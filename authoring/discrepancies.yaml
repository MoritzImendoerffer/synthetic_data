# =====================================================================================
# discrepancies.yaml — the machine-readable half of authoring/DISCREPANCIES.md
# -------------------------------------------------------------------------------------
# READ authoring/DISCREPANCIES.md FIRST. It carries the reasoning, the severity, the
# affected factors and the correct position for each entry. This file carries only what an
# author must be told BEFORE writing, so the item survives a re-authoring.
#
# Why this file exists
#
#   A registered discrepancy is a property of PROSE. D-001 lives in four plans' method
#   statements; D-002 lives in one sentence of PCR-003. Nothing surfaced either of them to
#   an author, so each survives only as long as nobody rewrites the document carrying it.
#   Re-author PCR-003 without this file and the sentence is simply not written again, while
#   authoring/DISCREPANCIES.md goes on calling the item open. No gate notices, because no
#   gate reads that registry, and check_grounding.py inspects SourceReference.quote and
#   never a description field.
#
#   It is worse than losing the item outright. D-002's other half is the ProcessStep
#   description in pc_package/build_ground_truth.py, which is GENERATED and therefore
#   survives. Losing only the prose half leaves the annex asserting something the document
#   no longer says.
#
#   So the same rule that retired the weak-claims feature governs these: anything that
#   changes what a document CLAIMS has to be present while the argument is being built.
#   Assigned in the brief before authoring, never restored afterwards. The failure analysis
#   that establishes the principle is in authoring/WEAK_CLAIMS.md.
#
# THIS FILE IS NOT THE WEAK-CLAIMS LAYER, and must never become it.
#
#   A weak claim is a labeled negative: the annex marks it unsupported, so a model is being
#   asked to detect it from the document alone. That feature lives only on
#   feature/weak-claims-via-brief and never on main, where `weak_claims` is empty in all 20
#   annexes without exception.
#
#   A registered discrepancy is NOT labeled anywhere. For D-002 the annex asserts the same
#   false thing the document does, deliberately. The task it poses is cross-document or
#   document-versus-data review, not span-level claim verification. Nothing here weakens the
#   rule that every claim on main is grounded.
#
# Keep this file and DISCREPANCIES.md in agreement. Adding an entry here without the prose
# rationale there, or removing an entry there without removing it here, re-creates exactly
# the drift this file exists to prevent.
#
# Numbers live in DISCREPANCIES.md, not here. The set-points and design centres that make
# D-001 bite are tabulated there and derive from config/parameters.yaml. Repeating them in
# this file would put a fourth copy of them in the repository, and it would go stale quietly.
# =====================================================================================

meta:
  registry: authoring/DISCREPANCIES.md
  surfaced_as: "brief §5c (authoring/build_brief.py::_discrepancy_assignments)"
  rule: >-
    An author writes what its §5c assignment states, in its own words, and does not
    reconcile it against anything. A document whose §5c is empty carries no registered
    discrepancy and must simply be internally and externally consistent.

items:

  # -----------------------------------------------------------------------------------
  # D-001 · the PAR analysis does not follow the method its own protocol specifies.
  # The PLANS are where this discrepancy is anchored: each commits to holding the other
  # parameters at their SET-POINTS, while doe_report.par_at_design_centre holds them at
  # coded 0, the midpoint of the characterization range. The two coincide at three of the
  # six DoE steps, which is what keeps the item partially masked.
  #
  # section_plan.yaml already instructs authors to write the at-set-point commitment, so
  # these plans have been safe by luck. The assignments below make it a guarantee.
  # -----------------------------------------------------------------------------------
  PCP-003:
    - id: D-001
      kind: protocol_method_statement
      assignment:
        # Re-verified verbatim against the plan re-authored on 2026-08-21 (TASK-028/030).
        # Recorded in the .qmd form, inline expression and all, so that no seeded number is
        # baked into a committed authoring artifact and so the brief prints what an author
        # writing the .qmd will type.
        #
        # NOTE, corrected 2026-08-21: this entry is the ONLY one in .qmd form. The comment
        # here used to claim PCP-009 does the same; it does not. PCP-006, PCP-008 and
        # PCP-009 all store the RENDERED sentence, and PCP-009's bakes in "201 points".
        # The consequence matters when checking a re-authored carrier: ANNEX-A-BATCH §5
        # tests registered_sentence against the .docx, which can never pass for this entry.
        # Verify THIS one against pc_package/PCP-003_bioreactor.qmd instead. The split in
        # convention is recorded rather than repaired, because unifying it would either bake
        # a seeded value in here or rewrite three entries whose documents are not in hand.
        registered_sentence: >-
          The first holds the other factors at the set-points in @tbl-params and scans the
          parameter of interest across the full characterization range, evaluating the fitted
          response-surface model at `{python} par_grid` grid points.
        state: >-
          Where the plan specifies how proven acceptable ranges will be determined, commit
          the first analysis to holding the other factors at their SET-POINTS while the
          parameter of interest is scanned across its characterization range. Say
          "set-points" and mean it. The second analysis propagates the other factors across
          their normal operating ranges by Monte-Carlo, as usual.
        why: >-
          This is the approved method a protocol would state. It is written here because
          the executed analysis departs from it, and that gap is the registered item. Do
          not describe the design centre, the range midpoint, or coded zero in a PLAN.
        placement: >-
          The proven-acceptable-ranges part of the statistical-methods section, or of the
          acceptance-criteria section, wherever this plan sets out how PARs will be derived.

  PCP-006:
    - id: D-001
      kind: protocol_method_statement
      assignment:
        registered_sentence: >-
          The first holds the other parameters at their set-points and scans the parameter of
          interest across its characterization range.
        state: >-
          Commit the first proven-acceptable-range analysis to holding the other parameters
          at their SET-POINTS and scanning the parameter of interest across its
          characterization range.
        why: >-
          Same registered item as PCP-003. It bites hardest here, because inactivation pH is
          the only true CPP in the process and its set-point is one of the six factors where
          the design centre differs. The gaps are tabulated in DISCREPANCIES.md.
        placement: >-
          Where the plan sets out how proven acceptable ranges will be derived.

  PCP-008:
    - id: D-001
      kind: protocol_method_statement
      assignment:
        registered_sentence: >-
          The first holds the other parameters at their set-points and evaluates the fitted
          response surface model across the parameter’s characterization range.
        state: >-
          Commit the first proven-acceptable-range analysis to holding the other parameters
          at their SET-POINTS and evaluating the fitted response-surface model across the
          parameter's characterization range.
        why: >-
          Same registered item as PCP-003. Protein load is the affected factor here; the
          gap is tabulated in DISCREPANCIES.md.
        placement: >-
          Where the plan sets out how proven acceptable ranges will be derived.

  PCP-009:
    - id: D-001
      kind: protocol_method_statement
      assignment:
        registered_sentence: >-
          The first holds the other parameter at its set-point and scans the parameter of
          interest across its characterization range on a grid of 201 points, using the
          fitted response-surface model.
        state: >-
          Commit the first proven-acceptable-range analysis to holding the other parameter
          at its SET-POINT and scanning the parameter of interest across its
          characterization range using the fitted response-surface model.
        why: >-
          Same registered item as PCP-003. Both factors are affected here, filtration volume
          and filtration pressure; the gaps are tabulated in DISCREPANCIES.md.
        placement: >-
          Where the plan sets out how proven acceptable ranges will be derived.

  # The reports carry the other end of D-001. They need no instruction to write anything —
  # par_table's "PAR (set-point)" column heading comes from the helper — but they must not
  # quietly reconcile the two, which would erase the item.
  PCR-006:
    - id: D-001
      kind: do_not_reconcile
      assignment:
        state: >-
          Present the proven acceptable ranges through D.par_table(UO) as it comes. Do not
          rename its "PAR (set-point)" column. DO NOT ASSERT WHERE THE OTHER PARAMETERS WERE
          HELD. Specifically, do not write that the first analysis holds them "at their
          set-points": that is the PLAN's commitment, and stating it here as a fact about the
          executed analysis makes the report say something false about its own work. Either
          say nothing about where they were held, or describe honestly what the helper does.
          And do not add a sentence that reconciles the reported analysis with the method
          PCP-006 specifies.
        why: >-
          The gap between the plan's method statement and the executed analysis is a
          registered benchmark item. A report that harmonises the two deletes it. Describing
          honestly what the analysis did, if you choose to, is fine; asserting that it
          matches the protocol is not.
        placement: >-
          The proven-acceptable-ranges section.

  PCR-008:
    - id: D-001
      kind: do_not_reconcile
      assignment:
        state: >-
          Present the proven acceptable ranges through D.par_table(UO) as it comes. Do not
          rename its "PAR (set-point)" column. DO NOT ASSERT WHERE THE OTHER PARAMETERS WERE
          HELD. Specifically, do not write that the first analysis holds them "at their
          set-points": that is the PLAN's commitment, and stating it here as a fact about the
          executed analysis makes the report say something false about its own work. Either
          say nothing about where they were held, or describe honestly what the helper does.
          And do not add a sentence that reconciles the reported analysis with the method
          PCP-008 specifies.
        why: >-
          Same registered item. See PCR-006.
        placement: >-
          The proven-acceptable-ranges section.

  PCR-009:
    - id: D-001
      kind: do_not_reconcile
      assignment:
        state: >-
          Present the proven acceptable ranges through D.par_table(UO) as it comes. Do not
          rename its "PAR (set-point)" column. DO NOT ASSERT WHERE THE OTHER PARAMETERS WERE
          HELD. Specifically, do not write that the first analysis holds them "at their
          set-points": that is the PLAN's commitment, and stating it here as a fact about the
          executed analysis makes the report say something false about its own work. Either
          say nothing about where they were held, or describe honestly what the helper does.
          And do not add a sentence that reconciles the reported analysis with the method
          PCP-009 specifies.
        why: >-
          Same registered item. See PCR-006.
        placement: >-
          The proven-acceptable-ranges section.

  # -----------------------------------------------------------------------------------
  # D-002 · PCR-003 claims the bioreactor is the only step that forms a quality attribute.
  # Contradicted by the corpus's own outputs/data/cqa_register.csv, whose set_by column
  # assigns leached Protein A to protein_a, XMuLV clearance to viral_inactivation and MVM
  # clearance to aex.
  # -----------------------------------------------------------------------------------
  PCR-003:
    - id: D-002
      kind: unsupported_absolute
      assignment:
        # Re-verified against the document re-authored on 2026-08-17. The subject is now the
        # step itself rather than a demonstrative, which is a register change and not a
        # change of strength: the claim is still the unqualified absolute.
        registered_sentence: >-
          The production bioreactor is the only step of the drug substance process at which
          product quality attributes are formed.
        state: >-
          When you introduce the role of the production bioreactor, assert without
          qualification that this is the ONLY step of the drug substance process at which
          product quality attributes are formed. State it as settled background, in one
          plain sentence, not as a finding of this study.
        write_next: >-
          Follow it with the narrower statement that IS true and that you can support: the
          glycosylation and charge-variant distributions are established inside the cell and
          in the culture fluid, and the platform purification train does not modify them.
          The elaboration must be correct. A reader who checks only the elaboration should
          find a supported statement and move on.
        why: >-
          Registered benchmark item D-002. The absolute is false against
          outputs/data/cqa_register.csv: leached Protein A is FORMED at the capture step,
          not merely reduced downstream, and PCR-005 characterizes the parameters that
          govern how much of it appears. Catching this needs the report read against the
          register or against PCR-005, so neither the bioreactor plan nor the bioreactor
          report is internally inconsistent. That is the point of the item.
        placement: >-
          The introduction, in the account of the step's role in the process. Not in the
          executive summary, not in a results section, and not anywhere it would read as a
          conclusion drawn from the data presented here.
        do_not: >-
          Do not qualify it ("essentially the only", "the principal step", "the only step at
          which glycan attributes are formed"). A qualified version is true and destroys the
          item. Do not add a caveat elsewhere reconciling it with leached Protein A, and do
          not soften any other sentence to accommodate it — move the claim instead.
      annex_note: >-
        The annex half is generated and needs nothing from the author. ProcessStep.description
        for step:production_bioreactor in pc_package/build_ground_truth.py::build_step carries
        the same absolute, so it reaches both PCR-003.json and PCP-003.json on every build.
        That is deliberate: it is the one place in the corpus where the ground truth itself
        asserts something false, which makes it a test of whether a system can find an error
        in its own supervision rather than only in the prose. check_grounding.py cannot see it,
        because it only inspects SourceReference.quote. Do not narrow that description.
