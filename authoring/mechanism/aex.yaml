key: aex
step_title: "Anion Exchange Chromatography"
source: "domain knowledge; written 2026-08-19 (TASK-009, 2026-08-18_03_author-facing-apparatus)"
reviewed_by_owner: 2026-08-19

overview: >-
  Anion exchange is operated in flow-through mode. At the load pH the antibody, which has a basic
  isoelectric point, carries a net positive charge and passes through the positively charged
  quaternary amine ligand, while species that are negatively charged at that pH bind: residual
  DNA, many host cell proteins, leached Protein A, and virus particles, whose surfaces are acidic.
  Binding of an impurity depends on its net charge at the load pH and on how strongly the ionic
  strength of the buffer shields that charge, so load pH and conductivity are the two parameters
  that set the clearance, and the step's contribution to viral safety is a modular clearance
  claim for both an enveloped and a non-enveloped model virus.

cqas:
  hcp: >-
    Host cell proteins that are acidic at the load pH bind the ligand and are removed; those
    near or above their isoelectric point pass through with the antibody. Raising the load pH
    moves more of the population below its isoelectric point and into the bound fraction, and
    raising the conductivity of the equilibration and wash buffers shields the electrostatic
    interaction and lets weakly bound host cell protein through. The two act on the same binding
    equilibrium from opposite sides.
  residual_dna: >-
    DNA is a polyanion at any pH the step could operate at and binds the anion exchanger
    strongly, so it is cleared by orders of magnitude and the clearance is robust to the
    operating parameters. This is the step that delivers the drug substance DNA specification.
  leached_protein_a: >-
    Leached Protein A is acidic and binds the anion exchanger at the load pH while the antibody
    passes through, so the step clears the ligand fragments the capture step introduced. Complexed
    fragments are held by the antibody's Fc and are removed only where the complex dissociates.
  lrv_xmulv: >-
    Retrovirus-like particles carry an acidic surface and bind the quaternary amine ligand at the
    load pH. Clearance falls as the load pH drops toward the point at which the particle surface
    loses its negative charge, and as conductivity rises and shields the interaction. The claim is
    modular and orthogonal to the low-pH inactivation, which acts on the envelope rather than on
    the surface charge.
  lrv_mvm: >-
    The parvovirus model has no envelope and is small, and its capsid is acidic at the load pH,
    so it binds the anion exchanger by the same electrostatic mechanism as the retrovirus and is
    cleared with the same dependence on load pH and conductivity. Because it is not inactivated by
    low pH, this step and the virus filter carry the whole claim for it.
  step_yield: >-
    Yield in flow-through mode is high because the product does not bind. Loss occurs only if the
    antibody's charge is close enough to neutral at the load pH for a fraction to bind, which the
    load pH range is set to avoid.

parameters:
  load_ph: >-
    The load pH sets the net charge on every species in the feed relative to its isoelectric
    point. A higher load pH makes the acidic impurities and the virus particles more negative and
    binds them more strongly, while the antibody remains positive and passes through, so it is
    the parameter that most directly sets both impurity clearance and viral clearance.
  wash1_cond: >-
    The conductivity of the equilibration and first wash buffer sets the ionic strength in the
    bed when the impurities meet the ligand. Higher ionic strength shields the electrostatic
    interaction, weakens the binding of the more weakly charged host cell proteins and virus
    particles, and lowers clearance. It acts opposite to load pH on the same equilibrium.
  load_cond: >-
    The conductivity of the load itself acts by the same shielding as the wash conductivity but
    during the load, when the impurities are competing with each other for the ligand. Its effect
    is bounded by the load buffer composition that the previous step delivers.
  load: >-
    Protein load in flow-through mode is the mass of antibody passed per volume of resin. It
    matters through the impurity mass that comes with it: the ligand has a finite capacity for the
    bound species, and a very heavy load can approach it and let impurity break through. Within
    the studied range the impurity mass is far below that capacity.
  flow: >-
    Flow rate sets the residence time and hence how completely the bound species reach the
    ligand before the fluid moves on. Because binding of the small, highly charged impurities is
    fast, the effect within the studied range is small, and the parameter is assessed one at a
    time.
