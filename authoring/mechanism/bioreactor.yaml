key: bioreactor
step_title: "Production Bioreactor"
source: "domain knowledge; written 2026-08-19 (TASK-009, 2026-08-18_03_author-facing-apparatus)"
reviewed_by_owner: 2026-08-19

overview: >-
  The production bioreactor is a fed-batch mammalian cell culture in which a recombinant Chinese
  hamster ovary line secretes the antibody into the medium over about two weeks. Cell growth,
  specific productivity and the post-translational state of the secreted antibody are all set by
  the culture environment: pH, temperature, dissolved gases, osmolality and the age of the culture
  at harvest. Glycosylation is completed in the Golgi before secretion and is not changed by any
  downstream step, so the glycoform distribution of the drug substance is decided here. Charge
  variants, aggregate and the impurity burden carried into harvest are also formed in the
  reactor, and the downstream train can only reduce, not reverse, what leaves it.

cqas:
  afucosylation: >-
    Core fucose is added to the N-linked glycan by a fucosyltransferase in the Golgi from the
    nucleotide sugar donor GDP-fucose. The fraction of antibody that leaves without core fucose
    depends on the activity of that enzyme, on the supply of the donor, and on how long the
    glycan is resident in the Golgi before secretion. Culture conditions that change growth rate,
    intracellular pH or the nucleotide sugar pool therefore move afucosylation, and because the
    harvested pool is the integral of everything secreted over the run, the culture age at harvest
    weights the pool toward late-culture material with the late-culture enzyme and donor state.
    Afucosylation governs binding to the Fcγ receptor and hence effector function, which is why it
    is a critical attribute.
  galactosylation: >-
    Terminal galactose is added to the biantennary glycan by a galactosyltransferase from
    UDP-galactose. Late in a fed-batch culture the nucleotide sugar donor and the enzyme's
    manganese cofactor are depleted and the Golgi becomes less effective, so galactosylation
    falls as the culture ages and the pool accumulates late-culture antibody. Temperature, pH,
    dissolved carbon dioxide and osmolality act on the same machinery through growth rate,
    intracellular pH and the metabolic state of the cell, and their effects interact because they
    move the same enzyme and donor pool.
  high_mannose: >-
    High mannose glycans are the species on which trimming and the addition of GlcNAc,
    galactose and fucose never proceeded, so the glycan left the cell in an early state. Their
    level rises when transit through the Golgi is fast relative to the processing enzymes, or when
    those enzymes are inhibited, and it tracks culture pH and dissolved oxygen weakly through
    intracellular pH and energy metabolism. High mannose species clear faster from the
    circulation, which is why the attribute is of very high criticality.
  aggregates_hmw: >-
    Aggregate in the harvest arises from antibody that partially unfolds or associates while it
    sits in the culture fluid at culture temperature for days. Its formation depends on the
    concentration of antibody, on the time it spends at temperature, and on the colloidal
    stability of the molecule at the culture pH, which sets the net charge and the strength of
    the intermolecular attraction. A longer culture and a higher culture pH therefore expose more
    product for longer under conditions closer to the isoelectric point.
  acidic_variants: >-
    Acidic charge variants are mainly the products of asparagine deamidation, whose rate depends
    on pH, temperature and the local sequence, together with sialylated glycans and glycated
    lysines. The culture conditions act on all of these at once: temperature and pH set the rate
    of the chemical reactions, dissolved carbon dioxide and osmolality act on intracellular pH and
    on the sialylation machinery, and the culture age sets the time at temperature. The net
    direction of any one parameter is therefore empirical, and the fitted model is what the
    report reads it from.
  hcp: >-
    Host cell protein in the clarified harvest is released when cells die and lyse. Viability
    falls late in a fed-batch culture, so a longer culture carries a larger burden of host cell
    protein into harvest, and the composition of that burden shifts toward intracellular proteins
    released by lysis rather than secreted ones. The bioreactor sets the load; Protein A capture
    and the two polishing steps clear it.
  residual_dna: >-
    Host cell DNA in the harvest has the same origin as host cell protein: it is released by
    lysis, and its level tracks the decline in viability toward the end of the run. It is a very
    low criticality attribute at the drug substance because the anion exchange step clears it by
    orders of magnitude, but the bioreactor sets the load the train has to clear.

parameters:
  pH: >-
    Culture pH sets intracellular pH and the ionic environment of the Golgi, and through them the
    activity of the glycosyltransferases and the rate of deamidation. It also sets the net charge
    of the antibody in the culture fluid and hence its colloidal stability. Because it acts on
    growth as well as on the enzymes, its effects on the glycoforms interact with temperature and
    with the culture age.
  temperature: >-
    Temperature sets the specific growth rate and the rate of every enzymatic and chemical
    reaction in and around the cell. A cooler culture grows more slowly, extends the productive
    phase and changes the residence time of the glycan in the Golgi; a warmer one accelerates
    deamidation and aggregation in the culture fluid. Its effect on the glycoforms is therefore
    coupled to pH and to the culture age.
  co2: >-
    Dissolved carbon dioxide equilibrates with bicarbonate and acidifies the cytosol, so it acts
    on the cell in the same way as culture pH but from inside, and it also raises the osmolality
    of the medium as bicarbonate accumulates. High dissolved carbon dioxide slows growth and
    shifts the glycoform and charge variant distribution through intracellular pH and the
    sialylation machinery.
  osmolality: >-
    Osmolality is set by the base and feed additions and by the accumulation of metabolites. High
    osmolality stresses the cell, slows growth, raises specific productivity per cell and shifts
    the balance of the nucleotide sugar pool, so it moves the glycoforms and interacts with the
    other parameters that act on the same pool.
  duration: >-
    Culture duration decides how much late-culture antibody the harvested pool contains and how
    far viability has fallen at harvest. Late-culture antibody is made under depleted nutrient
    and cofactor conditions and has spent longer at temperature in the culture fluid, and dying
    cells release host cell protein and DNA. It is therefore the parameter that most directly
    sets the impurity load and the age-dependent glycoforms.
  do: >-
    Dissolved oxygen sets the oxidative metabolism of the cell. Within the studied range it acts
    weakly on the glycoforms through energy metabolism and on high mannose through Golgi transit,
    and it is controlled by sparging and agitation to a set-point independent of the other
    parameters.
  ivcc: >-
    The initial viable cell concentration sets where on the growth curve the culture starts and
    hence how many days it spends in the productive phase before harvest. It changes the integral
    of viable cells and the titer more than it changes any quality attribute, because the cells
    themselves are the same.
  medium_conc: >-
    The basal medium concentration sets the supply of amino acids, glucose and the precursors of
    the nucleotide sugars at the start of the run. Within the studied range it changes growth and
    titer and has little effect on the glycoforms, because the feed strategy replenishes the same
    components.
  feed_vol: >-
    The nutrient feed volume replenishes glucose, amino acids and glycosylation precursors during
    the run and dilutes the culture. It acts on the glycoforms only through the supply of
    precursors and on osmolality through the feed's own contribution, and within the studied range
    the culture is fed to excess.
