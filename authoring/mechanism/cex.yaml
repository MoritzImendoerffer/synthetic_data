key: cex
step_title: "Cation Exchange Chromatography"
source: "domain knowledge; written 2026-08-19 (TASK-009, 2026-08-18_03_author-facing-apparatus)"
reviewed_by_owner: 2026-08-19

overview: >-
  Cation exchange is operated in bind-and-elute mode as the principal aggregate polishing step.
  Below its isoelectric point the antibody carries a net positive charge and binds the negatively
  charged sulfonate or carboxylate ligand; it is eluted by raising the pH or the conductivity so
  that the electrostatic attraction weakens. Aggregate binds more strongly than monomer, because
  a dimer presents twice the charged surface, so it elutes later, and the step separates the two
  by where the pool is stopped. Host cell protein and residual DNA are cleared by the load and
  wash, and leached Protein A, which is acidic, passes through in the load.

cqas:
  aggregates_hmw: >-
    Aggregate is retained more strongly than monomer because it presents more positive charge to
    the ligand, so it elutes after the monomer on a gradient or a step. The clearance the step
    achieves depends on how well the two are resolved and on where the pool is cut. Loading the
    column more heavily broadens both peaks and brings the aggregate front forward into the
    monomer, a higher elution pH weakens the binding of both and compresses the separation, and
    collecting further into the descending edge takes in the leading part of the aggregate peak.
  hcp: >-
    Most host cell proteins are acidic at the operating pH and do not bind the cation exchanger,
    so they leave in the load flow-through, and the weakly bound remainder is displaced in the
    wash. A higher wash conductivity strips more of that remainder from the ligand before elution,
    and a heavier load leaves less free ligand and lets more host cell protein co-adsorb with the
    antibody. Both act on the same population of weakly bound species.
  residual_dna: >-
    DNA is strongly negatively charged and is repelled by the cation exchange ligand, so it
    passes through in the load. Clearance is large and insensitive to the operating parameters.
  leached_protein_a: >-
    Leached Protein A and its fragments are acidic and do not bind the cation exchanger under the
    load conditions, and the fraction that is complexed with the antibody is released and passed
    through when the complex binds the ligand. The step therefore contributes a modest clearance
    that is a property of the chemistry rather than of any studied parameter.
  step_yield: >-
    Yield is lost at the two edges of the pool: monomer left in the tail beyond the stop point,
    and monomer that co-elutes with the aggregate that is cut away. Heavier loading broadens the
    peak and increases both losses.

parameters:
  load: >-
    Protein load sets how much of the ligand is occupied and how broad the elution peaks are.
    Nearer to capacity the aggregate and monomer peaks broaden and overlap more, and weakly bound
    host cell protein finds fewer free sites from which the wash would have displaced it, so load
    acts on aggregate clearance, host cell protein clearance and yield through the same physical
    quantity, the fraction of the ligand in use.
  wash_cond: >-
    The conductivity of the load and wash buffers sets the ionic strength that shields the charge
    on the ligand and on the bound species. A higher conductivity strips weakly bound host cell
    protein and other acidic species during the wash while the antibody, which binds more
    strongly, stays bound. Its effect is on impurity clearance rather than on the aggregate
    separation, which happens during elution.
  elution_ph: >-
    The elution buffer pH sets the net charge on the antibody and hence the strength of its
    binding at the moment of elution. A higher pH within the range weakens binding, brings both
    monomer and aggregate off earlier and closer together, and reduces the resolution on which the
    aggregate clearance depends; a lower pH holds the aggregate back longer.
  stop_collect: >-
    The stop collect point on the descending edge of the elution peak decides how much of the
    tail is taken into the pool. Because the aggregate elutes on that tail, stopping later
    recovers more monomer at the cost of taking in the front of the aggregate peak, and stopping
    earlier does the reverse. It is the direct handle on the aggregate–yield trade.
  flow: >-
    Elution flow rate sets residence time during elution and hence the sharpness of the peaks.
    Within the studied range and at the resin's particle size the effect on resolution is small,
    which is why it is assessed one at a time and controlled as a general parameter.
