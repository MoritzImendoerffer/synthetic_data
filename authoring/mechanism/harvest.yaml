key: harvest
step_title: "Harvest / Clarification"
source: "domain knowledge; written 2026-08-19 (TASK-009, 2026-08-18_03_author-facing-apparatus)"
reviewed_by_owner: 2026-08-19

overview: >-
  Harvest separates the antibody-containing culture fluid from cells and cell debris by
  continuous centrifugation followed by depth filtration and a sterilising-grade filter. The
  step forms no quality attribute of the antibody. What it decides is the condition of the feed
  to Protein A capture: how much intact cell material and fine debris the clarified harvest
  carries, and how much host cell protein and DNA are released by cells that break during the
  operation rather than in the reactor.

cqas:
  hcp: >-
    Host cell protein in the clarified harvest is the reactor's burden plus whatever is released
    by cells that lyse under the shear of the centrifuge feed zone and the pressure drop across
    the depth filter. Harvest does not clear host cell protein; a gentle harvest keeps the load
    close to what left the reactor, and a harsh one adds intracellular protein to it.
  residual_dna: >-
    DNA is released by the same lysis, and DNA fragments and nucleosomes also foul depth filters
    and Protein A resin. The depth filter media, which are positively charged, adsorb some DNA and
    debris, so the depth filtration stage removes a fraction of what the centrifuge passes.
  aggregates_hmw: >-
    Aggregate can rise at harvest only if the antibody is exposed to shear or to air-liquid
    interfaces strong enough to unfold it, at the centrifuge feed zone or in a foaming transfer.
    Within normal operation the exposure is brief and the effect small; it is a plausible
    mechanism to check rather than an expected one.

parameters:
  centrifuge_g: >-
    The centrifugal field sets the sedimentation velocity of cells and debris and hence how
    completely they are removed at a given feed rate. A higher field clarifies more completely,
    but the shear in the feed zone and at the disc stack rises with speed, and shear-damaged
    cells release host cell protein and DNA into the centrate. The parameter therefore trades
    clarity against lysis.
  depth_filter_load: >-
    The depth filter has a finite capacity for solids and for the fine debris and colloids the
    centrifuge passes. Loading it further raises the pressure drop, lets more fine particles and
    turbidity through as the media saturate, and at the extreme forces cells and debris through
    the pores. Load per unit area is what decides whether the filter is still doing its job at
    the end of the batch.
  turbidity: >-
    Post-clarification turbidity is a measure of the fine particulate and colloidal material
    the filters passed. It is not a set parameter but a property of the clarified harvest that
    the other two parameters produce, and it matters because that material fouls the Protein A
    column and shortens resin life.
