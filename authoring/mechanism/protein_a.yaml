key: protein_a
step_title: "Protein A Chromatography"
source: "domain knowledge; written 2026-08-19 (TASK-009, 2026-08-18_03_author-facing-apparatus)"
reviewed_by_owner: null

overview: >-
  Protein A capture is a bind-and-elute affinity step. Staphylococcal Protein A immobilised on
  the resin binds the Fc region of the antibody at neutral pH through a set of hydrophobic and
  hydrogen-bonding contacts at the interface between the second and third constant domains of the heavy chain, while host cell protein, DNA and
  most other components of the clarified harvest flow through or are removed in the wash.
  Lowering the pH protonates histidine residues at the Fc–ligand interface, weakens the
  interaction and releases the antibody into a small volume of low-pH eluate. The step
  concentrates the product, removes the bulk of the process impurities, and introduces one
  impurity of its own: ligand that leaches from the resin.

cqas:
  hcp: >-
    Host cell protein reaches the Protein A eluate by two routes. Some binds the resin backbone
    or the ligand weakly and elutes when the pH is lowered, and some associates with the antibody
    itself and is carried through as a complex. Both routes depend on how much antibody is bound
    and how completely it is released: as the load approaches the dynamic binding capacity the
    mass transfer zone extends further down the bed and impurity that would have been washed out
    is carried into the eluate, and a lower elution pH releases weakly bound host cell protein
    together with the product. The two effects therefore reinforce each other, and the interaction
    between load and elution pH is a property of the mechanism, not of the design.
  residual_dna: >-
    DNA is polyanionic and does not bind Protein A. It is removed in the load flow-through and
    the wash, and the small fraction that reaches the eluate is DNA associated with the antibody
    or with host cell protein complexes. Clearance is large and insensitive to the operating
    parameters within their ranges.
  leached_protein_a: >-
    Ligand leaches from the resin by hydrolysis of the immobilisation chemistry and by
    proteolysis of exposed ligand, and the leached fragments elute with the antibody because they
    still bind Fc. The amount depends on the resin's coupling chemistry, on the cumulative cycle
    number and on the sanitisation history, all of which are properties of the resin over its life
    rather than of a single run. Within one run's operating ranges the level is therefore expected
    to be flat, and it is controlled by resin life-cycle limits and cleared further downstream.
  step_yield: >-
    Yield is lost when antibody breaks through during the load or is left on the column at the
    end of elution. Breakthrough rises as the load approaches the dynamic binding capacity and as
    the residence time falls, because binding at the ligand is limited by diffusion into the
    pores of the bead. Extending the pool collection recovers the tail of the elution peak.

parameters:
  load: >-
    Protein load is the mass of antibody applied per volume of resin. As it approaches the
    dynamic binding capacity of the resin the mass transfer zone reaches the column outlet,
    antibody breaks through into the flow-through, and impurities that would otherwise be
    displaced by the wash are carried into the bed. Load therefore acts on host cell protein and
    on yield through the same physical quantity, the fraction of the bed's capacity in use.
  elution_ph: >-
    Elution pH sets how completely the Fc–ligand interaction is disrupted. A lower pH protonates
    the interface histidines more fully, releases the antibody sooner and in a sharper peak, and
    at the same time releases host cell protein that was held weakly on the resin or on the
    antibody. A higher pH within the range gives a broader, later peak with less co-eluting
    impurity but a larger pool volume, and it is the parameter that most directly sets pool host
    cell protein.
  flow: >-
    Load flow rate sets the residence time and hence how far into the pore the antibody diffuses
    before the fluid moves on. A faster load shortens the residence time, broadens the mass
    transfer zone and lowers the dynamic binding capacity, so at high load it costs yield through
    earlier breakthrough. Its effect on impurity is indirect, through the same broadening.
  end_collect: >-
    The end of pool collection decides how much of the elution peak's tail is taken. Extending
    it recovers antibody from the tail and raises yield, and it dilutes the pool; because the
    weakly held impurities elute early in the low-pH transition rather than in the tail, extending
    the collection has little effect on the impurity mass and lowers its concentration per mass
    of antibody.
  temperature: >-
    Operating temperature acts on the diffusion coefficient of the antibody and on the strength
    of the hydrophobic contacts at the Fc–ligand interface. Over the range studied, both effects
    are small compared with those of load and pH, and the resin manufacturer's binding capacity is
    specified across it.
  bed_height: >-
    Bed height at a fixed linear velocity sets the residence time and the pressure drop across
    the column. A taller bed lengthens residence time and raises dynamic binding capacity, and it
    is compensated by the linear velocity in scale-up so that residence time is held; within the
    studied range it is a property of the packing rather than of the chemistry.
