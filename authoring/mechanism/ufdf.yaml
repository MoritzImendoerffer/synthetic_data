key: ufdf
step_title: "Ultrafiltration / Diafiltration (formulation)"
source: "domain knowledge; written 2026-08-19 (TASK-009, 2026-08-18_03_author-facing-apparatus)"
reviewed_by_owner: null

overview: >-
  Ultrafiltration concentrates the antibody and diafiltration exchanges the buffer into the
  formulation matrix, both across a tangential-flow membrane whose pores pass buffer salts and
  retain the antibody. The step forms no quality attribute of the antibody in the drug substance
  characterization: its outputs are the final concentration and the completeness of the buffer
  exchange. What it can do to the product is mechanical, through shear at the pump and the
  membrane surface, and through the high concentration at the membrane wall where the retained
  antibody accumulates.

cqas:
  aggregates_hmw: >-
    Aggregate can form during ultrafiltration where the antibody is most concentrated and most
    sheared, at the membrane wall in the polarisation layer and in the pump. The risk rises with
    the final concentration, the transmembrane pressure that thickens the polarisation layer, and
    the number of passes through the pump. Within normal operation the exposure is brief and the
    effect small.

parameters:
  diavolumes: >-
    The number of diavolumes sets how completely the process buffer is exchanged for the
    formulation buffer. Each diavolume removes a fixed fraction of the remaining permeable species,
    so residual process buffer components fall exponentially with the count, and the number is set
    to bring them below what the formulation tolerates.
  tmp: >-
    Transmembrane pressure drives the permeate flux. Beyond the point at which the polarisation
    layer at the membrane wall limits the flux, more pressure compresses that layer without
    raising throughput and increases the concentration and shear the antibody sees at the wall.
  final_conc: >-
    The final concentration sets the viscosity of the retentate and the concentration in the
    polarisation layer, and with them the pressure drop, the shear and the aggregation risk near
    the end of the concentration. It is set by the formulation and controlled by mass balance.
