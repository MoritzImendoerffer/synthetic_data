key: viral_inactivation
step_title: "Low-pH Viral Inactivation"
source: "domain knowledge; written 2026-08-19 (TASK-009, 2026-08-18_03_author-facing-apparatus)"
reviewed_by_owner: 2026-08-19

overview: >-
  Low-pH viral inactivation holds the Protein A eluate at acid pH for a defined time before
  neutralisation. Enveloped viruses such as the retrovirus-like particles that mammalian cells
  shed are inactivated when acid disrupts the lipid envelope and denatures the envelope
  glycoproteins the virus needs to enter a cell. The rate of that inactivation, and therefore the
  log reduction achieved, is set by how acidic the hold is, how long it lasts and how warm it is.
  The same conditions act on the antibody: at low pH the molecule is partially unfolded and less
  colloidally stable, so aggregate can form during the hold, and acid-catalysed reactions at
  labile residues can add charge variants.

cqas:
  lrv_xmulv: >-
    Inactivation of an enveloped virus at low pH follows first-order kinetics whose rate constant
    rises as the pH falls and as the temperature rises. A lower pH disrupts the envelope and
    denatures the fusion glycoproteins faster, a longer hold integrates that rate for longer, and
    a warmer hold accelerates the denaturation. pH is the governing parameter because the rate
    depends on it steeply near the operating range, which is why it is controlled as a critical
    process parameter and the other two are wide-range.
  aggregates_hmw: >-
    At acid pH the antibody carries a large net positive charge and the second constant domain of its heavy chain is partially
    unfolded, exposing hydrophobic surface. Molecules in that state associate, and the association
    proceeds for as long as they are held at low pH and faster when they are warmer or more
    concentrated. Aggregate formed here is carried into cation exchange, which is the step that
    removes it, so the hold time and temperature are bounded to keep the aggregate load within
    what the polishing step clears.
  acidic_variants: >-
    Time at low pH can add acidic species through acid-catalysed reactions at labile residues,
    including succinimide formation and hydrolysis. The change over a hold of the studied length
    is small against the reactor's contribution and does not limit the attribute.

parameters:
  ph: >-
    The hold pH sets the rate of envelope disruption and glycoprotein denaturation and is the
    parameter the inactivation depends on most steeply. It also sets the extent to which the
    antibody is unfolded and hence how fast aggregate forms during the hold. Its narrow control
    range reflects both.
  hold_time: >-
    Hold time integrates the inactivation rate: a longer hold gives a larger log reduction at
    any pH and temperature, and it also gives the partially unfolded antibody longer to associate.
    The minimum time assures the clearance claim and the maximum time bounds the aggregate.
  temperature: >-
    Temperature accelerates both the denaturation that inactivates the virus and the association
    that forms aggregate. It is held near ambient, and the range studied brackets what a
    manufacturing suite delivers.
  protein_conc: >-
    The antibody concentration during the hold acts on aggregation, because association is a
    bimolecular event and proceeds faster in a more concentrated solution, and it has no effect
    on the inactivation chemistry. It is a property of the Protein A pool rather than a set
    parameter of the hold, which is why it is assessed one at a time.
