key: virus_filtration
step_title: "Small Virus Retentive Filtration"
source: "domain knowledge; written 2026-08-19 (TASK-009, 2026-08-18_03_author-facing-apparatus)"
reviewed_by_owner: null

overview: >-
  Virus filtration removes virus by size. The membrane has a pore size distribution chosen to
  retain the smallest viruses of concern, the parvoviruses, while passing the antibody, and the
  claim is a log reduction for both a small non-enveloped and a larger enveloped model virus. The
  mechanism is sieving, so the retention depends on the integrity of the pore structure and on
  how the membrane's effective pore size changes as it fouls over the batch. Retention of the
  larger enveloped virus is robust because it is far larger than the pores; retention of the
  small parvovirus is the one that a change in operating conditions can degrade.

cqas:
  lrv_mvm: >-
    The parvovirus is close to the pore size cut-off, so its retention depends on the fraction of
    pores at the large end of the distribution and on the flow through them. As the membrane
    fouls with product and residual impurity the flux redistributes toward the least fouled,
    largest pores, and small virus can pass; the risk therefore rises with the volume filtered per
    unit area. Interruptions of flow and low transmembrane pressure can also let virus that was
    held in the pore structure diffuse through, which is why pressure is controlled as well as
    volume.
  lrv_xmulv: >-
    The enveloped retrovirus model is many times larger than the pores and is retained
    completely as long as the membrane is intact. Its clearance is insensitive to the operating
    parameters and is confirmed by the integrity test after the batch.
  step_yield: >-
    Yield is limited only by product held up in the fouled membrane and the system, and it is
    high; the antibody is small enough to pass the pores freely.

parameters:
  filtration_volume: >-
    The volume filtered per unit area sets how far fouling has progressed by the end of the
    batch and hence how much of the flow passes through the largest pores. Retention of the small
    virus falls as the volume rises, so the maximum load is the parameter that bounds the
    clearance claim.
  pressure: >-
    Transmembrane pressure sets the flux and hence the throughput. A higher pressure compresses
    the fouling layer and raises flux, and a low pressure or an interruption of flow lets small
    virus that was retained in the pore structure diffuse back and through, so the claim is made
    over a pressure range and for uninterrupted operation.
