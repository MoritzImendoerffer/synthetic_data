# Rhetorical / argument-structure spans for PCMR-001 (master report).
# Converted 2026-08-18 from the pcmr_rhetorical_spans() builder in pc_package/build_ground_truth.py
# (work unit 2026-08-18_02_register-track-d, TASK-001). The conversion was byte-identical:
# the annexes rebuilt with no diff, which is what proves it changed nothing.
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCMR-001_master_report.docx — so no quote may cross a `{python}` inline expression, a @ref, a
# citation or bold markup. A span whose quote is no longer in the document now FAILS the
# build (build_ground_truth.build_rhetorical_spans), where the Python builder emitted it
# regardless and left check_grounding to find it later.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
# What the layer is about: the narrative, non-tabular argument structure of the roll-up report.
# THIS FILE IS NOT THE WHOLE LAYER. The annex also carries 17 deviation_disposition spans, one
# per row of the campaign deviation register, which pcmr_dev_spans() in
# pc_package/build_ground_truth.py builds from outputs/deviations.csv. They stay in code because
# a reseed rewrites them, and freezing a rendered data row into a curated file would hard-code a
# value that lives in outputs/. So 32 spans here, 49 in PCMR-001.json.
document_id: PCMR-001
section_id: PCMR-001_sec_rhet
spans:

  - id: PCMR-001-R00
    section: "Executive summary"
    role: claim
    quote: "Stage 1 characterization of the A-Mab drug substance process is complete and the
      process is ready for Stage 2"

  - id: PCMR-001-R01
    section: "Purpose and scope"
    role: deferral
    quote: "it does not re-derive their models, their effect estimates or their design spaces"

  - id: PCMR-001-R02
    section: "Study inventory"
    role: claim
    quote: "The response-surface model is the predictive model and the basis of each step’s design
      space, and no design space in this package rests on a screening fit"

  - id: PCMR-001-R03
    section: "Host cell protein"
    role: cross_step_credit
    quote: "Credit for host cell protein clearance is therefore shared, and no single step can be
      described as the host cell protein control"
    supported_by: ["PCMR-001-R04"]

  - id: PCMR-001-R04
    section: "Host cell protein"
    role: mechanistic_warrant
    quote: "A change to the load conditions of any one of them shifts the burden onto the others"

  - id: PCMR-001-R05
    section: "Aggregates"
    role: claim
    quote: "Cation exchange is the only aggregate clearance step in the train"

  - id: PCMR-001-R06
    section: "Process capability"
    role: hedge
    quote: "their indices should be read as showing that the attribute does not constrain the
      process, and not as meaningful precision"

  - id: PCMR-001-R07
    section: "Process capability"
    role: bounded_conclusion
    quote: "The step models it propagates were fitted on qualified scale-down models, so the
      capability is inherited from the scale-down qualification of each step"

  - id: PCMR-001-R08
    section: "Viral clearance summary"
    role: mechanistic_warrant
    quote: "minute virus of mice is a non-enveloped parvovirus with no envelope to disrupt"

  - id: PCMR-001-R09
    section: "Viral clearance summary"
    role: cross_step_credit
    quote: "No single step carries the cumulative claim"

  - id: PCMR-001-R10
    section: "Viral clearance summary"
    role: bounded_conclusion
    quote: "No viral clearance is claimed for Protein A capture or for cation exchange"

  - id: PCMR-001-R11
    section: "Viral clearance summary"
    role: hedge
    quote: "The margins quoted above are therefore conservative"
    bounds: "PCMR-001-R10"

  - id: PCMR-001-R12
    section: "Parameter classification summary"
    role: justification
    quote: "the safe course where an interaction has not been estimated is the more stringent
      class"

  - id: PCMR-001-R13
    section: "Parameter classification summary"
    role: justification
    quote: "a factor that does nothing over a wide range is evidence of robustness and not an
      absence of information"

  - id: PCMR-001-R14
    section: "Release control"
    role: claim
    quote: "Release testing confirms the outcome of the control strategy and is not the means by
      which the outcome is achieved"

  - id: PCMR-001-R15
    section: "What the control strategy does not cover"
    role: bounded_conclusion
    quote: "It does not establish commercial-scale reproducibility, which is the object of Stage 2"

  - id: PCMR-001-R16
    section: "Deviations across the campaign"
    role: problem_statement
    quote: "One deviation in this campaign invalidated a complete designed experiment"

  - id: PCMR-001-R17
    section: "The anion exchange deviations"
    role: deviation_disposition
    quote: "Both affected designs were invalidated for the purpose of defining an operating region
      and were re-executed in full"

  - id: PCMR-001-R18
    section: "The anion exchange deviations"
    role: deviation_disposition
    quote: "The first execution is retained as a controlled record and is referenced there to
      confirm the root cause"
    supported_by: ["PCMR-001-R17"]

  - id: PCMR-001-R19
    section: "The anion exchange deviations"
    role: deviation_disposition
    quote: "The data were not discarded, because the fitted model covers the collection range that
      was actually used"

  - id: PCMR-001-R20
    section: "The retained deviations"
    role: bounded_conclusion
    quote: "The excursion took the parameter outside its normal operating range but left it inside
      the range over which that parameter was characterized, so the fitted model already
      covers the condition that occurred"

  - id: PCMR-001-R21
    section: "The retained deviations"
    role: deviation_disposition
    quote: "Neither finding moved the associated attribute outside its limit"

  - id: PCMR-001-R22
    section: "Campaign-level impact"
    role: claim
    quote: "No deviation changed a parameter classification, an operating region or a viral
      clearance claim"
    supported_by: ["PCMR-001-R17", "PCMR-001-R20"]

  - id: PCMR-001-R23
    section: "Campaign-level impact"
    role: claim
    quote: "One control-strategy element did change"
    bounds: "PCMR-001-R22"

  - id: PCMR-001-R24
    section: "Campaign-level impact"
    role: justification
    quote: "Both are improvements to the control strategy and neither reflects a defect in the
      data reported here"

  - id: PCMR-001-R25
    section: "Limitations"
