# Rhetorical / argument-structure spans for PCR-003 (production bioreactor PC report).
# Re-curated 2026-07 against the re-authored report. Every quote is a verbatim,
# whitespace-collapsed substring of the plain prose of BOTH
# pc_package/PCR-003_bioreactor.qmd (checked by build_ground_truth.build_rhetorical_spans)
# and the rendered pc_package/PCR-003_bioreactor.docx (checked by check_grounding.py) —
# so no quote may cross a `{python}` inline expression, a @ref, a citation or bold markup.
# Number-free spans are preferred so a seed change cannot break grounding.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-003
spans:

  # ---- problem_statement (the uncertainty / caution that motivates a passage) ----
  - id: RS-P01
    section: Platform and prior-product knowledge
    role: problem_statement
    quote: "Characterization at this step confirms and bounds known relationships. It is
      not a search for unknown ones."
  - id: RS-P02
    section: Centre-point performance and reproducibility
    role: problem_statement
    quote: "an effect smaller than about the centre-point standard deviation of its
      response cannot be separated from run-to-run noise whatever its p-value"
  - id: RS-P03
    section: Design space
    role: problem_statement
    quote: "the surfaces predict mean levels, so at the boundary of the region the
      predicted mean sits on the limit and about half of the batches operated exactly
      there would be expected to exceed it"

  # ---- claim (the finding a section or paragraph asserts) ----
  - id: RS-01
    section: Executive summary
    role: claim
    quote: "The step is well understood."
    supported_by: [RS-J01, RS-J03]
  - id: RS-02
    section: "Screening: factor effects"
    role: claim
    quote: "The fit statistics show why this design identifies but does not predict."
    supported_by: [RS-J02]
  - id: RS-03
    section: Response-surface models
    role: claim
    quote: "Taken with the lack-of-fit tests, this supports the quadratic model form for
      both attributes."
    supported_by: [RS-J03, RS-J04]
  - id: RS-04
    section: Mechanistic interpretation
    role: claim
    quote: "This is why the operating region for this attribute has to be defined
      multivariately: a set of one-dimensional ranges, each established with the other
      parameters at their set-points, would understate the joint effect at the corners of
      the region."
    supported_by: [RS-M02]
  - id: RS-05
    section: Design space
    role: claim
    quote: "The design space for this step is the part of the characterized region in the
      four response-surface factors (culture pH, culture temperature, culture duration and
      dissolved CO₂) in which every attribute this step governs stays within its in-process
      limit."
    supported_by: [RS-J03, RS-J04, RS-M01]
  - id: RS-06
    section: Proven acceptable ranges
    role: claim
    quote: "Most characterized ranges are proven acceptable ranges in full when the other
      factors are held at their set-points, and most are not once the other factors are
      allowed to move."
  - id: RS-07
    section: Process capability and robustness
    role: claim
    quote: "The step meets its acceptance criteria at commercial scale with margin on
      every attribute it forms."
    supported_by: [RS-J05]
  - id: RS-08
    section: Parameter classification
    role: claim
    quote: "No parameter of this step is classified CPP."
    supported_by: [RS-J06]

  # ---- justification (evidence / statistic / diagnostic offered for a claim) ----
  - id: RS-J01
    section: Executive summary
    role: justification
    quote: "no response shows significant lack of fit against the centre-point pure error"
  - id: RS-J02
    section: "Screening: factor effects"
    role: justification
    quote: "absorbs almost all of the variation in the data and then predicts a held-out
      run worse than the response mean does"
  - id: RS-J03
    section: Response-surface models
    role: justification
    quote: "The residual plots show no structure against the predicted value and no
      funnel, the normal quantile plots are close to linear over the body of the
      distribution, and the actual against predicted plots scatter about the identity line
      without curvature."
  - id: RS-J04
    section: Response-surface models
    role: justification
    quote: "The predicted coefficient of determination is the measure that matters for a
      design space, because it is computed by leaving each run out in turn"
  - id: RS-J05
    section: Process capability and robustness
    role: justification
    quote: "so no simulated batch came within a percentage point of either limit"
  - id: RS-J06
    section: Parameter classification
    role: justification
    quote: "Since the whole of that range is a proven acceptable range for every attribute
      (§7), it is classified as well controlled on that basis and not on ease of control
      alone."

  # ---- mechanistic_warrant (reasoning from physical / enzymatic mechanism) ----
  - id: RS-M01
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "Elevated dissolved CO₂ lowers the pH of the Golgi lumen and moves the
      transferase away from its optimum, and a higher culture pH shifts the ammonium
      equilibrium towards free ammonia, which crosses membranes readily and raises lumenal
      pH with the same consequence."
  - id: RS-M02
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "The strong pH by duration interaction follows from that shared mechanism,
      because two conditions that both restrict the same limited galactosylation capacity
      cannot each remove it in full."

  # ---- hedge (standalone calibration of certainty or of practical significance) ----
  - id: RS-H01
    section: "Screening: factor effects"
    role: hedge
    quote: "so it is a real term in the model that is too small to matter to the control
      strategy"
  - id: RS-H02
    section: Response-surface models
    role: hedge
    quote: "it is reported as one check among four and not as the sole basis of model
      acceptance"

  # ---- bounded_conclusion (a claim explicitly bounded by range / model / scale-down) ----
  - id: RS-B01
    section: "Screening: factor effects"
    role: bounded_conclusion
    quote: "The screening results below are read as a ranking of active factors and as
      evidence of their direction, while the magnitudes used for prediction and for the
      design space come from the response-surface model"
    bounds: RS-02
  - id: RS-B02
    section: Design space
    role: bounded_conclusion
    quote: "The other four attributes remove further parts of the cube, and none of them is
      negligible."
    bounds: RS-05
  - id: RS-B03
    section: Design space
    role: bounded_conclusion
    quote: "Three bounds apply to this claim."
    bounds: RS-05
  - id: RS-B04
    section: Proven acceptable ranges
    role: bounded_conclusion
    quote: "Where the whole characterization range is a proven acceptable range, as it is
      here, the binding constraint on the operating region is the multivariate corner and
      not any univariate range."
    bounds: RS-06

  # ---- cross_step_credit (control of a shared attribute attributed to named steps) ----
  - id: RS-C01
    section: Executive summary
    role: cross_step_credit
    quote: "Host cell protein (HCP) and residual DNA are generated here and cleared
      downstream, so their drug substance capability is credited to Protein A
      chromatography, cation exchange and anion exchange, and the aggregate formed here is
      polished at cation exchange."
  - id: RS-C02
    section: Process capability and robustness
    role: cross_step_credit
    quote: "The credit for those two figures belongs to Protein A chromatography, cation
      exchange and anion exchange, and it is claimed in PCR-005, PCR-007 and PCR-008."
  - id: RS-C03
    section: Contribution to the control strategy
    role: cross_step_credit
    quote: "The step also makes no contribution to viral safety, since clearance of
      enveloped and non-enveloped virus is claimed at low-pH inactivation, anion exchange
      and virus filtration, and the cumulative claim is consolidated in PCMR-001."

  # ---- deviation_disposition (adverse finding -> investigation -> disposition) ----
  - id: RS-D01
    section: Executive summary
    role: deviation_disposition
    quote: "Both were investigated, impact-assessed and retained, and neither changed a
      parameter classification or the boundary of the operating region."
  - id: RS-D02
    section: "DEV-003-01: dissolved CO₂ probe drift during a screening run"
    role: deviation_disposition
    quote: "The run was retained on that basis, since the actual pCO₂ during the run
      remained inside the characterized range and the run therefore remains a valid point
      of the knowledge space."
  - id: RS-D03
    section: "DEV-003-02: nutrient feed under-delivery on a centre-point batch"
    role: deviation_disposition
    quote: "so the batch remains a valid centre point and it was retained"

  # ---- deferral (points to an appendix / paired document instead of "data not shown") ----
  - id: RS-F01
    section: Executive summary
    role: deferral
    quote: "These results roll up into the master report (PCMR-001)."
  - id: RS-F02
    section: Response-surface models
    role: deferral
    quote: "Coefficient tables for the remaining three responses are in Appendix C."

  # ---- restatement (the same claim in different words; coreference edge) ----
  - id: RS-R01
    section: Discussion
    role: restatement
    restates: RS-01
    quote: "The step is understood well enough to support a design space claim, and the
      evidence for that statement is the combination of a resolved factor set, a
      predictive model and a wide capability margin."
  - id: RS-R02
    section: Conclusions
    role: restatement
    restates: RS-01
    quote: "The production bioreactor is well characterized and robust over the ranges
      studied."
