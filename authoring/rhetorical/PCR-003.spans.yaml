# Rhetorical / argument-structure spans for PCR-003 (Production Bioreactor (Step 3) PC report).
# Re-curated 2026-08-20 (work unit 2026-08-19_02_fifth-round-plan-then-batches, TASK-017) against
# the one-pass re-authored pc_package/PCR-003_bioreactor.qmd, rendered to PCR-003_bioreactor.docx,
# authored under the amended rule 4 of WRITING_GUIDE.md.
# The document was not touched: this layer is annotation over the finished text, so every quote
# here was rewritten to the new prose and no sentence was written to fit a span.
#
# All 35 ids, roles and relations are kept. Every one of the previous 35 quotes failed against the
# new text, so all 35 were re-cut. Two section labels changed name only:
#   D02  'DEV-003-01 — dissolved CO2 probe drift'
#        -> 'DEV-003-01, dissolved carbon dioxide probe drift'
#   D03  'DEV-003-02 — nutrient feed-1 under-delivery'
#        -> 'DEV-003-02, nutrient feed-1 under-delivery'
# No span moved section.
#
# One thing about the new text is worth recording here, because it changes what two spans annotate
# without changing their roles. The revision of this document corrected two mechanistic claims that
# were wrong: it had said that dissolved carbon dioxide and culture pH sharing a sign on acidic
# charge variants is "what a shared intracellular mechanism predicts", which is false because a
# higher pCO2 lowers cytosolic pH while a higher culture pH raises it; and it had offered
# additivity as proof of independent mechanisms, which is circular. RS-M02 previously quoted the
# first of those. It now quotes the corrected account, which names the three contributions to the
# measured fraction and says they were not separated.
#
# Edges dropped: none. RS-01 supported_by [RS-J01, RS-J03], RS-02 supported_by [RS-J02],
# RS-03 supported_by [RS-J03, RS-J04], RS-04 supported_by [RS-M02],
# RS-05 supported_by [RS-J03, RS-J04, RS-M01], RS-07 supported_by [RS-J05],
# RS-08 supported_by [RS-J06], RS-B01 bounds RS-02, RS-B02/RS-B03 bound RS-05,
# RS-B04 bounds RS-06, RS-R01 and RS-R02 restate RS-01 — all hold in the new text.
#
# mechanistic_warrant, checked against the rule in RHETORICAL_ANNEX.md — each names a species, an
# enzyme or a physical property AND a direction, in the clause where the verb stands:
#   RS-M01  a less acidic Golgi lumen slowing the mannosidases and the GlcNAc transferase, so more
#           antibody is secreted still carrying five or more mannose residues;
#   RS-M02  dissolved carbon dioxide lowering cytosolic pH and with it the rate at which the
#           sialyltransferase adds sialic acid, against base-catalysed deamidation which alone
#           would give culture pH the opposite sign.
#
# Quotes are verbatim, whitespace-collapsed substrings of the rendered PCR-003_bioreactor.docx
# under BOTH extractors (pc_package/check_grounding.docx_text and build_rhetorical_annex.doc_text).
# No quote is taken from an ANOVA table row, which renders "nan" in the F and p columns.
document_id: PCR-003
section_id: rhetorical_spans
spans:
- id: RS-P01
  role: problem_statement
  section: Platform and prior-product knowledge
  quote: A parameter that raises deamidation may lower the sialylated fraction at the same time, so
    the net direction of each parameter on the sum was read from the fitted model.
- id: RS-P02
  role: problem_statement
  section: Centre-point performance and reproducibility
  quote: Galactosylation is the one response whose reproducibility differs between the two designs.
- id: RS-P03
  role: problem_statement
  section: Design space
  quote: It is defined on the qualified scale-down model and is not confirmed at commercial scale at
    the edges of the ranges.
- id: RS-01
  role: claim
  section: Executive summary
  supported_by:
  - RS-J01
  - RS-J03
  quote: The response-surface models account for between 91 and 97 % of the variance in the five
    responses.
- id: RS-02
  role: claim
  section: 'Screening: factor effects'
  supported_by:
  - RS-J02
  quote: Culture pH, culture temperature, culture duration and dissolved carbon dioxide are active
    across the responses that matter most
- id: RS-03
  role: claim
  section: Response-surface models
  supported_by:
  - RS-J03
  - RS-J04
  quote: The response-surface design was executed on the four factors carried forward, and the full
    quadratic model fitted to each response is the model from which §6, §7 and §8 are computed.
- id: RS-04
  role: claim
  section: Mechanistic interpretation
  supported_by:
  - RS-M02
  quote: A batch harvested a day early therefore leaves the reactor with a different glycan
    distribution depending on the pH at which it was grown
- id: RS-05
  role: claim
  section: Design space
  supported_by:
  - RS-J03
  - RS-J04
  - RS-M01
  quote: Galactosylation rejects the largest share at 14 % and high mannose the smallest at 5 %, so
    galactosylation is the attribute that binds the operating region of this step.
- id: RS-06
  role: claim
  section: Proven acceptable ranges
  quote: The design space in §6 is a multivariate statement and the proven acceptable ranges are the
    univariate statements that sit inside it, one per attribute and parameter.
- id: RS-07
  role: claim
  section: Process capability and robustness
  supported_by:
  - RS-J05
  quote: The tightest capability is high mannose, at a one-sided Cpk of 1.94.
- id: RS-08
  role: claim
  section: Parameter classification
  supported_by:
  - RS-J06
  quote: There is no critical process parameter at this step.
- id: RS-J01
  role: justification
  section: Executive summary
  quote: No response shows significant lack of fit against the centre-point pure error.
- id: RS-J02
  role: justification
  section: 'Screening: factor effects'
  quote: The overall screening model for afucosylation is not significant either (F = 5.51, p =
    0.093) on 3 residual degrees of freedom.
- id: RS-J03
  role: justification
  section: Response-surface models
  quote: No response shows significant lack of fit.
- id: RS-J04
  role: justification
  section: Response-surface models
  quote: Neither response shows a residual pattern that would indicate a missing term.
- id: RS-J05
  role: justification
  section: Process capability and robustness
  quote: Its simulated mean of 5.99 % of glycans sits between acceptance limits of 3 and 10 %, and
    the lower limit is the one that binds, at 5.8 standard deviations from the mean.
- id: RS-J06
  role: justification
  section: Parameter classification
  quote: Every parameter that is linked to a quality attribute is held inside a normal operating
    range that the equipment controls reliably and that sits inside the region characterized here
- id: RS-M01
  role: mechanistic_warrant
  section: Mechanistic interpretation
  quote: A less acidic Golgi lumen slows the mannosidases that trim the precursor glycan and the
    GlcNAc transferase that acts after them, so more antibody is secreted still carrying five or
    more mannose residues.
- id: RS-M02
  role: mechanistic_warrant
  section: Mechanistic interpretation
  quote: The measured fraction also carries sialylated glycans and glycated lysines, and dissolved
    carbon dioxide lowers cytosolic pH and with it the rate at which the sialyltransferase adds
    sialic acid.
- id: RS-H01
  role: hedge
  section: 'Screening: factor effects'
  quote: The screening analysis identifies which parameters and which interactions move each
    response over the ranges studied.
- id: RS-H02
  role: hedge
  section: Response-surface models
  quote: A test with a denominator that large would not separate a correct quadratic model from an
    incorrect one.
- id: RS-B01
  role: bounded_conclusion
  section: 'Screening: factor effects'
  bounds: RS-02
  quote: Culture duration has no demonstrated effect on this response over the range studied
- id: RS-B02
  role: bounded_conclusion
  section: Design space
  bounds: RS-05
