    to 40 %.
- id: RS-B03
  role: bounded_conclusion
  section: Design space
  bounds: RS-05
  quote: It is defined on mean predictions from the fitted models, so a batch run exactly on its
    boundary meets the criterion about half the time if the variation around the predicted mean is
    symmetrical.
- id: RS-B04
  role: bounded_conclusion
  section: Proven acceptable ranges
  bounds: RS-06
  quote: The propagated analysis is never wider than the set-point analysis, and for several pairs
    it is narrower than the normal operating range itself.
- id: RS-C01
  role: cross_step_credit
  section: Executive summary
  quote: The other two, host cell protein and residual DNA, enter the broth when cells lyse, and
    both rise as viability falls through the last days of the run.
