# initial viable cell concentration acts on acidic variants in the univariate study, and the departures from
# the plan are discrepancies). Several of the old spans asserted what the new text no longer says (no CPP at
# the step; galactosylation binds the operating region; the full quadratic model is the predictive model).
# So no span of that curation is carried over, and the ids are assigned afresh, in the order in which the
# spans occur in the rendered document: an id names a span of this revision only.
#
# Conventions, as in the PCR-006 file of the same pass:
#   - every quote is a verbatim, whitespace-collapsed substring of the rendered .docx
#     (check_grounding.docx_text) and occurs there exactly once;
#   - no quote carries a value of an inline {python} expression, a cross-reference, a citation, or the
#     superscript token "R²" on which the extractors disagree, so the layer survives a reseed; a quote that
#     would cross one stops short of it (a clause slice);
#   - section is the document's own heading of the span;
#   - one role per span, by RHETORICAL_ANNEX.md. A mechanistic_warrant names a physical cause (which species,
#     which enzyme or property, in which direction). A sentence that explains by process control rather than
#     by chemistry is a justification.
#   - The registered discrepancy D-002 (the sentence of Section 1.1 that the bioreactor is the only step at
#     which product quality attributes are formed) is deliberately not a span: the layer neither labels nor
#     endorses it.
