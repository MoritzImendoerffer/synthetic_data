# Rhetorical / argument-structure spans for PCR-003 (production bioreactor PC report).
# Re-curated 2026-08-18 against the report re-authored in work unit
# 2026-08-18_01_register-third-round, TASK-005. Every quote is a verbatim,
# whitespace-collapsed substring of the rendered pc_package/PCR-003_bioreactor.docx
# (checked by build_ground_truth.build_rhetorical_spans and by check_grounding.py) — so no
# quote may cross a `{python}` inline expression, a @ref, a citation or bold markup.
# Number-free spans are preferred so a seed change cannot break grounding; every quote below
# is free of digits, and free of R² / R2, which the two extractors render differently.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-003
spans:

  # ---- problem_statement (the uncertainty / caution that motivates a passage) ----
  - id: RS-P01
    section: "Platform and prior-product knowledge"
    role: problem_statement
    quote: "What the platform does not supply is the size of each effect for this molecule, or
      the shape of the region over which all five of the measured attributes stay simultaneously
      acceptable at commercial scale under normal operating range variation"
  - id: RS-P02
    section: "Centre-point performance and reproducibility"
    role: problem_statement
    quote: "Because the scale-down runs were executed across the whole campaign, these figures
      carry culture-to-culture variation as well as assay variation, which makes them an upper
      bound on the assay contribution taken alone"
  - id: RS-P03
    section: "Design space"
    role: problem_statement
    quote: "Design spaces of this kind are not confirmed at commercial scale at the edges of the
      ranges"

  # ---- claim (the finding a section or paragraph asserts) ----
  - id: RS-01
    section: "Executive summary"
    role: claim
    quote: "Over the ranges studied, the response surface models fitted to those runs describe the
      data adequately"
    supported_by: ["RS-J01", "RS-J03"]
  - id: RS-02
    section: "Screening: factor effects"
    role: claim
    quote: "Across the five responses, only a small number of large effects was resolved by
      screening"
    supported_by: ["RS-J02"]
  - id: RS-03
    section: "Response-surface models"
    role: claim
    quote: "The response surface models describe the characterized region adequately"
    supported_by: ["RS-J03", "RS-J04"]
  - id: RS-04
    section: "Mechanistic interpretation"
    role: claim
    quote: "An operating region assembled from independent one-dimensional ranges would miss that
      dependence entirely"
    supported_by: ["RS-M02"]
  - id: RS-05
    section: "Design space"
    role: claim
    quote: "The design space of the step is defined as the multivariate region of the characterized
      space over which every attribute the step governs stays inside its in-process limit"
    supported_by: ["RS-J03", "RS-J04", "RS-M01"]
  - id: RS-06
    section: "Proven acceptable ranges"
    role: claim
    quote: "The proven acceptable ranges are reported alongside the multivariate region, as a view
      taken one attribute and one parameter at a time"
  - id: RS-07
    section: "Process capability and robustness"
    role: claim
    quote: "The tightest capability among those seven attributes belongs to High Mannose"
    supported_by: ["RS-J05"]
  - id: RS-08
    section: "Parameter classification"
    role: claim
    quote: "Finally, no parameter at this step was classified as a CPP"
    supported_by: ["RS-J06"]

  # ---- justification (the evidence offered for a claim) ----
  - id: RS-J01
    section: "Executive summary"
    role: justification
    quote: "no lack of fit test reaching significance against the pure error"
  - id: RS-J02
    section: "Screening: factor effects"
    role: justification
    quote: "leaves the overall F test short of significance"
  - id: RS-J03
    section: "Response-surface models"
    role: justification
    quote: "Across the five responses, every overall F test reaches significance"
  - id: RS-J04
    section: "Response-surface models"
    role: justification
    quote: "No lack of fit test reaches significance against the centre-point pure error"
  - id: RS-J05
    section: "Process capability and robustness"
    role: justification
    quote: "the parameters that lower high mannose are the ones the step holds most closely, which
      settles the distribution nearer the floor than the ceiling"
  - id: RS-J06
    section: "Parameter classification"
    role: justification
    quote: "which keeps the risk of an excursion outside the design space low in each of the five
      cases considered"

  # ---- mechanistic_warrant (the mechanism that makes the evidence relevant) ----
  - id: RS-M01
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "which is the signature of incomplete mannosidase trimming, because a higher lumenal pH
      and a lower temperature both slow the trimming enzymes and leave more of the high-mannose
      precursor intact at secretion"
  - id: RS-M02
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Galactosylation falls as the culture lengthens, which is what a declining
      galactosyltransferase activity and a depleting nucleotide sugar pool together predict"

  # ---- hedge (the qualification on strength of evidence) ----
  - id: RS-H01
    section: "Screening: factor effects"
    role: hedge
    quote: "Consequently the fits from that design are read as effect estimates and never as
      predictive models of the step"
  - id: RS-H02
    section: "Response-surface models"
    role: hedge
    quote: "Therefore a non-significant result bounds the evidence for the model form without
      establishing it"

  # ---- bounded_conclusion (what the claim does not cover) ----
  - id: RS-B01
    section: "Screening: factor effects"
    role: bounded_conclusion
    quote: "which is where the predictive claim of this report is made"
    bounds: "RS-02"
  - id: RS-B02
    section: "Design space"
    role: bounded_conclusion
    quote: "That corner marks the edge of failure of the knowledge space. It lies well outside the
      operating region defined here"
    bounds: "RS-05"
  - id: RS-B03
    section: "Design space"
    role: bounded_conclusion
    quote: "Three bounds are attached to the design space claim made above"
    bounds: "RS-05"
  - id: RS-B04
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "The second analysis serves as the reproducible default of this package. By construction
      it bounds the parameter more tightly than the first"
    bounds: "RS-06"

  # ---- cross_step_credit (what another step contributes) ----
  - id: RS-C01
    section: "Executive summary"
    role: cross_step_credit
    quote: "both are formed in the culture and cleared downstream, with the clearance credited in
      PCR-005, PCR-007 and PCR-008"
  - id: RS-C02
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "The clearance that brings both attributes down is credited to Protein A capture
      (PCR-005), cation exchange (PCR-007) and anion exchange (PCR-008)"
  - id: RS-C03
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "Cross-step credit is owed for three of the seven attributes the step sets"

  # ---- deviation_disposition (what happened and how it was dispositioned) ----
  - id: RS-D01
    section: "Executive summary"
    role: deviation_disposition
    quote: "Both of them were investigated, root caused and retained, and neither altered a fitted
      effect, a proven acceptable range or a parameter classification"
  - id: RS-D02
    section: "DEV-003-01 — dissolved CO2 probe drift"
    role: deviation_disposition
    quote: "A perturbation of that size on a single run does not change the ranking from which the
      response surface factors were selected"
  - id: RS-D03
    section: "DEV-003-02 — nutrient feed-1 under-delivery"
    role: deviation_disposition
    quote: "The pump was recalibrated and the verification frequency was increased"

  # ---- deferral (the location a detail is deferred to) ----
  - id: RS-F01
    section: "Executive summary"
    role: deferral
    quote: "Confirmation at commercial scale is the work of Stage 2. Once that confirmation is
      complete, this report rolls up into PCMR-001"
  - id: RS-F02
    section: "Response-surface models"
    role: deferral
    quote: "with the remaining three in Appendix C"

  # ---- restatement (the claim restated later in the document) ----
  - id: RS-R01
    section: "Discussion"
    role: restatement
    quote: "The bioreactor step is now understood well enough to support the Stage 2 ranges"
    restates: "RS-01"
  - id: RS-R02
    section: "Conclusions"
    role: restatement
    quote: "The production bioreactor is well characterized and robust over the ranges studied"
    restates: "RS-01"
