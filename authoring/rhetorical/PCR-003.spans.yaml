# Rhetorical / argument-structure spans for PCR-003 (bioreactor PC report).
# Grounded by authoring/build_rhetorical_annex.py against
# pc_package/PCR-003_bioreactor.DRAFT.qmd. Every quote is a verbatim,
# whitespace-collapsed substring of the plain prose (no **bold**, no `{python}`
# inline expressions). The 3 weak_claims (WC-003-*) are auto-merged by the builder.
document_id: PCR-003
spans:

  # ---- problem_statement (Situation+Complication that motivates a section) ----
  - id: RS-P1
    section: results-screening
    role: problem_statement
    quote: "One screening run warrants explicit comment before the effects are accepted."
  - id: RS-P2
    section: results-screening
    role: problem_statement
    quote: "that high R² must not be read as predictive power"

  # ---- claim (Answer / finding asserted up front) ----
  - id: RS-01
    section: exec_summary
    role: claim
    quote: "the step is well understood, and a response-surface model over the well-controlled culture parameters defines an operating region in which the glycan, charge-variant and aggregate CQAs remain within their acceptance limits"
    supported_by: [RS-J3, RS-J4, RS-M1, RS-M3]
  - id: RS-02
    section: results-centerpoint
    role: claim
    quote: "The centre-point replicates establish tight pure error for every response and confirm that the scale-down model reproduces both the culture and its assays"
    supported_by: [RS-J1]
  - id: RS-03
    section: results-screening
    role: claim
    quote: "The screening design identified the active culture factors and two-factor interactions for each response and established the division of labour that governs the rest of the analysis"
    supported_by: [RS-J2]
  - id: RS-04
    section: results-rsm
    role: claim
    quote: "Every response-surface model explains the data well and none shows significant lack of fit"
    supported_by: [RS-J3, RS-J4]
  - id: RS-agg
    section: results-screening
    role: claim
    quote: "a longer, higher-pH culture demonstrably increases aggregate content"
    supported_by: [RS-J2, RS-M2]
  - id: RS-HM
    section: results-centerpoint
    role: claim
    quote: "This is a reproducibility limit of the measurement, not evidence of an unstable process."
    supported_by: [RS-M-assay]

  # ---- justification (evidence / statistic / table row / diagnostic) ----
  - id: RS-J1
    section: results-centerpoint
    role: justification
    quote: "the response %CV is in single digits for every attribute"
  - id: RS-J2
    section: results-screening
    role: justification
    quote: "high-molecular-weight species are raised by both culture pH and culture duration"
  - id: RS-J3
    section: results-rsm
    role: justification
    quote: "the model term is highly significant while the lack-of-fit mean square is not significant against the centre-point pure error, so the residual variation is consistent with measurement reproducibility rather than with a missing model term"
  - id: RS-J4
    section: results-rsm
    role: justification
    quote: "show no structure in the residuals against the predicted values"

  # ---- mechanistic_warrant (a justification that reasons from physical/chemical mechanism) ----
  - id: RS-M1
    section: results-mechanistic
    role: mechanistic_warrant
    quote: "pH and temperature set enzyme activity and the residence time over which glycan processing and product aggregation proceed, while pCO₂ modulates intracellular and medium pH and thereby dominates acidic charge-variant formation"
  - id: RS-M2
    section: results-screening
    role: mechanistic_warrant
    quote: "this is the mechanistic basis for treating pH and duration as the aggregate-governing pair when the operating region is drawn"
  - id: RS-M3
    section: results-mechanistic
    role: mechanistic_warrant
    quote: "Because culture pH recurs in the strongest interactions across several responses — with duration for aggregates and afucosylation, and against temperature for high mannose — the factors cannot be set independently without leaving those interactions uncontrolled"
  - id: RS-M-assay
    section: results-centerpoint
    role: mechanistic_warrant
    quote: "high mannose is a low-abundance glycan quantified by released-N-glycan HILIC-UPLC, where a small absolute species carries a larger relative measurement variance"

  # ---- hedge (calibrated qualification signalling limited certainty) ----
  - id: RS-H1
    section: results-centerpoint
    role: hedge
    quote: "attributable to the assay rather than the culture"
  - id: RS-H2
    section: results-rsm
    role: hedge
    quote: "are read as reliable descriptions of the surface rather than tight point-predictors"
  - id: RS-H3
    section: results-centerpoint
    role: hedge
    quote: "the fitted surfaces are consistent with the observed centre-point reproducibility"

  # ---- bounded_conclusion (a claim explicitly bounded by range / model / scale-down) ----
  - id: RS-B1
    section: exec_summary
    role: bounded_conclusion
    quote: "within the characterized culture ranges and on the qualified scale-down model, the formation of in-specification product quality"
    bounds: RS-01
  - id: RS-B2
    section: results-centerpoint
    role: bounded_conclusion
    quote: "The interpretation is bounded to the set-point and to the qualified scale-down model"
    bounds: RS-02
  - id: RS-B3
    section: results-mechanistic
    role: bounded_conclusion
    quote: "The interpretation is bounded to the proven acceptable ranges studied and to the qualified scale-down model"
    bounds: RS-01
  - id: RS-B4
    section: results-screening
    role: bounded_conclusion
    quote: "These screening effects hold over the ranges screened and rank the active factors"
    bounds: RS-03

  # ---- cross_step_credit (attributes a shared attribute's control to named steps/documents) ----
  - id: RS-C1
    section: exec_summary
    role: cross_step_credit
    quote: "burden it sets is cleared to release levels by the downstream purification train — Protein A (PCR-005), cation exchange (PCR-007) and anion exchange (PCR-008)"
  - id: RS-C2
    section: exec_summary
    role: cross_step_credit
    quote: "the enveloped- and small-virus safety margins are established at the dedicated viral steps (PCR-006, PCR-008, PCR-009) under ICH Q5A"
  - id: RS-C3
    section: exec_summary
    role: cross_step_credit
    quote: "These contributions are consolidated with the present one in the Master Report (PCMR-001)."

  # ---- deviation_disposition (adverse finding -> investigation -> disposition) ----
  - id: RS-D1
    section: exec_summary
    role: deviation_disposition
    quote: "each was investigated, bounded to within the studied ranges and retained without altering any parameter classification or the operating region"
  - id: RS-D2
    section: results-screening
    role: deviation_disposition
    quote: "The offset is small relative to the studied pCO₂ range and the affected attribute is of very-low criticality with wide capability; the effect estimates and the resulting classifications are unchanged."

  # ---- deferral (points to an appendix / paired section instead of "data not shown") ----
  - id: RS-F1
    section: results-screening
    role: deferral
    quote: "The full investigation and its bounded-impact argument are given in the deviations section."
  - id: RS-F2
    section: results-rsm
    role: deferral
    quote: "The same conclusion holds for the other four responses (Appendix C)."
  - id: RS-F3
    section: results-screening
    role: deferral
    quote: "the full effect tables for all five responses are in Appendix C"

  # ---- restatement (a claim restated elsewhere in different words; coreference) ----
  - id: RS-R1
    section: results-rsm
    role: restatement
    restates: RS-01
    quote: "it is these models — not the screening effects — that define the operating region"
  - id: RS-R2
    section: results-rsm
    role: restatement
    restates: RS-HM
    quote: "the same measurement variance limits both — so the qualification is attributed to the assay, not to model inadequacy"
  - id: RS-R3
    section: results-mechanistic
    role: restatement
    restates: RS-01
    quote: "the operating region is defined multivariately in the well-controlled CPPs rather than as a stack of one-dimensional ranges"
