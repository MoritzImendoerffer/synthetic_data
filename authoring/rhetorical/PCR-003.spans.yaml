# Rhetorical / argument-structure spans for PCR-003 (production bioreactor PC report).
#
# RE-CURATED 2026-07-28 against the RE-AUTHORED report. The previous layer was curated
# against the superseded text and all 35 of its spans had stopped matching. This is the
# second wholesale invalidation of this layer, which is why RHETORICAL_ANNEX.md says to
# re-curate as part of the annex step and not as a later task.
#
# Grounding rule: each quote must be a verbatim, whitespace-collapsed substring of the
# RENDERED pc_package/PCR-003_bioreactor.docx — that is what
# build_ground_truth.build_rhetorical_spans and check_grounding.py both read. Quotes may
# therefore contain rendered numbers, resolved cross-references ("Table 10", "§6") and the
# subscript glyph in pCO₂, none of which appear in the .qmd source; do not re-check this
# file against the .qmd.
#
# NOT annotated here: the two registered benchmark negatives WC-003-01 and WC-003-02
# (authoring/weak_claims.yaml). They are merged as role `weak_claim` with
# support = unsupported by the builder, and must not carry a normal `claim` span. Both live
# in §5.2; the claim and justification spans below take that section's OTHER sentences.
document_id: PCR-003
spans:

  # ---- problem_statement (the caution / gap that motivates a passage) ------------------
  # In a finished report this role is a mid-paragraph caution, not a section opener: each
  # of these warns the reader off an inference the surrounding evidence does not support.
  - id: RS-P01
    section: Screening design
    role: problem_statement
    quote: "The 16 factorial runs support a model of 16 terms, so the residual degrees of
      freedom come from the centre points alone."
  - id: RS-P02
    section: "Screening: factor effects"
    role: problem_statement
    quote: "The screening models fit the executed runs closely, and they have almost no
      predictive latitude."
  - id: RS-P03
    section: Proven acceptable ranges
    role: problem_statement
    quote: "It does not mean that every combination of parameters is acceptable, and §6 shows
      one combination that is not."

  # ---- claim (the finding a section or paragraph asserts) -----------------------------
  - id: RS-01
    section: Executive summary
    role: claim
    quote: "The production bioreactor is characterized, and the multivariate region defined in
      this report supports the operating ranges proposed for commercial manufacture."
    supported_by: [RS-J01]
  - id: RS-02
    section: Scale-down model and its qualification
    role: claim
    quote: "All characterization runs were executed on a qualified scale-down model of the
      commercial bioreactor, and the warrant for applying the results to commercial scale rests
      on that qualification."
    supported_by: [RS-J02]
  - id: RS-03
    section: Centre-point performance and reproducibility
    role: claim
    quote: "Reproducibility at the centre point is good for three of the five responses and
      moderate for galactosylation and high mannose."
    supported_by: [RS-J03]
  - id: RS-04
    section: "Screening: factor effects"
    role: claim
    quote: "The screening design separates the active factors from the inactive ones, and it
      does so with different force from one response to another."
    supported_by: [RS-J04]
  - id: RS-05
    section: Response-surface design
    role: claim
    quote: "Osmolality was not carried into the response-surface design."
    supported_by: [RS-J05]
  - id: RS-06
    section: Response-surface models
    role: claim
    quote: "The models are adequate for all five responses and each of them retains predictive
      value on runs it has not seen."
    supported_by: [RS-J06, RS-J07]
  - id: RS-07
    section: Mechanistic interpretation
    role: claim
    quote: "The fitted surfaces follow the mechanisms set out in §2.1 in most respects, and they
      depart from them in two."
    supported_by: [RS-M01, RS-M02, RS-M03, RS-M05]
  - id: RS-08
    section: Design space
    role: claim
    quote: "The design space for the production bioreactor is a multivariate region in culture
      pH, culture temperature, culture duration and pCO₂, with osmolality at its normal
      operating range, over which every attribute the step sets remains within its acceptance
      criterion."
    supported_by: [RS-J08, RS-J09]
  - id: RS-09
    section: Design space
    role: claim
    quote: "One corner of the characterized region fails."
    supported_by: [RS-J10, RS-M04]
  - id: RS-10
    section: Proven acceptable ranges
    role: claim
    quote: "Every proven acceptable range in the table spans the full characterization range of
      its parameter, under both analyses."
    supported_by: [RS-J11, RS-J12]
  - id: RS-11
    section: Proven acceptable ranges
    role: claim
    quote: "The binding constraint on the operating region at this step is the multivariate
      corner, not any univariate proven acceptable range."
    supported_by: [RS-P03, RS-J10]
  - id: RS-12
    section: Process capability and robustness
    role: claim
    quote: "Every attribute meets its acceptance criterion, and the tightest capability is
      comfortable."
    supported_by: [RS-J13]
  - id: RS-13
    section: Parameter classification
    role: claim
    quote: "The step has 5 well-controlled critical process parameters, 3 key process parameters
      and 1 general process parameter."
    supported_by: [RS-J14]
  - id: RS-14
    section: Discussion
    role: claim
    quote: "The step is well understood over the ranges characterized, and the understanding is
      mechanistic and not merely empirical."
    supported_by: [RS-J15]

  # ---- justification (evidence / statistic / diagnostic offered for a claim) ----------
  - id: RS-J01
    section: Executive summary
    role: justification
    quote: "The response-surface model is the predictive model and the basis of the design
      space, and it accounts for between 91.1% and 97.1% of the observed variation in the 5
      measured attributes, with lack of fit not significant for any of them."
  - id: RS-J02
    section: Scale-down model and its qualification
    role: justification
    quote: "Replicate set-point runs on the scale-down system were compared against
      commercial-scale engineering batches on the process performance measures (peak viable cell
      density, harvest viability, titre) and on the full quality panel"
  - id: RS-J03
    section: Centre-point performance and reproducibility
    role: justification
    quote: "High mannose is the least reproducible response, at 9.9 % CV, and acidic variants
      the most reproducible, at 4.1 %."
  - id: RS-J04
    section: "Screening: factor effects"
    role: justification
    quote: "It is significant for galactosylation, acidic variants and aggregates, and it does
      not reach significance for afucosylation and high mannose, so the individual terms of
      those models are read as indicative and are confirmed against the response-surface design
      in §5.3."
  - id: RS-J05
    section: Response-surface design
    role: justification
    quote: "Its screening main effect is the smallest of the five on galactosylation and on high
      mannose, which are the two responses that drive the design space and the capability claim,
      and osmolality is held close to its set-point in routine operation by the feed and base
      strategy."
  - id: RS-J06
    section: Response-surface models
    role: justification
    quote: "R² ranges from 0.91 to 0.97, adjusted R² does not fall below 0.81 (high mannose),
      and predicted R² does not fall below 0.60 (acidic variants), against a highest value of
      0.92."
  - id: RS-J07
    section: Response-surface models
    role: justification
    quote: "The residual variance was partitioned against the 3 pure-error degrees of freedom
      from the centre points, and the smallest lack-of-fit p-value across the five responses is
      0.15 (acidic variants), well above α = 0.05."
  - id: RS-J08
    section: Design space
    role: justification
    quote: "Across a grid of 21 levels in each of the four response-surface factors, which is
      194,481 combinations, the models place all five attributes inside their acceptance criteria
      at all but 3 points."
  - id: RS-J09
    section: Design space
    role: justification
    quote: "Every attribute stays within its criterion at every corner of the normal operating
      ranges, with margin."
  # The exceedance is a model PREDICTION. The superseded layer carried a span asserting that
  # galactosylation had also been MEASURED above the limit at this vertex; the re-authored
  # report makes no such claim anywhere, so that span is gone rather than re-anchored.
  - id: RS-J10
    section: Design space
    role: justification
    quote: "With culture pH at 6.6, culture duration at 15 days and pCO₂ at 40 mmHg, all three
      at their low edges, and culture temperature at 36 °C at its high edge, the fitted model
      predicts galactosylation of 40.27 % against an upper limit of 40 %."
  - id: RS-J11
    section: Proven acceptable ranges
    role: justification
    quote: "No single parameter, moved alone across the whole range studied, takes any attribute
      out of specification, and that remains true when the other three parameters vary randomly
      within their normal operating ranges."
  - id: RS-J12
    section: Proven acceptable ranges
    role: justification
    quote: "The reason the two columns agree is that the effects are moderate relative to the
      width of the acceptance criteria and the normal operating ranges are narrow."
  - id: RS-J13
    section: Process capability and robustness
    role: justification
    quote: "High Mannose is the binding attribute with a one-sided Cpk of 1.94."
  - id: RS-J14
    section: Parameter classification
    role: justification
    quote: "That outcome rests on control capability rather than on the absence of effects,
      since four of the five multivariate parameters have large demonstrated effects."
  - id: RS-J15
    section: Discussion
    role: justification
    quote: "Most of the significant main effects in Table 10 run through a route in the secretory
      pathway or in culture chemistry that was set out before the study was run (§2.1), and the
      fitted models reproduce those routes in direction."

  # ---- mechanistic_warrant (reasoning from enzymatic / physicochemical mechanism) -----
  - id: RS-M01
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "Terminal galactosylation is added late in the secretory pathway by
      galactosyltransferase, whose activity falls as the culture ages and the intracellular
      environment acidifies, so material made in the last days of a long culture carries less
      galactose."
  - id: RS-M02
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "The negative pCO₂ coefficient of -2.43 has the same root, since dissolved carbon
      dioxide lowers intracellular pH and moves the Golgi away from the optimum for that enzyme."
  - id: RS-M03
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "High mannose species are the ones that escape processing by the mannosidases in the
      early Golgi, so they accumulate when processing capacity is limiting relative to secretion
      flux."
  - id: RS-M04
    section: Design space
    role: mechanistic_warrant
    quote: "The mechanism is the pH by duration interaction described in §5.4, reinforced by the
      low pCO₂ and high temperature edges, each of which raises galactosylation on its own."
  - id: RS-M05
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "Deamidation of asparagine residues is base catalysed, and dissolved carbon dioxide
      lowers the pH of the culture fluid in which secreted antibody accumulates, so a higher
      pCO₂ suppresses the reaction."

  # ---- hedge (standalone calibration of certainty) ------------------------------------
  - id: RS-H01
    section: Response-surface models
    role: hedge
    quote: "Its predictions are mean levels, so a prediction at the edge of the region carries
      about a one in two chance of falling on either side of the predicted value if the
      variability around the mean is symmetric"
  - id: RS-H02
    section: Mechanistic interpretation
    role: hedge
    quote: "The icIEF acidic peak sums species formed by more than one route, and the fitted sign
      is a property of that summed measurement and not of deamidation alone."
  - id: RS-H03
    section: Discussion
    role: hedge
    quote: "Confidence in the scale-down model is good but not unlimited."

  # ---- bounded_conclusion (a claim explicitly bounded by range / model / scale-down) ---
  - id: RS-B01
    section: Design space
    role: bounded_conclusion
    quote: "Three bounds apply to this claim."
    bounds: RS-08
  - id: RS-B02
    section: Process capability and robustness
    role: bounded_conclusion
    quote: "It assumes every parameter stays inside its normal operating range, which is what the
      control system delivers and what the parameter classifications in §9 commit to."
    bounds: RS-12
  - id: RS-B03
    section: Proven acceptable ranges
    role: bounded_conclusion
    quote: "The ranges are proven over the characterization ranges of Table 6 and against the
      fitted response-surface model, so they are supported by data only where data were taken."
    bounds: RS-10
  - id: RS-B04
    section: Discussion
    role: bounded_conclusion
    quote: "Osmolality was characterized in screening only, so its contribution to the region is
      bounded by a two-level estimate and is not described by a surface (§4.3)."
    bounds: RS-05
  - id: RS-B05
    section: Conclusions
    role: bounded_conclusion
    quote: "The design space has not been confirmed at commercial scale at its edges, and
      confirmation within the normal operating ranges is the object of the process performance
      qualification."
    bounds: RS-08

  # ---- cross_step_credit (control of a shared attribute attributed to named steps) -----
  - id: RS-C01
    section: Quality attributes in scope
    role: cross_step_credit
    quote: "Host cell protein and residual DNA are generated in the culture at levels several
      orders of magnitude above the drug substance criterion and are cleared by Protein A, cation
      exchange and anion exchange (PCR-005, PCR-007, PCR-008)."
  - id: RS-C02
    section: Process capability and robustness
    role: cross_step_credit
    quote: "Host cell protein and residual DNA are generated in the culture at levels orders of
      magnitude above their drug substance criteria, and the indices shown here are the product
      of clearance at Protein A, cation exchange and anion exchange (PCR-005, PCR-007, PCR-008)."
  - id: RS-C03
    section: Conclusions
    role: cross_step_credit
    quote: "The drug substance levels of aggregate, host cell protein and residual DNA depend on
      downstream clearance as well as on culture conditions, and the credit for that clearance
      belongs to PCR-005, PCR-007 and PCR-008."

  # ---- deviation_disposition (adverse finding -> investigation -> disposition) ---------
  - id: RS-D01
    section: "DEV-003-01 — dissolved carbon dioxide probe drift"
    role: deviation_disposition
    quote: "The run was retained. The true setting remained inside the characterization range of
      pCO₂, the direction of every screening effect is unchanged, and the design space of §6
      rests on the response-surface design, which the deviation does not touch."
  - id: RS-D02
    section: "DEV-003-02 — nutrient feed-1 under-delivery"
    role: deviation_disposition
    quote: "The batch was retained as a centre point. Retaining it slightly inflates the
      pure-error term of the screening design, which is conservative, since a larger pure error
      makes a lack-of-fit test easier to pass and the screening design is not used for prediction
      in any case (§5.2)."

  # ---- deferral (points to an appendix / paired document / study record) ---------------
  - id: RS-F01
    section: Analytical methods
    role: deferral
    quote: "Method performance is summarized in Appendix D, and the full validation data are in
      the AMV reports."
  - id: RS-F02
    section: Response-surface models
    role: deferral
    quote: "Diagnostics for the remaining three responses were reviewed to the same standard and
      are held in the study record referenced by PCP-003."
  - id: RS-F03
    section: Univariate assessment
    role: deferral
    quote: "The results of the individual runs are held in the study record referenced by PCP-003
      and are not reproduced here"

  # ---- restatement (the same claim in different words; coreference edge) --------------
  - id: RS-R01
    section: Conclusions
    role: restatement
    restates: RS-12
    quote: "Predicted commercial-scale capability meets acceptance for all seven attributes the
      step sets, with High Mannose the tightest at a one-sided Cpk of 1.94 and 2.99 percentage
      points to its binding limit."
  - id: RS-R02
    section: Conclusions
    role: restatement
    restates: RS-11
    quote: "Proven acceptable ranges span the full characterization range of every
      response-surface parameter against every attribute it governs, under both the set-point and
      the normal-operating-range analyses, so the constraint that binds the operating region is
      the multivariate corner and not a univariate range."
  - id: RS-R03
    section: Discussion
    role: restatement
    restates: RS-09
    quote: "The adverse finding of the study is the excluded corner."
  - id: RS-R04
    section: Conclusions
    role: restatement
    restates: RS-08
    quote: "A response-surface model over culture pH, culture temperature, culture duration and
      pCO₂ defines a multivariate design space in which the five measured attributes remain
      within their acceptance criteria, with one corner of the characterized region excluded on
      galactosylation."
