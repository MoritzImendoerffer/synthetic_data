# Rhetorical / argument-structure spans for PCR-003 (production bioreactor PC report).
# Re-curated 2026-08-17 against the report re-authored under the amended writing guide
# (work unit 2026-08-16_01_register-from-four-sources, TASK-008). Every quote is a
# verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-003_bioreactor.docx (checked by build_ground_truth.build_rhetorical_spans
# and by check_grounding.py) — so no quote may cross a `{python}` inline expression, a
# @ref, a citation or bold markup. Number-free spans are preferred so a seed change cannot
# break grounding.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-003
spans:

  # ---- problem_statement (the uncertainty / caution that motivates a passage) ----
  - id: RS-P01
    section: Platform and prior-product knowledge
    role: problem_statement
    quote: "Prior experience therefore establishes what the culture does, and
      characterization is required to bound it instead of to discover it"
  - id: RS-P02
    section: Centre-point performance and reproducibility
    role: problem_statement
    quote: "The high mannose spread is therefore only partly a property of the culture, and
      it is the main reason the high mannose model is the weakest of the five"
  - id: RS-P03
    section: Design space
    role: problem_statement
    quote: "It is built from models of mean response, so the reliability at the edge of the
      region is roughly half if the batch variability is symmetric about the mean"

  # ---- claim (the finding a section or paragraph asserts) ----
  - id: RS-01
    section: Executive summary
    role: claim
    quote: "Within the characterized ranges these models define a multivariate region in
      which all five attributes stay inside the in-process limits for this step"
    supported_by: [RS-J01, RS-J03]
  - id: RS-02
    section: "Screening: factor effects"
    role: claim
    quote: "A near-saturated model reproduces the data it was fitted to and predicts
      nothing"
    supported_by: [RS-J02]
  - id: RS-03
    section: Response-surface models
    role: claim
    quote: "These models are suitable for predicting mean levels of the attributes over the
      ranges of the parameters included, and that is the only use made of them"
    supported_by: [RS-J03, RS-J04]
  - id: RS-04
    section: Mechanistic interpretation
    role: claim
    quote: "One parameter therefore moves a pair of efficacy-linked attributes and a
      safety-linked attribute in opposite directions"
    supported_by: [RS-M02]
  - id: RS-05
    section: Design space
    role: claim
    quote: "The four quality-linked parameters carried into the response-surface design
      define a multivariate region within the characterized space in which all five
      attributes are predicted to stay inside the in-process limits for this step"
    supported_by: [RS-J03, RS-J04, RS-M01]
  - id: RS-06
    section: Proven acceptable ranges
    role: claim
    quote: "Every parameter in the response-surface design has a proven acceptable range
      against every attribute it governs, and for most pairs that range is the whole
      characterization range"
  - id: RS-07
    section: Process capability and robustness
    role: claim
    quote: "Commercial-scale capability is comfortable for every attribute this step forms"
    supported_by: [RS-J05]
  - id: RS-08
    section: Parameter classification
    role: claim
    quote: "No parameter at this step is classified as a critical process parameter"
    supported_by: [RS-J06]

  # ---- justification (evidence / statistic / diagnostic offered for a claim) ----
  - id: RS-J01
    section: Executive summary
    role: justification
    quote: "none shows significant lack of fit against the centre-point pure error"
  - id: RS-J02
    section: "Screening: factor effects"
    role: justification
    quote: "the predicted coefficient of determination is negative for every response"
  - id: RS-J03
    section: Response-surface models
    role: justification
    quote: "By contrast with the screening fit, the predicted coefficient of determination
      is positive throughout"
  - id: RS-J04
    section: Response-surface models
    role: justification
    quote: "the lack-of-fit mean square is smaller than the pure-error mean square"
  - id: RS-J05
    section: Process capability and robustness
    role: justification
    quote: "That this attribute is the tightest follows from the acceptance interval and the
      assay and not from a large process effect"
  - id: RS-J06
    section: Parameter classification
    role: justification
    quote: "every quality-linked parameter is held by instrumentation inside a normal
      operating range that is a small fraction of the range characterized"

  # ---- mechanistic_warrant (reasoning from physical / enzymatic mechanism) ----
  - id: RS-M01
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "High mannose rises with pH because Golgi lumenal pH sets how completely the
      mannosidases trim, and a shift towards the alkaline end leaves more untrimmed
      structures behind"
  - id: RS-M02
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "Galactosylation and afucosylation both fall as the culture ages, and both are
      enzymatic modifications that depend on Golgi enzyme activity and on nucleotide sugar
      supply"

  # ---- hedge (standalone calibration of certainty or of practical significance) ----
  - id: RS-H01
    section: "Screening: factor effects"
    role: hedge
    quote: "which looks impressive and means very little"
  - id: RS-H02
    section: Response-surface models
    role: hedge
    quote: "so the test has little power and a non-significant result bounds the evidence
      without establishing that the model form is correct"

  # ---- bounded_conclusion (a claim explicitly bounded by range / model / scale-down) ----
  - id: RS-B01
    section: "Screening: factor effects"
    role: bounded_conclusion
    quote: "The screening design is read here as a ranking of effects"
    bounds: RS-02
  - id: RS-B02
    section: Design space
    role: bounded_conclusion
    quote: "That corner is an edge of failure in the knowledge space and it lies far outside
      the normal operating range"
    bounds: RS-05
  - id: RS-B03
    section: Design space
    role: bounded_conclusion
    quote: "Three bounds apply to this claim."
    bounds: RS-05
  - id: RS-B04
    section: Proven acceptable ranges
    role: bounded_conclusion
    quote: "The first range is computed with the other factors fixed and the second with the
      other factors varying inside their normal operating ranges, which is the more
      demanding analysis and the reproducible default"
    bounds: RS-06

  # ---- cross_step_credit (control of a shared attribute attributed to named steps) ----
  - id: RS-C01
    section: Executive summary
    role: cross_step_credit
    quote: "Host cell protein (HCP) and residual DNA are formed here and are cleared by the
      purification train, and the viral safety claim rests entirely on steps downstream of
      the bioreactor"
  - id: RS-C02
    section: Process capability and robustness
    role: cross_step_credit
    quote: "so the capability shown is the capability of the whole train and the credit
      belongs to the three clearance steps (PCR-005, PCR-007 and PCR-008)"
  - id: RS-C03
    section: Contribution to the control strategy
    role: cross_step_credit
    quote: "It does not set the aggregate level of the drug substance on its own, because
      cation exchange is the principal aggregate polishing step"

  # ---- deviation_disposition (adverse finding -> investigation -> disposition) ----
  - id: RS-D01
    section: Executive summary
    role: deviation_disposition
    quote: "Both were investigated, both were dispositioned as retained, and neither changed
      a parameter classification or an edge of the operating region"
  - id: RS-D02
    section: "DEV-003-01 — dissolved CO2 probe drift"
    role: deviation_disposition
    quote: "The run stayed inside the characterization range for pCO2 throughout, so it
      remains a valid design point and it was retained in the analysis"
  - id: RS-D03
    section: "DEV-003-02 — nutrient feed-1 under-delivery"
    role: deviation_disposition
    quote: "The batch was retained on that basis, and feed volume was later classified a key
      process parameter on the univariate evidence"

  # ---- deferral (points to an appendix / paired document instead of "data not shown") ----
  - id: RS-F01
    section: Executive summary
    role: deferral
    quote: "The contributions made here are consolidated with those of the other steps
      (PCMR-001)."
  - id: RS-F02
    section: "Screening: factor effects"
    role: deferral
    quote: "The full effect tables for all five responses are in Appendix C."

  # ---- restatement (the same claim in different words; coreference edge) ----
  - id: RS-R01
    section: Discussion
    role: restatement
    restates: RS-01
    quote: "The step is understood well enough to support the ranges proposed for Stage 2,
      and that understanding rests on a screening design that ranked the factors and a
      response-surface design that models the four that matter"
  - id: RS-R02
    section: Conclusions
    role: restatement
    restates: RS-01
    quote: "the step meets every acceptance criterion applicable to it"
