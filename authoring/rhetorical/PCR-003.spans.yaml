document_id: PCR-003
section_id: PCR-003_sec_rhet
spans:

  - id: PCR-003-R00
    section: "Executive summary"
    role: claim
    quote: "Afucosylation, galactosylation, high mannose and aggregate meet their intermediate acceptance criteria."
    supported_by: ["PCR-003-R46"]

  - id: PCR-003-R01
    section: "Executive summary"
    role: claim
    quote: "The risk was accepted as the producer’s."
    supported_by: ["PCR-003-R100"]

  - id: PCR-003-R02
    section: "Executive summary"
    role: claim
    quote: "Culture pH, culture temperature, pCO2 and culture duration were classified as well-controlled critical process parameters (WC-CPPs)."
    supported_by: ["PCR-003-R114", "PCR-003-R115", "PCR-003-R116", "PCR-003-R120"]

  - id: PCR-003-R03
    section: "Executive summary"
    role: claim
    quote: "Osmolality was classified as a critical process parameter (CPP)"
    supported_by: ["PCR-003-R04"]

  - id: PCR-003-R04
    section: "Executive summary"
    role: justification
    quote: "because no PAR from a model shows a wide margin between its acceptable range and its NOR"

  - id: PCR-003-R05
    section: "Executive summary"
    role: hedge
    quote: "That model simulates manufacturing scale directly and carries no effect of the initial viable cell concentration on acidic variants"

  - id: PCR-003-R06
    section: "Executive summary"
    role: deviation_disposition
    quote: "The pCO2 probe drift in one screening run and the feed under-delivery to one centre-point batch (DEV-003-01 and DEV-003-02) left their runs in the analysis."

  - id: PCR-003-R07
    section: "Product and unit operation"
    role: hedge
    quote: "They are set mainly in the Golgi before secretion, and glycosidases released by lysed cells can trim them further in the culture fluid."

  - id: PCR-003-R08
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "Cation and anion exchange separate by net charge, and core fucose, galactose and mannose carry none, so no purification step retains one neutral glycoform in preference to another"

  - id: PCR-003-R09
    section: "Product and unit operation"
    role: claim
    quote: "The neutral glycoforms of the drug substance are therefore those of the harvest."
    supported_by: ["PCR-003-R08"]

  - id: PCR-003-R10
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "Host cell protein and DNA enter the culture fluid when cells die and lyse, so their load at harvest rises as viability falls late in the culture."

  - id: PCR-003-R11
    section: "Changes in this revision"
    role: problem_statement
    quote: "The investigation found that the criteria used to judge each step in the analysis of the proven acceptable ranges were in no approved protocol and had been set after the data were seen (INV-001 finding 1)."

  - id: PCR-003-R12
    section: "Changes in this revision"
    role: problem_statement
    quote: "The records gave no execution dates (finding 5)."

  - id: PCR-003-R13
    section: "Changes in this revision"
    role: claim
    quote: "The description of the control of culture pH is corrected."
    supported_by: ["PCR-003-R14"]

  - id: PCR-003-R14
    section: "Changes in this revision"
    role: justification
    quote: "Version 1.0 gave it as control by carbon dioxide and base addition, but carbon dioxide cannot set the pH where pCO2 is a factor of the designs"

  - id: PCR-003-R15
    section: "Platform and prior-product knowledge"
    role: bounded_conclusion
    quote: "Their sizes are not, and the fitted models of this study give them."

  - id: PCR-003-R16
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "The fraction of antibody secreted without core fucose therefore rises when the activity of that enzyme falls, when the donor is depleted or when the glycan spends less time in the Golgi."

  - id: PCR-003-R17
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "The donor and the manganese cofactor of the enzyme are depleted late in a fed-batch culture, so galactosylation is expected to fall as the culture ages."

  - id: PCR-003-R18
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Dissolved carbon dioxide forms bicarbonate and lowers the pH in the cytosol, so a higher pCO2 is expected to move each glycan in the direction opposite to a higher culture pH."

  - id: PCR-003-R19
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "A culture pH closer to the isoelectric point raises it, because the net charge of the antibody falls and the repulsion between molecules weakens."

  - id: PCR-003-R20
    section: "Platform and prior-product knowledge"
    role: problem_statement
    quote: "These routes do not respond to a parameter in the same direction, so the net direction of each parameter on acidic variants is read from the data."

  - id: PCR-003-R21
    section: "Platform and prior-product knowledge"
    role: hedge
    quote: "The record holds no metabolite data with which to check the supply directly."

  - id: PCR-003-R22
    section: "Quality attributes in scope"
    role: cross_step_credit
    quote: "Host cell protein is first judged in the Protein A pool."

  - id: PCR-003-R23
    section: "Risk-based prioritization and parameter selection"
    role: justification
    quote: "The effect of one is therefore expected to depend on the levels of the others, and only a design that varies them together can estimate that dependence."

  - id: PCR-003-R24
    section: "Risk-based prioritization and parameter selection"
    role: bounded_conclusion
    quote: "No PAR is claimed beyond the range studied."

  - id: PCR-003-R25
    section: "Scale-down model and its qualification"
    role: justification
    quote: "A large vessel strips carbon dioxide less efficiently than a bench-scale vessel, so pCO2 was controlled to the level of each run and studied as a factor, over a range that spans the levels the commercial vessel reaches"

  - id: PCR-003-R26
    section: "Scale-down model and its qualification"
    role: justification
    quote: "Acidic variants fail their criterion over the NOR with the offset at its estimate and at either end of its interval, so that verdict does not depend on the offset either."

  - id: PCR-003-R27
    section: "Scale-down model and its qualification"
    role: hedge
    quote: "Its cause is not known."

  - id: PCR-003-R28
    section: "Scale-down model and its qualification"
    role: hedge
    quote: "The offset was estimated at the set-points only, and its use across the range studied is an assumption of PCP-003 §12."

  - id: PCR-003-R29
    section: "Cell line, media and culture operation"
    role: justification
    quote: "Culture pH was held by base addition against the lactate that the culture produces, which lowers it."

  - id: PCR-003-R30
    section: "Statistical methods"
    role: hedge
    quote: "so the screening analysis was read only to identify active factors and interactions"

  - id: PCR-003-R31
    section: "Statistical methods"
    role: justification
    quote: "A stepwise search changes one term at a time and stops when no single change lowers AICc, so it can stop where only a combination of changes would lower it further."

  - id: PCR-003-R32
    section: "Statistical methods"
    role: justification
    quote: "On the data of this step a forward search would have stopped at a model with a higher AICc for acidic variants, and a backward search for aggregate."

  - id: PCR-003-R33
    section: "Statistical methods"
    role: justification
    quote: "It keeps its 95 % coverage, because the probability that ln y lies between two values is the probability that y lies between their antilogs."

  - id: PCR-003-R34
    section: "Statistical methods"
    role: hedge
    quote: "It does not include variation between manufacturing batches beyond that scatter, and it does not include the uncertainty of the offset, which the qualification handles"

  - id: PCR-003-R35
    section: "Screening design"
    role: hedge
    quote: "The design carries no squared term, so it can detect curvature but cannot attribute it to a factor."

  - id: PCR-003-R36
    section: "Univariate assessment"
    role: hedge
    quote: "This design cannot show whether the effect of one of these parameters depends on the level of another"

  - id: PCR-003-R37
    section: "Univariate assessment"
    role: bounded_conclusion
    quote: "so the range it supports is conditioned on the other parameters being at their set-points"

  - id: PCR-003-R38
    section: "Centre-point performance and reproducibility"
    role: justification
    quote: "That is several times the precision of the glycan map"

  - id: PCR-003-R39
    section: "Centre-point performance and reproducibility"
    role: claim
    quote: "so most of the variation in high mannose comes from the culture"
    supported_by: ["PCR-003-R38"]

  - id: PCR-003-R40
    section: "Screening: factor effects"
    role: hedge
    quote: "so their individual effects identify candidates and no more"

  - id: PCR-003-R41
    section: "Screening: factor effects"
    role: claim
    quote: "Under PCP-003 §6.3 osmolality should therefore have been carried into the response-surface design, with the design amended before execution."

  - id: PCR-003-R42
    section: "Screening: factor effects"
    role: claim
    quote: "and it is the model from which the ranges and the design space are predicted"

  - id: PCR-003-R43
    section: "Selected models and their adequacy"
    role: hedge
    quote: "For afucosylation the Box-Cox interval excludes both 0 and 1, so the rule keeps the raw scale although the profile does not support it either"

  - id: PCR-003-R44
    section: "Selected models and their adequacy"
    role: problem_statement
    quote: "For acidic variants the difference lies in the unfavourable direction, because a model that predicts too high near the set-point overstates the distance to the lower limit."

  - id: PCR-003-R45
    section: "Selected models and their adequacy"
    role: claim
    quote: "The selected model of high mannose meets the limit, and the full quadratic model that the plan prescribes would leave high mannose without an adequate model on all runs."

  - id: PCR-003-R46
    section: "Residual patterns and influential runs"
    role: justification
    quote: "For every attribute and every deleted run, the model selected without the run met the model F-test, the lack-of-fit test and the limit on overfitting, every attribute kept its verdict over the NOR, and every NOR-propagated PAR still contained the NOR."

  - id: PCR-003-R47
    section: "Residual patterns and influential runs"
    role: justification
    quote: "The rise that the slope detects therefore does not show as a difference between the halves, and both are small against the width of the criterion"

  - id: PCR-003-R48
    section: "Residual patterns and influential runs"
    role: claim
    quote: "With the standard deviation of the half in which each prediction lies, both attributes keep their verdict over the NOR."
    supported_by: ["PCR-003-R47"]

  - id: PCR-003-R49
    section: "Residual patterns and influential runs"
    role: claim
    quote: "show no departure from normality, so the normality criterion is met"

  - id: PCR-003-R50
    section: "Effects of the parameters"
    role: hedge
    quote: "These bands are a judgement of this report, and no class rests on them"

  - id: PCR-003-R51
    section: "Effects of the parameters"
    role: claim
    quote: "Only for acidic variants do the effects bring the attribute to its limit within the NOR."
    supported_by: ["PCR-003-R52"]

  - id: PCR-003-R52
    section: "Effects of the parameters"
    role: justification
    quote: "There a higher pCO2 and a higher culture pH each lower acidic variants, and the PARs of these two parameters end just above their NOR highs"

  - id: PCR-003-R53
    section: "Effects of the parameters"
    role: claim
    quote: "The interaction of culture pH with culture duration is as large as the main effect of culture duration and of opposite sign."

  - id: PCR-003-R54
    section: "Effects of the parameters"
    role: justification
    quote: "It stays in the model because the interaction of culture pH with culture duration does."

  - id: PCR-003-R55
    section: "What the augmentation changed"
    role: hedge
    quote: "Their pCO2 settings rest on a probe whose calibration status the record does not give"

  - id: PCR-003-R56
    section: "What the augmentation changed"
    role: bounded_conclusion
    quote: "therefore rests on the augmentation runs and on the model selection together"

  - id: PCR-003-R57
    section: "What the augmentation changed"
    role: justification
    quote: "A model selected on the same runs on which it is judged passes an optimistic check, and the augmentation runs are an independent one."

  - id: PCR-003-R58
    section: "What the augmentation changed"
    role: hedge
    quote: "That limits the verdict of aggregate over the NOR."

  - id: PCR-003-R59
    section: "What the augmentation changed"
    role: claim
    quote: "Only the model of galactosylation is the same."

  - id: PCR-003-R60
    section: "Near-equivalent models"
    role: justification
    quote: "Each of them meets the model F-test, the lack-of-fit test and the limit on overfitting, gives every attribute the same verdict over the NOR as the selected model and leaves the scale-down model qualified."

  - id: PCR-003-R61
    section: "Univariate assessment"
    role: claim
    quote: "Every result meets its criterion."

  - id: PCR-003-R62
    section: "Univariate assessment"
    role: hedge
    quote: "at which about one test in twenty with no real effect gives a significant result"

  - id: PCR-003-R63
    section: "Univariate assessment"
    role: justification
    quote: "No correction for the number of tests is applied, because none was set before the result."

  - id: PCR-003-R64
    section: "Univariate assessment"
    role: claim
    quote: "That route does not account for the effect."
    supported_by: ["PCR-003-R65"]

  - id: PCR-003-R65
    section: "Univariate assessment"
    role: justification
    quote: "Culture duration sets the time in the culture fluid most directly, and it has no detectable main effect on acidic variants"

  - id: PCR-003-R66
    section: "Univariate assessment"
    role: claim
    quote: "The parameter should therefore have been carried into a multivariate study and the plan amended, and that was not done"
    supported_by: ["PCR-003-R64"]

  - id: PCR-003-R67
    section: "Univariate assessment"
    role: claim
    quote: "Acidic variants at harvest are to be trended against the initial viable cell concentration of each production batch, so that a false positive is found out."

  - id: PCR-003-R68
    section: "Osmolality study"
    role: bounded_conclusion
    quote: "The study therefore shows no significant effect of osmolality on acidic variants at this combination, and the fitted mean at the NOR high is not a finding."

  - id: PCR-003-R69
    section: "Osmolality study"
    role: bounded_conclusion
    quote: "so it does not give the interactions of osmolality with the other parameters"

  - id: PCR-003-R70
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Galactosylation falls with culture duration, the direction that the late depletion of UDP-galactose and of the manganese cofactor of the galactosyltransferase predicts"

  - id: PCR-003-R71
    section: "Mechanistic interpretation"
    role: justification
    quote: "The mechanism predicts a rise."

  - id: PCR-003-R72
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "A pool weighted toward antibody made late in the culture, when GDP-fucose and the processing capacity of the Golgi have declined, should carry more antibody without core fucose."

  - id: PCR-003-R73
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "The mechanism predicts the direction of a lower culture pH, because dissolved carbon dioxide lowers the pH in the cytosol."

  - id: PCR-003-R74
    section: "Mechanistic interpretation"
    role: justification
    quote: "A rise of osmolality with pCO2 therefore does not explain the direction."

  - id: PCR-003-R75
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Acidic variants rise with culture temperature, the direction in which a higher temperature speeds deamidation."

  - id: PCR-003-R76
    section: "Mechanistic interpretation"
    role: hedge
    quote: "A higher pH would have to lower the sialylated or glycated forms by more than it raises the deamidated ones, and icIEF does not measure the three routes apart."

  - id: PCR-003-R77
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Aggregate rises with culture pH and with culture duration, the directions that the weaker repulsion between antibody molecules near the isoelectric point and the longer time at temperature predict"

  - id: PCR-003-R78
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "A warmer culture speeds the processing enzymes of the Golgi, which predicts less high mannose, and the mechanism gives no direction for the pH effect."

  - id: PCR-003-R79
    section: "Mechanistic interpretation"
    role: claim
    quote: "therefore does not explain the direction of the effect of culture duration on afucosylation, of pCO2 on galactosylation, afucosylation and acidic variants, or of culture pH on acidic variants, and it does not account for the effect of the initial viable cell concentration on acidic variants"
    supported_by: ["PCR-003-R71", "PCR-003-R73"]

  - id: PCR-003-R80
    section: "Mechanistic interpretation"
    role: claim
    quote: "For the operation of the step, the attribute nearest its limit is acidic variants at its lower limit."
    supported_by: ["PCR-003-R81"]

  - id: PCR-003-R81
    section: "Mechanistic interpretation"
    role: justification
    quote: "A high culture pH, a high pCO2 and a low culture temperature lower acidic variants."

  - id: PCR-003-R82
    section: "Mechanistic interpretation"
    role: restatement
    quote: "Routine operation is therefore limited by acidic variants"
    restates: PCR-003-R80

  - id: PCR-003-R83
    section: "Design space"
    role: bounded_conclusion
    quote: "so the design space is conditioned on them, and it is not claimed beyond the ranges studied"

  - id: PCR-003-R84
    section: "Design space"
    role: justification
    quote: "A region drawn on mean predictions gives a single batch at its edge only about an even chance of meeting the criterion (PCMP-001 §6.2)."

  - id: PCR-003-R85
    section: "Design space"
    role: claim
    quote: "The NOR therefore does not lie entirely inside the design space"

  - id: PCR-003-R86
    section: "Design space"
    role: bounded_conclusion
    quote: "The design space rests on the scale-down model and is not confirmed at commercial scale at its edges."

  - id: PCR-003-R87
    section: "Acceptance criteria"
    role: justification
    quote: "Afucosylation, galactosylation and high mannose keep their drug substance criteria, because no downstream step changes them."

  - id: PCR-003-R88
    section: "Acceptance criteria"
    role: justification
    quote: "In the low-pH response-surface design every run at the same hold time gave the same acidic-variant result, so the full quadratic model reproduces the results exactly, cannot be judged against PCMP-001 §7.2, and the platform value stands."

  - id: PCR-003-R89
    section: "Acceptance criteria"
    role: claim
    quote: "The net change is a tightening."

  - id: PCR-003-R90
    section: "Acceptance criteria"
    role: justification
    quote: "No in-process test of aggregate exists at this step, so no batch fails here, and the risk of the tighter criterion falls on the producer at release"

  - id: PCR-003-R91
    section: "Acceptance criteria"
    role: claim
    quote: "The replacement therefore reflects the shorter hold of A-Mab and not a more stable product."

  - id: PCR-003-R92
    section: "Acceptance criteria"
    role: bounded_conclusion
    quote: "It holds for routine manufacture, which is controlled within the hold-time NOR, and the NOR of hold time and temperature in force ends at the same longest hold and highest temperature as the NOR as characterized."

  - id: PCR-003-R93
    section: "Acceptance criteria"
    role: deferral
    quote: "PCR-006 gives the bound and states whether it depends on a single run, as PCMP-001 §7.5 requires."

  - id: PCR-003-R94
    section: "Acceptance criteria"
    role: justification
    quote: "The low-pH model of acidic variants is an exact fit, which cannot replace the platform value, so the acidic-variant criterion would not change."

  - id: PCR-003-R95
    section: "Outputs against their criteria over the NOR"
    role: restatement
    quote: "Afucosylation, galactosylation, high mannose and aggregate meet their criteria."
    restates: PCR-003-R00

  - id: PCR-003-R96
    section: "Outputs against their criteria over the NOR"
    role: claim
    quote: "The upper limit is met at every combination."

  - id: PCR-003-R97
    section: "Outputs against their criteria over the NOR"
    role: justification
    quote: "Some fail with culture pH at its set-point, so narrowing the NOR of culture pH alone would not restore the criterion."

  - id: PCR-003-R98
    section: "Outputs against their criteria over the NOR"
    role: restatement
    quote: "It was kept, and the risk accepted as the producer’s, on the following grounds."
    restates: PCR-003-R01

  - id: PCR-003-R99
    section: "Outputs against their criteria over the NOR"
    role: bounded_conclusion
    quote: "so this ground holds only with the augmentation runs and the model selection"

  - id: PCR-003-R100
    section: "Outputs against their criteria over the NOR"
    role: justification
    quote: "A batch below the limit is detected by the release test of the drug substance against the acidic-variant criterion and does not reach the patient, so the risk of a failure falls on the producer."

  - id: PCR-003-R101
    section: "Outputs against their criteria over the NOR"
    role: hedge
    quote: "That model carries no effect of the initial viable cell concentration on acidic variants."

  - id: PCR-003-R102
    section: "PARs"
    role: claim
    quote: "The exceptions are the PARs of culture pH and pCO2 for acidic variants."

  - id: PCR-003-R103
    section: "PARs"
    role: claim
    quote: "In the set-point analysis every PAR spans the range studied."

  - id: PCR-003-R104
    section: "PARs"
    role: justification
    quote: "The PAR of pCO2 is a range at the set-point of osmolality, because the response-surface model holds osmolality there."

  - id: PCR-003-R105
    section: "PARs"
    role: bounded_conclusion
    quote: "The PAR of pCO2 for acidic variants therefore does not include the effect of the osmolality rise that comes with it at scale."

  - id: PCR-003-R106
    section: "Univariate parameters and osmolality"
    role: bounded_conclusion
    quote: "For the initial viable cell concentration the support does not extend to the other parameters at their least favourable NOR settings for acidic variants"

  - id: PCR-003-R107
    section: "Univariate parameters and osmolality"
    role: bounded_conclusion
    quote: "The osmolality study supports its NOR for every attribute except acidic variants, at the single combination of the other parameters that it tested, and no range of osmolality beyond its NOR is claimed."

  - id: PCR-003-R108
    section: "Process capability and robustness"
    role: hedge
    quote: "It carries no effect of the initial viable cell concentration on acidic variants, so the capability does not include the effect found in the univariate study."

  - id: PCR-003-R109
    section: "Process capability and robustness"
    role: claim
    quote: "Every other attribute that the step sets has a Cpk above the target, and none of the simulated batches fell outside its criterion."

  - id: PCR-003-R110
    section: "Process capability and robustness"
    role: hedge
    quote: "That bound covers the sampling of the simulation and not the uncertainty of the integrated model."

  - id: PCR-003-R111
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "Host cell protein and residual DNA in the drug substance depend on the clearance of the downstream steps, which the integrated model takes from Protein A, cation exchange and anion exchange (PCR-005, PCR-007 and PCR-008)."

  - id: PCR-003-R112
    section: "Parameter classification"
    role: problem_statement
    quote: "Neither PCMP-001 nor SOP-4001 sets a numerical threshold for a relevant effect or a wide PAR, so each class below is argued from the effects found and from the margin between each PAR and its NOR."

  - id: PCR-003-R113
    section: "Parameter classification"
    role: claim
    quote: "Culture pH is a WC-CPP."
    supported_by: ["PCR-003-R114"]

  - id: PCR-003-R114
    section: "Parameter classification"
    role: justification
    quote: "Base addition holds it at its set-point."

  - id: PCR-003-R115
    section: "Parameter classification"
    role: justification
    quote: "The vessel jacket holds it."

  - id: PCR-003-R116
    section: "Parameter classification"
    role: justification
    quote: "The carbon dioxide fraction of the sparge gas holds it."

  - id: PCR-003-R117
    section: "Parameter classification"
    role: claim
    quote: "Osmolality is a CPP."
    supported_by: ["PCR-003-R118", "PCR-003-R119"]

  - id: PCR-003-R118
    section: "Parameter classification"
    role: justification
    quote: "It has no PAR from a model, because it was not a factor of the response-surface design, so its PAR cannot be shown to be wide against its NOR."

  - id: PCR-003-R119
    section: "Parameter classification"
    role: justification
    quote: "The risk of operating outside its acceptable range is therefore not shown to be low."

  - id: PCR-003-R120
    section: "Parameter classification"
    role: justification
    quote: "It is set by the day of harvest."

  - id: PCR-003-R121
    section: "Parameter classification"
    role: claim
    quote: "Dissolved oxygen is a GPP."
    supported_by: ["PCR-003-R122"]

  - id: PCR-003-R122
    section: "Parameter classification"
    role: justification
    quote: "The culture is not limited by oxygen at either end of the range studied"

  - id: PCR-003-R123
    section: "Parameter classification"
    role: claim
    quote: "Basal medium concentration is a KPP."
    supported_by: ["PCR-003-R124"]

  - id: PCR-003-R124
    section: "Parameter classification"
    role: justification
    quote: "A higher concentration raises the supply of nutrients, and with it growth and titre (PCP-003 §4.1), so it acts on process performance."

  - id: PCR-003-R125
    section: "Parameter classification"
    role: hedge
    quote: "The classes of the three KPPs rest on their expected effect on growth and titre"

  - id: PCR-003-R126
    section: "Contribution to the control strategy"
    role: justification
    quote: "A PAR is one-dimensional, so the PAR edge of one parameter holds only while the parameters that act with it stay within limits, and here those limits lie inside their NORs."

  - id: PCR-003-R127
    section: "Contribution to the control strategy"
    role: claim
    quote: "The alert covers every combination inside the NOR that fails the criterion."
    supported_by: ["PCR-003-R126"]

  - id: PCR-003-R128
    section: "Contribution to the control strategy"
    role: justification
    quote: "Osmolality is not a factor of the response-surface design, so the harvest action limit of item 3 covers it."

  - id: PCR-003-R129
    section: "Contribution to the control strategy"
    role: hedge
    quote: "A result below it is found before purification, although it cannot change the batch."

  - id: PCR-003-R130
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "The host cell protein that this step releases into the harvest is cleared by Protein A, cation exchange and anion exchange, and is judged at each of those steps and at the drug substance."

  - id: PCR-003-R131
    section: "Contribution to the control strategy"
    role: bounded_conclusion
    quote: "It confirms the process at scale near the centre of the NOR and does not test the edges of the ranges."

  - id: PCR-003-R132
    section: "Discussion"
    role: claim
    quote: "The conclusions of this report rest on the scale-down model, whose offsets are known well enough that no verdict over the NOR depends on their exact size."

  - id: PCR-003-R133
    section: "Discussion"
    role: bounded_conclusion
    quote: "Four facts limit how far that holds."
    bounds: PCR-003-R132

  - id: PCR-003-R134
    section: "Discussion"
    role: hedge
    quote: "The difference in aggregate between the scales has no known cause (PD-003-13)."

  - id: PCR-003-R135
    section: "Discussion"
    role: justification
    quote: "Each gives acidic variants the same verdict over the NOR."

  - id: PCR-003-R136
    section: "Discussion"
    role: hedge
    quote: "The capability does not include it."

  - id: PCR-003-R137
    section: "Conclusions"
    role: claim
    quote: "Every PAR contains the NOR on all runs, and on the planned runs alone three PARs for acidic variants do not."

  - id: PCR-003-R138
    section: "Conclusions"
    role: bounded_conclusion
    quote: "Against the completion criteria of PCP-003 §7, the study is complete except that the design space does not contain the NOR for acidic variants (PD-003-08), osmolality has no PAR from a model (PD-003-07), and the multivariate study of the initial viable cell concentration was not made (PD-003-11)."

  - id: PCR-003-R139
    section: "DEV-003-01, pCO2 probe drift during screening run 4"
    role: deviation_disposition
    quote: "The record gives the cause as drift of the probe between two calibrations, and the equipment record shows the probe in calibration at the time of execution."

  - id: PCR-003-R140
    section: "DEV-003-01, pCO2 probe drift during screening run 4"
    role: hedge
    quote: "so it does not show whether the probe read high in those runs too"

  - id: PCR-003-R141
    section: "DEV-003-02, nutrient feed-1 under-delivery on a centre-point batch"
    role: deviation_disposition
    quote: "The mass reconciliation after the run detected it, and its cause was a calibration offset of the feed pump."

  - id: PCR-003-R142
    section: "PD-003-09, viable cell density, viability and titre not in the record"
    role: claim
    quote: "No criterion of this report depends on these outputs."

  - id: PCR-003-R143
    section: "PD-003-10, univariate study started before the response-surface study"
    role: justification
    quote: "The sequence of PCP-003 §11 exists so that the factors of the response-surface design are chosen from the screening result."

  - id: PCR-003-R144
    section: "PD-003-10, univariate study started before the response-surface study"
    role: claim
    quote: "The order of the two studies therefore affects no analysis."
    supported_by: ["PCR-003-R143"]

  - id: PCR-003-R145
    section: "PD-003-11, initial viable cell concentration not carried into a multivariate study"
    role: justification
    quote: "That was not done, because the univariate results were not analysed in Version 1.0."

  - id: PCR-003-R146
    section: "PD-003-11, initial viable cell concentration not carried into a multivariate study"
    role: hedge
    quote: "The verdict over the NOR and the capability of this report do not include the effect."

  - id: PCR-003-R147
    section: "PD-003-12, equipment and calibration status not recorded for the osmolality and augmentation studies"
    role: hedge
    quote: "A probe that read high, as in study event DEV-003-01, would put the true pCO2 below the recorded level."

  - id: PCR-003-R148
    section: "PD-003-13, aggregate offset of the scale-down model accounted for, not investigated"
    role: justification
    quote: "Under PCMP-001 Version 2.0 §7.1 a scale-down model may differ in mean from manufacturing scale where its offset is known precisely enough, so the Version 1.0 test was stricter than the use of the model needs."
