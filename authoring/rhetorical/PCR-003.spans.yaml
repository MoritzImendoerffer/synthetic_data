# Rhetorical / argument-structure spans for PCR-003 (production bioreactor PC report).
#
# RE-CURATED 2026-07-27 against the RE-AUTHORED report. The previous layer was curated
# against the superseded text and every one of its 35 spans had stopped matching.
#
# Grounding rule: each quote must be a verbatim, whitespace-collapsed substring of the
# RENDERED pc_package/PCR-003_bioreactor.docx — that is what
# build_ground_truth.build_rhetorical_spans and check_grounding.py both read. Quotes may
# therefore contain rendered numbers and resolved cross-references ("Table 13", "§6"),
# which do NOT appear in the .qmd source; do not re-check this file against the .qmd.
# Number-free spans are preferred wherever the number is not itself the point.
#
# NOT annotated here: the two registered benchmark negatives WC-003-01 and WC-003-02
# (authoring/weak_claims.yaml). They are merged as role `weak_claim` with
# support = unsupported by the builder, and must not carry a normal `claim` span.
document_id: PCR-003
spans:

  # ---- problem_statement (the caution / gap that motivates a passage) ----------------
  - id: RS-P01
    section: Screening design
    role: problem_statement
    quote: "The residual degrees of freedom available to the screening analysis are few,
      and a two-level design cannot attribute curvature to any individual factor."
  - id: RS-P03
    section: Proven acceptable ranges
    role: problem_statement
    quote: "Table 13 does not see the excluded vertex of §6, and it cannot, because both of
      its analyses hold the other parameters at or near their set-points while one parameter
      moves."

  # ---- claim (the finding a section or paragraph asserts) -----------------------------
  - id: RS-01
    section: Executive summary
    role: claim
    quote: "The production bioreactor is the step at which A-Mab acquires its glycan,
      charge-variant and aggregate quality attributes."
    supported_by: [RS-J01]
  - id: RS-02
    section: Scale-down model and its qualification
    role: claim
    quote: "The model reproduces the culture environment that forms the quality attributes,
      so parameter-response relationships measured in it transfer to the commercial vessel."
    supported_by: [RS-J02]
  - id: RS-03
    section: "Screening: factor effects"
    role: claim
    quote: "On that basis osmolality was not carried into the response-surface design, and
      the magnitudes of the four factors that were carried forward are refined there."
    supported_by: [RS-J03]
  - id: RS-04
    section: Response-surface models
    role: claim
    quote: "The response-surface models are adequate for all five responses and predictive
      for four of them."
    supported_by: [RS-J04]
  - id: RS-05
    section: Mechanistic interpretation
    role: claim
    quote: "The surfaces are consistent with the glycan-processing mechanism assumed in
      §2.1, and the agreement is close enough to treat the models as process understanding
      and not only as empirical fits."
    supported_by: [RS-M01, RS-M02]
  - id: RS-06
    section: Design space
    role: claim
    quote: "The rest of the characterized region is inside the design space, and the normal
      operating ranges sit well within it."
    supported_by: [RS-J06]
  - id: RS-07
    section: Design space
    role: claim
    quote: "The excluded corner is the galactosylation edge of failure reported in §5.3."
    supported_by: [RS-J07, RS-J08, RS-M04]
  - id: RS-08
    section: Proven acceptable ranges
    role: claim
    quote: "The binding constraint on the operating region is therefore the multivariate
      corner and not any proven acceptable range, and a control strategy built from Table 13
      alone would not protect against it."
    supported_by: [RS-P03, RS-J09]
  - id: RS-09
    section: Process capability and robustness
    role: claim
    quote: "Every quality attribute formed at this step meets its acceptance criterion at
      commercial scale with margin."
    supported_by: [RS-J10]

  # ---- justification (evidence / statistic / diagnostic offered for a claim) ----------
  - id: RS-J01
    section: Executive summary
    role: justification
    quote: "No later step in the drug-substance process modifies the glycan profile, so the
      operating region defined here fixes those attributes for the product."
  - id: RS-J02
    section: Scale-down model and its qualification
    role: justification
    quote: "Qualification then compared growth, viability, titer and the five product-quality
      responses between the model and the at-scale reference batches, and found no difference
      that the analytical methods could resolve."
  - id: RS-J03
    section: "Screening: factor effects"
    role: justification
    quote: "Both of its main effects are the smallest of the active factors on their
      respective responses, and across the normal operating range of osmolality they amount
      to 1.5 and 1.6 percentage points."
  - id: RS-J04
    section: Response-surface models
    role: justification
    quote: "so no model misses the design points by more than the centre-point replicates
      themselves vary"
  - id: RS-J06
    section: Design space
    role: justification
    quote: "Evaluating the fitted models at the corners of the normal operating ranges gives
      a worst predicted galactosylation of 31.8 %, which is 8.2 percentage points below the
      limit, and every other response meets its criterion at every one of those corners."
  # The edge of failure is measured, not only predicted — RS-J07 is the observation and
  # RS-J08 the four single-parameter moves that return the response inside the limit.
  - id: RS-J07
    section: Response-surface models
    role: justification
    quote: "The exceedance is not only a prediction, because galactosylation was measured
      above the limit at that same corner in 1 run of the screening design, at 41.4 %, and in
      1 run of the response-surface design, at 40.5 %."
  - id: RS-J08
    section: Design space
    role: justification
    quote: "Holding the other three factors at that vertex, the model returns galactosylation
      to its limit at a culture pH of 6.617, at a culture temperature of 35.77 °C, at a
      culture duration of 15.06 days, or at a dissolved carbon dioxide of 44.0 mmHg."
  - id: RS-J09
    section: Proven acceptable ranges
    role: justification
    quote: "No univariate range binds anywhere in the table, and no attribute is brought to
      its limit by moving one parameter across its full studied range while the others are
      held at set-point or varied within their operating ranges."
  - id: RS-J10
    section: Process capability and robustness
    role: justification
    quote: "The tightest capability at this step is 1.94 for High Mannose, whose simulated
      mean of 5.99 % sits 2.99 percentage points above its lower limit"

  # ---- mechanistic_warrant (reasoning from enzymatic / physicochemical mechanism) -----
  - id: RS-M01
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "Galactosylation is a terminal step of N-glycan processing, so the fraction of
      chains that carry galactose depends on how much processing time the antibody spends in
      a Golgi with adequate galactosyltransferase activity and adequate donor supply."
  - id: RS-M02
    section: Mechanistic interpretation
    role: mechanistic_warrant
    quote: "Higher dissolved carbon dioxide lowers it because carbon dioxide crosses the
      membrane freely and acidifies the intracellular compartments."
  - id: RS-M04
    section: Design space
    role: mechanistic_warrant
    quote: "All four parameters sit at the edge that raises galactosylation, and on balance
      the interactions between culture pH and the other three add to the effect at that
      vertex."

  # ---- hedge (standalone calibration of certainty) ------------------------------------
  - id: RS-H01
    section: Response-surface models
    role: hedge
    quote: "That model remains adequate for interpolation, but its predictions carry visibly
      more uncertainty than the other four"
  - id: RS-H02
    section: Mechanistic interpretation
    role: hedge
    quote: "Higher culture pH also lowers it, which the study cannot separate from a shift in
      the pH gradient the cell maintains against the medium."

  # ---- bounded_conclusion (a claim explicitly bounded by range / model / scale-down) ---
  - id: RS-B01
    section: Design space
    role: bounded_conclusion
    quote: "Three bounds apply to the claim made in this section."
    bounds: RS-06
  - id: RS-B02
    section: Scale-down model and its qualification
    role: bounded_conclusion
    quote: "It does not reproduce commercial-scale mixing heterogeneity at full working
      volume, and it cannot demonstrate the reproducibility of a commercial batch."
    bounds: RS-02
  - id: RS-B03
    section: Process capability and robustness
    role: bounded_conclusion
    quote: "It holds for parameters drawn across their normal operating ranges and not across
      the wider characterization ranges."
    bounds: RS-09
  - id: RS-B04
    section: Discussion
    role: bounded_conclusion
    quote: "Osmolality is supported by a screening study and by platform history and not by a
      response-surface model, which is a deliberate choice justified by the size of its main
      effects."
    bounds: RS-03

  # ---- cross_step_credit (control of a shared attribute attributed to named steps) -----
  - id: RS-C01
    section: Executive summary
    role: cross_step_credit
    quote: "The step does not clear any impurity, since host cell protein and residual DNA
      are generated by the culture and removed downstream, with their drug-substance
      capability credited to Protein A chromatography (PCR-005), cation exchange (PCR-007)
      and anion exchange (PCR-008)."
  # ---- deviation_disposition (adverse finding -> investigation -> disposition) ---------
  - id: RS-D01
    section: "DEV-003-01 — dissolved carbon dioxide probe drift"
    role: deviation_disposition
    quote: "so the displacement moves the run by less than the study can resolve. The
      deviation was retained on that basis."
  - id: RS-D02
    section: "DEV-003-02 — nutrient feed-1 under-delivery"
    role: deviation_disposition
    quote: "The deviation was retained on that basis, and the batch was kept in the analysed
      data set."

  # ---- deferral (points to an appendix / paired document / campaign, not "data not shown")
  - id: RS-F01
    section: Scale-down model and its qualification
    role: deferral
    quote: "Those two questions are answered by the process performance qualification
      campaign and not by this report."
  # ---- restatement (the same claim in different words; coreference edge) --------------
  - id: RS-R01
    section: Conclusions
    role: restatement
    restates: RS-09
    quote: "At commercial scale every attribute formed at this step meets its criterion, with
      the tightest capability of 1.94 belonging to High Mannose and a margin of 2.99
      percentage points to its binding limit."
  - id: RS-R02
    section: Conclusions
    role: restatement
    restates: RS-08
    quote: "The proven acceptable ranges of §7 span the full characterization range of every
      parameter against every governed attribute, so the binding constraint on operation is
      the multivariate corner and not any univariate range."
