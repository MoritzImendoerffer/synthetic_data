# Rhetorical / argument-structure spans for PCR-003 (production bioreactor PC report).
# Re-curated 2026-08-18 against the report re-authored in work unit
# 2026-08-17_01_register-second-round, TASK-007. Every quote is a verbatim,
# whitespace-collapsed substring of the rendered pc_package/PCR-003_bioreactor.docx
# (checked by build_ground_truth.build_rhetorical_spans and by check_grounding.py) — so no
# quote may cross a `{python}` inline expression, a @ref, a citation or bold markup.
# Number-free spans are preferred so a seed change cannot break grounding.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-003
spans:

  # ---- problem_statement (the uncertainty / caution that motivates a passage) ----
  - id: RS-P01
    section: "Platform and prior-product knowledge"
    role: problem_statement
    quote: "Prior knowledge does not settle two things, and both of them shaped this study"
  - id: RS-P02
    section: "Centre-point performance and reproducibility"
    role: problem_statement
    quote: "Before any effect is reported, the centre point replicates fix what the study can
      resolve"
  - id: RS-P03
    section: "Design space"
    role: problem_statement
    quote: "The region is defined by mean predictions from models fitted over the characterized
      ranges, and says nothing about settings outside those ranges"

  # ---- claim (the finding a section or paragraph asserts) ----
  - id: RS-01
    section: "Executive summary"
    role: claim
    quote: "The response surface model built on those factors is the predictive model"
    supported_by: ["RS-J01", "RS-J03"]
  - id: RS-02
    section: "Screening: factor effects"
    role: claim
    quote: "A near saturated design produces exactly that, because almost every degree of freedom
      has gone into estimating a term"
    supported_by: ["RS-J02"]
  - id: RS-03
    section: "Response-surface models"
    role: claim
    quote: "A model at that level predicts the mean response usefully and predicts an individual
      batch loosely"
    supported_by: ["RS-J03", "RS-J04"]
  - id: RS-04
    section: "Mechanistic interpretation"
    role: claim
    quote: "An operating region built from one dimensional ranges would not represent that, which is
      the argument for the multivariate region"
    supported_by: ["RS-M02"]
  - id: RS-05
    section: "Design space"
    role: claim
    quote: "The design space of the production bioreactor is a multivariate region in culture pH,
      culture temperature, culture duration and dissolved CO2 (pCO2), over which the
      fitted response surface models predict that every attribute the step governs stays
      within the in-process criterion"
    supported_by: ["RS-J03", "RS-J04", "RS-M01"]
  - id: RS-06
    section: "Proven acceptable ranges"
    role: claim
    quote: "proven acceptable ranges complement the multivariate region with a per attribute
      statement of how far a single parameter may move"
  - id: RS-07
    section: "Process capability and robustness"
    role: claim
    quote: "Across those batches, every attribute clears the drug substance criterion"
    supported_by: ["RS-J05"]
  - id: RS-08
    section: "Parameter classification"
    role: claim
    quote: "No parameter at this step is classified as a critical process parameter"
    supported_by: ["RS-J06"]

  # ---- justification (the evidence offered for a claim) ----
  - id: RS-J01
    section: "Executive summary"
    role: justification
    quote: "No response shows significant lack of fit against the centre point replicates"
  - id: RS-J02
    section: "Screening: factor effects"
    role: justification
    quote: "The overall model does not reach significance for high mannose"
  - id: RS-J03
    section: "Response-surface models"
    role: justification
    quote: "As a result, the fitted terms are carrying real structure and not degrees of freedom"
  - id: RS-J04
    section: "Response-surface models"
    role: justification
    quote: "The lack of fit test does not approach significance"
  - id: RS-J05
    section: "Process capability and robustness"
    role: justification
    quote: "The reason high mannose is the tightest case is not that the process controls the
      attribute poorly"
  - id: RS-J06
    section: "Parameter classification"
    role: justification
    quote: "the risk of an unnoticed excursion outside the design space is correspondingly low"

  # ---- mechanistic_warrant (the mechanism that makes the evidence relevant) ----
  - id: RS-M01
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "the Golgi mannosidases work best at an acidic lumenal pH, and raising the culture pH
      raises the lumenal pH away from that optimum"
  - id: RS-M02
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Galactosylation falls as the culture ages, which is what a declining
      galactosyltransferase activity and a depleting nucleotide sugar pool produce"

  # ---- hedge (the qualification on strength of evidence) ----
  - id: RS-H01
    section: "Screening: factor effects"
    role: hedge
    quote: "However, two limits on the screening analysis need stating"
  - id: RS-H02
    section: "Response-surface models"
    role: hedge
    quote: "Therefore a non significant result bounds the evidence for the model form without
      establishing it"

  # ---- bounded_conclusion (what the claim does not cover) ----
  - id: RS-B01
    section: "Screening: factor effects"
    role: bounded_conclusion
    quote: "Screening therefore ranks the factors, and the response surface model estimates the
      magnitudes"
    bounds: "RS-02"
  - id: RS-B02
    section: "Design space"
    role: bounded_conclusion
    quote: "The characterized ranges therefore contain edges of failure, which is the intended
      outcome of choosing ranges wider than the control ranges"
    bounds: "RS-05"
  - id: RS-B03
    section: "Design space"
    role: bounded_conclusion
    quote: "Three bounds apply to this claim."
    bounds: "RS-05"
  - id: RS-B04
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "A proven acceptable range is univariate, and each one holds only under the analysis that
      produced it"
    bounds: "RS-06"

  # ---- cross_step_credit (what another step contributes) ----
  - id: RS-C01
    section: "Executive summary"
    role: cross_step_credit
    quote: "Host cell protein and residual DNA are both cleared downstream, and that clearance is
      credited in PCR-005, PCR-007 and PCR-008"
  - id: RS-C02
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "The clearance credit belongs to Protein A capture (PCR-005), cation exchange (PCR-007)
      and anion exchange (PCR-008)"
  - id: RS-C03
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "The consolidated control strategy, including the cumulative viral clearance and the
      cross step credit for the shared attributes, is in PCMR-001"

  # ---- deviation_disposition (what happened and how it was dispositioned) ----
  - id: RS-D01
    section: "Executive summary"
    role: deviation_disposition
    quote: "Neither changed a parameter classification and neither moved the boundaries of the
      operating region"
  - id: RS-D02
    section: "DEV-003-01 — dissolved carbon dioxide probe drift"
    role: deviation_disposition
    quote: "The actual dissolved carbon dioxide level in the affected run stayed well inside the
      characterized range, and the run remained a valid setting of the design"
  - id: RS-D03
    section: "DEV-003-02 — nutrient feed-1 under-delivery"
    role: deviation_disposition
    quote: "The batch was retained as a centre point, the pump was recalibrated, and the feed
      delivery check was added to the in-process record for the remaining runs"

  # ---- deferral (the location a detail is deferred to) ----
  - id: RS-F01
    section: "Executive summary"
    role: deferral
    quote: "Confirmation at scale belongs to Stage 2, and this report rolls up into PCMR-001"
  - id: RS-F02
    section: "Response-surface models"
    role: deferral
    quote: "Coefficient tables for the remaining responses are given in an appendix (Appendix C)"

  # ---- restatement (the claim restated later in the document) ----
  - id: RS-R01
    section: "Discussion"
    role: restatement
    quote: "the step is understood well enough to define a design space and to justify the ranges
      Stage 2 will run"
    restates: "RS-01"
  - id: RS-R02
    section: "Conclusions"
    role: restatement
    quote: "The production bioreactor is characterized and the operating region is defined"
    restates: "RS-01"
