# Rhetorical / argument-structure spans for PCR-004 (Harvest and Clarification (Step 4) PC report).
# Converted 2026-08-18 from the h_rhetorical_spans() builder in pc_package/build_ground_truth.py
# (work unit 2026-08-18_02_register-track-d, TASK-001). The conversion was byte-identical:
# the annexes rebuilt with no diff, which is what proves it changed nothing.
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-004_harvest.docx — so no quote may cross a `{python}` inline expression, a @ref, a
# citation or bold markup. A span whose quote is no longer in the document now FAILS the
# build (build_ground_truth.build_rhetorical_spans), where the Python builder emitted it
# regardless and left check_grounding to find it later.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
# What the layer is about: harvest is the corpus's clearest negative argument — no design was
# run, no design space is claimed, no CQA is set — so the spans are dominated by claims about
# what the step does NOT do, the mechanistic warrants that license them, and the credit handed
# to PCR-005 / PCR-007 / PCR-008.
document_id: PCR-004
section_id: PCR-004_sec_rhet
spans:

  - id: PCR-004-R00
    section: "Executive summary"
    role: claim
    quote: "The step forms no product-quality attribute and is credited with no impurity clearance"
    supported_by: ["PCR-004-R05", "PCR-004-R10"]

  - id: PCR-004-R01
    section: "Executive summary"
    role: claim
    quote: "What it delivers is product recovery and a consistent, low-solids feed to Protein A
      capture"

  - id: PCR-004-R02
    section: "Executive summary"
    role: bounded_conclusion
    quote: "Both results were obtained over the characterized ranges given in §7 and in a
      scale-down model, so they are bounded by that model and by those ranges"
    bounds: "PCR-004-R01"

  - id: PCR-004-R03
    section: "Executive summary"
    role: deviation_disposition
    quote: "Two deviations were recorded, investigated and closed. Both were retained without
      altering a parameter classification or a characterized range"

  - id: PCR-004-R04
    section: "Executive summary"
    role: deferral
    quote: "its outcome rolls up into PCMR-001"

  - id: PCR-004-R05
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "The step forms no critical quality attribute and reduces none, because it has no
      chromatographic, chemical or size-based mechanism that acts on the antibody"

  - id: PCR-004-R06
    section: "Product and unit operation"
    role: cross_step_credit
    quote: "Their clearance is the work of the purification steps, and the credit for it is given
      in PCR-005, PCR-007 and PCR-008"

  - id: PCR-004-R07
    section: "Regulatory and scientific basis"
    role: cross_step_credit
    quote: "the cumulative viral-clearance claim for the drug substance rests on low-pH
      inactivation (PCR-006), anion exchange (PCR-008) and small-virus retentive filtration
      (PCR-009)"

  - id: PCR-004-R08
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "As that capacity is consumed, retained solids begin to pass and the turbidity of the
      filtrate rises"

  - id: PCR-004-R09
    section: "Platform and prior-product knowledge"
    role: problem_statement
    quote: "Two expectations follow from these mechanisms, and the study was designed to test them"

  - id: PCR-004-R10
    section: "Risk-based prioritization and parameter selection"
    role: mechanistic_warrant
    quote: "No parameter of the step has a mechanism by which it can act on a quality attribute,
      so the risk it carries is a process-performance risk and not a quality risk"

  - id: PCR-004-R11
    section: "Scale-down model and its qualification"
    role: hedge
    quote: "found no difference that the analytical methods could resolve"

  - id: PCR-004-R12
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "It reproduces the sedimentation and capacity duties, but it does not reproduce the
      full shear history of a commercial disk-stack machine, and it operates at hold times
      shorter than those of a commercial harvest"

  - id: PCR-004-R13
    section: "Scale-down model and its qualification"
    role: deferral
    quote: "The qualification record is held under SOP-1001 and is not reproduced here"

  - id: PCR-004-R14
    section: "Statistical methods"
    role: justification
    quote: "A response surface is the predictive model that defines a design space, and it is
      worth building only where a parameter acts on a quality attribute, which at this step
      is true of none of them, so there is no response to model and no design space to
      define"

  - id: PCR-004-R15
    section: "Univariate assessment"
    role: claim
    quote: "No designed experiment was executed at this step, and none is reported"
    supported_by: ["PCR-004-R14", "PCR-004-R10"]

  - id: PCR-004-R16
    section: "Univariate assessment"
    role: problem_statement
    quote: "The limitation of a univariate design is that it cannot resolve an interaction between
      the two settings"

  - id: PCR-004-R17
    section: "Univariate assessment"
    role: mechanistic_warrant
    quote: "That limitation is accepted here because the two act on different solids populations,
      the centrifuge on the sedimentable fraction and the filter on the fine fraction, and
      because neither acts on product quality"

  - id: PCR-004-R18
    section: "Clarification performance and filter capacity"
    role: claim
    quote: "Clarification met its in-process expectation across the ranges studied, with one
      excursion that is described below"
    supported_by: ["PCR-004-R19", "PCR-004-R08"]

  - id: PCR-004-R19
    section: "Clarification performance and filter capacity"
    role: justification
    quote: "Turbidity rose as depth-filter loading approached the top of its characterized range,
      which is the expected consequence of consuming filter capacity and is the mechanism
      set out in §2.1"

  - id: PCR-004-R20
    section: "Clarification performance and filter capacity"
    role: hedge
    quote: "which is consistent with sedimentation being complete well below the upper edge of
      that range"

  - id: PCR-004-R21
    section: "Product quality across the step"
    role: claim
    quote: "No quality attribute changed across clarification, and aggregate, charge-variant and
      glycan levels measured in the clarified harvest were the same as those in the
      bioreactor broth within the variability of the methods"
    supported_by: ["PCR-004-R05", "PCR-004-R22"]

  - id: PCR-004-R22
    section: "Product quality across the step"
    role: justification
    quote: "That null result is a finding, and it is retained in the knowledge space. It is the
      evidence that supports classifying both settable parameters as key and not critical"

  - id: PCR-004-R23
    section: "Design space"
    role: claim
    quote: "This step contributes no design space, since a design space is the multivariate region
      of parameter settings that is known to give acceptable values of the critical quality
      attributes, and it can only be defined for a step whose parameters act on such an
      attribute"
    supported_by: ["PCR-004-R05", "PCR-004-R22", "PCR-004-R14"]

  - id: PCR-004-R24
    section: "Proven acceptable ranges"
    role: claim
    quote: "Each parameter was assessed univariately over its characterized range, and each range
      is proven acceptable over its full width for the process-performance criteria of the
      step"

  - id: PCR-004-R25
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "These are univariate ranges and not a multivariate region"
    bounds: "PCR-004-R24"

  - id: PCR-004-R26
    section: "Process capability and robustness"
    role: claim
    quote: "The step has no process capability of its own to report, because it governs no quality
      attribute and therefore has no acceptance limit to be capable against"

  - id: PCR-004-R27
    section: "Process capability and robustness"
    role: bounded_conclusion
    quote: "Neither margin is earned here, and this report claims none of it"
    bounds: "PCR-004-R26"

  - id: PCR-004-R28
    section: "Parameter classification"
    role: claim
    quote: "The step carries no critical process parameter and no well-controlled critical process
      parameter"
    supported_by: ["PCR-004-R29", "PCR-004-R22"]

  - id: PCR-004-R29
    section: "Parameter classification"
    role: justification
    quote: "The absence of an effect is not a gap in the study, and it is the evidence, gathered
      over ranges two to three times the width of the routine control ranges, that supports
      the classification above"

  - id: PCR-004-R30
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "It takes no viral-clearance credit, and the cumulative claim rests on PCR-006, PCR-008
      and PCR-009"

  - id: PCR-004-R31
    section: "Contribution to the control strategy"
    role: deferral
    quote: "The contributions above roll up into the overall control strategy in PCMR-001"

  - id: PCR-004-R32
    section: "Conclusions"
    role: restatement
    quote: "The step forms no critical quality attribute and changes none, and its parameters were
      shown to have no effect on product quality over ranges two to three times the width of
      the routine control ranges"
    restates: "PCR-004-R00"

  - id: PCR-004-R33
    section: "DEV-004-01 — pre-use flush turbidity above alert"
    role: deviation_disposition
    quote: "The root cause is an insufficient initial flush volume and not a defect in the media,
      and the lot was released for use and the run was retained"

  - id: PCR-004-R34
    section: "DEV-004-02 — post-clarification turbidity excursion"
    role: deviation_disposition
    quote: "The run was retained and its data were used, and the disposition rests on two findings"

  - id: PCR-004-R35
    section: "DEV-004-02 — post-clarification turbidity excursion"
    role: justification
    quote: "The excursion occurred outside the normal operating range of depth-filter loading, so
      it does not describe routine operation, and the material remained acceptable for
      capture"
