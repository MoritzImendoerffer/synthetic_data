# Rhetorical / argument-structure spans for PCR-004 (Harvest and Clarification (Step 4) PC report).
# Re-curated 2026-08-20 (work unit 2026-08-19_02_fifth-round-plan-then-batches, TASK-051) against
# ATTEMPT 2 of the re-authored pc_package/PCR-004_harvest.qmd, rendered to PCR-004_harvest.docx.
# Attempt 2 is the first PCR-004 to win its blind reading against the pre-campaign text (owner,
# 2026-08-20, key B2b). The document was not touched: this layer is annotation over the finished
# text, so every quote here was rewritten to the new prose and no sentence was written to fit a
# span.
#
# All 36 ids, roles and relations are kept. Every one of the previous 36 quotes failed against
# attempt 2, so all 36 were re-cut. Four section labels changed, all name-only:
#   R23  'Operating ranges in place of a design space' -> 'Design space'
#        Attempt 2 titles the section plainly and says in its first sentence that none is defined.
#   R15  'Univariate assessment' -> 'Univariate characterization design'
#   R33  'DEV-004-01, depth filter lot flush turbidity above alert'
#        -> 'DEV-004-01 — Depth-filter lot pre-use flush turbidity above alert'
#   R34, R35  'DEV-004-02, post-clarification turbidity excursion above the normal operating range'
#        -> 'DEV-004-02 — Post-clarification turbidity excursion above the normal operating range'
# Three spans that the 2026-08-20 curation of attempt 1 had moved section move back, because
# attempt 2 states those roles where the original layer expected them:
#   R06  'Contribution to the control strategy' (unchanged from the attempt-1 curation)
#   R16, R17  stay in 'Statistical methods'; attempt 2 also states the univariate limitation there.
#
# Edges dropped: none. R00 supported_by [R05, R10], R02 bounds R01, R15 supported_by [R14, R10],
# R18 supported_by [R19, R08], R21 supported_by [R05, R22], R23 supported_by [R05, R22, R14],
# R25 bounds R24, R27 bounds R26, R28 supported_by [R29, R22] and R32 restates R00 all hold.
#
# mechanistic_warrant, checked against the rule in RHETORICAL_ANNEX.md — each names a physical
# cause AND a direction in the clause where the verb stands. Attempt 2 states all four better than
# attempt 1 did, which is why three of them are longer here:
#   R05  fine particulate and colloidal material fouling the Protein A column and shortening resin
#        life, which is why a limit on it is a control on the capture step;
#   R08  a gentle harvest keeping the load close to what left the reactor and a harsh one adding
#        intracellular protein to it;
#   R10  a higher centrifugal field raising sedimentation velocity in proportion to the field, so
#        more debris reaches the disk surface within the residence time of the bowl;
#   R17  cells damaged by the shear at the feed zone and disk stack releasing intracellular protein
#        and DNA into the centrate as bowl speed rises.
#
# Quotes are verbatim, whitespace-collapsed substrings of the rendered PCR-004_harvest.docx under
# BOTH extractors (pc_package/check_grounding.docx_text and build_rhetorical_annex.doc_text).
document_id: PCR-004
section_id: rhetorical_spans
spans:
- id: PCR-004-R00
  role: claim
  section: Executive summary
  supported_by:
  - PCR-004-R05
  - PCR-004-R10
  quote: The step forms no quality attribute of the antibody and no clearance of any impurity is
    claimed for it.
- id: PCR-004-R01
  role: claim
  section: Executive summary
  quote: What the step decides is the condition of the load presented to Protein A chromatography.
- id: PCR-004-R02
  role: bounded_conclusion
  section: Executive summary
  bounds: PCR-004-R01
  quote: No quality attribute of the antibody changed measurably across the step at any setting
    studied.
- id: PCR-004-R03
  role: deviation_disposition
  section: Executive summary
  quote: Both were investigated, both were dispositioned as retained, and neither affected product
    quality.
- id: PCR-004-R04
  role: deferral
  section: Executive summary
  quote: This report rolls up into the master report PCMR-001.
- id: PCR-004-R05
  role: mechanistic_warrant
  section: Product and unit operation
  quote: It is carried in the parameter list because that material fouls the Protein A column and
    shortens resin life, so a limit on it is a control on the capture step rather than on this one.
- id: PCR-004-R06
  role: cross_step_credit
  section: Contribution to the control strategy
  quote: Resin cycling limits at the capture step account for the particulate the clarified harvest
    carries onto the column, and PCR-005 reports the cycling limit.
- id: PCR-004-R07
  role: cross_step_credit
  section: Regulatory and scientific basis
  quote: Viral clearance is claimed for the low-pH hold, anion exchange and virus filtration, and no
    viral clearance is claimed for harvest.
- id: PCR-004-R08
  role: mechanistic_warrant
  section: Platform and prior-product knowledge
  quote: A gentle harvest keeps the load close to what left the reactor and a harsh one adds
    intracellular protein to it.
- id: PCR-004-R09
  role: problem_statement
  section: Platform and prior-product knowledge
  quote: Aggregate can rise at harvest only if the antibody unfolds at the shear rate of the
    centrifuge feed zone or at an air-liquid interface created in a foaming transfer.
- id: PCR-004-R10
  role: mechanistic_warrant
  section: Risk-based prioritization and parameter selection
  quote: The step has no mechanism by which it forms or removes a quality attribute of the antibody,
    so the severity axis of the assessment is low for every parameter
- id: PCR-004-R11
  role: hedge
  section: Scale-down model and its qualification
  quote: The model does not reproduce the residence time of product in the commercial centrifuge
    bowl or the hold time of the clarified harvest before capture, and neither was varied in this
    study.
- id: PCR-004-R12
  role: bounded_conclusion
  section: Scale-down model and its qualification
  quote: The model is therefore suitable for establishing the operating ranges of this step, and the
    conclusions drawn on it are applied directly to the commercial process.
- id: PCR-004-R13
  role: deferral
  section: Scale-down model and its qualification
  quote: Two bounds on the model apply to every result that follows.
- id: PCR-004-R14
  role: justification
  section: Statistical methods
  quote: No model was fitted to the data of this study, because the study is univariate and no
    designed multivariate experiment was performed.
- id: PCR-004-R15
  role: claim
  section: Univariate characterization design
  supported_by:
  - PCR-004-R14
  - PCR-004-R10
  quote: The parameter under study was set in turn to the low edge of its characterized range, to
    its set-point and to the high edge of its characterized range, and every other parameter was
    held at its set-point.
- id: PCR-004-R16
  role: problem_statement
  section: Statistical methods
  quote: It cannot detect an interaction, where the effect of one parameter depends on the level of
    another
- id: PCR-004-R17
  role: mechanistic_warrant
  section: Scale-down model and its qualification
  quote: because the feed zone is where cells break and release intracellular protein into the
    centrate
- id: PCR-004-R18
  role: claim
  section: Depth filter load
  supported_by:
  - PCR-004-R19
  - PCR-004-R08
  quote: Turbidity of the clarified harvest rose with load, and the rise was not linear.
- id: PCR-004-R19
  role: justification
  section: Depth filter load
  quote: As they do, the available media surface falls, and particles that would have been captured
    early in a batch pass late in the same batch.
- id: PCR-004-R20
  role: hedge
  section: Depth filter load
  quote: The normal operating range of 100 to 140 L/m2 sits below the part of the characterized
    range where turbidity rises.
- id: PCR-004-R21
  role: claim
  section: Product quality across the step
  supported_by:
  - PCR-004-R05
  - PCR-004-R22
  quote: In every case the difference between the two was within the precision of the method that
    measured it.
- id: PCR-004-R22
  role: justification
  section: Product quality across the step
  quote: The depth filter media are positively charged and adsorb a fraction of the DNA and debris
    the centrifuge passes, so some DNA removal across the filtration stage is expected on
    mechanistic grounds.
- id: PCR-004-R23
  role: claim
  section: Design space
  supported_by:
  - PCR-004-R05
  - PCR-004-R22
  - PCR-004-R14
  quote: No critical quality attribute of A-Mab responds to a parameter of this step, so there is
    nothing for such a region to be defined against, and the multivariate studies that would define
    one were not performed.
- id: PCR-004-R24
  role: claim
  section: Proven acceptable ranges
  quote: Table 7 gives the proven acceptable range of each parameter with the basis on which it is
    proven.
- id: PCR-004-R25
  role: bounded_conclusion
  section: Proven acceptable ranges
  bounds: PCR-004-R24
  quote: Each was established with the other parameters held at their set-points, so none of them is
    a statement about the corners where two parameters are at their edges at once.
- id: PCR-004-R26
  role: claim
  section: Process capability and robustness
  quote: The robustness of this step is its own recovery and its own clarification, and both were
    stable.
- id: PCR-004-R27
  role: bounded_conclusion
  section: Process capability and robustness
  bounds: PCR-004-R26
  quote: The one condition at which performance degraded was high depth filter loading, and what
    degraded was the turbidity of the clarified harvest.
- id: PCR-004-R28
  role: claim
  section: Parameter classification
  supported_by:
  - PCR-004-R29
  - PCR-004-R22
  quote: No parameter of this step is a critical process parameter or a well-controlled critical
    process parameter.
- id: PCR-004-R29
  role: justification
  section: Parameter classification
  quote: Turbidity of the clarified harvest rises as loading rises, and the particulate that
    turbidity measures deposits on the head of the capture column and shortens the number of cycles
    the resin lot runs.
- id: PCR-004-R30
  role: cross_step_credit
  section: Contribution to the control strategy
  quote: The attributes in Table 4 are tested at the drug substance and are controlled by the steps
    that clear them.
- id: PCR-004-R31
  role: deferral
  section: Contribution to the control strategy
  quote: The contribution of this step is consolidated in PCMR-001.
- id: PCR-004-R32
  role: restatement
  section: Conclusions
  restates: PCR-004-R00
  quote: No quality attribute of A-Mab was formed, modified or cleared across the step at any
    condition studied, and no clearance credit and no viral clearance claim is taken for it.
- id: PCR-004-R33
  role: deviation_disposition
  section: DEV-004-01 — Depth-filter lot pre-use flush turbidity above alert
  quote: The lot was used and the data from the affected run were retained.
- id: PCR-004-R34
  role: deviation_disposition
  section: DEV-004-02 — Post-clarification turbidity excursion above the normal operating range
  quote: The investigation attributed the excursion to depth filter loading near the maximum of the
    range under study
- id: PCR-004-R35
  role: justification
  section: DEV-004-02 — Post-clarification turbidity excursion above the normal operating range
  quote: The turbidity method has a precision of 4 % relative standard deviation, so the excursion
    is about 6 times the analytical variability of the result and is real.
