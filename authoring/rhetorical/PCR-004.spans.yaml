# Rhetorical / argument-structure spans for PCR-004 (Harvest and Clarification (Step 4) PC report).
#
# Re-curated 2026-10-11, work unit 2026-10-08_01_rev2-campaign, against the final Version 2.0 text of
# pc_package/PCR-004_harvest.qmd (rendered .docx), in the same pass as the Version 2.0 annex builder
# pc_package/annex_builders/pcr_004.py (procedure ANNEX-A-DOCUMENT.md, rule 7).
#
# The previous curation (2026-08-20) quoted the Version 1.0 text, and none of its 36 spans appears in the
# Version 2.0 document: the report was rewritten under INV-001 (the univariate study S-HAR-UNI2 and the
# hold study S-HAR-HLD made during the re-analysis, the unqualified scale-down model, the depth filter
# load PAR bounded by the clarification limit, the record as study events and discrepancies). So no span
# of that curation is carried over, and the ids are assigned afresh in the order in which the spans occur
# in the rendered document: an id names a span of this revision only.
#
# Conventions, as in every spans file of the corpus:
#   - every quote is a verbatim, whitespace-collapsed substring of the rendered .docx
#     (check_grounding.docx_text) and occurs there exactly once;
#   - no quote carries a value of an inline {python} expression, a cross-reference or a citation, so the
#     layer survives a reseed; a quote that would cross one stops short of it (a clause slice);
#   - section is the document's own heading of the span;
#   - one role per span, by RHETORICAL_ANNEX.md. A mechanistic_warrant names a physical cause and a
#     direction.
#
# Relations: R00 supported_by [R38, R35]; R02 supported_by [R38]; R01 bounds R02; R04 bounds R00;
# R05 supported_by [R41, R43]; R45 supported_by [R08]; R48 supported_by [R43, R49]; R54 supported_by
# [R38]; R60 supported_by [R41, R43]; R65 restates R00; R66 restates R54.
#
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-004
section_id: PCR-004_sec_rhet
spans:

  - id: PCR-004-R00
    section: "Executive summary"
    role: claim
    quote: "Turbidity responded to the parameters, and no effect on a quality attribute was detected."
    supported_by: ["PCR-004-R38", "PCR-004-R35"]

  - id: PCR-004-R01
    section: "Executive summary"
    role: bounded_conclusion
    bounds: PCR-004-R02
    quote: "The study supports it for the parameters, the ranges and the attributes it measured, and it did not measure the culture before harvest."

  - id: PCR-004-R02
    section: "Executive summary"
    role: claim
    quote: "The A-Mab assumption is therefore kept."
    supported_by: ["PCR-004-R38"]

  - id: PCR-004-R03
    section: "Executive summary"
    role: problem_statement
    quote: "The scale-down model of the harvest train was not qualified, because no laboratory-scale disk-stack centrifuge exists (PD-004-03)."

  - id: PCR-004-R04
    section: "Executive summary"
    role: bounded_conclusion
    bounds: PCR-004-R00
    quote: "Every result is therefore stated at the scale of the study, and its offset from manufacturing scale is unknown, not zero."

  - id: PCR-004-R05
    section: "Executive summary"
    role: claim
    quote: "Centrifugation (rcf) and depth filter load were classified as KPPs, because each changed the clarity of the feed to capture and no effect of either on a quality attribute was detected."
    supported_by: ["PCR-004-R41", "PCR-004-R43"]

  - id: PCR-004-R06
    section: "Executive summary"
    role: cross_step_credit
    quote: "The lowest level of acidic variants expected to enter the hold already lies below the lower limit, and PCR-003 reports that result with the acceptance of its risk."

  - id: PCR-004-R07
    section: "Product and unit operation"
    role: claim
    quote: "It is not credited with clearing any impurity, and no viral clearance is claimed for it."

  - id: PCR-004-R08
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "Proteases released by dead and lysing cells clip the antibody in the reactor, and clipping continues in the clarified harvest, because clarification removes the cells but not the proteases already in solution."

  - id: PCR-004-R09
    section: "Objectives"
    role: problem_statement
    quote: "Objective 1, the qualification of the scale-down model, was not met, because no qualification was made"

  - id: PCR-004-R10
    section: "Objectives"
    role: hedge
    quote: "Objective 2, the effect of the field, was met in part."

  - id: PCR-004-R11
    section: "Regulatory and scientific basis"
    role: hedge
    quote: "The case study notes that the assumption might not hold in a real process."

  - id: PCR-004-R12
    section: "Changes in this revision"
    role: problem_statement
    quote: "The investigation found that the criteria used to judge each step in the proven acceptable range analysis had been set after the data were seen and were in no approved protocol (INV-001 finding 1)."

  - id: PCR-004-R13
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "In the disk-stack centrifuge, cells and debris settle under the centrifugal field at a velocity that rises with the field and with the difference between their density and that of the medium."

  - id: PCR-004-R14
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "The culture is accelerated to the speed of the bowl in the feed zone, and the shear there rises with that speed, while the flow between the discs is laminar and low in shear."

  - id: PCR-004-R15
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "As retained solids fill the void space of the matrix and occupy its charged sites, the pressure drop rises and more fine material passes."

  - id: PCR-004-R16
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Lysed cells release reducing enzymes, thioredoxin reductase among them, which can break the interchain disulfide bonds of the antibody in the harvest."

  - id: PCR-004-R17
    section: "Platform and prior-product knowledge"
    role: justification
    quote: "It matters because this material reaches the Protein A column, where it fouls the bed and shortens the working life of the resin."

  - id: PCR-004-R18
    section: "Quality attributes in scope"
    role: justification
    quote: "It is measured because DNA fragments and nucleosomes foul depth filters and Protein A resin, so it describes the condition of the feed."

  - id: PCR-004-R19
    section: "Quality attributes in scope"
    role: hedge
    quote: "These criteria rest on the assumption that harvest changes no attribute, and this report uses them to judge the held clarified harvest"

  - id: PCR-004-R20
    section: "Risk-based prioritization and parameter selection"
    role: cross_step_credit
    quote: "Protein A capture and the two ion exchange steps clear the host cell protein and DNA that cell breakage releases"

  - id: PCR-004-R21
    section: "Risk-based prioritization and parameter selection"
    role: justification
    quote: "A range that stops at the NOR limits cannot show where the operation begins to fail, and an excursion beyond a NOR limit would then have no data behind it."

  - id: PCR-004-R22
    section: "Scale-down model and its qualification"
    role: hedge
    quote: "PCP-004 §5.1 expected the bench model to under-represent cell lysis, because the acceleration of the feed in the commercial feed zone and the periodic discharge of solids are not fully reproduced."

  - id: PCR-004-R23
    section: "Scale-down model and its qualification"
    role: justification
    quote: "An offset that is the same at every level of a series, as a difference or as a ratio, leaves a slope of zero at zero, and the conclusions rest on that."

  - id: PCR-004-R24
    section: "Scale-down model and its qualification"
    role: hedge
    quote: "A scale effect that differs between levels would not be seen."

  - id: PCR-004-R25
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "It does not predict the concentration of an impurity in a commercial batch."

  - id: PCR-004-R26
    section: "Statistical methods"
    role: hedge
    quote: "The variation between the set-point replicates does not include such a departure from a straight line, so for a response that is not linear the interval of the slope understates its uncertainty."

  - id: PCR-004-R27
    section: "Statistical methods"
    role: hedge
    quote: "The fragments level that enters the hold is therefore not the highest level expected in routine manufacture."

  - id: PCR-004-R28
    section: "Univariate assessment"
    role: hedge
    quote: "Material prepared this way carries the particle size distribution of the centrate it was made from, which is not the distribution that a depth filter at the end of its capacity would pass."

  - id: PCR-004-R29
    section: "Univariate assessment"
    role: problem_statement
    quote: "Three elements of the planned design were not run."

  - id: PCR-004-R30
    section: "Centrifugation (rcf)"
    role: justification
    quote: "The interval includes no change, and its point estimate is a fall, not the rise that more cell breakage at a higher field would give."

  - id: PCR-004-R31
    section: "Centrifugation (rcf)"
    role: claim
    quote: "The effect is therefore detected and not material."

  - id: PCR-004-R32
    section: "Depth filter load"
    role: claim
    quote: "Depth filter load therefore failed the clarification criterion"

  - id: PCR-004-R33
    section: "Depth filter load"
    role: hedge
    quote: "describes these results poorly, because nearly all of the change lies between the two highest levels, and its interval leaves that departure from a straight line out"

  - id: PCR-004-R34
    section: "Depth filter load"
    role: justification
    quote: "The decision on the range rests on the individual results against the limit."

  - id: PCR-004-R35
    section: "Post-clarification turbidity"
    role: bounded_conclusion
    quote: "No difference in these attributes of the material presented to capture was therefore detected across its turbidity."

  - id: PCR-004-R36
    section: "Quality attributes across the three series"
    role: claim
    quote: "Across the three series no slope was detected for any quality attribute at"

  - id: PCR-004-R37
    section: "Quality attributes across the three series"
    role: hedge
    quote: "The data do not exclude a change of up to that size across a range."

  - id: PCR-004-R38
    section: "Quality attributes across the three series"
    role: bounded_conclusion
    quote: "Turbidity responded to the parameters, and no effect on the attributes was detected within the ranges studied, at the precision of the runs."

  - id: PCR-004-R39
    section: "Quality attributes across the three series"
    role: hedge
    quote: "The support has three limits."

  - id: PCR-004-R40
    section: "Hold-time stability of the clarified harvest"
    role: hedge
    quote: "The levels of the pool itself are therefore not used."

  - id: PCR-004-R41
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "A higher field raises the settling velocity of cells and debris, so more of them reach a disc and are captured before the fluid leaves the stack."

  - id: PCR-004-R42
    section: "Mechanistic interpretation"
    role: hedge
    quote: "That is consistent with a remaining turbidity carried by particles too small to settle in the time available at any field studied."

  - id: PCR-004-R43
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "This is the shape the mechanism predicts for media that approach saturation, in which retained solids fill the void space and occupy the charged sites until fine material passes."

  - id: PCR-004-R44
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Acidic variants followed the same pattern, because deamidation also runs faster at a higher temperature."

  - id: PCR-004-R45
    section: "Mechanistic interpretation"
    role: claim
    quote: "The hold study showed that fragments depend on temperature, as clipping by proteases predicts."
    supported_by: ["PCR-004-R08"]

  - id: PCR-004-R46
    section: "Design space"
    role: claim
    quote: "No design space is claimed for this step."

  - id: PCR-004-R47
    section: "Design space"
    role: justification
    quote: "A design space is a multivariate region, and no multivariate design was run here (PCP-004 §8)."

  - id: PCR-004-R48
    section: "Proven acceptable ranges"
    role: claim
    quote: "The failure is therefore taken as the capacity of the media and not as an error of the runs."
    supported_by: ["PCR-004-R43", "PCR-004-R49"]

  - id: PCR-004-R49
    section: "Proven acceptable ranges"
    role: justification
    quote: "differ by less than the repeatability limit of the turbidity method"

  - id: PCR-004-R50
    section: "Proven acceptable ranges"
    role: problem_statement
    quote: "A NOR limit on the edge of the proven range leaves no margin for the ordinary variability of the commercial operation (PCP-004 §8)."

  - id: PCR-004-R51
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "It does not cover the performance of Protein A capture, because the load challenge was not made (PD-004-05)."

  - id: PCR-004-R52
    section: "Process capability and robustness"
    role: hedge
    quote: "That bound covers the sampling of the simulation and not the uncertainty of the step models."

  - id: PCR-004-R53
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "Host cell protein and aggregate depend in the same way on the purification steps that clear them."

  - id: PCR-004-R54
    section: "Parameter classification"
    role: claim
    quote: "No effect of a parameter of this step on a CQA was detected within the range studied, so the step has no CPP and no WC-CPP."
    supported_by: ["PCR-004-R38"]

  - id: PCR-004-R55
    section: "Parameter classification"
    role: hedge
    quote: "This class is a judgement."

  - id: PCR-004-R56
    section: "Parameter classification"
    role: problem_statement
    quote: "By the rule above a GPP also has no effect on process performance, and the data do not show that for turbidity."

  - id: PCR-004-R57
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "Host cell protein and DNA are controlled by their clearance at Protein A capture, cation exchange and anion exchange (PCR-005, PCR-007 and PCR-008), and residual DNA by that clearance, not by a release test"

  - id: PCR-004-R58
    section: "Contribution to the control strategy"
    role: justification
    quote: "The upper NOR limit of depth filter load lies on the edge of its proven acceptable range, so this test is the control that detects an excursion of the filter load."

  - id: PCR-004-R59
    section: "Contribution to the control strategy"
    role: hedge
    quote: "Bioburden and endotoxin were not part of the hold study, so a hold time in manufacturing needs that support as well."

  - id: PCR-004-R60
    section: "Discussion"
    role: claim
    quote: "The harvest train of A-Mab behaves as the platform mechanisms predict."
    supported_by: ["PCR-004-R41", "PCR-004-R43"]

  - id: PCR-004-R61
    section: "Discussion"
    role: problem_statement
    quote: "Confidence in the scale-down model is the main limitation."

  - id: PCR-004-R62
    section: "Discussion"
    role: hedge
    quote: "Cell breakage at the highest field may also be greater in the commercial feed zone than in the study, so the absence of a rise in host cell protein and DNA holds at the scale of the study."

  - id: PCR-004-R63
    section: "Discussion"
    role: cross_step_credit
    quote: "Protein A capture and the two ion exchange steps clear what such breakage would add."

  - id: PCR-004-R64
    section: "Discussion"
    role: problem_statement
    quote: "The results rest on two studies that PCP-004 did not plan."

  - id: PCR-004-R65
    section: "Conclusions"
    role: restatement
    restates: PCR-004-R00
    quote: "Turbidity responded to the parameters of harvest, and no effect on a quality attribute was detected."

  - id: PCR-004-R66
    section: "Conclusions"
    role: restatement
    restates: PCR-004-R54
    quote: "The step has no CPP and no WC-CPP."

  - id: PCR-004-R67
    section: "Study events"
    role: deviation_disposition
    quote: "S-HAR-UNI has no data in the record and no result of it enters this report, so neither event bears on a conclusion."

  - id: PCR-004-R68
    section: "DEV-004-01, depth filter flush turbidity above its alert limit"
    role: deviation_disposition
    quote: "The investigation found the initial flush volume insufficient."

  - id: PCR-004-R69
    section: "DEV-004-02, post-clarification turbidity above the NOR on one run"
    role: deviation_disposition
    quote: "The investigation found loading of the depth filter near its maximum as the cause."

  - id: PCR-004-R70
    section: "Statistical methods"
    role: deferral
    quote: "Appendix B gives the residual version as a sensitivity."

  - id: PCR-004-R71
    section: "Centrifugation (rcf)"
    role: deferral
    quote: "Appendix A every individual result"
