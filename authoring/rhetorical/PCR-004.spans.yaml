# Rhetorical / argument-structure spans for PCR-004 (Harvest and Clarification (Step 4) PC report).
# Re-curated 2026-08-20 (work unit 2026-08-19_02_fifth-round-plan-then-batches, TASK-017) against
# the one-pass re-authored pc_package/PCR-004_harvest.qmd, rendered to PCR-004_harvest.docx.
# This is the first document authored under the amended rule 4 of WRITING_GUIDE.md.
# The document was not touched: this layer is annotation over the finished text, so every quote
# here was rewritten to the new prose and no sentence was written to fit a span.
#
# All 36 ids, roles and relations are kept. Every one of the previous 36 quotes failed against the
# new text, so all 36 were re-cut. Six section labels moved, and three spans moved section because
# the role they annotate is now played in a different section of the new document:
#   R06  'Product and unit operation' -> 'Contribution to the control strategy'
#        The new §1.1 describes the operation; the credit to the purification steps is stated in
#        §10, so the cross_step_credit role lives there. R06 and R30 quote different sentences.
#   R16  'Univariate assessment' -> 'Statistical methods'
#   R17  'Univariate assessment' -> 'Statistical methods'
#        The new document states the univariate design's limitation, and the mechanism by which
#        the two parameters could interact, in §3.5 rather than in the design section.
# Section labels that changed name only (same argument, same place):
#   R15  'Univariate assessment' -> 'Univariate characterization design'
#   R18, R19, R20  'Clarification performance and filter capacity' -> 'Depth filter load'
#   R23  'Design space' -> 'Operating ranges in place of a design space'
#   R33  'DEV-004-01 — pre-use flush turbidity above alert'
#        -> 'DEV-004-01, depth filter lot flush turbidity above alert'
#   R34, R35  'DEV-004-02 — post-clarification turbidity excursion'
#        -> 'DEV-004-02, post-clarification turbidity excursion above the normal operating range'
#
# Edges dropped: none. R00 supported_by [R05, R10], R02 bounds R01, R15 supported_by [R14, R10],
# R18 supported_by [R19, R08], R21 supported_by [R05, R22], R23 supported_by [R05, R22, R14],
# R25 bounds R24, R27 bounds R26, R28 supported_by [R29, R22] and R32 restates R00 all hold in the
# new text.
#
# mechanistic_warrant, checked against the rule in RHETORICAL_ANNEX.md — each names a physical
# cause and a direction, not a category label:
#   R05  intact cell material and fine debris in the clarified harvest fouling the capture column
#        and shortening resin life;
#   R08  a harsh harvest adding intracellular protein to the load a gentle one would not;
#   R10  the centrifugal field setting the sedimentation velocity of cells and debris, and the
#        shear the culture meets, at a given feed rate;
#   R17  a higher field delivering a centrate with less solid material to the filter train.
#
# Quotes are verbatim, whitespace-collapsed substrings of the rendered PCR-004_harvest.docx under
# BOTH extractors (pc_package/check_grounding.docx_text and build_rhetorical_annex.doc_text).
# Digits are avoided except where the section's only sentence playing the role carries them.
document_id: PCR-004
section_id: rhetorical_spans
spans:
- id: PCR-004-R00
  role: claim
  section: Executive summary
  supported_by:
  - PCR-004-R05
  - PCR-004-R10
  quote: The step has no critical process parameter and no well controlled critical process
    parameter.
- id: PCR-004-R01
  role: claim
  section: Executive summary
  quote: What the step decides is the condition of the feed delivered to Protein A capture.
- id: PCR-004-R02
  role: bounded_conclusion
  section: Executive summary
  bounds: PCR-004-R01
  quote: Aggregate, charge variants and glycan attributes were unchanged across the step at every
    setting studied.
- id: PCR-004-R03
  role: deviation_disposition
  section: Executive summary
  quote: deviations were recorded during execution and both were retained
- id: PCR-004-R04
  role: deferral
  section: Executive summary
  quote: The proven acceptable ranges, the normal operating ranges and the parameter
    classifications reported here are proposed for Stage 2 and roll up into the master report
    PCMR-001.
- id: PCR-004-R05
  role: mechanistic_warrant
  section: Product and unit operation
  quote: The first is how much intact cell material and fine debris the clarified harvest carries,
    because that material fouls the capture column and shortens resin life.
- id: PCR-004-R06
  role: cross_step_credit
  section: Contribution to the control strategy
  quote: Aggregate is controlled at cation exchange and reported in PCR-007.
- id: PCR-004-R07
  role: cross_step_credit
  section: Regulatory and scientific basis
  quote: The viral safety of the drug substance rests on low pH viral inactivation, anion exchange
    and small virus retentive filtration, and the modular claim is consolidated in PCMR-001.
- id: PCR-004-R08
  role: mechanistic_warrant
  section: Platform and prior-product knowledge
  quote: A gentle harvest keeps the load close to what left the reactor, and a harsh one adds
    intracellular protein to it.
- id: PCR-004-R09
  role: problem_statement
  section: Platform and prior-product knowledge
  quote: Aggregate can rise at harvest only if the antibody meets shear or an air liquid interface
    strong enough to unfold it, at the centrifuge feed zone or in a foaming transfer.
- id: PCR-004-R10
  role: mechanistic_warrant
  section: Risk-based prioritization and parameter selection
  quote: The centrifugal field sets the sedimentation velocity of cells and debris and so decides
    how completely they are removed at a given feed rate, and it also sets the shear the culture
    meets.
- id: PCR-004-R11
  role: hedge
  section: Scale-down model and its qualification
  quote: Shear history in a continuous centrifuge is not fully preserved by matching the centrifugal
    field alone, because the feed zone geometry differs between the bench machine and the commercial
    machine
- id: PCR-004-R12
  role: bounded_conclusion
  section: Scale-down model and its qualification
  quote: The scale-down model was accepted as representative on that basis, and the studies reported
    here were executed on it.
- id: PCR-004-R13
  role: deferral
  section: Scale-down model and its qualification
  quote: The limitation of the model is stated in §11.
- id: PCR-004-R14
  role: justification
  section: Statistical methods
  quote: A design space is closed by the acceptance limit of a critical quality attribute, and no
    critical quality attribute is assigned to Step 4.
- id: PCR-004-R15
  role: claim
  section: Univariate characterization design
  supported_by:
  - PCR-004-R14
  - PCR-004-R10
  quote: The design produces the effect of each parameter on the responses with the other at its
    set-point.
- id: PCR-004-R16
  role: problem_statement
  section: Statistical methods
  quote: A univariate design cannot resolve interactions between parameters, where the effect of one
    parameter on a response depends on the level of another.
- id: PCR-004-R17
  role: mechanistic_warrant
  section: Statistical methods
  quote: since a higher field delivers a centrate with less solid material to the filter train
- id: PCR-004-R18
  role: claim
  section: Depth filter load
  supported_by:
  - PCR-004-R19
  - PCR-004-R08
  quote: Post-clarification turbidity rose as the load approached the upper edge.
- id: PCR-004-R19
  role: justification
  section: Depth filter load
  quote: Loading beyond the point of saturation therefore raises the turbidity of the filtrate
    directly, and at the extreme it forces cells and debris through the pores.
- id: PCR-004-R20
  role: hedge
  section: Depth filter load
  quote: The wider characterization range is supported for step yield but is not proposed for
    routine operation.
- id: PCR-004-R21
  role: claim
  section: Product quality across the step
  supported_by:
  - PCR-004-R05
  - PCR-004-R22
  quote: No change was measured across the step at any setting studied, and the values leaving the
    step were indistinguishable from the values entering it within the precision of the methods.
- id: PCR-004-R22
  role: justification
  section: Product quality across the step
  quote: Some DNA is adsorbed by the positively charged depth filter media and some host cell
    protein is retained with the solids, so a reduction across the step is measurable.
- id: PCR-004-R23
  role: claim
  section: Operating ranges in place of a design space
  supported_by:
  - PCR-004-R05
  - PCR-004-R22
  - PCR-004-R14
  quote: No critical quality attribute is assigned to Step 4 in the drug substance register, and no
    design space is defined for it or claimed.
- id: PCR-004-R24
  role: claim
  section: Proven acceptable ranges
  quote: The proven acceptable range of the centrifugal field is 6,000 to 12,000 g, which is its
    full characterization range.
- id: PCR-004-R25
  role: bounded_conclusion
  section: Proven acceptable ranges
  bounds: PCR-004-R24
  quote: All three ranges were established on a qualified scale-down model with the culture at its
    platform target for cell density and viability.
- id: PCR-004-R26
  role: claim
  section: Process capability and robustness
  quote: The robustness of the step itself is carried by the two responses of §5.
- id: PCR-004-R27
  role: bounded_conclusion
  section: Process capability and robustness
  bounds: PCR-004-R26
  quote: The step is therefore robust to the parameter variation the commercial process will see,
    which is variation inside the normal operating ranges rather than across the characterization
    ranges.
- id: PCR-004-R28
  role: claim
  section: Parameter classification
  supported_by:
  - PCR-004-R29
  - PCR-004-R22
  quote: No parameter of this step meets that condition.
- id: PCR-004-R29
  role: justification
  section: Parameter classification
  quote: The particulate that passes fouls the Protein A column and leaves the antibody unchanged,
    so the parameter is key rather than critical.
- id: PCR-004-R30
  role: cross_step_credit
  section: Contribution to the control strategy
  quote: The viral clearance claim rests on low pH viral inactivation, anion exchange and small
    virus retentive filtration, and is consolidated in PCMR-001.
- id: PCR-004-R31
  role: deferral
  section: Contribution to the control strategy
  quote: The contribution of Step 4 is that it delivers a feed of consistent and characterized
