    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "Leached Protein A is formed at this step and at no other, since it is the affinity
      ligand released from the resin under the elution condition"

  - id: PCR-005-R07
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Leached Protein A is assigned by the platform to the resin life-cycle programme
      (SOP-2008) as much as to the operating parameters, because ligand release accumulates with
      cycle number and sanitization history"

  - id: PCR-005-R08
    section: "Platform and prior-product knowledge"
    role: deferral
    quote: "The analysis reported in §5.3 was framed by that expectation"

  - id: PCR-005-R09
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "It supports claims about the operating ranges and about the clearance a single cycle
      delivers, without saying anything about how the resin behaves after many cycles"

  - id: PCR-005-R10
    section: "Statistical methods"
    role: justification
    quote: "Model adequacy is reported as the coefficient of determination, the adjusted
      coefficient, the predicted coefficient computed from the PRESS statistic"

  - id: PCR-005-R11
    section: "Statistical methods"
    role: justification
    quote: "A response for which no factor reaches significance is treated as robust over the
      ranges studied, in which case the factors are kept in the knowledge space as evidence of that
      robustness"

  - id: PCR-005-R12
    section: "Response-surface design"
    role: claim
    quote: "The response-surface model is the predictive model of this report"

  - id: PCR-005-R13
    section: "Screening: factor effects"
    role: claim
    quote: "Leached Protein A returned no significant term at all"
    supported_by: ["PCR-005-R14"]

  - id: PCR-005-R14
    section: "Screening: factor effects"
    role: justification
    quote: "A negative adjusted coefficient on a near-saturated fit means the terms explain less
      than their degrees of freedom cost, which is the signature of a null result"

  - id: PCR-005-R15
    section: "Response-surface models"
    role: claim
    quote: "The response-surface stage produced one model that is adequate and predictive, one that
      is adequate, and one that is neither"
    supported_by: ["PCR-005-R22", "PCR-005-R10"]

  - id: PCR-005-R16
    section: "Response-surface models"
    role: claim
    quote: "Leached Protein A yielded no usable model"
    supported_by: ["PCR-005-R19", "PCR-005-R20", "PCR-005-R21", "PCR-005-R11"]

  - id: PCR-005-R17
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Leaching of the affinity ligand behaves as a resin property over these ranges, since
      ligand release depends on the chemistry of the immobilization, on the cumulative cycle count
      and on the sanitization history, none of which is a parameter of a single run"

  - id: PCR-005-R18
    section: "Response-surface models"
    role: bounded_conclusion
    quote: "The leached Protein A model is retained as knowledge-space evidence and is put to no
      other use in this report"
    bounds: "PCR-005-R16"

  - id: PCR-005-R19
    section: "Response-surface models"
    role: justification
    quote: "A negative predicted coefficient means the model predicts a held-out run worse than the
      mean of the data predicts"

  - id: PCR-005-R20
    section: "Response-surface models"
    role: justification
    quote: "A non-significant result here therefore says only that the quadratic form is not
      contradicted by a noisy replicate set, which is not evidence that the model predicts"

  - id: PCR-005-R21
    section: "Response-surface models"
    role: justification
    quote: "For this reason the result bounds the evidence for the model form without establishing
      it"

  - id: PCR-005-R22
    section: "Response-surface models"
    role: justification
    quote: "A predicted coefficient close to the adjusted coefficient means the model predicts a
      held-out run about as well as it fits the data used to build the model"

  - id: PCR-005-R23
    section: "Response-surface models"
    role: claim
    quote: "The operative claim for leached Protein A is therefore made from the assayed pools
      directly"

  - id: PCR-005-R24
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Elution buffer pH governs pool host cell protein because it sets the aggressiveness of
      desorption: a lower pH releases the antibody faster and also releases the more tightly
      associated host cell protein, which then co-elutes into the collected pool"

