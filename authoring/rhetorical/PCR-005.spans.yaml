# Rhetorical / argument-structure spans for PCR-005 (Protein A Chromatography (Step 5) PC report).
# 2026-10-11, data state of the owner's decisions (NORs come from production): the protein load NOR is no
# longer narrowed, so R26, which bounded R00 by the NOR in force, is re-cut onto the sentence that now
# bounds the judgements over the NOR by the unqualified scale-down model for pool host cell protein.
# Re-curated 2026-10-11 (work unit 2026-10-08_01_rev2-campaign) against the final Version 2.0 text after
# its record pass (commit 50ebbcc), pc_package/PCR-005_protein_a.qmd rendered to PCR-005_protein_a.docx.
# The document was not touched: this layer is annotation over the finished text, and no sentence was
# written to fit a span. The previous curation (2026-10-08) quoted an earlier Version 2.0 text, and 37 of
# its 40 spans no longer appeared.
#
# What changed in the argument since 2026-10-08: every response-surface output now has a selected model
# that meets the adequacy criteria on lack of fit and predictive power, so the claims that leached Protein
# A and fragments have no adequate model and are reported descriptively (old R02, R16, R18, R28, R33,
# R34) have no counterpart; leached Protein A now has a selected model with no term, and the report says
# it shows no dependence on the parameters. The design space is drawn on the single-batch limit. The
# report records no deviation: the events of execution are study events (DEV-005-01, DEV-005-02), and
# every departure from the plan is a discrepancy (PD-005-01 to PD-005-09); old R39 (DEV-005-03) is now
# the disposition of PD-005-07.
#
# Ids R00-R39 are kept with their roles and re-cut onto the sentence of the current text that plays that
# role; where the old sentence has no counterpart the id was given the nearest sentence of the same role,
# in whatever section it now sits (the section field is the document's own heading). No role changed.
# Ids R40-R66 are new: the claim that R18 bounds (R40), the opposite signs of end of pool collect between
# the designs (R41-R44), the widening of the host cell protein criterion argued by its risk (R45-R49),
# the dispositions and impact arguments of the record pass (R50-R55), the log scale (R56-R57), the
# narrowed protein load NOR (R58), the hold study (R59-R62) and the classification argument (R63-R66).
#
# Relations, derived from the current text:
#   R00 supported_by [R22]        no excluded point with every factor in its NOR, by the excluded corner
#                                 never reaching both NORs at once; R26 bounds R00 (the NOR in force)
#   R02 supported_by [R19]        no dependence of leached Protein A, by its selected model having no term;
#                                 R03 and R34 bound R02, R33 restates R02
#   R13 supported_by [R14]        the screening model identifies effects, by its inability to resolve
#                                 curvature; R44 supported_by [R14] (the response-surface model predicts)
#   R16 supported_by [R10, R19]   which selected models meet which criteria, by the rule for a model with
#                                 no term and by the leached Protein A model having none
#   R18 bounds R40                no PAR claimed beyond the range studied
#   R30 supported_by [R31]        no CPP, by the control of buffer pH (elution buffer pH is a WC-CPP)
#   R36 supported_by [R37]        the leached Protein A judgement is the same with either result of run 11
#   R45 supported_by [R46], R47 supported_by [R48], R50 supported_by [R51], R54 supported_by [R55],
#   R56 supported_by [R57]
#
# The role deviation_disposition is the schema's name for the move adverse finding -> investigation ->
# disposition. It labels that move for a study event (R35, R38, R53) and for a discrepancy from the plan
# (R39, R52); it does not call either a deviation.
#
# Every quote is a verbatim, whitespace-collapsed substring of the rendered .docx under both extractors
# (pc_package/check_grounding.docx_text and authoring/build_rhetorical_annex.doc_text), occurs once in the
# document, and is static text of the .qmd: no quote carries a number from an inline expression, a
# cross-reference, a citation or a sub/superscript glyph, so the layer survives a reseed.
