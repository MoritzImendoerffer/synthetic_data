# Rhetorical / argument-structure spans for PCR-005 (Protein A Chromatography (Step 5) PC report).
# Converted 2026-08-18 from the pa_rhetorical_spans() builder in pc_package/build_ground_truth.py
# (work unit 2026-08-18_02_register-track-d, TASK-001). The conversion was byte-identical:
# the annexes rebuilt with no diff, which is what proves it changed nothing.
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-005_protein_a.docx — so no quote may cross a `{python}` inline expression, a @ref, a
# citation or bold markup. A span whose quote is no longer in the document now FAILS the
# build (build_ground_truth.build_rhetorical_spans), where the Python builder emitted it
# regardless and left check_grounding to find it later.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
# What the layer is about: the centrepiece is the leached Protein A robustness argument — a null
# screening fit, a response-surface model whose predicted coefficient of determination is
# negative, a non-significant lack-of-fit test, the model explicitly RETAINED as knowledge-space
# evidence and not used predictively, and the operative claim made model-free from the assayed
# pools. That cluster is a claim plus justifications plus a bounded_conclusion. The second thread
# is the in-process framing of pool host cell protein, whose drug substance limit is met only
# after anion exchange (cross_step_credit).
document_id: PCR-005
section_id: PCR-005_sec_rhet
spans:

  - id: PCR-005-R00
    section: "Executive summary"
    role: claim
    quote: "Pool host cell protein and step yield are well described by the response-surface
      models"
    supported_by: ["PCR-005-R22"]

  - id: PCR-005-R01
    section: "Executive summary"
    role: problem_statement
    quote: "Leached Protein A behaves differently."

  - id: PCR-005-R02
    section: "Executive summary"
    role: claim
    quote: "No process parameter had a significant effect on it, and the fitted surface predicts a
      run it has not seen no better than the mean of the response does"
    supported_by: ["PCR-005-R19", "PCR-005-R20"]

  - id: PCR-005-R03
    section: "Executive summary"
    role: bounded_conclusion
    quote: "so the study reports the attribute as robust to the operating parameters over the
      ranges studied and does not treat its model as predictive"
    bounds: "PCR-005-R02"

  - id: PCR-005-R04
    section: "Executive summary"
    role: cross_step_credit
    quote: "The pool host cell protein handed forward is not judged against the drug-substance
      specification, because the polishing steps reported in PCR-007 and PCR-008 carry that
      reduction."

  - id: PCR-005-R05
    section: "Executive summary"
    role: deferral
    quote: "This report supports the transfer scope in PTP-001 and rolls up into the master report
      PCMR-001."

  - id: PCR-005-R06
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "Small quantities of Protein A ligand are released from the resin during elution and
      enter the pool, so the step sets the leached Protein A attribute and does not clear
      it."

  - id: PCR-005-R07
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Ligand release from a Protein A resin is driven by hydrolysis and proteolysis of the
      immobilised ligand, which depend on the base matrix, the packing quality, the
      sanitisation regime and the number of cycles the column has seen."

  - id: PCR-005-R08
    section: "Platform and prior-product knowledge"
    role: deferral
    quote: "Prior campaign experience with an alternate resin is recorded in RA-004, which
      concluded that independent characterization would be required for any resin change and
      that no bridging from platform data would be accepted."

  - id: PCR-005-R09
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "The operating region defined in §6 is therefore a claim about the scale-down model,
      verified at commercial scale only at the set-point."

  - id: PCR-005-R10
    section: "Statistical methods"
    role: justification
    quote: "The predicted coefficient of determination is the decisive one for a predictive claim,
      because it measures how well the fitted surface predicts an observation that was not
      used to fit it."

  - id: PCR-005-R11
    section: "Statistical methods"
    role: justification
    quote: "A response for which no factor is active and for which the lack-of-fit test is not
      significant is reported as robust, and its model is retained as evidence of that
      robustness rather than used for prediction."

  - id: PCR-005-R12
    section: "Response-surface design"
    role: claim
    quote: "The response-surface model is the predictive model of this report and is the basis of
      the operating region in §6 and the proven acceptable ranges in §7."

  - id: PCR-005-R13
    section: "Screening: factor effects"
    role: claim
    quote: "Leached Protein A showed no significant effect from any factor or interaction."
    supported_by: ["PCR-005-R14"]

  - id: PCR-005-R14
    section: "Screening: factor effects"
    role: justification
    quote: "The screening model is not significant as a whole"

  - id: PCR-005-R15
    section: "Response-surface models"
    role: claim
    quote: "Two of the three responses are adequately modelled and one is not, and the distinction
      governs how each is used in the rest of this report."
    supported_by: ["PCR-005-R22", "PCR-005-R10"]

  - id: PCR-005-R16
    section: "Response-surface models"
    role: claim
    quote: "No process parameter had a significant effect on leached Protein A."
    supported_by: ["PCR-005-R19", "PCR-005-R20", "PCR-005-R21", "PCR-005-R11"]

  - id: PCR-005-R17
    section: "Response-surface models"
    role: mechanistic_warrant
    quote: "The remainder is run-to-run variation in ligand release from the resin itself, which
      is governed by the resin life cycle (packing, cycle number and sanitisation) and is
      controlled under SOP-2008."

  - id: PCR-005-R18
    section: "Response-surface models"
    role: bounded_conclusion
    quote: "The response-surface model for leached Protein A is retained in the knowledge space as
      evidence that the attribute does not depend on protein load, elution buffer pH, load
      flow rate or end of pool collect over the ranges studied, and it is not used as a
      predictive model."
    bounds: "PCR-005-R16"

  - id: PCR-005-R19
    section: "Response-surface models"
    role: justification
    quote: "The response-surface model is not significant as a whole"

  - id: PCR-005-R20
    section: "Response-surface models"
    role: justification
    quote: "A negative predicted coefficient of determination means the fitted surface predicts a
      held-out run less well than the mean of the response does."

  - id: PCR-005-R21
    section: "Response-surface models"
    role: justification
    quote: "so the residual variation is consistent with pure error and there is no evidence of
      structure the quadratic form has missed"

  - id: PCR-005-R22
    section: "Response-surface models"
    role: justification
    quote: "which is close enough to the adjusted value to support prediction rather than
      description alone"

  - id: PCR-005-R23
    section: "Response-surface models"
    role: claim
    quote: "The operative result for this attribute is the direct one: all 47 pools assayed across
      the screening and response-surface designs met the acceptance criterion of 5 ppm"

  - id: PCR-005-R24
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Host cell protein enters the pool by co-adsorption to the resin and to the product, so
      it rises with the mass of product bound, and it is released preferentially at the
      harsher low-pH desorption condition."

  - id: PCR-005-R25
    section: "Design space"
    role: claim
    quote: "Leached Protein A does not bound it"
    supported_by: ["PCR-005-R23"]

  - id: PCR-005-R26
    section: "Design space"
    role: bounded_conclusion
    quote: "All runs used a single clarified-harvest pool at nominal titre and impurity burden, so
      the region is defined for that feed state and the study does not bound the effect of
      feed variability."
    bounds: "PCR-005-R25"

  - id: PCR-005-R27
    section: "Proven acceptable ranges"
    role: cross_step_credit
    quote: "The limit is met after anion exchange and not before."

  - id: PCR-005-R28
    section: "Proven acceptable ranges"
    role: hedge
    quote: "That bound comes from the quadratic term discussed in §5.3, which is the only term in
      the model to reach nominal significance and which the study does not regard as
      established."

  - id: PCR-005-R29
    section: "Process capability and robustness"
    role: hedge
    quote: "The capability index for this attribute is very large and carries no discriminating
      information, because the mean is orders of magnitude below the limit."

  - id: PCR-005-R30
    section: "Parameter classification"
    role: claim
    quote: "No parameter of this step required designation as a critical process parameter."
    supported_by: ["PCR-005-R31"]

  - id: PCR-005-R31
    section: "Parameter classification"
    role: justification
    quote: "The only quality attribute the step sets is insensitive to all four multivariate
      parameters over the ranges studied, and the attribute that does respond strongly to
      them is one whose drug-substance level is set by later steps."

  - id: PCR-005-R32
    section: "Contribution to the control strategy"
    role: deferral
    quote: "The cumulative position across all steps is consolidated in PCMR-001."

  - id: PCR-005-R33
    section: "Discussion"
    role: restatement
    quote: "Leached Protein A has no model, and that is the result rather than a gap in the study,
      because the attribute the step sets does not respond to the parameters the step
      controls."
    restates: "PCR-005-R16"

  - id: PCR-005-R34
    section: "Discussion"
    role: bounded_conclusion
    quote: "It does not extend to a different resin, and RA-004 has already determined that a
      resin change would require independent characterization with no bridging from platform
      data."
    bounds: "PCR-005-R16"

  - id: PCR-005-R35
    section: "DEV-005-01 — elution buffer prepared below target"
    role: deviation_disposition
    quote: "The non-conforming lot was rejected, a replacement lot was prepared and released
      within its pH acceptance limit, and the affected run was executed with the
      replacement."

  - id: PCR-005-R36
    section: "DEV-005-01 — elution buffer prepared below target"
    role: claim
    quote: "The impact on the study is therefore none."
    supported_by: ["PCR-005-R37"]

  - id: PCR-005-R37
    section: "DEV-005-01 — elution buffer prepared below target"
    role: justification
    quote: "The deviation was detected at buffer release testing, before the lot was issued to the
      column."

  - id: PCR-005-R38
    section: "DEV-005-02 — leached Protein A determination out of trend"
    role: deviation_disposition
    quote: "Because carryover was suspected but not confirmed, the original determination could
      not be invalidated, and it was retained in the reported data set."
