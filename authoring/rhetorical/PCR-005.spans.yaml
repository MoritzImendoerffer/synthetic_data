# Rhetorical / argument-structure spans for PCR-005 (Protein A Chromatography (Step 5) PC report).
# Re-curated 2026-08-20 (work unit 2026-08-19_02_fifth-round-plan-then-batches, TASK-017) against
# the one-pass re-authored pc_package/PCR-005_protein_a.qmd, rendered to PCR-005_protein_a.docx,
# authored under the amended rule 4 of WRITING_GUIDE.md.
# The document was not touched: this layer is annotation over the finished text, so every quote
# here was rewritten to the new prose and no sentence was written to fit a span.
#
# All 39 ids, roles and relations are kept. Every one of the previous 39 quotes failed against the
# new text, so all 39 were re-cut. Three section labels changed name only:
#   R35, R36, R37  'Elution buffer prepared below target (DEV-005-01)'
#                  -> 'DEV-005-01, elution buffer prepared below target'
#   R38  'Leached Protein A result initially out of trend (DEV-005-02)'
#        -> 'DEV-005-02, leached Protein A result out of trend'
# No span moved section.
#
# The argument the layer annotates is unchanged in substance, and one thing about it is worth
# recording. The old curation's R00/R02/R15/R16/R23 turned on leached Protein A having "no usable
# model". The new text reaches the same place by a different route: it reports the response as
# robust to all four parameters across the ranges studied and declines to use a model for it at
# all, so the claims and their justifications re-cut cleanly onto the new sentences.
#
# Edges dropped: none. R00 supported_by [R22], R02 supported_by [R19, R20], R03 bounds R02,
# R13 supported_by [R14], R15 supported_by [R22, R10], R16 supported_by [R19, R20, R21, R11],
# R18 bounds R16, R25/R26, R30 supported_by [R31], R33 restates R16, R34 bounds R16 and
# R36 supported_by [R37] all hold in the new text.
#
# mechanistic_warrant, checked against the rule in RHETORICAL_ANNEX.md — each names a physical
# cause and a direction, not a category label:
#   R06  ligand that leaves the resin eluting with the antibody, which is how the step introduces
#        its own critical quality attribute;
#   R07  ligand lost by hydrolysis of the immobilization chemistry and by proteolysis, at a rate
#        set by the resin over its life rather than by a single run;
#   R17  the leached fragments eluting with the antibody because they still bind the Fc region;
#   R24  a lower elution pH driving the residual affinity of the complex down and protonating the
#        remaining carboxylate contacts, so the antibody desorbs sooner and carries the weakly held
#        protein with it.
#
# Quotes are verbatim, whitespace-collapsed substrings of the rendered PCR-005_protein_a.docx under
# BOTH extractors (pc_package/check_grounding.docx_text and build_rhetorical_annex.doc_text).
# No quote is taken from the ANOVA table row, which renders "nan" in the F and p columns.
