# Rhetorical / argument-structure spans for PCR-005 (Protein A Chromatography (Step 5) PC report).
# Converted 2026-08-18 from the pa_rhetorical_spans() builder in pc_package/build_ground_truth.py
# (work unit 2026-08-18_02_register-track-d, TASK-001), then RE-CURATED WHOLESALE on 2026-08-18
# against the report re-authored in TASK-004 of the same unit. All 39 spans failed after that
# re-author, which is the normal state: the layer is curated against one revision of the prose and
# a one-pass re-author invalidates every quote at once.
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-005_protein_a.docx — so no quote may cross a `{python}` inline expression, a @ref,
# a citation or bold markup. Each was tested under BOTH extractors before the builder ran:
# check_grounding.docx_text (yields "R2") and build_rhetorical_annex.doc_text (yields "R²").
# A span whose quote is no longer in the document FAILS the build
# (build_ground_truth.build_rhetorical_spans), where the old Python builder emitted it regardless.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the TASK-001 conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
# What the layer is about: the centrepiece is the leached Protein A robustness argument — a null
# screening fit, a response-surface model whose predicted coefficient of determination is
# negative, a non-significant lack-of-fit test that bounds the model form without establishing it,
# the model retained as knowledge-space evidence and used for nothing, and the operative claim
# made model-free from the assayed pools. That cluster is a claim plus justifications plus a
# bounded_conclusion. The second thread is the in-process framing of pool host cell protein, whose
# drug substance limit is met only after the polishing steps (cross_step_credit).
# TWO SPANS MOVED SECTION in the re-curation, because the argument moved: R17
# (mechanistic_warrant, resin-property account of leaching) is now in Mechanistic interpretation,
# and R27 (cross_step_credit for leached Protein A) is now in Response-surface models. R25 lost
# its supported_by edge: the re-authored Design space section makes a different claim, about load
# flow rate and end of pool collect, which the assayed-pool evidence in R23 does not support.
# The two deviation sections were renamed by the re-author and the section fields follow them.
