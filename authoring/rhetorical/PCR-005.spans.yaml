# Rhetorical / argument-structure spans for PCR-005 (Protein A Chromatography (Step 5) PC report).
# Re-curated 2026-10-08 (work unit 2026-10-08_01_rev2-campaign) against the Version 2.0 text,
# pc_package/PCR-005_protein_a.qmd rendered to PCR-005_protein_a.docx. The document was not touched:
# this layer is annotation over the finished text, and no sentence was written to fit a span.
#
# Version 2.0 changed the argument, not only the wording. Version 1.0 reported leached Protein A as
# robust to all four parameters; Version 2.0 reports that no adequate model results for it, so its
# dependence on the parameters is not resolved, and judges it on the measured results against its
# intermediate acceptance criterion. Every Version 1.0 quote therefore failed and every span was
# re-selected. Ids R00-R38 are kept with their Version 1.0 roles and re-cut onto the sentence of
# the new text that plays that role; where the Version 1.0 sentence has no counterpart, the id was
# given the nearest sentence of the same role. One id is new, R39, a deviation_disposition for
# DEV-005-03, which did not exist in Version 1.0. No role outside the schema vocabulary is used.
#
# Relations were re-derived from the new text rather than carried over:
#   R00 supported_by [R22]       the design space claim, by all outputs meeting their criteria
#   R02 supported_by [R19, R20]  no adequate model for leached Protein A, by the model not being
#                                significant and the centre-point spread matching the design spread
#   R03 bounds R02, R33 restates R02, R34 bounds R02
#   R13 supported_by [R14]       the screening model identifies effects, by its inability to resolve
#                                curvature
#   R16 supported_by [R10, R19]  leached Protein A and fragments reported descriptively, by the rule
#                                for an inadequate model and the leached Protein A model test
#   R18 bounds R16, R26 bounds R00, R30 supported_by [R31], R36 supported_by [R37]
# Dropped Version 1.0 edges: R15 supported_by [R22, R10] (the new adequacy claim rests on the
# adequacy table, not on these spans), R25/R26 (R26 now bounds the design-space claim R00), R11 as
# support of R16 (R11 now justifies the use of the NOR-propagated PAR).
#
# Quotes are number-free wherever the number is not the point, so the layer survives a reseed.
document_id: PCR-005
section_id: rhetorical_spans
spans:
- id: PCR-005-R00
  role: claim
  section: Design space
  supported_by:
  - PCR-005-R22
  quote: The design space of this step is the region in protein load and elution buffer pH, the two
    WC-CPPs, over which pool host cell protein meets its intermediate acceptance criterion.
- id: PCR-005-R01
  role: problem_statement
  section: Design space
  quote: The excluded region is the corner of high protein load and low elution buffer pH
- id: PCR-005-R02
  role: claim
  section: Executive summary
  supported_by:
  - PCR-005-R19
  - PCR-005-R20
  quote: No adequate model results for leached Protein A, so its dependence on the parameters of the
    multivariate design is not resolved.
- id: PCR-005-R03
  role: bounded_conclusion
  section: Leached Protein A
  bounds: PCR-005-R02
  quote: It shows only that any dependence is too small to resolve against the variation of the runs.
- id: PCR-005-R04
  role: cross_step_credit
  section: Process capability and robustness
  quote: These figures describe the drug substance after cation exchange and anion exchange have
    removed most of what the Protein A pool carries.
- id: PCR-005-R05
  role: deferral
  section: Executive summary
  quote: The results roll up into the Process Characterization Master Report PCMR-001.
- id: PCR-005-R06
  role: mechanistic_warrant
  section: Platform and prior-product knowledge
  quote: Leached Protein A comes from hydrolysis of the coupling chemistry and from cleavage of
    exposed ligand by host cell proteases in the load, and the leached fragments elute with the
    antibody because they still bind Fc.
- id: PCR-005-R07
  role: mechanistic_warrant
  section: Platform and prior-product knowledge
  quote: More protease activity in the load, for example after a longer hold of the clarified
    harvest before capture, is expected to cleave more ligand.
- id: PCR-005-R08
  role: deferral
  section: Contribution to the control strategy
  quote: Resin use, cleaning and sanitization are controlled by SOP-2008, and the hold of the
    clarified harvest is characterized in PCR-004.
- id: PCR-005-R09
  role: bounded_conclusion
  section: Scale-down model and its qualification
  quote: Under criterion 1 of PCP-005 §7 the step yield model is therefore not used for any range or
    prediction.
- id: PCR-005-R10
  role: justification
  section: Statistical methods
  quote: Where no adequate model resulted, the response is reported descriptively against its
    criterion over the runs of the design.
- id: PCR-005-R11
  role: justification
  section: Proven acceptable ranges per attribute and parameter
  quote: The NOR-propagated range is the one that supports a claim.
- id: PCR-005-R12
  role: claim
  section: Response-surface design
  quote: A face-centred design keeps every run inside the range studied.
- id: PCR-005-R13
  role: claim
  section: Statistical methods
  supported_by:
  - PCR-005-R14
  quote: The screening model identifies effects.
- id: PCR-005-R14
  role: justification
  section: Statistical methods
  quote: A two-level design cannot resolve curvature, so the screening model was not used to predict
    between its corners.
- id: PCR-005-R15
  role: claim
  section: Response-surface models
  quote: The model for pool host cell protein meets criteria 2 to 4.
- id: PCR-005-R16
  role: claim
  section: Response-surface models
  supported_by:
  - PCR-005-R10
  - PCR-005-R19
  quote: No adequate model results for them, and they are reported descriptively.
- id: PCR-005-R17
  role: mechanistic_warrant
  section: Mechanistic interpretation
  quote: Collecting further into the tail adds antibody and little host cell protein, so the ratio
    falls.
- id: PCR-005-R18
  role: bounded_conclusion
  section: Proven acceptable ranges per attribute and parameter
  bounds: PCR-005-R16
  quote: For leached Protein A and fragments the table rows come from models that are not adequate,
    and no PAR is claimed from them.
- id: PCR-005-R19
  role: justification
  section: Leached Protein A
  quote: The leached Protein A model is not significant as a whole.
- id: PCR-005-R20
  role: justification
  section: Centre-point performance and reproducibility
  quote: Its centre-point spread is of the same size as its variation across the whole design, so
    the variation of the ELISA and of the runs at set-point masks any effect of the parameters of
    that size.
- id: PCR-005-R21
  role: justification
  section: Model residuals and influential runs
  quote: Cook’s distances above 4/n are therefore expected in this design, and the limit does not
    separate an influential run from a run at a corner.
- id: PCR-005-R22
  role: justification
  section: Outputs against their criteria over the NOR
  quote: All three outputs meet their criteria at the set-point and across the NOR.
- id: PCR-005-R23
  role: claim
  section: Step yield
  quote: Step yield has no acceptance criterion, and its model is used for the classification of
    parameters only.
- id: PCR-005-R24
  role: mechanistic_warrant
  section: Mechanistic interpretation
  quote: A higher protein load puts more antibody on the bed, and with it more of the host cell
    protein associated with the antibody, so pool host cell protein rises with load.
- id: PCR-005-R25
  role: claim
  section: Design space
  quote: Leached Protein A and fragments met their criteria in every run of the designs, and step
    yield has no criterion, so they do not constrain it.
- id: PCR-005-R26
  role: bounded_conclusion
  section: Design space
  bounds: PCR-005-R00
  quote: These statements rest on a model of the scale-down column, which is qualified for pool host
    cell protein
- id: PCR-005-R27
  role: cross_step_credit
  section: Contribution to the control strategy
  quote: Host cell protein, leached Protein A and fragments are further cleared by cation exchange
    (PCR-007) and anion exchange (PCR-008), and they are tested at release of the drug substance.
- id: PCR-005-R28
  role: hedge
  section: Outputs against their criteria over the NOR
  quote: For these two outputs the decision rests on the measured results, every one of which met
    its criterion, and the predictions are shown for completeness.
- id: PCR-005-R29
  role: hedge
  section: Executive summary
  quote: The Cpk for leached Protein A is not meaningful, because the simulated drug substance
    values lie below the limit of quantitation of the ELISA.
- id: PCR-005-R30
  role: claim
  section: Executive summary
  supported_by:
  - PCR-005-R31
  quote: No parameter of the step was classified as a CPP.
- id: PCR-005-R31
  role: justification
  section: Parameter classification
  quote: Buffer pH is controlled at preparation and verified at release.
- id: PCR-005-R32
  role: deferral
  section: Contribution to the control strategy
  quote: The control strategy of the whole train is consolidated in PCMR-001.
- id: PCR-005-R33
  role: restatement
  section: Discussion
  restates: PCR-005-R02
  quote: Leached Protein A and fragments gave no adequate model.
- id: PCR-005-R34
  role: bounded_conclusion
  section: Discussion
  bounds: PCR-005-R02
  quote: Both met their criteria in every run, so the absence of a model limits what is known about
    their shape and not whether the step meets them.
- id: PCR-005-R35
  role: deviation_disposition
  section: DEV-005-01. Elution buffer pH below target on a response-surface run
  quote: The run was retained.
- id: PCR-005-R36
  role: claim
  section: DEV-005-01. Elution buffer pH below target on a response-surface run
  supported_by:
  - PCR-005-R37
  quote: The result therefore does not show the rise in pool host cell protein that the lower pH
    would cause, and the run does not distort the model in that direction.
- id: PCR-005-R37
  role: justification
  section: DEV-005-01. Elution buffer pH below target on a response-surface run
  quote: The run was analysed at its design setting, so the error in pH enters the model as part of
    the residual of this run.
- id: PCR-005-R38
  role: deviation_disposition
  section: DEV-005-02. Leached Protein A result initially out of trend
  quote: the first result was kept in the record with its status marked.
- id: PCR-005-R39
  role: deviation_disposition
  section: DEV-005-03. Scale-down equivalence not demonstrable with the planned set-point runs
  quote: The margins were not changed, because a criterion changed after the data are seen is the
    failure that INV-001 investigated.
