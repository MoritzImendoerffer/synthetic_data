    section: "Product and unit operation"
    role: cross_step_credit
    quote: "The other two claims are those of anion exchange and virus filtration."

  - id: PCR-006-R09
    section: "Changes in this revision"
    role: problem_statement
    quote: "The investigation found that the criteria used to judge each step in the PAR analysis were in no approved protocol and had been set after the data were seen"

  - id: PCR-006-R10
    section: "Changes in this revision"
