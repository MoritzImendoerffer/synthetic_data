section_id: PCR-006_sec_rhet
spans:

  - id: PCR-006-R00
    section: "Executive summary"
    role: problem_statement
    quote: "At the normal operating ranges (NORs) against which the studies were planned, the XMuLV claim was not met."

  - id: PCR-006-R01
    section: "Executive summary"
    role: bounded_conclusion
    quote: "so the claim is met there"

