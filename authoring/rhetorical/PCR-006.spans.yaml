# Rhetorical / argument-structure spans for PCR-006 (Low-pH Viral Inactivation (Step 6) PC report).
#
# Re-curated 2026-08-19, work unit 2026-08-19_02_fifth-round-plan-then-batches, against the
# one-pass re-authored pc_package/PCR-006_viral_inactivation.qmd (rendered .docx). The previous
# curation (converted 2026-08-18 from the vi_rhetorical_spans() builder) quoted the OLD text and
# all 31 spans failed: re-authoring a report invalidates its spans wholesale, as RHETORICAL_ANNEX.md
# says. The ids, the roles and the relation graph are carried over; only the quotes and the
# section labels are new. 31 spans in, 31 spans out; no span was dropped and no id was added.
#
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-006_viral_inactivation.docx under BOTH extractors
# (pc_package/check_grounding.docx_text and build_rhetorical_annex.doc_text). Those two disagree on
# the subscript/superscript glyphs — one renders "log10" and "R2" where the other renders "log₁₀"
# and "R²" — so no quote here contains either token, and no quote crosses a `{python}` inline
# expression, a @ref, a citation or bold markup.
#
# Sections that moved (the argument moved with the re-authoring; the document's own heading is used):
#   R06  "Regulatory and scientific basis"        -> "Scale-down model and its qualification"
#        the "rests on the model, never on a manufacturing measurement" move is now made in §3.1,
#        where the report says why virus clearance cannot be measured at commercial scale.
#   R08  "Screening: factor effects"              -> "Factor effects from the screening design"  (heading renamed)
#   R09  "Screening: factor effects"              -> "Mechanistic interpretation"
#        the bounded statement about which constraint binds is now made in §5.4, not in screening.
#   R10  "Screening: factor effects"              -> "Factor effects from the screening design"  (heading renamed)
#   R21  "Process capability and robustness"      -> unchanged; the modular-additivity sentence moved
#        to §10, but §8 still carries a cross-step statement (the simulated Cpk is the train's, not
#        the step's), so the span stays where it was.
#   R27  "Discussion"                             -> "Parameter classification"
#        "control reliability, not effect size, separates the two classes" is now argued in §9.
#   R29  "DEV-006-01 — hold-time record discrepancy"  -> "DEV-006-01 — Hold-time record discrepancy"
#   R30  "DEV-006-02 — infectivity assay cytotoxicity at low dilution"
#                                                 -> "DEV-006-02 — Infectivity assay cytotoxicity at low dilution"
#        (both deviation headings are capitalised in the re-authored document)
#
# Roles changed: none. Every role in the previous curation still has a sentence in the new text
# that plays it, so all eleven role assignments are carried over unchanged.
#
# Edges dropped: none. All four relations still hold in the new text —
#   R03 bounds R02        the exec summary still states the reassurance and then the edge of failure;
#   R09 supported_by R08  the screening ranking of hold time on both responses is what supports
#                         "the two constraints meet only through hold time";
#   R15 supported_by R14  the first-order acid-denaturation mechanism is the warrant for reading
#                         the pH gradient and its curvature;
#   R19 bounds R18        R19 is one of the three ways §6 says the design space is bounded;
#   R24 restates R00      the Discussion restates the exec summary's caution that the region stops
#                         being acceptable somewhere inside it;
#   R26 supported_by R17  "held far inside the acceptable region" is managed because a boundary
#                         setting carries less reliability.
#
# mechanistic_warrant check (RHETORICAL_ANNEX.md: a warrant must name a physical cause — which
# species, which interaction, which property, in which direction; a category label is not a warrant):
#   R14 names acid, the lipid envelope and the fusion glycoproteins, and the direction (the
#       first-order rate constant rises as the pH falls).
#   R16 names the molecule's partially unfolded state as the property that is already saturated
#       across the range, and the direction (moving pH changes the virus inactivation rate and
#       not the association rate of the antibody).
#   Both name a cause, not a category. No span labelled mechanistic_warrant carries a frame of the
#   "acts through the property of X" kind that docs/results/2026-08-18-track-d-stopped.md §5.6 rejects.
#
# section_id: the flat per-document form the Python builder used, kept unchanged.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-006
section_id: PCR-006_sec_rhet
spans:

  - id: PCR-006-R00
    section: "Executive summary"
    role: problem_statement
    quote: "The characterized region does not meet every criterion at every corner."

  - id: PCR-006-R01
    section: "Executive summary"
    role: claim
    quote: "Inactivation pH was classified as a critical process parameter, hold time and temperature as well controlled critical process parameters"

  - id: PCR-006-R02
    section: "Executive summary"
    role: bounded_conclusion
    quote: "Every corner of the normal operating ranges meets both criteria with margin"

  - id: PCR-006-R03
    section: "Executive summary"
    role: bounded_conclusion
    quote: "so an edge of failure lies inside the knowledge space"
    bounds: "PCR-006-R02"

  - id: PCR-006-R04
    section: "Executive summary"
    role: claim
    quote: "Acid inactivates the enveloped virus during the hold, which is the step’s contribution to the cumulative clearance of XMuLV."

  - id: PCR-006-R05
    section: "Executive summary"
    role: deferral
    quote: "The parameter classification, the proven acceptable ranges and the clearance contribution reported here roll up into PCMR-001."

  - id: PCR-006-R06
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "The log reduction factors reported here were therefore measured on a qualified small-scale spiking model"

  - id: PCR-006-R07
    section: "Risk-based prioritization and parameter selection"
    role: justification
    quote: "The characterization ranges cover the excursions a manufacturing suite can plausibly produce and extend far enough to locate an edge of failure where one exists."

  - id: PCR-006-R08
    section: "Factor effects from the screening design"
    role: claim
    quote: "The parameter that dominates virus inactivation therefore has no demonstrated effect on aggregate over the range studied, and the two parameters that dominate aggregate are the two that come second and third on inactivation."

  - id: PCR-006-R09
    section: "Mechanistic interpretation"
    role: bounded_conclusion
    quote: "The two constraints meet only through hold time, which raises both the log reduction and the aggregate, and the operating region in §6 is the region where the hold is long enough for the first and short enough for the second."
    supported_by: ["PCR-006-R08"]

  - id: PCR-006-R10
    section: "Factor effects from the screening design"
    role: bounded_conclusion
    quote: "The screening design identifies which parameters are active and estimates their effects on the assumption that the response is linear between the two edges of each range."

  - id: PCR-006-R11
    section: "Response-surface models"
    role: justification
    quote: "The gap between the first and the last is the model’s own statement of how much less well it predicts a new run than it fits the existing ones, and it follows from the reproducibility reported in §5.1."

  - id: PCR-006-R12
    section: "Response-surface models"
    role: hedge
    quote: "It is not a statement about the clearance a single batch will achieve, and every claim built on it in §6 and §7 is either a mean prediction or a predictive interval that carries this residual forward."

  - id: PCR-006-R13
    section: "Response-surface models"
    role: hedge
    quote: "which sits at the significance level and not inside it"

  - id: PCR-006-R14
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Inactivation of an enveloped virus at low pH is a first-order process whose rate constant rises as the pH falls, because acid disrupts the lipid envelope and denatures the fusion glycoproteins the virus needs to enter a cell."

  - id: PCR-006-R15
    section: "Mechanistic interpretation"
    role: claim
    quote: "The negative curvature in pH says that the gain in clearance from lowering the pH falls away toward the acid edge of the range."
    supported_by: ["PCR-006-R14"]

  - id: PCR-006-R16
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "the molecule is already in the partially unfolded state at every setting, so moving the pH within the range changes how fast the virus is inactivated without changing how fast the antibody associates"

  - id: PCR-006-R17
    section: "Design space"
    role: hedge
    quote: "It rests on models of mean response, so a setting on the boundary carries about half the reliability of a setting inside it, and the proven acceptable ranges in §7 are the form in which the variability is carried."

  - id: PCR-006-R18
    section: "Design space"
    role: bounded_conclusion
    quote: "The design space is bounded in three ways."

  - id: PCR-006-R19
    section: "Design space"
    role: bounded_conclusion
    quote: "It covers the three parameters studied multivariately, and A-Mab concentration enters it only through the range in which that parameter was assessed."
    bounds: "PCR-006-R18"

  - id: PCR-006-R20
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "The ranges in Table 17 are univariate statements and the design space in §6 is a multivariate one, so the two do not substitute for each other."

  - id: PCR-006-R21
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "The distribution simulated for XMuLV is the sum of the log reductions of the three steps that clear it, so the Cpk in Table 18 describes the train."

  - id: PCR-006-R22
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "Aggregate formed during the hold is removed by cation exchange (PCR-007), and the in-process criterion used here is derived from that step’s capability, so a change to the cation exchange operating region changes the criterion this step is judged against."

  - id: PCR-006-R23
    section: "Contribution to the control strategy"
    role: deferral
    quote: "Its outcome is verified through the drug substance tests for aggregate and charge variants and through the modular clearance claim consolidated in PCMR-001."

  - id: PCR-006-R24
    section: "Discussion"
    role: restatement
    quote: "What the study adds is the size of each effect for A-Mab, the shape of the surfaces, and the location of the boundary at which the region stops being acceptable."
    restates: "PCR-006-R00"

  - id: PCR-006-R25
    section: "Discussion"
    role: bounded_conclusion
    quote: "Three limitations bound the results."

  - id: PCR-006-R26
    section: "Discussion"
    role: hedge
    quote: "This is managed by claiming the clearance as a minimum and by holding the normal operating ranges far inside the acceptable region."
    supported_by: ["PCR-006-R17"]

  - id: PCR-006-R27
    section: "Parameter classification"
    role: justification
    quote: "The parameter is set by a titration to an endpoint, which is a less reliable operation than holding a timer or a jacket temperature, so the risk of leaving the proven acceptable range is not negligible."

  - id: PCR-006-R28
    section: "Deviations from the plan"
    role: deviation_disposition
    quote: "Both were raised in the quality system, investigated to root cause and dispositioned before the analysis was finalised, and both were retained with the affected data included."

  - id: PCR-006-R29
    section: "DEV-006-01 — Hold-time record discrepancy"
    role: deviation_disposition
    quote: "The deviation was dispositioned as retained, and the affected runs were included in the analysis."

  - id: PCR-006-R30
    section: "DEV-006-02 — Infectivity assay cytotoxicity at low dilution"
    role: deviation_disposition
    quote: "Every affected log reduction factor under-reports the clearance, so the models fitted to those values, the criterion in §7 and the credited clearance in §10 are conservative."
