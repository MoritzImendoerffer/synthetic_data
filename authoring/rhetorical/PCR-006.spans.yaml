#   - section is the document's own heading of the span;
#   - one role per span, by RHETORICAL_ANNEX.md. A mechanistic_warrant names a physical cause (which
#     species, which interaction, which property, in which direction). A sentence that explains by
#     process control rather than by chemistry is a justification.
