    section: "Executive summary"
    role: claim
    quote: "Aggregate, fragments and acidic variants meet their intermediate acceptance criteria across the NOR in force."

  - id: PCR-006-R03
    section: "Executive summary"
    role: claim
    quote: "Inactivation pH was classified as a critical process parameter (CPP)."
    supported_by: ["PCR-006-R80", "PCR-006-R41"]

  - id: PCR-006-R04
    section: "Executive summary"
    role: hedge
    quote: "For XMuLV clearance the concentration study bounds the effect loosely, with four runs, so the GPP class rests for that attribute on how the hold acts."

  - id: PCR-006-R05
    section: "Executive summary"
    role: mechanistic_warrant
    quote: "The acid denatures the envelope of the virus, and the antibody around it neither shields the envelope nor takes part in that reaction."

  - id: PCR-006-R06
    section: "Executive summary"
    role: deviation_disposition
    quote: "The runs of both events were retained in the analysis."

  - id: PCR-006-R07
    section: "Executive summary"
