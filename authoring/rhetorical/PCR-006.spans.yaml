    quote: "Two Version 1.0 conclusions moved."

  - id: PCR-006-R11
    section: "Changes in this revision"
    role: claim
    quote: "One conclusion did not move."

  - id: PCR-006-R12
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Low pH inactivates an enveloped virus by denaturing the glycoproteins of its envelope and by disrupting the envelope itself."

  - id: PCR-006-R13
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Molecules in that state associate, so aggregate forms for as long as the pool is held at low pH, and faster in a warmer pool, because both the unfolding and the association speed up with temperature."

  - id: PCR-006-R14
    section: "Risk-based prioritization and parameter selection"
    role: justification
    quote: "The three were also expected to interact, because on the first-order description the log reduction is the product of a rate that depends on pH and temperature and the time over which that rate acts."

  - id: PCR-006-R15
    section: "Risk-based prioritization and parameter selection"
    role: mechanistic_warrant
    quote: "A higher antibody concentration raises the rate at which partially unfolded molecules meet, so aggregate was expected to form faster in a more concentrated pool."

  - id: PCR-006-R16
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "Both conclusions hold at all three values of the offset, so the model is qualified for aggregate and for acidic variants."

  - id: PCR-006-R17
    section: "Scale-down model and its qualification"
    role: hedge
    quote: "The fragment results are far from their criterion, which bounds what the assumption can cost."

  - id: PCR-006-R18
    section: "Scale-down model and its qualification"
    role: justification
    quote: "The inactivation rate depends on the pH, the temperature and the matrix of the pool, and not on its volume."

  - id: PCR-006-R19
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "The small-scale result therefore represents the manufacturing step at that concentration, provided the whole pool reaches the inactivation pH."
    supported_by: ["PCR-006-R18"]

  - id: PCR-006-R20
    section: "Statistical methods"
    role: claim
    quote: "The screening model identifies effects."

  - id: PCR-006-R21
    section: "Statistical methods"
    role: justification
    quote: "With no residual there is no pure error for the lack-of-fit test and no residual mean square for the model F-test, so the criteria of PCMP-001 §7.2 cannot be applied, and the prediction interval of such a model has zero width."

  - id: PCR-006-R22
    section: "Statistical methods"
    role: justification
    quote: "Viral clearance is validated at worst-case conditions, so the claim has to hold there, and this report gives that reason nowhere else."

  - id: PCR-006-R23
    section: "Factors, ranges and the knowledge space"
    role: hedge
    quote: "The centre points therefore estimate pure error at the design centre, and each model predicts the outputs at the set-point from the fitted surface rather than measuring them there."

  - id: PCR-006-R24
    section: "Univariate assessment"
    role: hedge
    quote: "A study of one factor at a time cannot show whether the effect of the concentration depends on the other parameters, and the designs, which held the concentration at its set-point, carry no information on a concentration effect."

