# Rhetorical / argument-structure spans for PCR-006 (Low-pH Viral Inactivation (Step 6) PC report).
# Converted 2026-08-18 from the vi_rhetorical_spans() builder in pc_package/build_ground_truth.py
# (work unit 2026-08-18_02_register-track-d, TASK-001). The conversion was byte-identical:
# the annexes rebuilt with no diff, which is what proves it changed nothing.
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-006_viral_inactivation.docx — so no quote may cross a `{python}` inline expression, a @ref, a
# citation or bold markup. A span whose quote is no longer in the document now FAILS the
# build (build_ground_truth.build_rhetorical_spans), where the Python builder emitted it
# regardless and left check_grounding to find it later.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-006
section_id: PCR-006_sec_rhet
spans:

  - id: PCR-006-R00
    section: "Executive summary"
    role: problem_statement
    quote: "Low-pH viral inactivation is a hold step, and it is the operation on which the
      enveloped-virus clearance claim for A-Mab drug substance principally rests"

  - id: PCR-006-R01
    section: "Executive summary"
    role: claim
    quote: "Inactivation pH is classified as a critical process parameter, and it is the only
      parameter in the drug substance process to carry that classification"

  - id: PCR-006-R02
    section: "Executive summary"
    role: bounded_conclusion
    quote: "Its characterized range fails in both directions."

  - id: PCR-006-R03
    section: "Executive summary"
    role: bounded_conclusion
    quote: "the range stops where platform data place the onset of acid-induced aggregation, and
      no run was executed below that pH"
    bounds: "PCR-006-R02"

  - id: PCR-006-R04
    section: "Executive summary"
    role: claim
    quote: "Two claims are explicitly not made here."

  - id: PCR-006-R05
    section: "Executive summary"
    role: deferral
    quote: "the outcome rolls up into PCMR-001"

  - id: PCR-006-R06
    section: "Regulatory and scientific basis"
    role: bounded_conclusion
    quote: "the claim rests on the qualification of the scale-down model and never on a
      manufacturing measurement"

  - id: PCR-006-R07
    section: "Risk-based prioritization and parameter selection"
    role: justification
    quote: "because a range that does not reach an edge of failure cannot distinguish a critical
      parameter from a well-controlled one"

  - id: PCR-006-R08
    section: "Screening: factor effects"
    role: claim
    quote: "That null result carries information"

  - id: PCR-006-R09
    section: "Screening: factor effects"
    role: bounded_conclusion
    quote: "the onset was not reached, and pH is retained in the knowledge space for aggregate as
      evidence that the attribute is robust to it down to pH 3.2"
    supported_by: ["PCR-006-R08"]

  - id: PCR-006-R10
    section: "Screening: factor effects"
    role: bounded_conclusion
    quote: "The screening study is used for identification and for nothing else."

  - id: PCR-006-R11
    section: "Response-surface models"
    role: justification
    quote: "The model is therefore fitting to the limit of what the infectivity assay can resolve"

  - id: PCR-006-R12
    section: "Response-surface models"
    role: hedge
    quote: "Its sign and size suggest that the surface is not linear in pH and that the decline in
      clearance steepens as pH rises toward the top of the range"

  - id: PCR-006-R13
    section: "Response-surface models"
    role: hedge
    quote: "It is a reason to treat the p-values of the marginal terms, and the pH quadratic in
      particular, as approximate"

  - id: PCR-006-R14
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "The surfaces behave as acid denaturation kinetics predict, and that agreement is the
      main evidence that the models describe chemistry and not noise"

  - id: PCR-006-R15
    section: "Mechanistic interpretation"
    role: claim
    quote: "Almost all of the sensitivity of the step to pH lies above the set-point."
    supported_by: ["PCR-006-R14"]

  - id: PCR-006-R16
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "The two mechanisms pull in opposite directions on hold time, and this is why the step
      needs a multivariate region rather than three independent ranges"

  - id: PCR-006-R17
    section: "Design space"
    role: hedge
    quote: "the corner is not shown to fail so much as shown to provide no assurance of passing,
      and it lies outside the operating region for that reason"

  - id: PCR-006-R18
    section: "Design space"
    role: bounded_conclusion
    quote: "Three statements bound the region, and each is a limit on what the assessor should
      read into it."

  - id: PCR-006-R19
    section: "Design space"
    role: bounded_conclusion
    quote: "Nothing in this report supports operation below pH 3.2."
    bounds: "PCR-006-R18"

  - id: PCR-006-R20
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "These ranges are univariate statements and the design space is not, and the two must
      not be read as alternatives."

  - id: PCR-006-R21
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "The three mechanisms are orthogonal, which is what allows the contributions to be
      added under ICH Q5A(R2)"

  - id: PCR-006-R22
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "a change at anion exchange or virus filtration that reduces their credited
      contributions raises the floor required of this step"

  - id: PCR-006-R23
    section: "Contribution to the control strategy"
    role: deferral
    quote: "The consolidated position across all steps is given in PCMR-001."

  - id: PCR-006-R24
    section: "Discussion"
    role: restatement
    quote: "The step is well understood over the ranges studied, and the understanding is narrower
      than the volume of data might suggest"
    restates: "PCR-006-R00"

  - id: PCR-006-R25
    section: "Discussion"
    role: bounded_conclusion
    quote: "Four limitations bound what has been shown, and they are stated together because they
      compound."

  - id: PCR-006-R26
    section: "Discussion"
    role: hedge
    quote: "The report treats the first as a real margin and the second as an absence of assurance
      rather than a demonstrated failure."
    supported_by: ["PCR-006-R17"]

  - id: PCR-006-R27
    section: "Discussion"
    role: justification
    quote: "That difference, and not the size of the effect, is what separates the two classes at
      this step."

  - id: PCR-006-R28
    section: "Deviations from the plan"
    role: deviation_disposition
    quote: "Neither deviation invalidated a run, and no design point was re-executed."

  - id: PCR-006-R29
    section: "DEV-006-01 — hold-time record discrepancy"
    role: deviation_disposition
    quote: "The run was retained with its control system duration, and re-fitting is not warranted"

  - id: PCR-006-R30
    section: "DEV-006-02 — infectivity assay cytotoxicity at low dilution"
    role: deviation_disposition
    quote: "the affected log reduction factors are lower bounds and the fitted model is
      conservative in that direction"
