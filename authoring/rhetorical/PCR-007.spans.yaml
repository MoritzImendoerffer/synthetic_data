# Rhetorical / argument-structure spans for PCR-007 (Cation Exchange Chromatography (Step 7) PC report).
# Converted 2026-08-18 from the cx_rhetorical_spans() builder in pc_package/build_ground_truth.py
# (work unit 2026-08-18_02_register-track-d, TASK-001). The conversion was byte-identical:
# the annexes rebuilt with no diff, which is what proves it changed nothing.
#
# Re-curated 2026-08-19 (work unit 2026-08-19_01_fourth-round-one-document) against the
# one-pass re-authored PCR-007_cex.qmd and its rendered PCR-007_cex.docx. Every one of the 33
# quotes was rewritten: the re-author replaced the prose wholesale, so no old quote survived.
# The span ids and the relation structure are unchanged. All 33 spans are kept and no edge is
# dropped: R09 is still supported by the two mechanistic warrants R07 and R08, which in the new
# Section 5.4 carry the conductivity effect and its interaction with protein load; R16 is still
# supported by R12 (the residual diagnostics of both predictive models) and R14 (linearity, no
# edge of failure inside the ranges); R18 still bounds R16 and R31 still restates it.
# No role was changed. The new text carries a sentence for every role the old layer used.
#
# Sections that moved, because the argument moved in the re-authored document:
#   R00  Executive summary                -> Quality attributes in scope
#        (the "nothing downstream removes it" stake is now made where aggregate criticality is)
#   R03  Executive summary                -> The acceptance basis
#   R04  Executive summary                -> The acceptance basis
#        (the in-process-limit-not-specification argument and its intermediate-pool reason now
#         live together in Section 7.1 instead of in the summary)
#   R05  Executive summary                -> Contribution to the control strategy
#        (the named anion exchange / PCR-005 / PCR-008 credit is stated in Section 10)
#   R17  Design space                     -> Quality attributes in scope
#        (Section 6 no longer names a downstream step; Section 2.2 does)
#   R19  Proven acceptable ranges         -> The two analyses
#   R20  Proven acceptable ranges         -> What the ranges show
#   R21  Proven acceptable ranges         -> What the ranges show
#        (Section 7 is now subdivided; the spans take the subsection they sit in)
#   R29  DEV-007-01 - expired buffer lot used in a screening run
#                                         -> DEV-007-01 — expired load and wash buffer lot
#   R30  DEV-007-02 - column inlet temperature excursion in a response-surface run
#                                         -> DEV-007-02 — column inlet temperature excursion
#        (the two deviation subsections were renamed by the re-author)
#
# Both mechanistic_warrant quotes name a physical cause, a direction and the species involved,
# as RHETORICAL_ANNEX.md requires; neither stands on a category label. R07 names the ionic
# strength of the mobile phase screening the attraction between the sulfonate ligand and the
# weakly bound acidic host cell proteins, and the antibody staying bound because it is held
# more strongly. R08 names the extra weakly bound host cell protein a heavily loaded column
# carries into the wash, and the direction that gives the interaction its negative sign.
#
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-007_cex.docx under BOTH extractors (check_grounding.docx_text and
# build_rhetorical_annex.doc_text), which differ on the R2 superscript — so no quote here
# contains R2, and none crosses a `{python}` inline expression, a @ref, a citation or bold
# markup. A span whose quote is no longer in the document FAILS the build
# (build_ground_truth.build_rhetorical_spans), where the Python builder emitted it
# regardless and left check_grounding to find it later.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-007
section_id: PCR-007_sec_rhet
spans:

  - id: PCR-007-R00
    section: "Quality attributes in scope"
    role: problem_statement
    quote: "cation exchange is the last step in the train that reduces the high molecular weight
      fraction, so no step after this one removes what this step leaves in the pool"

  - id: PCR-007-R01
    section: "Executive summary"
    role: claim
    quote: "It forms no quality attribute of its own."

  - id: PCR-007-R02
    section: "Executive summary"
    role: claim
    quote: "Pool aggregate constrains the region more than pool host cell protein does."

  - id: PCR-007-R03
    section: "The acceptance basis"
    role: claim
    quote: "The criterion this step is judged against is an in-process limit and not the
      drug-substance specification"

  - id: PCR-007-R04
    section: "The acceptance basis"
    role: justification
    quote: "Its host cell protein content is reduced again by the anion exchange step, so
      comparing the pool against the drug-substance criterion would report a failure that does
      not exist"

  - id: PCR-007-R05
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "Host cell protein, residual DNA and leached Protein A are cleared by Protein A
      capture, by this step and by anion exchange, and the ranges and controls those steps
      contribute are in PCR-005 and PCR-008"

  - id: PCR-007-R06
    section: "Executive summary"
    role: deferral
    quote: "The outcomes of this step roll up into the master report PCMR-001."

  - id: PCR-007-R07
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "A higher load and wash conductivity raises the ionic strength of the mobile phase,
      which screens the attraction between the sulfonate ligand and the weakly bound acidic host
      cell proteins and strips them from the column during the wash, while the antibody, which is
      held more strongly, stays bound"

  - id: PCR-007-R08
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "A heavily loaded column carries more weakly bound host cell protein into the wash, so
      a higher wash conductivity removes more from a heavily loaded column than from a lightly
      loaded one, and the interaction coefficient is negative"

  - id: PCR-007-R09
    section: "Screening: factor effects"
    role: claim
    quote: "Host cell protein levels were affected by load and wash conductivity and by protein
      load, in opposite directions, and a significant interaction between the two was identified."
    supported_by: ["PCR-007-R07", "PCR-007-R08"]

  - id: PCR-007-R10
    section: "Centre-point performance and reproducibility"
    role: hedge
    quote: "Host cell protein results near the limit of quantitation are therefore attributed to
      the assay unless a factor effect explains them"

  - id: PCR-007-R11
    section: "Screening: factor effects"
    role: bounded_conclusion
    quote: "The screening study is therefore read here for which factors are active and in which
      direction"

  - id: PCR-007-R12
    section: "Response-surface models"
    role: justification
    quote: "The residuals of both models are centred on zero and show no trend with the predicted
      value, so neither model is systematically wrong at one end of its range"

  - id: PCR-007-R13
    section: "Response-surface models"
    role: hedge
    quote: "The model confirms the protein load effect that screening found and is used for
      nothing else in this report."

  - id: PCR-007-R14
    section: "Response-surface models"
    role: claim
    quote: "Pool aggregate therefore changes linearly with each of the four parameters over this
      region, and the surface shows no maximum, no minimum and no edge of failure inside the
      ranges studied"

  - id: PCR-007-R15
    section: "Response-surface models"
    role: justification
    quote: "The three interactions identified in screening are confirmed, and the interaction of
      protein load with elution buffer pH is again the largest"

  - id: PCR-007-R16
    section: "Design space"
    role: claim
    quote: "The design space of this step is the region of the four well-controlled critical
      process parameters over which pool aggregate and pool host cell protein remain within their
      in-process limits."
    supported_by: ["PCR-007-R12", "PCR-007-R14"]

  - id: PCR-007-R17
    section: "Quality attributes in scope"
    role: cross_step_credit
    quote: "It is cleared by three chromatography steps in series, so its acceptable level at the
      cation exchange pool depends on what the anion exchange step downstream removes"

  - id: PCR-007-R18
    section: "Design space"
    role: bounded_conclusion
    quote: "The region is defined only over the ranges the study explored and says nothing about
      settings outside them."
    bounds: "PCR-007-R16"

  - id: PCR-007-R19
    section: "The two analyses"
    role: claim
    quote: "Each proven acceptable range was determined twice, and the two answers differ because
      they answer different questions."

  - id: PCR-007-R20
    section: "What the ranges show"
    role: bounded_conclusion
    quote: "The corner is the simultaneous worst case of three or two independent parameters and
      is not a condition the process is run at."

  - id: PCR-007-R21
    section: "What the ranges show"
    role: deferral
    quote: "The consequence for the control strategy is stated in Section 10"

  - id: PCR-007-R22
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "Capability at this step is shared with other steps and is not delivered by cation
      exchange alone."

  - id: PCR-007-R23
    section: "Process capability and robustness"
    role: bounded_conclusion
    quote: "Two bounds apply to every number in this section."

  - id: PCR-007-R24
    section: "Parameter classification"
    role: claim
    quote: "No parameter was classified as a critical process parameter."

  - id: PCR-007-R25
    section: "Contribution to the control strategy"
    role: bounded_conclusion
    quote: "The step does not act alone on any of them except aggregate."

  - id: PCR-007-R26
    section: "Contribution to the control strategy"
    role: deferral
    quote: "The elements listed here are consolidated with those of the other steps in PCMR-001,
      which is the document that states the control strategy for the process as a whole."

  - id: PCR-007-R27
    section: "Discussion"
    role: hedge
    quote: "What the model has not shown is that the small-scale column behaves like the
      commercial column at the edges of the ranges, because it was qualified at the target
      settings."

  - id: PCR-007-R28
    section: "Deviations from the plan"
    role: deviation_disposition
    quote: "Both were detected after the affected run rather than during it, both were
      investigated to a root cause, and both were dispositioned as retained."

  - id: PCR-007-R29
    section: "DEV-007-01 — expired load and wash buffer lot"
    role: deviation_disposition
    quote: "The deviation was dispositioned as retained. Run 6 was kept in the analysis and no
      design point was invalidated."

  - id: PCR-007-R30
    section: "DEV-007-02 — column inlet temperature excursion"
    role: deviation_disposition
    quote: "The deviation was dispositioned as retained. Run 14 was kept in the analysis and no
      design point was invalidated. Temperature was not a studied factor at this step, so this
      deviation does not establish a range for it, and the chamber remains controlled to the
      platform specification under SOP-2010."

  - id: PCR-007-R31
    section: "Conclusions"
    role: restatement
    quote: "A design space was defined over the four multivariate parameters"
    restates: "PCR-007-R16"

  - id: PCR-007-R32
    section: "Conclusions"
    role: bounded_conclusion
    quote: "These estimates rest on qualified scale-down models with every parameter inside its
      normal operating range and are confirmed at commercial scale during Stage 2."
