# Rhetorical / argument-structure spans for PCR-007 (Cation Exchange Chromatography (Step 7) PC report).
#
# Re-curated 2026-10-11, work unit 2026-10-08_01_rev2-campaign, against the final Version 2.0 text of
# pc_package/PCR-007_cex.qmd (rendered .docx of 2026-10-11), in the same pass as the Version 2.0 annex builder
# pc_package/annex_builders/pcr_007.py (procedure ANNEX-A-DOCUMENT.md, rule 7).
#
# The previous curation (2026-08-19) quoted the Version 1.0 text, and none of its 33 spans appears in the
# Version 2.0 document: the report was rewritten under INV-001 and INV-002 (criteria set before the data and
# verified at manufacturing scale, model selection on the log scale, the host cell protein model failing the
# criterion on residuals, fragments judged on their measured results, the verification of the platform worst
# cases, the record of study events and discrepancies from the plan). No span of that curation is carried
# over, and the ids are assigned afresh, in the order in which the spans occur in the rendered document: an id
# names a span of this revision only.
#
# Conventions, as in every spans file of the corpus:
#   - every quote is a verbatim, whitespace-collapsed substring of the rendered .docx
#     (check_grounding.docx_text) and occurs there exactly once;
#   - no quote carries a value of an inline {python} expression, a cross-reference, a citation, or the
#     tokens "log10" and "R²", so the layer survives a reseed; a quote that would cross one stops short of it
#     (a clause slice);
#   - section is the document's own heading of the span;
#   - one role per span, by RHETORICAL_ANNEX.md. A mechanistic_warrant names a physical cause (which species,
#     which property, in which direction).
#
# Relations (supported_by on a claim; bounds and restates as RHETORICAL_ANNEX.md defines them):
#   R01 claim supported_by R65                           Aggregate and host cell protein met their intermediate accep
#   R04 claim supported_by R36                           The highest single-run limit over the NOR stays below the cr
