#   R24 claim supported_by R25                           The screening model identifies effects.
#   R47 claim supported_by R48, R49                      Protein load and elution buffer pH acted on aggregate in the
#   R50 claim supported_by R34, R51, R16                 Within this range conductivity has no demonstrated effect on
#   R53 claim supported_by R54                           Protein load and load/wash conductivity acted on host cell p
#   R55 claim supported_by R14                           Residual DNA clearance did not depend on any of the four fac
#   R61 claim supported_by R62                           The widening changes no conclusion of this report over the N
#   R64 claim supported_by R65                           Every output meets its criterion across the NOR.
#   R05 bounds R04; R08 bounds R07; R21 bounds R20; R37 bounds R36; R57 bounds R56; R58 bounds R56; R63 bounds R61; R70 bounds R06
#   R30 restates R26; R67 restates R02; R79 restates R47
#
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-007
section_id: PCR-007_sec_rhet
spans:

  - id: PCR-007-R01
    section: "Executive summary"
    role: claim
    quote: "Aggregate and host cell protein met their intermediate acceptance criteria at every combination of NOR low, set-point and NOR high."
    supported_by: ["PCR-007-R65"]

  - id: PCR-007-R02
    section: "Executive summary"
    role: claim
    quote: "The proven acceptable range of every parameter for aggregate and host cell protein is its range studied."

  - id: PCR-007-R03
    section: "Executive summary"
    role: problem_statement
    quote: "The host cell protein model does not meet the fourth, because its residuals drift with the order of execution."

  - id: PCR-007-R04
    section: "Executive summary"
    role: claim
    quote: "The highest single-run limit over the NOR stays below the criterion with the whole drift added to it."
    supported_by: ["PCR-007-R36"]

  - id: PCR-007-R05
    section: "Executive summary"
    role: bounded_conclusion
    quote: "The highest limit over the whole region studied would not, and nor would the limit over the NOR with the offset at the unfavourable end of its interval, on which the qualification rests"
    bounds: "PCR-007-R04"

  - id: PCR-007-R06
    section: "Executive summary"
    role: claim
    quote: "The platform worst case for host cell protein was confirmed with the offset at its estimate."

  - id: PCR-007-R07
    section: "Executive summary"
    role: claim
    quote: "The platform worst case for fragments was confirmed by the rule of PCP-007 §7.6"

  - id: PCR-007-R08
    section: "Executive summary"
    role: bounded_conclusion
    quote: "The fragment model behind that prediction does not meet PCMP-001 §7.2."
    bounds: "PCR-007-R07"

  - id: PCR-007-R09
    section: "Executive summary"
    role: deviation_disposition
    quote: "Both runs were retained in the analysis."

  - id: PCR-007-R10
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "Below its isoelectric point the antibody carries a net positive charge and binds the ligand."

  - id: PCR-007-R11
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "Aggregate binds more strongly than monomer and elutes later, so the step separates the two by where the pool is cut."

  - id: PCR-007-R12
    section: "Product and unit operation"
    role: cross_step_credit
    quote: "Enveloped virus is claimed at low-pH inactivation, anion exchange and virus filtration, and small viruses at anion exchange and virus filtration"

  - id: PCR-007-R13
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Aggregate presents more positive charge to the ligand than monomer does, so it is retained more strongly and elutes on the tail of the elution peak."

  - id: PCR-007-R14
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "DNA carries a strong negative charge and is repelled by the ligand, so its clearance is large and is not expected to depend on the parameters studied."

  - id: PCR-007-R15
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Free leached Protein A does not bind under load conditions, but the leached Protein A in complex with the antibody binds with it, which limits the clearance to a modest factor."

  - id: PCR-007-R16
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "The ionic strength of the load and the wash does not change the relative charge of aggregate and monomer at the elution pH, and that difference in charge is what separates them."

  - id: PCR-007-R17
    section: "Quality attributes in scope"
    role: problem_statement
    quote: "Aggregate has the highest criticality of the five and is the attribute the step exists to control."

  - id: PCR-007-R18
    section: "Quality attributes in scope"
    role: cross_step_credit
    quote: "Host cell protein is cleared here and at anion exchange, so the pool of this step must be one that anion exchange can bring to the drug substance criterion."

  - id: PCR-007-R19
    section: "Scale-down model and its qualification"
    role: justification
    quote: "The model is qualified for an output with a criterion when the conclusion over the NOR is the same with the offset at either end of its interval."

  - id: PCR-007-R20
    section: "Scale-down model and its qualification"
    role: claim
    quote: "The model is qualified for both outputs that carry a criterion."
    supported_by: ["PCR-007-R19"]

  - id: PCR-007-R21
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "Under the a priori criterion the model would therefore not be qualified for host cell protein"
    bounds: "PCR-007-R20"

  - id: PCR-007-R22
    section: "Scale-down model and its qualification"
    role: hedge
    quote: "The qualification did not compare fragments at both scales, so their offset is unknown, not zero."

  - id: PCR-007-R23
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "The conclusions of this report apply to the commercial step through the qualification above, and they are to be confirmed at scale in Stage 2."

  - id: PCR-007-R24
    section: "Statistical methods"
    role: claim
    quote: "The screening model identifies effects."
    supported_by: ["PCR-007-R25"]

  - id: PCR-007-R25
    section: "Statistical methods"
    role: justification
    quote: "It is not the predictive model of the step, because a model without quadratic terms cannot describe curvature."

  - id: PCR-007-R26
    section: "Statistical methods"
    role: claim
    quote: "The response-surface model is the predictive model."

  - id: PCR-007-R27
    section: "Statistical methods"
    role: mechanistic_warrant
    quote: "This is the behaviour expected of a purification step, which removes a share of what is present, so that a parameter changes the share rather than a fixed amount."

  - id: PCR-007-R28
    section: "Factor effects in the screening design"
    role: justification
    quote: "On the raw scale, two effects that are additive on the log scale appear as an interaction, and with one effect positive and the other negative that interaction is negative."

  - id: PCR-007-R29
    section: "Factor effects in the screening design"
    role: hedge
    quote: "The record gives no cause for it, and this report offers none."

  - id: PCR-007-R30
    section: "Factor effects in the screening design"
    role: restatement
    quote: "The response-surface model stays the predictive model"
    restates: "PCR-007-R26"

  - id: PCR-007-R31
    section: "Response-surface models"
    role: claim
    quote: "The models of aggregate and host cell protein meet the first three criteria."

  - id: PCR-007-R32
    section: "Response-surface models"
    role: justification
    quote: "The aggregate model also meets the fourth, and the host cell protein model does not."

  - id: PCR-007-R33
    section: "Aggregate"
    role: justification
    quote: "There the interactions do not act, and a curvature term has the same value at both ends of a range, so these factors are the full change across the range."

  - id: PCR-007-R34
    section: "Aggregate"
    role: justification
    quote: "so no effect of conductivity on aggregate is demonstrated."

  - id: PCR-007-R35
    section: "Host cell protein"
    role: hedge
    quote: "PCP-007 §12 states that an effect smaller than the spread of the centre points will not be claimed, so the curvature is kept in the model for prediction and is not claimed as a finding."

  - id: PCR-007-R36
    section: "Host cell protein"
    role: justification
    quote: "The conclusion over the NOR therefore does not depend on the trend."

  - id: PCR-007-R37
    section: "Host cell protein"
    role: bounded_conclusion
    quote: "Outside the NOR it can."
    bounds: "PCR-007-R36"

  - id: PCR-007-R38
    section: "Host cell protein"
    role: hedge
    quote: "The edge of the design space and the qualification for host cell protein are therefore sensitive to the drift, whose cause is unknown."

  - id: PCR-007-R39
    section: "Influential runs"
    role: claim
    quote: "The choice of scale for host cell protein therefore rests on these two runs, and no conclusion over the NOR rests on that choice."

  - id: PCR-007-R40
    section: "Models within two AICc units of the selected model"
    role: justification
    quote: "All of them meet the first three adequacy criteria and give the same judgement over the NOR."

  - id: PCR-007-R41
    section: "Models within two AICc units of the selected model"
    role: hedge
    quote: "They show that the qualification for host cell protein, the verification of its platform worst case and the edge of the design space at that corner all lie close to their limits."

  - id: PCR-007-R42
    section: "Fragments"
    role: bounded_conclusion
    quote: "Fragments are therefore judged on their measured results, and no range and no predicted level is derived for them."

  - id: PCR-007-R43
    section: "Residual DNA and leached Protein A"
    role: hedge
    quote: "so the data do not show a dependence on load, and none is claimed."

  - id: PCR-007-R44
    section: "Univariate assessment of elution flow rate"
    role: justification
    quote: "No difference was detected in aggregate, host cell protein or step yield."

  - id: PCR-007-R45
    section: "Univariate assessment of elution flow rate"
    role: hedge
    quote: "The study is too small to exclude such an effect on yield."

  - id: PCR-007-R46
    section: "Univariate assessment of elution flow rate"
    role: problem_statement
    quote: "Residual DNA clearance was significantly lower at the high end of the flow-rate range."

  - id: PCR-007-R47
    section: "Mechanistic interpretation"
    role: claim
    quote: "Protein load and elution buffer pH acted on aggregate in the directions expected."
    supported_by: ["PCR-007-R48", "PCR-007-R49"]

  - id: PCR-007-R48
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "A higher load occupies more of the ligand and broadens the elution peaks, so the aggregate front overlaps more of the monomer."

  - id: PCR-007-R49
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "A higher pH lowers the positive charge of both species, which weakens their binding and brings them off closer together."

  - id: PCR-007-R50
    section: "Mechanistic interpretation"
    role: claim
    quote: "Within this range conductivity has no demonstrated effect on aggregate, as expected."
    supported_by: ["PCR-007-R34", "PCR-007-R51", "PCR-007-R16"]

  - id: PCR-007-R51
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "The ionic strength of the load and the wash weakens the binding of every species during loading and washing."

  - id: PCR-007-R52
    section: "Mechanistic interpretation"
    role: problem_statement
    quote: "The elution stop collect acted on aggregate in the opposite direction to the expectation of PCP-007 §4.1."

  - id: PCR-007-R53
    section: "Mechanistic interpretation"
    role: claim
    quote: "Protein load and load/wash conductivity acted on host cell protein in the directions expected."
    supported_by: ["PCR-007-R54"]

  - id: PCR-007-R54
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "More load leaves more host cell protein held with the bound antibody, and a higher ionic strength strips more of the weakly bound species in the wash."

  - id: PCR-007-R55
    section: "Mechanistic interpretation"
    role: claim
    quote: "Residual DNA clearance did not depend on any of the four factors of the response-surface design, as expected for a species repelled by the ligand."
    supported_by: ["PCR-007-R14"]

  - id: PCR-007-R56
    section: "Design space"
    role: claim
    quote: "No attribute bounds the region within the ranges studied."

  - id: PCR-007-R57
    section: "Design space"
    role: bounded_conclusion
    quote: "Four results bound this claim near the corner of highest load and lowest conductivity."
    bounds: "PCR-007-R56"

  - id: PCR-007-R58
    section: "Design space"
    role: bounded_conclusion
    quote: "The design space has not been confirmed at manufacturing scale anywhere near the edges of the ranges studied."
    bounds: "PCR-007-R56"

  - id: PCR-007-R59
    section: "Acceptance basis"
    role: justification
    quote: "The derivation of the a priori criteria uses no result of the studies they judge."

  - id: PCR-007-R60
    section: "Acceptance basis"
    role: justification
    quote: "The risk falls on the producer where such a result is detected, and on the patient only where it is not."

  - id: PCR-007-R61
    section: "Acceptance basis"
    role: claim
    quote: "The widening changes no conclusion of this report over the NOR."
    supported_by: ["PCR-007-R62"]

  - id: PCR-007-R62
    section: "Acceptance basis"
    role: justification
    quote: "meets the a priori criterion as well."

  - id: PCR-007-R63
    section: "Acceptance basis"
    role: bounded_conclusion
    quote: "The widening does decide two results outside that judgement."
    bounds: "PCR-007-R61"

  - id: PCR-007-R64
    section: "Outputs against their criteria"
    role: claim
    quote: "Every output meets its criterion across the NOR."
    supported_by: ["PCR-007-R65"]

  - id: PCR-007-R65
    section: "Outputs against their criteria"
    role: justification
    quote: "No predicted value over the NOR comes near its criterion."

  - id: PCR-007-R66
    section: "Proven acceptable ranges per parameter"
    role: justification
    quote: "The design space is a statement about the four together, and a combination of settings inside their separate ranges could fall outside it where an interaction is active."

  - id: PCR-007-R67
    section: "Proven acceptable ranges per parameter"
    role: restatement
    quote: "At this step, at the criteria in force, both cover the whole range studied."
    restates: "PCR-007-R02"

  - id: PCR-007-R68
    section: "Verification of the platform worst cases"
    role: claim
    quote: "No later step is credited with any clearance of aggregate."

  - id: PCR-007-R69
    section: "Verification of the platform worst cases"
    role: deferral
    quote: "Both studies, their results and their decisions belong to PCR-006."

  - id: PCR-007-R70
    section: "Verification of the platform worst cases"
    role: bounded_conclusion
    quote: "Its outcome for host cell protein depends on that estimate."
    bounds: "PCR-007-R06"

  - id: PCR-007-R71
    section: "Process capability and robustness"
    role: justification
    quote: "No simulated batch fell outside any of the five criteria."

  - id: PCR-007-R72
    section: "Process capability and robustness"
    role: hedge
    quote: "The bound covers the sampling of the simulation and not the uncertainty of the integrated model itself."

  - id: PCR-007-R73
    section: "Parameter classification"
    role: problem_statement
    quote: "No numerical threshold is set for practical relevance or for a PAR that is wide against its NOR."

  - id: PCR-007-R74
    section: "Parameter classification"
    role: claim
    quote: "This report therefore judges the effect too small to move residual DNA appreciably in the drug substance, in the sense of PCMP-001 §7.7."

  - id: PCR-007-R75
    section: "Parameter classification"
    role: hedge
    quote: "The study therefore does not show that flow rate leaves yield unchanged."

  - id: PCR-007-R76
    section: "Contribution to the control strategy"
    role: deferral
    quote: "The results of this report roll up, with those of the other steps, into the master report PCMR-001."

  - id: PCR-007-R77
    section: "Contribution to the control strategy"
    role: bounded_conclusion
    quote: "The conclusions of this report hold for resin within the cycle count qualified under SOP-2008."

  - id: PCR-007-R78
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "Anion exchange clears host cell protein, residual DNA, leached Protein A and virus after this step (PCR-008)."

  - id: PCR-007-R79
    section: "Discussion"
    role: restatement
    quote: "A higher protein load and a higher elution buffer pH raise aggregate in the pool."
    restates: "PCR-007-R47"

  - id: PCR-007-R80
    section: "Discussion"
    role: hedge
    quote: "Neither result is explained."

  - id: PCR-007-R81
    section: "Discussion"
    role: problem_statement
    quote: "The missing load results matter most, because every clearance factor of aggregate and host cell protein rests on the process model at set-point instead of a measured load."

  - id: PCR-007-R82
    section: "DEV-007-01 Expired buffer lot in a screening run"
    role: justification
    quote: "With the run excluded, the screening models find the same significant terms for all three outputs."

  - id: PCR-007-R83
    section: "DEV-007-01 Expired buffer lot in a screening run"
    role: deviation_disposition
    quote: "The screening design identifies effects and sets no range, so the run was retained."

  - id: PCR-007-R84
    section: "DEV-007-02 Temperature excursion during a response-surface run"
    role: deviation_disposition
    quote: "The run was retained."

  - id: PCR-007-R85
    section: "PD-007-01 Model selection"
    role: claim
    quote: "It changed no conclusion over the NOR."

  - id: PCR-007-R86
    section: "PD-007-05 Load aggregate and host cell protein not recorded"
    role: hedge
    quote: "The clearance factors and the verification of the platform worst cases do, and a load that differed from the process model between runs would appear in them as scatter or as a trend."

  - id: PCR-007-R87
    section: "PD-007-11 Feed lots not recorded"
    role: problem_statement
    quote: "A lot effect therefore cannot be separated from the run-order drift of host cell protein or from the scatter between runs."

  - id: PCR-007-R88
    section: "PD-007-12 Load/wash buffer named Tris in Version 1.0"
    role: claim
    quote: "The correction changes no result of this report."
