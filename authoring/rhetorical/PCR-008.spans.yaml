# Rhetorical / argument-structure spans for PCR-008 (Anion Exchange Chromatography (Step 8) PC report).
# Re-curated 2026-08-20 (work unit 2026-08-19_02_fifth-round-plan-then-batches, TASK-048) against
# ATTEMPT 3 of the one-pass re-authored pc_package/PCR-008_aex.qmd, rendered to PCR-008_aex.docx.
# Attempt 3 is the first PCR-008 authored under the amended rule 4 of WRITING_GUIDE.md and the
# first to win its blind reading against the round-zero text (owner, 2026-08-20, key B1d).
# The document was not touched: this layer is annotation over the finished text, so every quote
# here was rewritten to the new prose and no sentence was written to fit a span.
#
# The previous curation (2026-08-19) quoted attempt 2, and all 25 of its quotes failed against
# attempt 3. All 25 ids, roles and relations are kept; only the quotes and four section labels
# changed.
#
# Sections changed (the argument is in the same place, the heading is not) — the four labels that
# the 2026-08-19 curation had flattened are restored, because attempt 3 renders them as Quarto
# writes them:
#   PCR-008-R11  "Screening factor effects" -> "Screening: factor effects"
#   PCR-008-R20  "DEV-008-01, non-representative load in the first execution"
#                -> "DEV-008-01 — non-representative load in the first execution"
#   PCR-008-R21  "DEV-008-02, permissive pool collection set-point"
#                -> "DEV-008-02 — permissive pool collection set-point"
#   PCR-008-R24  "DEV-008-03, equilibration and wash buffer released below its pH range"
#                -> "DEV-008-03 — equilibration and wash-1 buffer released below its pH range"
# Roles changed: none. Every role still has a sentence in the new text that plays it.
# Edges dropped: none. R11 supported_by [R09, R10], R22 restates R00 and R17 bounds R16 all hold
# in attempt 3: R09 and R10 are the two mechanisms behind the effect R11 claims, R22 restates
# R00's "host cell protein is what bounds the region" in the conclusions, and R17 bounds R16 by
# saying what limits the meaning of the exclusion R16 reports.
#
# mechanistic_warrant, checked against the rule in RHETORICAL_ANNEX.md — each of the three names a
# physical cause and a direction, not a category label:
#   R04  the acidic groups on a virus particle's surface holding it to the quaternary amine
#        ligand, with the lipid envelope taking no part, which is why MVM and XMuLV behave alike;
#   R09  a more negatively charged species holding its place through a larger rise in ionic
#        strength than a weakly charged one;
#   R10  the wash conductivity displacing the weakly held fraction of the host cell protein
#        population, more of it as the conductivity rises.
#
# Quotes are verbatim, whitespace-collapsed substrings of the rendered PCR-008_aex.docx under BOTH
# extractors (pc_package/check_grounding.docx_text and build_rhetorical_annex.doc_text), which
# differ in sub/superscripts — so no quote carries "R2" or a log10 subscript from a table. Digits
# are avoided except where the section's only sentence playing the role carries them (R01, R02,
# R05, R14, R22).
document_id: PCR-008
section_id: rhetorical_spans
spans:
- id: PCR-008-R00
  role: claim
  section: Executive summary
  quote: The host cell protein criterion excludes 14.4% of that region and the two viral criteria
    exclude no part of it.
- id: PCR-008-R01
  role: problem_statement
  section: Executive summary
  quote: for pool host cell protein the range that survives propagation of the other parameters
    through their normal operating ranges is narrower than the characterization range for two of
    them
- id: PCR-008-R02
  role: claim
  section: Executive summary
  quote: All 5 parameters were classified as well-controlled critical process parameters.
- id: PCR-008-R03
  role: claim
  section: Parameter classification
  quote: All 5 parameters of this step are therefore well-controlled critical process parameters
    and none is a critical process parameter.
- id: PCR-008-R04
  role: mechanistic_warrant
  section: Mechanistic interpretation
  quote: Both particles are held by the attraction between the acidic groups on their surface and
    the quaternary amine ligand, and the lipid envelope that XMuLV carries and MVM lacks takes no
    part in that attraction.
- id: PCR-008-R05
  role: cross_step_credit
  section: Executive summary
  quote: The remainder comes from low-pH inactivation (PCR-006) and small-virus retentive
    filtration (PCR-009), and no part of the cumulative claim rests on this step alone.
- id: PCR-008-R06
  role: deviation_disposition
  section: Executive summary
  quote: One of them established that the load material used in the first execution of both designs
    was not representative of the routine process, and both designs were invalidated and
    re-executed in full on a requalified load
- id: PCR-008-R07
  role: bounded_conclusion
  section: Executive summary
  quote: The antibody carries a net positive charge at the load pH and is not retained, and no
    factor changed step yield over the ranges studied.
- id: PCR-008-R08
  role: deferral
  section: Executive summary
  quote: The outcomes summarized here roll up into the master report PCMR-001.
- id: PCR-008-R09
  role: mechanistic_warrant
  section: Mechanistic interpretation
  quote: A species that carries more negative charge at a high load pH holds its place through a
    larger rise in ionic strength than a weakly charged one
- id: PCR-008-R10
  role: mechanistic_warrant
  section: Mechanistic interpretation
  quote: A fraction of the host cell protein population is held weakly enough for the wash to
    displace it, and raising the conductivity of that wash raises the fraction displaced.
- id: PCR-008-R11
  role: claim
  section: 'Screening: factor effects'
  supported_by:
  - PCR-008-R09
  - PCR-008-R10
  quote: Moving load pH across its range binds about as much host cell protein as moving the buffer
    conductivity across its own range releases.
- id: PCR-008-R12
  role: justification
  section: Response-surface models
  quote: The residuals of both models scatter about zero with no trend against the predicted value,
    the quantile plots are close to linear, and the predicted values track the measured ones across
    the whole range of the response.
- id: PCR-008-R13
  role: hedge
  section: Response-surface models
  quote: and it says that a run deleted from the design is predicted with appreciably more error
    than the fit within the design suggests
- id: PCR-008-R14
  role: hedge
  section: Centre-point performance and reproducibility
  quote: The host cell protein assay carries an intermediate precision of 9.5 % and accounts for
    about 40.0% of the variance of a result, so the process contribution to the observed spread is
    smaller than the total.
- id: PCR-008-R15
  role: bounded_conclusion
  section: Design space
  quote: It is defined on the scale-down model, and design space boundaries are not confirmed at
    commercial scale at the edges of the ranges.
- id: PCR-008-R16
  role: claim
  section: Proven acceptable ranges
  quote: The second analysis therefore excludes part of the normal operating range for these two
    parameters.
- id: PCR-008-R17
  role: bounded_conclusion
  section: Proven acceptable ranges
  bounds: PCR-008-R16
  quote: Three things bound what that exclusion means.
- id: PCR-008-R18
  role: cross_step_credit
  section: Contribution to the control strategy
  quote: Residual DNA and leached Protein A are cleared at this step and at the two chromatographic
    steps before it, and are tested on the drug substance.
- id: PCR-008-R19
  role: deferral
  section: Contribution to the control strategy
  quote: Attributes that this step does not control are controlled elsewhere and are named here so
    that the strategy can be read as a whole.
- id: PCR-008-R20
  role: deviation_disposition
  section: DEV-008-01 — non-representative load in the first execution
  quote: Both designs were declared invalid for the definition of the operating region and were
    re-executed in full on requalified, representative material
- id: PCR-008-R21
  role: justification
  section: DEV-008-02 — permissive pool collection set-point
  quote: An estimated effect is a difference between runs, and a shift shared by all of them
    cancels out of every difference
- id: PCR-008-R22
  role: restatement
  section: Conclusions
  restates: PCR-008-R00
  quote: Of the characterized region, 85.6% meets every criterion the step is judged against, and
    pool host cell protein is the attribute that bounds it.
- id: PCR-008-R23
  role: bounded_conclusion
  section: Conclusions
  quote: The anion exchange step was characterized on a qualified scale-down model over ranges wider
    than its normal operating ranges.
- id: PCR-008-R24
  role: deviation_disposition
  section: DEV-008-03 — equilibration and wash-1 buffer released below its pH range
  quote: The run was retained in the screening analysis and the deviation is closed as retained.
