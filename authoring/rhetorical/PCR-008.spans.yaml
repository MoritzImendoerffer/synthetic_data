# Rhetorical / argument-structure spans for PCR-008 (Anion Exchange Chromatography (Step 8) PC report).
#
# Re-curated 2026-10-11, work unit 2026-10-08_01_rev2-campaign, against the final Version 2.0 text of
# pc_package/PCR-008_aex.qmd (rendered .docx of 2026-10-11), in the same pass as the Version 2.0 annex builder
# pc_package/annex_builders/pcr_008.py (procedure ANNEX-A-DOCUMENT.md, rule 7).
#
# The previous curation (2026-08-20) quoted the Version 1.0 text, and none of its 25 spans appears in the
# Version 2.0 document: the report was rewritten under INV-001 and INV-002 (criteria set before the data, the
# augmentation and the model selection, pool host cell protein on the log scale, the verification of the
# platform worst case that widened two upstream criteria, the region now bounded by MVM clearance and not by
# host cell protein, the record of study events and discrepancies from the plan). No span of that curation is
# carried over, and the ids are assigned afresh, in the order in which the spans occur in the rendered
# document: an id names a span of this revision only.
#
# Conventions, as in every spans file of the corpus:
#   - every quote is a verbatim, whitespace-collapsed substring of the rendered .docx
#     (check_grounding.docx_text) and occurs there exactly once;
#   - no quote carries a value of an inline {python} expression, a cross-reference, a citation, or the
#     tokens "log10" and "R²", so the layer survives a reseed; a quote that would cross one stops short of it
#     (a clause slice);
#   - section is the document's own heading of the span;
#   - one role per span, by RHETORICAL_ANNEX.md. A mechanistic_warrant names a physical cause (which species,
#     which property, in which direction). A sentence that explains by process control or by statistics rather
#     than by chemistry is a justification.
#
# Relations (supported_by on a claim; bounds and restates as RHETORICAL_ANNEX.md defines them):
#   R04 claim supported_by R30, R31      pool host cell protein on the log scale
#   R05 claim supported_by R54, R55      every output met its criterion over the NOR
#   R11 claim supported_by R84, R86, R88 all five parameters WC-CPP
#   R62 claim supported_by R63, R64      directions as charge-based binding predicts
#   R75 claim supported_by R79           the bound replaced the platform value
#   R88 claim supported_by R87           flow rate classified WC-CPP
#   R91 claim supported_by R62           a charge-based flow-through polish
#   R92 claim supported_by R26           confidence greatest for pool host cell protein
#   R35 bounds R34; R56 bounds R55; R71 bounds R70; R76, R77, R78 bound R75
#   R96 restates R11; R97 restates R06
#
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
