  - id: PCR-008-R15
    section: "Design space"
    role: bounded_conclusion
    quote: "Three bounds apply to the design space claim."

  - id: PCR-008-R16
    section: "Proven acceptable ranges"
    role: claim
    quote: "Neither viral attribute is restricted anywhere"

  - id: PCR-008-R17
    section: "Proven acceptable ranges"
    role: bounded_conclusion
