spans:

  - id: PCR-008-R00
    section: "Executive summary"
    role: claim
    quote: "The step now provides a defined multivariate operating region over which viral
      clearance and pool purity both meet their criteria"

  - id: PCR-008-R01
    section: "Executive summary"
    role: problem_statement
    quote: "The step sets the cumulative clearance claim for minute virus of mice (MVM)"

  - id: PCR-008-R02
    section: "Executive summary"
    role: claim
    quote: "all of them were classified as well-controlled critical process parameters (WC-CPP)"

  - id: PCR-008-R03
    section: "Parameter classification"
    role: claim
    quote: "No parameter at this step is classified as a critical process parameter, and none is
      classified as a key process parameter or a general process parameter"

  - id: PCR-008-R04
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Viral clearance behaves as a charge partitioning process, in which both model viruses
      are more strongly retained when they carry more negative charge and when fewer
      competing counter-ions are present"

  - id: PCR-008-R05
    section: "Executive summary"
    role: cross_step_credit
    quote: "the cumulative MVM claim also rests on small-virus retentive filtration and the
      cumulative XMuLV claim rests on the low-pH hold as well"

  - id: PCR-008-R06
    section: "Executive summary"
    role: deviation_disposition
    quote: "The most serious of them invalidated the first execution of both designs, because the
      load material carried an elevated acidic charge variant burden and was not
      representative of the commercial feed"

  - id: PCR-008-R07
    section: "Executive summary"
    role: bounded_conclusion
    quote: "None of the three altered a parameter classification or a boundary of the operating
      region"

  - id: PCR-008-R08
    section: "Executive summary"
    role: deferral
    quote: "contribution is consolidated with the rest of the train in PCMR-001"

  - id: PCR-008-R09
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "at a higher pH the weakly acidic species carry more negative charge and remain bound
      even when the wash conductivity is raised, which is why the two sets of contours
      converge"

  - id: PCR-008-R10
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Its governing parameter is the conductivity of the equilibration and wash-1 buffer and
      not the conductivity of the load"

  - id: PCR-008-R11
    section: "Screening: factor effects"
    role: claim
    quote: "Pool HCP is governed by two factors and by their interaction"
    supported_by: ["PCR-008-R09", "PCR-008-R10"]

  - id: PCR-008-R12
    section: "Response-surface models"
    role: justification
    quote: "because it is estimated with curvature in the model and on a design that supports it"

  - id: PCR-008-R13
    section: "Response-surface models"
    role: hedge
    quote: "which suggests a slight flattening of the surface at high pH without providing
      evidence for it"

  - id: PCR-008-R14
    section: "Centre-point performance and reproducibility"
    role: hedge
