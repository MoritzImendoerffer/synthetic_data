# Rhetorical / argument-structure spans for PCR-008 (Anion Exchange Chromatography (Step 8) PC report).
# Re-curated 2026-08-19 (work unit 2026-08-19_02_fifth-round-plan-then-batches) against the
# one-pass re-authored pc_package/PCR-008_aex.qmd, rendered to PCR-008_aex.docx. The document was
# not touched: this layer is annotation over the finished text, so every quote here was rewritten
# to the new prose and no sentence was written to fit a span.
# The previous curation (2026-08-18, converted from the ax_rhetorical_spans() builder) quoted the
# superseded text and every one of its 25 quotes failed. All 25 ids, roles and relations are kept;
# only the quotes and four section labels changed.
#
# Sections changed (the argument is in the same place, the heading is not):
#   PCR-008-R11  "Screening: factor effects" -> "Screening factor effects"
#   PCR-008-R20  "Non-representative load material in the first execution"
#                -> "DEV-008-01, non-representative load in the first execution"
#   PCR-008-R21  "Collection criterion on the descending edge"
#                -> "DEV-008-02, permissive pool collection set-point"
#   PCR-008-R24  "Equilibration and wash-1 buffer pH excursion"
#                -> "DEV-008-03, equilibration and wash buffer released below its pH range"
# Roles changed: none. Every role still has a sentence in the new text that plays it.
# Edges dropped: none. R11 supported_by [R09, R10], R22 restates R00 and R17 bounds R16 all hold
# in the new text: R09 and R10 are the mechanisms for the two factors and the interaction R11
# claims, R22 restates R00's "pool HCP constrains the region" in the conclusions, and R17 bounds
# R16 by saying a univariate range cannot express a two-parameter corner.
#
# mechanistic_warrant, checked against the rule in RHETORICAL_ANNEX.md — each of the three names a
# physical cause, not a category label:
#   R04  acidic virus surfaces binding the ligand by the same electrostatic mechanism as the
#        acidic host cell proteins, which is why both viruses depend on load pH;
#   R09  at low pH the bound population carries little net negative charge, so a rise in ionic
#        strength displaces it more readily;
#   R10  the equilibration and wash buffer raises the ionic strength in the bed, shields the
#        electrostatic interaction and releases weakly bound species into the pool.
# The two frames flagged in docs/results/2026-08-18-track-d-stopped.md §5.6 are gone: the old R04
# ("Viral clearance behaves as a charge partitioning process") and the old R10 ("Its governing
# parameter is the conductivity of the equilibration and wash-1 buffer") named a category and a
# parameter where a cause belongs.
#
# Quotes are verbatim, whitespace-collapsed substrings of the rendered PCR-008_aex.docx under BOTH
# extractors (pc_package/check_grounding.docx_text and build_rhetorical_annex.doc_text), which
# differ only in sub/superscripts — so no quote carries "log10" or "R2" from a table. Digits are
# avoided except in R02, R13 and R22, where the section's only sentence playing the role carries
# them. No quote crosses a `{python}` inline expression, a @ref, a citation or bold markup.
# section_id: the flat per-document form the Python builder used, kept from the conversion.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-008
section_id: PCR-008_sec_rhet
spans:

  - id: PCR-008-R00
    section: "Executive summary"
    role: claim
    quote: "Pool HCP is the response that constrains the region and the viral responses reject
      none of it."

  - id: PCR-008-R01
    section: "Executive summary"
    role: problem_statement
    quote: "The normal operating ranges are not fully covered."

  - id: PCR-008-R02
    section: "Executive summary"
    role: claim
    quote: "All 5 parameters were classified as well controlled critical process parameters."

  - id: PCR-008-R03
    section: "Parameter classification"
    role: claim
    quote: "The step has no key process parameter and no general process parameter."

  - id: PCR-008-R04
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Both model viruses carry acidic surfaces and bind by the same electrostatic mechanism
      as the acidic host cell proteins, so the load pH dependence is expected and is nearly
      identical for the two viruses."

  - id: PCR-008-R05
    section: "Executive summary"
    role: cross_step_credit
    quote: "The step is the sole contributor to the MVM clearance claim other than virus
      filtration."

  - id: PCR-008-R06
    section: "Executive summary"
    role: deviation_disposition
    quote: "One of them invalidated the first execution of both designs, which were re-executed in
      full on a requalified load."

  - id: PCR-008-R07
    section: "Executive summary"
    role: bounded_conclusion
    quote: "Protein load carried no effect on any response over the range studied, and the
      univariate assessment of operating flow rate identified none over its range."

  - id: PCR-008-R08
    section: "Executive summary"
    role: deferral
    quote: "These outcomes roll up into PCMR-001."

  - id: PCR-008-R09
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "At low pH the bound population is dominated by species whose net negative charge is
      small, and a weakly held species is displaced by a given increase in ionic strength more
      readily than a strongly held one."

  - id: PCR-008-R10
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Raising the conductivity of the equilibration and wash buffer raises the ionic strength
      in the bed, which shields the electrostatic interaction and releases the more weakly bound
      species into the pool."

  - id: PCR-008-R11
    section: "Screening factor effects"
    role: claim
    quote: "Pool HCP was affected by the equilibration and wash conductivity, by load pH, and by
      the interaction between them."
    supported_by: ["PCR-008-R09", "PCR-008-R10"]

  - id: PCR-008-R12
    section: "Response-surface models"
    role: justification
    quote: "In each case the standardized residuals scatter without pattern against the predicted
      value, the normal quantile plot is close to linear, and the actual values track the predicted
      values along the identity line."

  - id: PCR-008-R13
    section: "Response-surface models"
    role: hedge
    quote: "Its one significant interaction, load pH with protein load at 0.19 log10 per coded unit
      (p = 0.030), is smaller than the centre-point standard deviation of the titration and is not
      treated as a design constraint."

  - id: PCR-008-R14
    section: "Centre-point performance and reproducibility"
    role: hedge
    quote: "The consequence for the rest of this section is that an effect on pool HCP has to be
      large to be detected, and that a difference of a few tenths of a log in a viral response is
      not distinguishable from assay noise."

  - id: PCR-008-R15
    section: "Design space"
    role: bounded_conclusion
    quote: "Two bounds apply to the region as stated."

  - id: PCR-008-R16
    section: "Proven acceptable ranges"
    role: claim
    quote: "Pool HCP is the only attribute whose proven acceptable range is narrower than the
      characterization range."

  - id: PCR-008-R17
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "A univariate range answers what may be done with one parameter, and it cannot express
      the corner in which two parameters move together."
    bounds: "PCR-008-R16"

  - id: PCR-008-R18
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "Enveloped virus clearance is set principally by low-pH inactivation and is reported in
      PCR-006."

  - id: PCR-008-R19
    section: "Contribution to the control strategy"
    role: deferral
    quote: "The glycan attributes, the charge variants and the aggregate content of the drug
      substance are formed or reduced upstream and are reported in PCR-003 and PCR-007."

  - id: PCR-008-R20
    section: "DEV-008-01, non-representative load in the first execution"
    role: deviation_disposition
    quote: "Both designs were therefore invalidated for operating region definition and were
      re-executed in full on a requalified, representative cation exchange pool."

  - id: PCR-008-R21
    section: "DEV-008-02, permissive pool collection set-point"
    role: justification
    quote: "Pool host cell protein at the corrected set-point was consistent with the fitted
      surface after allowing for the removed trailing edge."

  - id: PCR-008-R22
    section: "Conclusions"
    role: restatement
    quote: "A design space has been defined over 86 % of the characterized region, bounded by pool
      host cell protein at the corner combining low load pH with high equilibration and wash
      conductivity."
    restates: "PCR-008-R00"

  - id: PCR-008-R23
    section: "Conclusions"
    role: bounded_conclusion
    quote: "The anion exchange step has been characterized on a qualified scale-down model over
      ranges at least twice the width of the intended control ranges."

  - id: PCR-008-R24
    section: "DEV-008-03, equilibration and wash buffer released below its pH range"
    role: deviation_disposition
    quote: "The run was therefore retained in the analysis and the deviation was dispositioned as
      retained."
