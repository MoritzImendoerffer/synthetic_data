# Rhetorical / argument-structure spans for PCR-009 (Small-Virus Retentive Filtration (Step 9) PC report).
#
# Re-curated 2026-10-11, work unit 2026-10-08_01_rev2-campaign, against the final Version 2.0 text of
# pc_package/PCR-009_virus_filtration.qmd (rendered .docx of 2026-10-11), in the same pass as the Version 2.0
# annex builder pc_package/annex_builders/pcr_009.py (procedure ANNEX-A-DOCUMENT.md, rule 7).
#
# The previous curation (2026-08-19) quoted the Version 1.0 text, and none of its 37 spans appears in the
# Version 2.0 document: the report was rewritten under INV-001 and INV-002 (criteria set before the data,
# model selection, the selected MVM model failing the criterion on residuals and influential runs, XMuLV
# judged on its measured results, the record of study events and discrepancies from the plan). No span of
# that curation is carried over, and the ids are assigned afresh, in the order in which the spans occur in
# the rendered document: an id names a span of this revision only.
#
# Conventions, as in every spans file of the corpus:
#   - every quote is a verbatim, whitespace-collapsed substring of the rendered .docx
#     (check_grounding.docx_text) and occurs there exactly once;
#   - no quote carries a value of an inline {python} expression, a cross-reference, a citation, or the
#     tokens "log10" and "R²", so the layer survives a reseed; a quote that would cross one stops short of it
#     (a clause slice);
#   - section is the document's own heading of the span;
#   - one role per span, by RHETORICAL_ANNEX.md. A mechanistic_warrant names a physical cause (which species,
#     which property, in which direction).
#
# Relations (supported_by on a claim; bounds and restates as RHETORICAL_ANNEX.md defines them):
#   R01 claim supported_by R30           filtration volume the only parameter with a detected effect
#   R04 claim supported_by R50, R51      every output with a criterion met it across the NOR
#   R06 claim supported_by R59, R08      both parameters WC-CPP
#   R33 claim supported_by R32           the screening model identifies effects, the RSM predicts
#   R40 claim supported_by R39           the fall of MVM LRF with volume is what the mechanism predicts
#   R43 claim supported_by R39, R16      the claim is most at risk at the highest volume
#   R60 claim supported_by R59           filtration volume classified WC-CPP on margin and control
#   R63 claim supported_by R17           filtration is uninterrupted
#   R36 bounds R34; R49 bounds R46; R55 bounds R54
#   R61 restates R06; R67 restates R40; R72 restates R06
#
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
document_id: PCR-009
section_id: PCR-009_sec_rhet
spans:

  - id: PCR-009-R01
    section: "Executive summary"
    role: claim
    quote: "Filtration volume was the only parameter with a detected effect."
    supported_by: ["PCR-009-R30"]

  - id: PCR-009-R02
    section: "Executive summary"
    role: justification
    quote: "No term containing filtration pressure was significant for any output."

  - id: PCR-009-R03
    section: "Executive summary"
    role: problem_statement
    quote: "It fails the criterion on residuals and influential runs, because one run moves the fit more than that criterion allows."

  - id: PCR-009-R04
    section: "Executive summary"
    role: claim
    quote: "Each output with a criterion met its intermediate acceptance criterion across the normal operating range (NOR)."
    supported_by: ["PCR-009-R50", "PCR-009-R51"]

  - id: PCR-009-R05
    section: "Executive summary"
    role: hedge
    quote: "With run 5 deleted, the PAR of filtration volume and the design space would both reach the end of the range studied, while the judgement over the NOR and the terms of the selected model would not change."

  - id: PCR-009-R06
    section: "Executive summary"
    role: claim
    quote: "Both parameters were classified as well-controlled critical process parameters (WC-CPP)."
    supported_by: ["PCR-009-R59", "PCR-009-R08"]

  - id: PCR-009-R08
    section: "Executive summary"
    role: justification
    quote: "No effect of filtration pressure was detected, and its class follows the A-Mab case study and the scope of the viral clearance claim"

  - id: PCR-009-R09
    section: "Executive summary"
    role: deviation_disposition
    quote: "Every run concerned was retained in the analysis, as Version 1.0 recorded, and the record does not name the runs."

  - id: PCR-009-R10
    section: "Executive summary"
    role: deferral
    quote: "The results of this report roll up into the master report PCMR-001, which consolidates the cumulative viral clearance claim."

  - id: PCR-009-R11
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "The small virus retentive filtration step filters the flow-through pool of anion exchange through a membrane whose pore size distribution retains the parvoviruses while the antibody passes."

  - id: PCR-009-R12
    section: "Product and unit operation"
    role: cross_step_credit
    quote: "The clearance of the step is orthogonal to that of low-pH viral inactivation (Step 6) and anion exchange chromatography (Step 8), because it removes virus by size and not by inactivation or by binding"

  - id: PCR-009-R13
    section: "Changes in this revision"
    role: problem_statement
    quote: "INV-001 found that the criteria used to judge each step in the PAR analysis had been set after the data were seen and were in no approved protocol (INV-001 finding 1)."

  - id: PCR-009-R14
    section: "Changes in this revision"
    role: claim
    quote: "These PARs are withdrawn, because XMuLV LRF has no adequate model and therefore no PAR."

  - id: PCR-009-R15
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "As the membrane fouls with product and residual impurity, the flux shifts toward the least fouled and largest pores, and small virus can pass."

  - id: PCR-009-R16
    section: "Platform and prior-product knowledge"
    role: justification
    quote: "MVM retention is therefore expected to fall as the volume filtered per unit area rises, so the claim is most at risk at the maximum load."

  - id: PCR-009-R17
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "A low pressure or an interruption of flow lets virus held in the pore structure diffuse through."

  - id: PCR-009-R18
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "PCP-009 §4.3 reasoned that the load decides how much of the membrane is still open and the pressure how fast the filtrate crosses what is left."

  - id: PCR-009-R19
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "It is retained while the membrane is intact, so its clearance is expected not to depend on either parameter."

  - id: PCR-009-R20
    section: "Quality attributes in scope"
    role: cross_step_credit
    quote: "Low-pH viral inactivation makes no claim for MVM, because a parvovirus has no lipid envelope for low pH to disrupt."

  - id: PCR-009-R21
    section: "Risk-based prioritization and parameter selection"
    role: justification
    quote: "No parameter of the step was left out of the study on prior knowledge alone, because a viral safety claim is supported by product specific data even where the mechanism is well understood."

  - id: PCR-009-R22
    section: "Scale-down model and its qualification"
    role: problem_statement
    quote: "The comparison therefore rests on step yield alone."

  - id: PCR-009-R23
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "No output with a criterion therefore has a measured offset, and the judgements of MVM LRF, XMuLV LRF and fragments are made on the scale-down results under these assumptions."

  - id: PCR-009-R24
    section: "Analytical methods"
    role: hedge
    quote: "Whether any filtrate titre was below the limit of detection, which would make its LRF a lower bound, cannot be read from the record."

  - id: PCR-009-R25
    section: "Sampling plan"
    role: bounded_conclusion
    quote: "The log reduction therefore cannot be resolved against the volume filtered within a run, and the effect of filtration volume is estimated between runs only."

  - id: PCR-009-R30
