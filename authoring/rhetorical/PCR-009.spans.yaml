# Rhetorical / argument-structure spans for PCR-009 (Small-Virus Retentive Filtration (Step 9) PC report).
# Converted 2026-08-18 from the vf_rhetorical_spans() builder in pc_package/build_ground_truth.py
# (work unit 2026-08-18_02_register-track-d, TASK-001). The conversion was byte-identical:
# the annexes rebuilt with no diff, which is what proves it changed nothing.
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-009_virus_filtration.docx — so no quote may cross a `{python}` inline expression, a @ref, a
# citation or bold markup. A span whose quote is no longer in the document now FAILS the
# build (build_ground_truth.build_rhetorical_spans), where the Python builder emitted it
# regardless and left check_grounding to find it later.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
# What the layer is about: the spine of the report is adverse-first. The only resolved effect is
# the decline of MVM clearance with volumetric load, which is stated, mechanistically warranted,
# then bounded three ways — worst characterized corner, worst NOR corner, NOR-propagated lower
# band.
document_id: PCR-009
section_id: PCR-009_sec_rhet
spans:

  - id: PCR-009-R01
    section: "Executive summary"
    role: claim
    quote: "volumetric load is the only parameter whose effect on MVM clearance was resolved"
    supported_by: ["PCR-009-R08"]

  - id: PCR-009-R02
    section: "Executive summary"
    role: bounded_conclusion
    quote: "The trend is bounded by the acceptance criterion for the step."
    supported_by: ["PCR-009-R03"]
    bounds: "PCR-009-R01"

  - id: PCR-009-R03
    section: "Executive summary"
    role: justification
    quote: "At the worst corner of the characterized region, which is the highest load at the
      highest pressure"

  - id: PCR-009-R04
    section: "Executive summary"
    role: claim
    quote: "XMuLV clearance and step yield were robust to both parameters over the ranges studied."
    supported_by: ["PCR-009-R10"]

  - id: PCR-009-R05
    section: "Response-surface design"
    role: problem_statement
    quote: "The division of labour between the two designs needs to be stated plainly, because it
      is not the usual one."

  - id: PCR-009-R06
    section: "Response-surface design"
    role: claim
    quote: "The response-surface model is still the predictive model and the basis of the design
      space, for two reasons."
    supported_by: ["PCR-009-R07"]

  - id: PCR-009-R07
    section: "Response-surface design"
    role: justification
    quote: "It uses the axial runs to test whether the response is linear in load across the full
      range, and it carries a larger replicated centre and therefore a better estimate of
      pure error."

  - id: PCR-009-R08
    section: "Screening: factor effects"
    role: justification
    quote: "The load term is significant on its own, and that is the finding the screening study
      was run to produce."

  - id: PCR-009-R10
    section: "Screening: factor effects"
    role: justification
    quote: "Neither XMuLV clearance nor step yield gave a significant term"

  - id: PCR-009-R11
    section: "Response-surface models"
    role: claim
    quote: "Only the MVM model is adequate for prediction."
    supported_by: ["PCR-009-R12"]

  - id: PCR-009-R12
    section: "Response-surface models"
    role: justification
    quote: "The residuals show no trend against the predicted value and no funnel, the normal
      quantile plot is close to a straight line"

  - id: PCR-009-R14
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "Particles larger than the membrane retention rating are held back while the antibody
      monomer passes, so the mechanism does not depend on solution chemistry and is
      orthogonal to the mechanisms of the two other clearance steps."

  - id: PCR-009-R15
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "As filtration proceeds, protein and particulate matter from the load deposit within
      the membrane and progressively change that distribution, and the fraction of the load
      that finds a path through increases with the volume that has already been filtered."

  - id: PCR-009-R17
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "That is consistent with a size-based mechanism, in which pressure sets the flux and
      hence the duration of the run but does not alter the pore size distribution."

  - id: PCR-009-R18
    section: "DEV-009-02 — membrane lot flux below the vendor-typical value"
    role: mechanistic_warrant
    quote: "Permeability is set by the number and the size of the flow paths available and
      determines how fast the load passes, whereas retention is set by the tightest part of
      the same distribution and determines what is held back."

  - id: PCR-009-R19
    section: "Mechanistic interpretation"
    role: claim
    quote: "The practical consequence is that the operating region of this step is effectively
      one-dimensional."
    supported_by: ["PCR-009-R15", "PCR-009-R17"]

  - id: PCR-009-R20
    section: "Mechanistic interpretation"
    role: hedge
    quote: "it is stated here so that the design space in §6 is not read as more complex than the
      data support"

  - id: PCR-009-R21
    section: "Product and unit operation"
    role: cross_step_credit
    quote: "Low-pH inactivation (PCR-006) destroys the lipid envelope of enveloped viruses, and
      anion exchange (PCR-008) removes virus by charge-based binding in flow-through mode."

  - id: PCR-009-R23
    section: "Proven acceptable ranges"
    role: cross_step_credit
    quote: "Low-pH inactivation is credited with no MVM clearance at all, because a non-enveloped
      parvovirus is not inactivated by low pH."

  - id: PCR-009-R24
    section: "Design space"
    role: claim
    quote: "The design space of the step is the region of the characterized ranges over which the
      predicted MVM log reduction meets the required step contribution, and that region is
      the whole characterized rectangle."

  - id: PCR-009-R25
    section: "Design space"
    role: bounded_conclusion
    quote: "Three bounds apply to this claim."
    bounds: "PCR-009-R24"

  - id: PCR-009-R27
    section: "Proven acceptable ranges"
    role: problem_statement
    quote: "A viral-clearance attribute carries no drug-substance specification that a single step
      can be measured against, so the acceptance basis is derived below before any range is
      claimed."

  - id: PCR-009-R28
    section: "Proven acceptable ranges"
    role: claim
    quote: "this step does have an edge of failure inside the range it was studied over"
    supported_by: ["PCR-009-R29"]

  - id: PCR-009-R29
    section: "Proven acceptable ranges"
    role: justification
    quote: "The result that matters is the ceiling on filtration volume"

  - id: PCR-009-R30
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "Because the proven acceptable ranges were established against a step requirement that
      is itself derived from the clearance credited elsewhere, they are only valid while
      that credit holds."
    bounds: "PCR-009-R28"

  - id: PCR-009-R31
    section: "Parameter classification"
    role: claim
    quote: "Both characterized parameters are classified as well-controlled critical process
      parameters under SOP-4001."
    supported_by: ["PCR-009-R32"]

  - id: PCR-009-R32
    section: "Parameter classification"
    role: justification
    quote: "It is classified WC-CPP because the viral clearance claimed for this step was
      demonstrated under the conditions studied"

  - id: PCR-009-R33
    section: "Centre-point performance and reproducibility"
    role: hedge
    quote: "should be read as a lower bound on the true run-to-run variation"

  - id: PCR-009-R34
    section: "Centre-point performance and reproducibility"
    role: bounded_conclusion
    quote: "Any effect on MVM clearance smaller than about the assay precision is beyond the
      resolution of this study and is not claimed."

  - id: PCR-009-R35
    section: "Discussion"
    role: problem_statement
    quote: "The adverse finding deserves to be read in its own terms before its mitigation."

  - id: PCR-009-R36
    section: "Response-surface models"
    role: hedge
    quote: "and that a small pure error inflates the lack-of-fit ratio"

  - id: PCR-009-R38
    section: "Discussion"
    role: restatement
    quote: "Volumetric load reduces MVM clearance by progressively changing the flow-path
      distribution of the membrane"
    restates: "PCR-009-R01"

  - id: PCR-009-R39
    section: "Conclusions"
    role: restatement
    quote: "XMuLV clearance and step yield are robust to both parameters over the same ranges."
    restates: "PCR-009-R04"

  - id: PCR-009-R41
    section: "DEV-009-01 — filtration pressure excursion above the normal operating range"
    role: deviation_disposition
    quote: "The run was retained in the analysis. The corrective action was a revision of the pump
      ramp profile to approach the pressure set-point without overshoot"

  - id: PCR-009-R42
    section: "DEV-009-02 — membrane lot flux below the vendor-typical value"
    role: deviation_disposition
    quote: "The affected runs were retained. Three lines of evidence support that disposition."

  - id: PCR-009-R43
    section: "Contribution to the control strategy"
    role: deferral
    quote: "The modular claim is consolidated in PCMR-001, which is where the cumulative
      arithmetic and the orthogonality argument are presented for the process as a whole."

  - id: PCR-009-R45
    section: "Scale-down model and its qualification"
    role: deferral
    quote: "The qualification record is held under SOP-1001 and summarized in PCP-009."
