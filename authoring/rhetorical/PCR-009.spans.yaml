  - id: PCR-009-R39
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "As the membrane fouls, the flux shifts toward the largest pores, through which the parvovirus can pass, and the shift grows with the volume filtered per unit area."

  - id: PCR-009-R40
    section: "Mechanistic interpretation"
    role: claim
