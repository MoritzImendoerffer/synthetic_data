# Rhetorical / argument-structure spans for PCR-009 (Small-Virus Retentive Filtration (Step 9) PC report).
# Re-curated 2026-08-19, work unit 2026-08-19_02_fifth-round-plan-then-batches, against the
# one-pass re-authored PCR-009. The previous curation (converted 2026-08-18 from the
# vf_rhetorical_spans() builder in pc_package/build_ground_truth.py) quoted the OLD text and no
# span survived the re-author, so every quote below was written from the rendered
# pc_package/PCR-009_virus_filtration.docx. The 37 ids and the relation structure are unchanged.
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-009_virus_filtration.docx — so no quote may cross a `{python}` inline expression, a @ref, a
# citation or bold markup. A span whose quote is no longer in the document now FAILS the
# build (build_ground_truth.build_rhetorical_spans), where the Python builder emitted it
# regardless and left check_grounding to find it later.
# Quotes were checked against BOTH extractors (check_grounding.docx_text and
# build_rhetorical_annex.doc_text). The two differ on this document only where the rendered
# text carries R² or log₁₀, so no quote here contains either.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
# What the layer is about: the spine of the report is unchanged and still adverse-first. The only
# resolved effect is the fall of MVM retention with the volume filtered per unit area, which is
# stated in the summary, warranted from the fouling mechanism, and then bounded twice — by the
# design-space region and by the proven acceptable range under pressure propagation.
#
# Sections that moved (the re-authored document renamed or relocated the argument):
#   R05  Response-surface design            -> Screening design
#        (the new §4.3 states the design only; the caution the role marks is now the screening
#         design's inability to separate curvature)
#   R06  Response-surface design            -> Statistical methods
#        (the framing claim "the response-surface model is the predictive model" now lives in §3.5)
#   R07  Response-surface design            -> Screening effects
#        (its support is now the closing sentence of §5.2)
#   R08  Screening: factor effects          -> Screening effects   (heading renamed)
#   R10  Screening: factor effects          -> Screening effects   (heading renamed)
#   R18  DEV-009-02 — membrane lot flux below the vendor-typical value
#                                           -> Membrane lot flux below the vendor typical value (DEV-009-02)
#   R23  Proven acceptable ranges           -> Quality attributes in scope
#        (the cross-step credit is now stated in §2.2, against the register)
#   R27  Proven acceptable ranges           -> Acceptance basis     (new subsection §7.1)
#   R28  Proven acceptable ranges           -> Ranges               (new subsection §7.2)
#   R29  Proven acceptable ranges           -> Ranges
#   R30  Proven acceptable ranges           -> Ranges
#   R41  DEV-009-01 — filtration pressure excursion above the normal operating range
#                                           -> Transient filtration pressure excursion (DEV-009-01)
#   R42  DEV-009-02 — membrane lot flux below the vendor-typical value
#                                           -> Membrane lot flux below the vendor typical value (DEV-009-02)
#
# Roles: no role changed. Every role in the previous curation is realized by a sentence of the
# new text.
#
# Edges: one dropped. R19 was supported_by [R15, R17]; it is now supported_by [R15] only.
# In the new §5.4 the pressure warrant (R17) describes a loss of retention at BOTH ends of the
# pressure range, produced by diffusion at low flux and by compression of the fouling layer at
# high flux, and the text says explicitly that the pressure dependence is consistent with the
# mechanism rather than demonstrated. It therefore no longer supports R19's claim that retention
# falls with the load and that the load is what bounds the clearance claim. Every other edge is
# carried over and its target still supports its claim in the new text.
#
# mechanistic_warrant spans: all four name a physical cause and a direction, not a category label.
#   R14 — the membrane's pore size distribution retains the parvoviruses while the antibody passes.
#   R15 — product and residual impurity accumulate in the membrane, so the flux redistributes
#         toward the least fouled and largest pores, which is the path a particle of that size takes.
#   R17 — at low pressure the low flux gives virus in the pore structure time to diffuse through;
#         at high pressure the fouling layer is compressed and the flux through the largest pores rises.
#   R18 — permeability of the lot sets how long the same load takes at the same pressure, and
#         retention depends on the load the membrane has seen and not on the rate at which it saw it.
document_id: PCR-009
section_id: PCR-009_sec_rhet
spans:

  - id: PCR-009-R01
    section: "Executive summary"
    role: claim
    quote: "The filtration volume is the only parameter with a demonstrated effect on virus
      retention."
    supported_by: ["PCR-009-R08"]

  - id: PCR-009-R02
    section: "Executive summary"
    role: bounded_conclusion
    quote: "The proven acceptable range for the filtration volume ends at 97.2 L/m2 when the
      filtration pressure varies within its normal operating range."
    supported_by: ["PCR-009-R03"]
    bounds: "PCR-009-R01"

  - id: PCR-009-R03
    section: "Executive summary"
    role: justification
    quote: "Across the characterized range of 50 to 140 L/m2 the predicted MVM LRF falls by 1.76
      log at the set-point pressure"

  - id: PCR-009-R04
    section: "Executive summary"
    role: claim
    quote: "Neither XMuLV LRF nor step yield has an active factor over the ranges studied."
    supported_by: ["PCR-009-R10"]

  - id: PCR-009-R05
    section: "Screening design"
    role: problem_statement
    quote: "The design is not able to separate curvature from either factor."

  - id: PCR-009-R06
    section: "Statistical methods"
    role: claim
    quote: "The response-surface model is the predictive model and is the basis of the design
      space and of the proven acceptable ranges."
    supported_by: ["PCR-009-R07"]

  - id: PCR-009-R07
    section: "Screening effects"
    role: justification
    quote: "It does not resolve curvature, and the effect magnitudes it returns are refined by
      the response-surface model reported next."

  - id: PCR-009-R08
    section: "Screening effects"
    role: justification
    quote: "The effect is a loss of 1.61 log across the characterized range of the load, at
      p = 0.027."

  - id: PCR-009-R10
    section: "Screening effects"
    role: justification
    quote: "No factor had a significant effect on XMuLV LRF or on step yield."

  - id: PCR-009-R11
    section: "Response-surface models"
    role: claim
    quote: "The model for MVM LRF is adequate."
    supported_by: ["PCR-009-R12"]

  - id: PCR-009-R12
    section: "Response-surface models"
    role: justification
    quote: "The residuals are unstructured against the predicted value, the normal plot is close
      to linear, and the actual against predicted plot shows no run driving the fit."

  - id: PCR-009-R14
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "The membrane has a pore size distribution chosen to retain the smallest viruses of
      concern, the parvoviruses, while the antibody passes freely into the filtrate."

  - id: PCR-009-R15
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "As product and residual impurity accumulate on and within the membrane, the flux
      redistributes toward the least fouled and largest pores, which are the pores through
      which a particle of that size can pass."

  - id: PCR-009-R17
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "At low pressure the flux is low and virus held within the pore structure has time to
      diffuse through the membrane, and at high pressure the fouling layer is compressed and
      the flux through the largest pores rises."

  - id: PCR-009-R18
    section: "Membrane lot flux below the vendor typical value (DEV-009-02)"
    role: mechanistic_warrant
    quote: "A less permeable lot therefore filters the same load at the same pressure over a
      longer time. Retention depends on the load the membrane has seen and not on how quickly
      it saw it"

  - id: PCR-009-R19
    section: "Mechanistic interpretation"
    role: claim
    quote: "Retention therefore falls as the load rises, and the load is the parameter that
      bounds the clearance claim."
    supported_by: ["PCR-009-R15"]

  - id: PCR-009-R20
    section: "Mechanistic interpretation"
    role: hedge
    quote: "The pressure behaviour is the one part of the surface that the data support only
      weakly."

  - id: PCR-009-R21
    section: "Product and unit operation"
    role: cross_step_credit
    quote: "Viral safety is claimed modularly from three orthogonal steps, and no claim is made
      here for the low pH hold or for the anion exchange step, whose contributions are
      reported in PCR-006 and PCR-008."

  - id: PCR-009-R23
    section: "Quality attributes in scope"
    role: cross_step_credit
    quote: "The register records MVM clearance against the anion exchange step and XMuLV
      clearance against the low pH inactivation step, which are the steps that carry the
      cumulative claim."

  - id: PCR-009-R24
    section: "Design space"
    role: claim
    quote: "The design space of this step is the region of the filtration volume and the
      filtration pressure over which both governed attributes meet the log reduction credited
      to the step."

  - id: PCR-009-R25
    section: "Design space"
    role: bounded_conclusion
    quote: "Two bounds apply to the region as stated here."
    bounds: "PCR-009-R24"

  - id: PCR-009-R27
    section: "Acceptance basis"
    role: problem_statement
    quote: "The criterion this step is judged against is not the drug substance requirement."

  - id: PCR-009-R28
    section: "Ranges"
    role: claim
    quote: "The routine maximum load is therefore not supported over the whole of the normal
      operating range once the pressure is allowed to vary within its own"
    supported_by: ["PCR-009-R29"]

  - id: PCR-009-R29
    section: "Ranges"
    role: justification
    quote: "Under the second analysis the proven acceptable range of the filtration volume ends
      at 97.2 L/m2, below the upper limit of the normal operating range of 105 L/m2."

  - id: PCR-009-R30
    section: "Ranges"
    role: bounded_conclusion
    quote: "The proven acceptable ranges are one dimensional sections through the region
      described in §6, and the multivariate region is the statement of record where the two
      disagree."
    bounds: "PCR-009-R28"

  - id: PCR-009-R31
    section: "Parameter classification"
    role: claim
    quote: "Both parameters of the step were classified under SOP-4001 from the effects
      demonstrated in §5 and the ability of the commercial equipment to hold them."
    supported_by: ["PCR-009-R32"]

  - id: PCR-009-R32
    section: "Parameter classification"
    role: justification
    quote: "The load has a demonstrated effect on MVM clearance, which is a very high criticality
      attribute, and it is the parameter that bounds the clearance claim."

  - id: PCR-009-R33
    section: "Centre-point performance and reproducibility"
    role: hedge
    quote: "The spread of both virus responses is dominated by the infectivity assays rather than
      by the filtration"

  - id: PCR-009-R34
    section: "Centre-point performance and reproducibility"
    role: bounded_conclusion
    quote: "The difference is within what three and four replicates of an infectivity assay can
      resolve"

  - id: PCR-009-R35
    section: "Discussion"
    role: problem_statement
    quote: "The limit of that argument is that a spiking study cannot be run at commercial scale"

  - id: PCR-009-R36
    section: "Response-surface models"
    role: hedge
    quote: "The margin is not large, and the pure error it is tested against rests on 3 degrees
      of freedom."

  - id: PCR-009-R38
    section: "Discussion"
    role: restatement
    quote: "Retention of the parvovirus falls as the volume filtered per unit area rises, because
      fouling moves a growing share of the flow onto the largest pores of the membrane."
    restates: "PCR-009-R01"

  - id: PCR-009-R39
    section: "Conclusions"
    role: restatement
    quote: "XMuLV clearance and step yield are robust across the whole characterized region."
    restates: "PCR-009-R04"

  - id: PCR-009-R41
    section: "Transient filtration pressure excursion (DEV-009-01)"
    role: deviation_disposition
    quote: "The run was therefore retained and the data are included in the analysis."

  - id: PCR-009-R42
    section: "Membrane lot flux below the vendor typical value (DEV-009-02)"
    role: deviation_disposition
    quote: "The lot was used, the runs executed on it were retained, and the responses were
      measured under AMV-3018 and AMV-3017 as for every other run."

  - id: PCR-009-R43
    section: "Contribution to the control strategy"
    role: deferral
    quote: "The contribution of this step is consolidated with the rest of the train in PCMR-001."

  - id: PCR-009-R45
    section: "Scale-down model and its qualification"
    role: deferral
    quote: "The study was executed on a small scale spiking model of the commercial filtration
      step, qualified under SOP-1001."
