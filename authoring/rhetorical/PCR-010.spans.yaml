# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-010_ufdf.docx — so no quote may cross a `{python}` inline expression, a @ref, a
# citation or bold markup. A span whose quote is no longer in the document now FAILS the
# build (build_ground_truth.build_rhetorical_spans), where the Python builder emitted it
# regardless and left check_grounding to find it later.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
# What the layer is about: the argument of a non-DoE step that forms and clears nothing is mostly
# about what is NOT claimed — no design space (with the reason), formulation characterization
# DEFERRED and not omitted (with its location named), and KPP classification precisely because no
# CQA is at stake.
document_id: PCR-010
section_id: PCR-010_sec_rhet
spans:

  - id: PCR-010-R00
    section: "Executive summary"
    role: claim
    quote: "It takes no viral clearance credit, it takes no impurity clearance credit, and it does
      not characterize the formulation."
    supported_by: ["PCR-010-R01", "PCR-010-R02"]

  - id: PCR-010-R01
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "The membrane retains monomer and aggregated forms alike, so no size variant is
      separated, and no charge-based or affinity-based mechanism operates, so no charge
      variant and no glycosylation variant is separated either."

  - id: PCR-010-R02
    section: "Executive summary"
    role: deferral
    quote: "Formulation composition and the stability of A-Mab in it are established in the drug
      product programme, outside the drug substance transfer scope defined in PTP-001."

  - id: PCR-010-R04
    section: "Operating ranges and proven acceptable ranges"
    role: claim
    quote: "This step has no design space."
    supported_by: ["PCR-010-R05", "PCR-010-R06"]

  - id: PCR-010-R05
    section: "Operating ranges and proven acceptable ranges"
    role: justification
    quote: "The characterization was univariate, so what the data support is a proven acceptable
      range for each parameter and not a multivariate region in three parameters"

  - id: PCR-010-R06
    section: "Operating ranges and proven acceptable ranges"
    role: justification
    quote: "The substitution follows from the risk-based study assignment in RA-001 (§2.3), and it
      does not follow from an incomplete study."

  - id: PCR-010-R08
    section: "Risk-based prioritization and parameter selection"
    role: problem_statement
    quote: "No interaction between the three parameters has been quantified, so the ranges in §6
      are single-parameter ranges and not a multivariate region."

  - id: PCR-010-R09
    section: "Operating ranges and proven acceptable ranges"
    role: bounded_conclusion
    quote: "Three bounds apply to these ranges."
    bounds: "PCR-010-R10"

  - id: PCR-010-R10
    section: "Operating ranges and proven acceptable ranges"
    role: claim
    quote: "The proven acceptable range of each parameter is its characterization range"

  - id: PCR-010-R11
    section: "Operating ranges and proven acceptable ranges"
    role: bounded_conclusion
    quote: "They are single-parameter ranges, so simultaneous movement of two parameters to
      opposite edges is not covered by them."
    bounds: "PCR-010-R10"

  - id: PCR-010-R12
    section: "Discussion"
    role: deferral
    quote: "Formulation characterization is deferred and not omitted."

  - id: PCR-010-R14
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "for a species that passes the membrane freely the residual fraction falls
      exponentially with the diavolume count"

  - id: PCR-010-R15
    section: "Concentration and buffer exchange"
    role: claim
    quote: "Buffer exchange is complete at the low edge of the diavolume range."
    supported_by: ["PCR-010-R14"]

  - id: PCR-010-R16
    section: "Concentration and buffer exchange"
    role: bounded_conclusion
    quote: "Two bounds apply to that calculation, and neither of them is removed by the data."
    bounds: "PCR-010-R15"

  - id: PCR-010-R17
    section: "Concentration and buffer exchange"
    role: hedge
    quote: "the calculation is the design basis for the diavolume set-point and is not the batch
      acceptance test"

  - id: PCR-010-R19
    section: "Quality attributes in scope"
    role: cross_step_credit
    quote: "the credit for them belongs to PCR-005, PCR-007 and PCR-008, and the viral clearance
      claims belong to PCR-006, PCR-008 and PCR-009"

  - id: PCR-010-R20
    section: "Step yield and the process mass balance"
    role: claim
    quote: "This is the last step of the drug substance train, so the mass balance closes here."
    supported_by: ["PCR-010-R21"]

  - id: PCR-010-R21
    section: "Step yield and the process mass balance"
    role: justification
    quote: "The loss is attributed to product held in the membrane system and the transfer lines
      after the recovery flush, and that attribution is supported by the investigation of
      DEV-010-02"

  - id: PCR-010-R23
    section: "Scale-down model and its qualification"
    role: mechanistic_warrant
    quote: "Hold-up volume does not scale in proportion to membrane area, and hold-up is the
      dominant term in the step loss, so the model reproduces the commercial recovery less
      faithfully than it reproduces the other two outcomes."

  - id: PCR-010-R24
    section: "Discussion"
    role: claim
    quote: "the model predicts commercial step yield with less confidence than it predicts
      concentration and buffer exchange"
    supported_by: ["PCR-010-R21", "PCR-010-R23"]

  - id: PCR-010-R25
    section: "Discussion"
    role: bounded_conclusion
    quote: "The concentration and exchange claims do not depend on hold-up and are unaffected by
      this limitation."
    bounds: "PCR-010-R24"

  - id: PCR-010-R26
    section: "Parameter classification"
    role: claim
    quote: "The final drug substance concentration is a key process parameter, and it is the
      deliverable of the step, so a value away from target is a process performance failure
      and not a quality failure."
    supported_by: ["PCR-010-R27"]

  - id: PCR-010-R27
    section: "Discussion"
    role: justification
    quote: "because a step that neither forms nor clears a quality attribute cannot hold a
      critical process parameter under the classification rule in SOP-4001"

  - id: PCR-010-R28
    section: "Process capability and robustness"
    role: hedge
    quote: "Neither figure is evidence about this step beyond the absence of a contribution from
      it."

  - id: PCR-010-R29
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "it belongs to the cumulative parvovirus clearance, which is credited to anion exchange
      and small-virus retentive filtration (PCR-008 and PCR-009)"

  - id: PCR-010-R31
    section: "DEV-010-01 Transmembrane-pressure excursion during concentration"
    role: deviation_disposition
    quote: "The run was retained and its data were used as recorded."

  - id: PCR-010-R32
    section: "DEV-010-02 Final concentration below target on one run"
    role: deviation_disposition
    quote: "The pool was concentrated further to the target and re-assayed by A280 (AMV-3019)
      before release, and the batch was dispositioned as conforming."

  - id: PCR-010-R34
    section: "Conclusions"
    role: restatement
    quote: "No design space, no clearance credit and no viral clearance claim is made for this
      step, and the formulation itself is characterized in the drug product programme."
    restates: "PCR-010-R00"

  - id: PCR-010-R36
    section: "Operating ranges and proven acceptable ranges"
    role: bounded_conclusion
    quote: "It was not executed as a single run, since the study was univariate, so it is
      identified here and it is not claimed as characterized."
    bounds: "PCR-010-R10"

  - id: PCR-010-R37
    section: "Contribution to the control strategy"
    role: claim
    quote: "What the step does not control matters as much to the assessor as what it does."
