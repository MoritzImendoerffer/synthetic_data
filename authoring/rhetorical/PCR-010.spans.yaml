# Rhetorical / argument-structure spans for PCR-010 (Ultrafiltration / Diafiltration (Step 10) PC report).
# Converted 2026-08-18 from the uf_rhetorical_spans() builder in pc_package/build_ground_truth.py
# (work unit 2026-08-18_02_register-track-d, TASK-001). The conversion was byte-identical:
# the annexes rebuilt with no diff, which is what proves it changed nothing.
#
# Re-curated 2026-08-19 (work unit 2026-08-19_02_fifth-round-plan-then-batches) against the
# one-pass re-authored PCR-010_ufdf.qmd and its rendered PCR-010_ufdf.docx. Every one of the 30
# quotes was rewritten: the re-author replaced the prose wholesale, so no old quote survived.
# The span ids are unchanged and all 30 spans are kept. No role was changed: the new text
# carries a sentence for every role the old layer used.
# Every quote is a verbatim, whitespace-collapsed substring of the rendered
# pc_package/PCR-010_ufdf.docx, checked against BOTH extractors (check_grounding.docx_text and
# build_rhetorical_annex.doc_text) — so no quote may cross a `{python}` inline expression, a
# @ref, a citation or bold markup. Number-free spans are preferred so a reseed cannot break
# grounding: no quote below contains a digit except inside the document identifiers PCR-008 and
# PCMR-001, and none contains R² / R2, which the two extractors render differently.
# section_id: the flat per-document form the Python builder used. PCR-003 carries no such
# key and keeps the per-section default. Kept only so the conversion moved no byte.
# No weak_claim spans: the planted weak-claim feature is retired (authoring/WEAK_CLAIMS.md).
#
# What the layer is about, in the re-authored document: the argument of a non-DoE step that
# forms and clears nothing is still mostly about what is NOT claimed — no design space (with
# the reason, now in its own Section 6), proven acceptable ranges that are the ranges studied
# and nothing wider (Section 7), and KPP classification precisely because no CQA is at stake.
# The one substantive shift is the scale-down limitation: the old text made it hold-up volume,
# the re-authored text makes it the number of pump passes and the shear history it carries.
#
# Sections that moved, because the argument moved in the re-authored document:
#   R02  Executive summary                         -> Contribution to the control strategy
#   R04  Operating ranges and proven acceptable ranges -> Operating ranges in place of a design space
#   R05  Operating ranges and proven acceptable ranges -> Operating ranges in place of a design space
#   R36  Operating ranges and proven acceptable ranges -> Operating ranges in place of a design space
#   R09  Operating ranges and proven acceptable ranges -> Proven acceptable ranges
#   R10  Operating ranges and proven acceptable ranges -> Proven acceptable ranges
#   R11  Operating ranges and proven acceptable ranges -> Proven acceptable ranges
#        (the old single section is now two: Section 6 argues that there is no design space and
#         Section 7 states the proven acceptable ranges; each span takes the one it sits in)
#   R06  Operating ranges and proven acceptable ranges -> Risk-based prioritization and parameter selection
#        (the "the absence follows from the risk-based assignment, not from an incomplete study"
#         reason is now made in Section 2.3, where the assignment is made)
#   R08  Risk-based prioritization and parameter selection -> Limitations of the design
#        (Section 2.3 no longer states the interaction gap; Section 4.3 does, and names the
#         physical route the two parameters share)
#   R15  Concentration and buffer exchange         -> Buffer exchange
#   R16  Concentration and buffer exchange         -> Buffer exchange
#   R17  Concentration and buffer exchange         -> Product quality across the step
#   R20  Step yield and the process mass balance   -> Concentration and mass balance
#   R21  Step yield and the process mass balance   -> Concentration and mass balance
#        (Section 5 is now subdivided into 5.1 concentration and mass balance, 5.2 buffer
#         exchange, 5.3 product quality and 5.4 the parameter responses; R17's calibration of
#         what the assay can resolve now sits in 5.3)
#   R27  Discussion                                -> Parameter classification
#        (the classification rule and its application are stated together in Section 9)
#   R34  Conclusions                               -> Product and unit operation
#        (the Conclusions no longer restate the no-credit position; Section 1.1 does, in
#         different words from the Executive summary claim it restates)
#   R31  DEV-010-01 Transmembrane-pressure excursion during concentration
#                                                  -> DEV-010-01, transmembrane pressure excursion during concentration
#   R32  DEV-010-02 Final concentration below target on one run
#                                                  -> DEV-010-02, final concentration below target
#        (the two deviation subsections were renamed by the re-author)
#
# One edge dropped: R24 was supported_by [R21, R23] and is now supported_by [R23] alone. In the
# old text the scale-down model's weak quantity was hold-up volume, so the mass-balance loss
# attribution (R21) bore directly on the model's fidelity. The re-authored text names a
# different weak quantity — the number of pump passes, which carries the shear history — and
# attributes the step loss to retentate held in the recirculation loop, the membrane housing
# and the tubing without tying that loss to scale. So the new R21 no longer supports R24, and
# the edge is dropped rather than re-pointed at a sentence that does not carry it. Every other
# edge survives: R00 <- [R01, R02], R04 <- [R05, R06], R15 <- [R14], R20 <- [R21],
# R26 <- [R27]; R09, R11 and R36 still bound R10, R16 still bounds R15, R25 still bounds R24,
# and R34 still restates R00.
#
# All three mechanistic_warrant quotes name a physical cause, the species involved and a
# direction, as RHETORICAL_ANNEX.md requires; none stands on a category label. R01 names the
# membrane pores passing buffer salts and small solutes while retaining the antibody. R14 names
# the fixed fraction of permeable species each diavolume removes and the exponential fall of
# residual process buffer components with the count. R23 names the recirculation volume of the
# small system, larger relative to its batch volume than the commercial skid's, driving a
# molecule through the pump more often at small scale.
document_id: PCR-010
section_id: PCR-010_sec_rhet
spans:

  - id: PCR-010-R00
    section: "Executive summary"
    role: claim
    quote: "It forms no quality attribute of the antibody, and no impurity clearance and no viral
      clearance are claimed for it."
    supported_by: ["PCR-010-R01", "PCR-010-R02"]

  - id: PCR-010-R01
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "The step is operated as tangential flow filtration on a membrane whose pores pass
      buffer salts and small solutes and retain the antibody."

  - id: PCR-010-R02
    section: "Contribution to the control strategy"
    role: deferral
    quote: "It contributes nothing to viral clearance, which is established at the low pH
      inactivation, anion exchange and small virus retentive filtration steps and consolidated in
      PCMR-001."

  - id: PCR-010-R04
    section: "Operating ranges in place of a design space"
    role: claim
    quote: "This step has no design space."
    supported_by: ["PCR-010-R05", "PCR-010-R06"]

  - id: PCR-010-R05
    section: "Operating ranges in place of a design space"
    role: justification
    quote: "This step governs no critical quality attribute and no such model was fitted"

  - id: PCR-010-R06
    section: "Risk-based prioritization and parameter selection"
    role: justification
    quote: "No parameter of this step reached the score at which a multivariate design is
      required, because none of them acts on an attribute the step forms or clears."

  - id: PCR-010-R08
    section: "Limitations of the design"
    role: problem_statement
    quote: "Two of the three parameters in this step act through the same physical route, which is
      the concentration and the shear at the membrane wall, so an interaction between
      transmembrane pressure and final concentration is physically plausible. The design does not
      resolve it, and this report makes no claim about it."

  - id: PCR-010-R09
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "The ranges are not extrapolated, so the claim stops at the edges stated above."
    bounds: "PCR-010-R10"

  - id: PCR-010-R10
    section: "Proven acceptable ranges"
    role: claim
    quote: "The proven acceptable range of each parameter is therefore the range over which it was
      assessed and over which the step delivered drug substance at target concentration with the
      buffer exchange complete"

  - id: PCR-010-R11
    section: "Proven acceptable ranges"
    role: bounded_conclusion
    quote: "Each range was demonstrated with the other two parameters at their set-points, so a
      combination of two parameters at their edges is not covered"
    bounds: "PCR-010-R10"

  - id: PCR-010-R12
    section: "Discussion"
    role: deferral
    quote: "Membrane life-cycle effects were not studied here, because the studies were run on
      membranes within their qualified use, and a change in membrane re-use is a change to the
      step."

  - id: PCR-010-R14
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Each diavolume removes a fixed fraction of the permeable species that remain, so
      residual process buffer components fall exponentially with the diavolume count, and the
      count is set so that they fall below what the formulation tolerates."

  - id: PCR-010-R15
    section: "Buffer exchange"
    role: claim
    quote: "The completeness of the buffer exchange follows from the diavolume count."
    supported_by: ["PCR-010-R14"]

  - id: PCR-010-R16
    section: "Buffer exchange"
    role: bounded_conclusion
    quote: "The relation assumes that the species passes the membrane freely and that the
      retentate volume is held constant during the diafiltration phase, and a species that is
      partly retained is removed more slowly than the relation predicts."
    bounds: "PCR-010-R15"

  - id: PCR-010-R17
    section: "Product quality across the step"
    role: hedge
    quote: "That difference is not resolvable, and it is spread across three operations rather
      than this one."

  - id: PCR-010-R19
    section: "Quality attributes in scope"
    role: cross_step_credit
    quote: "Aggregate carries high criticality and it is not reduced by any operation downstream
      of cation exchange, so any aggregate formed here reaches the drug substance."

  - id: PCR-010-R20
    section: "Concentration and mass balance"
    role: claim
    quote: "None of these routes alters the quality of the material that is recovered."
    supported_by: ["PCR-010-R21"]

  - id: PCR-010-R21
    section: "Concentration and mass balance"
    role: justification
    quote: "Retentate is held in the recirculation loop, the membrane housing and the tubing at
      the end of the operation"

  - id: PCR-010-R23
    section: "Scale-down model and its qualification"
    role: mechanistic_warrant
    quote: "The recirculation volume of a small system is larger relative to its batch volume than
      that of the commercial skid, so a molecule passes the pump more often at small scale than at
      commercial scale."

  - id: PCR-010-R24
    section: "Discussion"
    role: claim
    quote: "Confidence in the scale-down model is high for the quantities that govern the step and
      lower for one of them."
    supported_by: ["PCR-010-R23"]

  - id: PCR-010-R25
    section: "Discussion"
    role: bounded_conclusion
    quote: "The small system drives each molecule through the pump more often, so the aggregate
      measured at small scale bounds the commercial value from above"
    bounds: "PCR-010-R24"

  - id: PCR-010-R26
    section: "Parameter classification"
    role: claim
    quote: "No parameter of this step was classified as critical or as well-controlled critical,
      and none was classified as a general process parameter."
    supported_by: ["PCR-010-R27"]

  - id: PCR-010-R27
    section: "Parameter classification"
    role: justification
    quote: "A parameter is critical or well-controlled critical when its variability affects a
      critical quality attribute. None of these parameters does."

  - id: PCR-010-R28
    section: "Process capability and robustness"
    role: hedge
    quote: "Both figures are whole-process figures, in which every step contributes and every
      parameter varies inside its normal operating range, so neither is a property of this step
      alone."

  - id: PCR-010-R29
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "it is set by another step and reported in PCR-008. This step contributes nothing to
      it, and the consolidated position across all attributes is in PCMR-001."

  - id: PCR-010-R31
    section: "DEV-010-01, transmembrane pressure excursion during concentration"
    role: deviation_disposition
    quote: "The deviation was retained and the run was kept in the assessment."

  - id: PCR-010-R32
    section: "DEV-010-02, final concentration below target"
    role: deviation_disposition
    quote: "The additional period was short against the concentration phase it followed, and the
      drug substance from the run met the acceptance criterion for aggregate. The deviation was
      retained on that basis."

  - id: PCR-010-R34
    section: "Product and unit operation"
    role: restatement
    quote: "The step forms no quality attribute of the antibody. It removes no impurity that the
      control strategy credits, and no viral clearance is claimed for it."
    restates: "PCR-010-R00"

  - id: PCR-010-R36
    section: "Operating ranges in place of a design space"
    role: bounded_conclusion
    quote: "An excursion downward in either parameter is outside the region this study covers, and
      it requires its own assessment rather than a reference to this report."
    bounds: "PCR-010-R10"

  - id: PCR-010-R37
    section: "Contribution to the control strategy"
    role: claim
    quote: "Two things this step does not control should be stated."
