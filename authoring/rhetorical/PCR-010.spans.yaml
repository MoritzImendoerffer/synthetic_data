document_id: PCR-010
section_id: PCR-010_sec_rhet
spans:

  - id: PCR-010-R00
    section: "Executive summary"
    role: claim
    quote: "The step has no designed experiment."

  - id: PCR-010-R01
    section: "Executive summary"
    role: bounded_conclusion
    quote: "The proven acceptable range (PAR) of each parameter is therefore its range studied"

  - id: PCR-010-R02
    section: "Executive summary"
    role: problem_statement
    quote: "The A-Mab case study leaves UF/DF out, so no published source gave the size of this effect in advance."

  - id: PCR-010-R03
    section: "Executive summary"
    role: problem_statement
    quote: "PCMP-001 assumed that no step after cation exchange changes aggregate."

  - id: PCR-010-R04
    section: "Executive summary"
    role: mechanistic_warrant
    quote: "This step can only raise the acidic charge variants, by deamidation, so it moves them away from that limit."

  - id: PCR-010-R05
    section: "Executive summary"
    role: hedge
    quote: "so this report cannot confirm the simulated capability from its own results"

  - id: PCR-010-R06
    section: "Executive summary"
    role: deviation_disposition
    quote: "Neither changes a conclusion."

  - id: PCR-010-R07
    section: "Product and unit operation"
    role: mechanistic_warrant
    quote: "It can add to aggregate, which can form at the membrane wall and in the recirculation pump."

  - id: PCR-010-R08
    section: "Changes in this revision"
    role: hedge
    quote: "The study record holds no limit for what the formulation tolerates, and this version makes no such claim"

  - id: PCR-010-R09
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Each diavolume removes a fixed fraction of the permeable species that remain in the retentate."

  - id: PCR-010-R10
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "Aggregate can form at the wall, where the antibody is most concentrated, and in the pump, where cavitation, air-liquid interfaces and particles shed by the pump can start it."

  - id: PCR-010-R11
    section: "Platform and prior-product knowledge"
    role: hedge
    quote: "Within the normal operating ranges (NORs) the exposure is short, and the effects were expected to be small."

  - id: PCR-010-R12
    section: "Platform and prior-product knowledge"
    role: mechanistic_warrant
    quote: "It converts a neutral residue into a charged one, so it can only raise the acidic charge variants."

  - id: PCR-010-R13
    section: "Risk-based prioritization and parameter selection"
    role: mechanistic_warrant
    quote: "A higher final DS concentration raises the viscosity and the bulk concentration of the retentate, and both lower the limiting flux."

  - id: PCR-010-R14
    section: "Risk-based prioritization and parameter selection"
    role: problem_statement
    quote: "A study that varies one factor at a time cannot resolve such an interaction."

  - id: PCR-010-R15
    section: "Scale-down model and its qualification"
    role: mechanistic_warrant
    quote: "More antibody is therefore lost to hold-up, and more of it meets surfaces and air-liquid interfaces per gram processed."

  - id: PCR-010-R16
    section: "Scale-down model and its qualification"
    role: justification
    quote: "Both differences are in the direction that the larger hold-up predicts."

  - id: PCR-010-R17
    section: "Scale-down model and its qualification"
    role: hedge
    quote: "so this report uses the ends of the interval and not its inclusion of zero"

  - id: PCR-010-R18
    section: "Scale-down model and its qualification"
    role: bounded_conclusion
    quote: "so the model is qualified for aggregate under this approach"

  - id: PCR-010-R19
    section: "Scale-down model and its qualification"
    role: justification
    quote: "The two skids share their design and their membrane, so the hold-up and the surface that the antibody meets per gram, which cause the offsets, are expected to be alike."

  - id: PCR-010-R20
    section: "Scale-down model and its qualification"
    role: mechanistic_warrant
    quote: "That passage is a property of the membrane and of the species, so the fraction removed in each diavolume does not depend on scale."

  - id: PCR-010-R21
    section: "Sampling plan"
    role: problem_statement
    quote: "Without a load result the change in aggregate and in the acidic charge variants across the step cannot be calculated."

  - id: PCR-010-R22
    section: "Statistical methods"
    role: claim
    quote: "The criterion, and not the p-value, decides whether a range is acceptable."

  - id: PCR-010-R23
    section: "Univariate assessment"
    role: bounded_conclusion
    quote: "The effects, PARs and classes of this report rest on one parameter at a time."
    bounds: PCR-010-R01

  - id: PCR-010-R24
    section: "Aggregate"
    role: justification
    quote: "Under the rule of PCP-010 §5.3, a change larger than the pure error is not assay noise, so neither is attributed to the assay."

  - id: PCR-010-R25
    section: "Aggregate"
    role: hedge
    quote: "The data do not show that rise at the precision of the study, and an effect within the interval cannot be excluded."

  - id: PCR-010-R26
    section: "Acidic charge variants"
    role: cross_step_credit
    quote: "They are formed first in the production bioreactor, whose report PCR-003 characterizes them, and deamidation adds to them wherever the antibody is held in solution."

  - id: PCR-010-R27
    section: "Acidic charge variants"
    role: mechanistic_warrant
    quote: "Deamidation can only raise the acidic charge variants, so whatever the step adds moves them toward the upper limit"

  - id: PCR-010-R28
    section: "Buffer exchange"
    role: problem_statement
    quote: "The residual process buffer cannot stand in for the conductivity."

  - id: PCR-010-R29
    section: "Buffer exchange"
    role: justification
    quote: "It falls by a constant fraction with each diavolume, so it does not level off within any range that an assay can resolve."

  - id: PCR-010-R30
    section: "Buffer exchange"
    role: claim
    quote: "Objective (iii), to establish the number of diavolumes at which the retentate reaches the formulation buffer, is not met."
    supported_by: ["PCR-010-R28", "PCR-010-R29"]

  - id: PCR-010-R31
    section: "Mechanistic interpretation"
    role: hedge
    quote: "The rise of aggregate with the final DS concentration and with TMP is consistent with aggregate forming in the polarization layer at the membrane wall."

  - id: PCR-010-R32
    section: "Mechanistic interpretation"
    role: mechanistic_warrant
    quote: "Below the limiting flux TMP raises the concentration at the wall by driving more permeate through the membrane."

  - id: PCR-010-R33
    section: "Mechanistic interpretation"
    role: hedge
    quote: "The study did not measure where in the step aggregate forms, so this explanation is not tested."

  - id: PCR-010-R34
    section: "Design space"
    role: claim
    quote: "No design space is defined for UF/DF."
    supported_by: ["PCR-010-R35"]

  - id: PCR-010-R35
    section: "Design space"
    role: justification
    quote: "A study that varies one parameter at a time cannot define one, because it gives no result where two parameters are away from their set-points at the same time."

  - id: PCR-010-R36
    section: "Design space"
    role: bounded_conclusion
    quote: "These data support the movement of one parameter within its PAR, with the others at their set-points."
    bounds: PCR-010-R01

  - id: PCR-010-R37
    section: "Acceptance basis"
    role: claim
    quote: "This study shows that two parameters of UF/DF raise aggregate within their NORs."
    supported_by: ["PCR-010-R24"]

  - id: PCR-010-R38
    section: "Acceptance basis"
    role: bounded_conclusion
    quote: "The fit assumes that the parameters act independently"
    bounds: PCR-010-R37

  - id: PCR-010-R39
    section: "Results against the criteria"
    role: justification
    quote: "Every attribute result of every level met its criterion, so every level is acceptable."

  - id: PCR-010-R40
    section: "Proven acceptable ranges of the parameters"
    role: hedge
    quote: "The study cannot exclude an interaction, but one of that size is far outside the effects it measured."

  - id: PCR-010-R41
    section: "Process capability and robustness"
    role: hedge
    quote: "That bound covers the sampling of the simulation and not the uncertainty of the integrated process model."

  - id: PCR-010-R42
    section: "Process capability and robustness"
    role: cross_step_credit
    quote: "The attribute is formed in the production bioreactor, and its report PCR-003 gives the parameters that drive it and the controls that address them."

  - id: PCR-010-R43
    section: "Process capability and robustness"
    role: hedge
    quote: "This level is not a measured result."

  - id: PCR-010-R44
    section: "Parameter classification"
    role: claim
    quote: "TMP was classified as a KPP."
    supported_by: ["PCR-010-R45"]

  - id: PCR-010-R45
    section: "Parameter classification"
    role: justification
    quote: "This report judges an effect of that size too small to be practically relevant, and the KPP class of both TMP and the final DS concentration rests on that judgement."

  - id: PCR-010-R46
    section: "Contribution to the control strategy"
    role: cross_step_credit
    quote: "Fragments form by proteolytic clipping in culture and during the harvest hold (PCR-003, PCR-004), and slowly by hydrolysis of the hinge region in solution, and they are tested at release."

  - id: PCR-010-R47
    section: "Discussion"
    role: claim
    quote: "They still matter upstream."
    supported_by: ["PCR-010-R37"]

  - id: PCR-010-R48
    section: "Discussion"
    role: problem_statement
    quote: "The main scientific limitation is the univariate design, which cannot measure an interaction."

  - id: PCR-010-R49
    section: "Discussion"
    role: mechanistic_warrant
    quote: "TMP and the final DS concentration both act on the polarization layer at the membrane wall, so an interaction between them would raise aggregate most where both are high."

  - id: PCR-010-R50
    section: "Discussion"
    role: deferral
    quote: "PCMR-001 assesses this attribute across the whole process."

  - id: PCR-010-R51
    section: "Conclusions"
    role: restatement
    quote: "The bench-scale TFF model is qualified for aggregate"
    restates: PCR-010-R18

  - id: PCR-010-R52
    section: "DEV-010-01, transmembrane pressure above the NOR"
    role: deviation_disposition
    quote: "The investigation attributed it to a transient fouling of the membrane, and the run was retained."

  - id: PCR-010-R53
    section: "DEV-010-02, final concentration below target"
    role: deviation_disposition
    quote: "so no conclusion depends on the run"

  - id: PCR-010-R54
    section: "Discrepancies from the plan"
    role: justification
    quote: "No result for a parameter effect existed when it was made, so no conclusion rests on runs added after a result was known."
