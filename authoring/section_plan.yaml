investigation_report_models:
  applies_to: [INV-002]
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    The second QA investigation of the campaign, in the same form as INV-001 and shorter. Its
    subject is statistical: the Version 2.0 re-analysis applied the model-adequacy criteria of
    PCMP-001 §7.2 to every response-surface model that carries a criterion, and some full
    quadratic models failed the limit on overfitting. The investigation states the finding,
    its cause, the rule that decides the remedy of each failing model (stated before any new
    run), the sample-size calculation for the augmentations, the D-optimal designs, and the
    CAPA. It carries the sample-size calculation in full; the reports carry only their own
    additional runs and the re-evaluation. It does not report the results of the new runs: the
    reports do. It changes no acceptance criterion (the criteria were fixed at the closure of
    INV-001, from the planned designs). Everything is computed (model_adequacy.csv,
    augmentation_sample_size.csv, augmentation_plan.csv, doe_<step>_aug.csv) and the tables
    come from pc_package/tables.py.
  sections:
    - {id: summary, heading: "Summary", unnumbered: true, length_band: S,
       covers: "The finding, the classification, the cause in one sentence, the rule, the
                augmentations (which steps, how many runs) and the refits, and that no criterion
                changed."}
    - {id: event, heading: "Event description", length_band: S,
       covers: "When and how the re-analysis found the failing models (the trigger and dates),
                and the immediate action: no range set from a failing model."}
    - {id: scope, heading: "Scope", length_band: S,
       covers: "Every response-surface model with a criterion. Out of scope: the screening
                models (they identify effects and set no range), the criteria themselves
                (INV-001), the univariate studies."}
    - {id: finding, heading: "Finding", length_band: M,
       covers: "The models that fail (T.model_adequacy()): by how much, grouped as models with
                an effect that the design is too small for, and models of attributes with no
                effect within the range studied."}
    - {id: root_cause, heading: "Root cause", length_band: S,
       covers: "The full quadratic model has many terms for the planned designs; the Version 1.0
                plans set no adequacy criterion and so no check of design size against it;
                responses with no effect cannot meet the limit with a full quadratic at any
                practical size."}
    - {id: rule, heading: "Remedy and decision rule", length_band: M,
       covers: "The two remedies PCMP-001 §7.2 allows, and the rule that assigns them (config
                campaign.model_adequacy): augmentation for an attribute of the drug substance
                specification with an effect, a refit for every other model; viral clearance
                is not a drug substance test; no augmentation larger than the planned design.
                The refit procedure (hierarchical backward elimination at α, block kept). The
                measured-results basis for a response with no adequate model.
                T.adequacy_remedy()."}
    - {id: sample_size, heading: "Sample-size calculation", length_band: L,
       covers: "The method (simulation from the refit of the planned runs and its residual
                standard deviation; the planned model with a block term fitted to each simulated
                data set; assurance = share meeting §7.2; the target; the number of data sets;
                sizes in steps), the D-optimal augmentation of the face-centred design, and the
                results (T.sample_size()): runs needed per model, the size of each step's
                augmentation, the power of each effect at that size."}
    - {id: designs, heading: "Augmentation designs", length_band: M,
       covers: "Each augmentation (T.augmentation_design(step)): the points, the block, the study
                and its dates, the responses measured (viral clearance not), the randomized order."}
    - {id: impact, heading: "Impact assessment", length_band: M,
       covers: "Per report: which models change and how (augmented, refitted, judged on measured
                results); that no acceptance criterion changes; the discrepancies from the plan
                the augmentations are (discrepancy IDs); the consequence for any NOR conclusion
                that rested on a failing model, stated from the data."}
    - {id: capa, heading: "Corrective and preventive actions", length_band: S,
       covers: "The CAPA table (CAPA2): the augmentations and their re-evaluation, the refits,
                and the design-size check for future plans."}
    - {id: effectiveness, heading: "Effectiveness check", length_band: S,
       covers: "How and when the CAPA is verified effective (EFFECTIVENESS2)."}
    - {id: conclusion, heading: "Conclusion and closure", length_band: S,
       covers: "The classification confirmed, the CAPA status, closure."}

