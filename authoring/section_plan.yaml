# =====================================================================================
# section_plan.yaml — machine-readable section plans for the A-Mab PC corpus
# -------------------------------------------------------------------------------------
# One-pass authoring: a single agent writes a whole document in section order, holding
# it all in one context. This file is that agent's outline. It is BOUND to the agent
# alongside authoring/WRITING_GUIDE.md, authoring/out/<DOC>.brief.md (the grounded
# facts + helper inventory), authoring/REGISTER_EXEMPLAR.md (voice) and
# authoring/STORY_BIBLE.md (world canon).
#
# Seven document classes are planned here.
#
# Per unit operation (Steps 3-10):
#   report_doe     PCR-00N for a step WITH a DoE  (bioreactor, protein_a,
#                  viral_inactivation, cex, aex, virus_filtration)
#   report_nondoe  PCR-00N for a step WITHOUT a DoE (harvest, ufdf) — univariate /
#                  qualitative characterization; NEVER fabricate a DoE
#   plan           PCP-00N (protocol) for any step; DoE vs non-DoE handled per-section
#
# Corpus level (one document each, structures per pc_package/TASKS.md):
#   transfer_plan    PTP-001  — parent; frames why the whole package exists
#   risk_assessment  RA-001   — PRE-characterization; output is the study scope
#   master_plan      PCMP-001 — umbrella over the PCP-00N documents
#   master_report    PCMR-001 — roll-up of the PCR-00N documents; WRITTEN LAST
#
# Canonical orders are the CLAUDE.md orders. Scaffold / rigor per WRITING_GUIDE §2-§3;
# REGISTER per WRITING_GUIDE §4 and meta.register_rules below, which are modelled on the
# published human sources (refs/text/), never on an existing report in pc_package/.
# Length is EMERGENT (WRITING_GUIDE §7): the band is a lint hint, never a target to pad
# toward.
#
# Grounding rule (absolute): every number is an inline expression from the brief's
# helper inventory. This file names WHICH helpers a section typically draws on ("pull:")
# as a menu, not an instruction to use all of them. If a needed value has no helper,
# write <<NEEDS: ...>> and continue.
# =====================================================================================

meta:
  scaffolds:
    OCAR: >-
      Whole-document arc (Schimel hourglass): Opening (wide — product, step role,
      regulatory basis) -> Challenge (narrowing — which CQAs are at risk here) ->
      Action (narrow — prior knowledge, design, results, design space, capability) ->
      Resolution (widening — control-strategy contribution, discussion, conclusions).
      The section ORDER is this arc; honour it.
    SCQA: >-
      Section opener (Minto): Situation (agreed context) -> Complication (what changed /
      is uncertain) -> Question (implicit) -> Answer (your claim, stated FIRST, then
      evidenced beneath, MECE, strongest first). In a report the Answer is a FINDING.
    CCC: >-
      Paragraph shape: Context (topic sentence stating the point, tied to the section
      Answer) -> Content (the evidence: effect, table row, diagnostic) -> Conclusion
      (what it means). One paragraph = one point. Never open with a number/table ref.
    GopenSwan: >-
      Sentence: old-info first (topic position), new/important info last (stress
      position); subject next to verb; one point per sentence.
  registers:
    defensive: >-
      Dense, anticipates the reviewer's objection, every claim bounded. Executive
      summary, design space, conclusions, deviations.
    procedural: >-
      Methodical, past tense for what was done, present for what holds. Materials &
      methods, introduction, operation.
    argumentative: >-
      Builds a case from prior knowledge and risk to a classification. Prior knowledge,
      parameter classification, control-strategy, discussion.
    analytical: >-
      Reports and interprets quantitative results; calibrated hedging. Results,
      capability, RSM interpretation.
    boilerplate: >-
      Three flat sentences and a table. Administrative sections, appendix intros. Do NOT
      inflate; short here is correct.
  rigor_glossary:
    grounding: Every number is an inline expression from the model (WRITING_GUIDE §6).
    screening_identifies_rsm_predicts: >-
      State it: the screening design finds which factors matter; the response-surface
      model is the predictive / design-space model. Do not over-claim the near-saturated
      screening fit.
    bounded_conclusion: >-
      Close a results/design-space claim with >=2 of: range bound (region studied),
      model bound (what the model does/does not cover), assumption bound (feed states,
      scale-down validity). An unbounded robustness claim is a defect.
    calibrated_hedging: >-
      Match the verb to the evidence: demonstrates (strong, tight CI) vs is consistent
      with vs suggests (small/non-significant). Attribute near-limit noise to the assay.
    adverse_before_mitigation: >-
      When a result is worse than expected, state the adverse magnitude FIRST, then the
      mitigating evidence, then the residual position. Never lead with reassurance.
    cross_step_credit: >-
      When an attribute is controlled by more than one step, state THIS step's
      contribution and name the documents for the others; never imply this step does all.
    deferral_names_a_location: >-
      Never "data not shown". Point to an appendix, a paired report, an SOP, or an AMV.
    null_result_is_informative: >-
      A factor with no significant effect gets classified (GPP / robust) and kept in the
      knowledge space as evidence of robustness — state that, don't just drop it.
    capability_margin: State the Cpk AND the margin to the limit; name the tightest.
    explicit_non_claim: Say what the step does NOT do / does not by itself guarantee.
    worst_case_identification: Name the worst-case corner the region must still satisfy.
    factor_inclusion_rationale: Justify the RANGE of each factor, not just its presence.
    table_narration: >-
      Introduce a table, walk its notable rows and say why each is notable, then state
      the conclusion. A bare "@tbl-x" with no walkthrough is a defect (WRITING_GUIDE §5).
  length_bands: {XS: "<0.5 pp", S: "0.5-1 pp", M: "1-2.5 pp", L: "2.5-4 pp", XL: ">4 pp"}
  register_rules: >-
    HARD (WRITING_GUIDE §4; gated by authoring/check_style.py). Plain technical English at
    about C1 level, modelled on PDA TR 60 and the A-Mab case study (refs/text/), NOT on any
    existing report in pc_package/. Sentence-length targets are a BAND, not a ceiling: mean
    20-28 words (aim ~24), median 18-25, 15-32% of sentences under 15 words, and 3-16% over
    40 words. Prose that is uniformly short and choppy fails just as hard as prose that
    sprawls. Use parentheses normally (3-14 per 1000 words) for references, glosses and
    examples. Em-dashes <=2.5 and semicolons <=4.5 per 1000 words: add a
    qualification with a NEW SENTENCE, not with a dash, a semicolon or another subordinate
    clause. No bold inside a sentence. No coined hyphenated compounds ("host cell protein",
    not "host-cell-protein"; never "quality-attribute-richest"). No commentary on your own
    rhetoric ("stated first", "it is worth noting", "this warrants comment"). Do not append
    a significance clause to every paragraph; some paragraphs correctly end on a fact.
  notes:
    - >-
      Coreference across sections is a benchmark feature, but it comes from naming the same
      thing the same way and from explicit cross-references ("see §7"), NOT from restating a
      claim in fresh words. Elegant variation is a defect (WRITING_GUIDE §4b).
    - >-
      Deviation prose is AUTHORED from the brief's structured deviation facts (Option A);
      the register exemplar teaches the deviation-section moves. Where a deviation
      invalidated and re-executed a DoE, a real superseded dataset exists (see the brief
      'superseded study' block) and is referenced, not analysed.
    - >-
      Ground every claim. Nothing is added to, weakened or corrected in the document after
      authoring. The planted weak-claim feature is RETIRED (authoring/WEAK_CLAIMS.md): a
      claim injected into a finished document contradicts the prose around it instead of
      merely lacking support, which changes the benchmark task and passes every gate
      undetected. If it is ever revived, the claims must be named in the brief so the author
      writes them into the argument in one pass.

# -------------------------------------------------------------------------------------
report_doe:
  applies_to: [bioreactor, protein_a, viral_inactivation, cex, aex, virus_filtration]
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  sections:
    - id: exec_summary
      heading: "Executive summary"
      unnumbered: true
      scaffold: SCQA
      register: defensive
      length_band: M
      rigor: [bounded_conclusion, capability_margin, explicit_non_claim, cross_step_credit]
      pull: [report_params, cqas_for, cqas_by_keys, cap_for, doe_runs, dev_register, pct]
      instructions: >-
        The whole-document Answer, up front (OCAR resolution stated first). One opening
        paragraph: what step this is, its role in the train, the study basis (PCP-00N,
        qualified SDM, lifecycle + QbD + Q5A citations, A-Mab case study). Then the
        headline outcomes: parameter count and classifications, the CQA(s) the step sets
        or clears, model adequacy in one clause, the capability with its margin and which
        is tightest. If deviations were recorded, say so here in one or two sentences
        (count + that they were resolved without changing classifications/region) — do
        not detail them. Close by widening to what the step now guarantees and the roll-up
        to PCMR-001. Every number inline. State one explicit non-claim.
    - id: introduction
      heading: "Introduction"
      scaffold: OCAR
      register: procedural
      length_band: M
      rigor: [cross_step_credit]
      subsections:
        - {id: product_unit_op, heading: "Product and unit operation",
           note: "A-Mab identity + platform train; this step's mode of operation and
                  mechanism; what CQA it forms/sets/clears; broad->narrow."}
        - {id: objectives, heading: "Objectives",
           note: "Numbered (i)-(v): quantify parameter-response relationships; define the
                  operating region; establish PAR/NOR; classify each parameter; justify
                  Stage 2 ranges + control strategy."}
        - {id: regulatory_basis, heading: "Regulatory and scientific basis",
           note: "Lifecycle (FDA 2011), QbD (ICH Q8/Q9/Q11),
                  Q5A(R2) for viral steps, A-Mab case study. Criticality as a continuum
                  (ICH Q9). Map to FDA 2011 Stage-1 (Process Design) content."}
      instructions: >-
        Open wide (product + platform) and narrow to this step's role and objectives.
        Procedural register. Cite only existing references.bib keys. Name the paired
        plan PCP-00N. No results here.
    - id: prior_knowledge
      heading: "Prior knowledge and quality risk basis"
      scaffold: SCQA
      register: argumentative
      length_band: M
      rigor: [cross_step_credit, factor_inclusion_rationale]
      subsections:
        - {id: platform_knowledge, heading: "Platform and prior-product knowledge",
           note: "Platform behaviour from prior products (X/Y/Z-Mab, see STORY_BIBLE) and
                  A-Mab clinical/engineering experience. State the MECHANISM the study
                  expects (what each factor should do and why) — this frames the ranges."}
        - {id: cqas_in_scope, heading: "Quality attributes in scope",
           note: "Table via cqas_for(key) (sets) and/or cqas_by_keys([...]) (clears).
                  Narrate it. Tool #1 = Impact x Uncertainty; H/VH => Critical."}
        - {id: risk_prioritization, heading: "Risk-based prioritization and parameter selection",
           note: "RA-001 set the scope by risk-ranking-and-filtering. Justify which
                  parameters went to DoE vs univariate, and WHY the ranges."}
      instructions: >-
        Argumentative. The Answer: prior knowledge + RA-001 justify this study's factor
        set and ranges. Establish the mechanistic expectation now so Results can confirm
        or refute it. Conservative default for uncertain attributes. This is where the
        factor-inclusion / range rationale lives.
    - id: materials_methods
      heading: "Materials and methods"
      scaffold: CCC
      register: procedural
      length_band: L
      rigor: [deferral_names_a_location, calibrated_hedging]
      subsections:
        - {id: sdm_qualification, heading: "Scale-down model and its qualification",
           note: "SDM operated at commercial equivalents (cite the operation SOP + SOP-1001);
                  qualified against at-scale data by matching input/output attributes.
                  The centre-point reproducibility is the pure-error term for lack-of-fit.
                  For viral steps: qualified small-scale spiking model (Q5A)."}
        - {id: operation, heading: "Cell line, media and culture operation | Operation",
           note: "Step operation in commercial-equivalent terms. Inputs controlled to
                  platform spec are identity/quality-controlled, not characterized."}
        - {id: analytical_methods, heading: "Analytical methods",
           note: "Validated methods table via sop_table(sops=[], amvs=<KEY>_AMV_REFS).
                  Narrate which assay measures which response. Defer performance to App D."}
        - {id: sampling_plan, heading: "Sampling plan",
           note: "What was sampled where; centre-point replicate counts (screening vs RSM)."}
        - {id: statistical_methods, heading: "Statistical methods",
           note: "Coded factors (setpoint=0, edges=+/-1); screening = 2FI OLS, effect =
                  2x coded coef; RSM = full quadratic; alpha=0.05; adequacy by
                  R2/adjR2/predR2(PRESS)/F/ANOVA lack-of-fit vs pure error; robust =
                  no active factor; capability by Monte-Carlo of V['n_monte_carlo']
                  batches, one-sided Cpk."}
      instructions: >-
        Procedural/defensive. Justify the scale-down warrant explicitly (why the SDM
        supports operating-range and clearance claims). Attribute assay variance where
        relevant. Every deferral names a location. This is a long, methodical section;
        that length is correct, not padding.
    - id: study_design
      heading: "Study design"
      scaffold: SCQA
      register: analytical
      length_band: M
      rigor: [factor_inclusion_rationale]
      subsections:
        - {id: factors_ranges, heading: "Factors, ranges and the knowledge space",
           note: "report_params(key) table (PAR = knowledge-space edges, NOR = routine).
                  D.factor_legend_df(key) for the coded A-D legend. Narrate both."}
        - {id: screening_design, heading: "Screening design",
           note: "Two-level full factorial (or fractional) in the screening factors + n
                  centre points; doe_runs(key,'screening') runs; estimates all main
                  effects + 2FI. Point to Appendix A."}
        - {id: rsm_design, heading: "Response-surface design",
           note: "Face-centred CCD in the RSM_TOP subset; doe_runs(key,'rsm') runs; adds
                  curvature. Point to Appendix B."}
        - {id: univariate, heading: "Univariate assessment",
           note: "Factors assessed one-at-a-time and WHY they were not in the multivariate
                  design (e.g. act through residence time, not chemistry)."}
      instructions: >-
        Analytical/argumentative. Answer-first: the design resolves effects (screening)
        and defines the region (RSM). Justify each factor's RANGE against prior knowledge.
    - id: results
      heading: "Results"
      scaffold: CCC
      register: analytical
      length_band: XL
      rigor: [table_narration, screening_identifies_rsm_predicts, calibrated_hedging,
              null_result_is_informative, adverse_before_mitigation]
      subsections:
        - {id: centerpoint, heading: "Centre-point performance and reproducibility",
           note: "D.center_cv_df(key,'rsm'); narrate the %CV, name the least precise
                  response; this is the pure-error basis for lack-of-fit."}
        - {id: screening_effects, heading: "Screening: factor effects",
           note: "D.fit_summary_df(key,'screening') + D.screening_effects_df(key,resp).
                  Walk the largest effects; state directions + mechanism; note the
                  significant interactions; state that magnitudes are refined by the RSM."}
        - {id: rsm_models, heading: "Response-surface models",
           note: "D.fit_summary_df(key,'rsm'); adequacy statement (R2 range, adjR2 floor,
                  lack-of-fit NS); which models are additionally predictive vs adequate.
                  D.rsm_coeff_df, D.anova_lof_df for the key responses; fig_rsm_contours,
                  fig_diagnostics. Narrate the diagnostics (no structure, on identity)."}
        - {id: mechanistic, heading: "Mechanistic interpretation",
           note: "Explain WHY the surfaces look as they do from the physical chemistry;
                  tie to prior knowledge; justify why a multivariate region (not 1-D
                  ranges) is needed."}
      instructions: >-
        The technical core; longest section; CCC per subsection. Answer-first per
        paragraph. STATE screening-identifies / RSM-predicts explicitly. Every table
        narrated. Null results get classified and kept. If any result is adverse
        (e.g. a deviation-linked corner), state the adverse magnitude before the
        mitigation. Bound every quantitative claim.
    - id: design_space
      heading: "Design space"
      scaffold: SCQA
      register: analytical
      length_band: M
      rigor: [worst_case_identification, bounded_conclusion]
      pull: [report_params, "CFG.unit_op(key).param(...).nor"]
      instructions: >-
        The Answer: a multivariate region in the well-controlled CPPs over which the
        governed CQA(s) stay in limit. Name its principal planes (the dominant factor
        pairs). Locate the NOR inside the characterized region inside the PAR knowledge
        space. Identify the worst-case corner. State movement-within = not-a-change;
        movement-outside = change control. Bound the claim (ranges, model, scale-down).
    - id: proven_acceptable_ranges
      heading: "Proven acceptable ranges"
      scaffold: SCQA
      register: analytical
      length_band: L
      rigor: [table_narration, bounded_conclusion, worst_case_identification, cross_step_credit]
      pull: [par_table, par_at_setpoint, par_nor_propagated, fig_par, governing_factor, acceptance_for]
      instructions: >-
        Complements the (multivariate) design space with per-CQA, per-parameter PROVEN
        ACCEPTABLE RANGES. State the acceptance basis first: the criteria are the
        study-provided drug-substance specifications (impurities and formed CQAs); for a
        viral-clearance CQA the step-level required log-reduction is back-calculated from
        the cumulative requirement minus the other steps' credited clearance —
        `D.acceptance_for(UO, resp)` returns the right criterion in each case (no
        hand-calculation). Present `D.par_table(UO)`: for each governed CQA × parameter, the
        characterization range and BOTH proven acceptable ranges — (1) at set-point (other
        factors held at their set-points) and (2) NOR-propagated (other factors varied
        within their NOR by Monte-Carlo of the fitted response-surface model, the reproducible
        default). Narrate it: where the two coincide across the full characterization range,
        the parameter's whole studied range is proven acceptable and robust even to NOR
        co-variation; where the NOR PAR is narrower, name the binding CQA and the residual
        margin. Give a PAR plot per governed CQA via
        `D.fig_par(UO, resp, D.governing_factor(UO, resp))` — parameter on x, response on y,
        acceptance limit drawn, the acceptable region **shaded green**, set-point and NOR
        marked, with the at-set-point and NOR-propagated analyses as the two panels. State
        the relationship to the design space explicitly: the PARs are univariate / NOR-robust
        ranges, whereas the design space is the multivariate region; when the whole
        characterization range is a PAR, the binding constraint on the operating region is the
        multivariate design-space corner, not any univariate PAR. Bound the conclusion to the
        characterization ranges and the fitted model.
    - id: capability
      heading: "Process capability and robustness"
      scaffold: CCC
      register: analytical
      length_band: M
      rigor: [capability_margin, cross_step_credit, bounded_conclusion]
      pull: [cap_for, "V['n_monte_carlo']"]
      instructions: >-
        Monte-Carlo of V['n_monte_carlo'] NOR-bounded batches -> cap_for(keys) table,
        one-sided Cpk. Narrate each CQA: Cpk + margin to limit; name the tightest
        capability and this step's contribution to it; give cross-step credit for
        shared attributes. Bound to NOR + scale-down.
    - id: parameter_classification
      heading: "Parameter classification"
      scaffold: SCQA
      register: argumentative
      length_band: M
      rigor: [null_result_is_informative, cross_step_credit]
      pull: [report_params]
      instructions: >-
        One bulleted rationale per parameter (this is the one place prose bullets are
        idiomatic in the corpus): class + why, from demonstrated effects and
        operating-region risk. Null-effect factors are
        classified (GPP or wide-range WC-CPP) with the robustness evidence stated, not
        dropped. Close with the KPP/CPP summary (e.g. 'no KPP at this step').
    - id: control_strategy
      heading: "Contribution to the control strategy"
      scaffold: SCQA
      register: argumentative
      length_band: M
      rigor: [cross_step_credit, explicit_non_claim]
      instructions: >-
        SCQA resolution (widening). Enumerate this step's control contributions: which
        parameters to which ranges, in-process monitoring, life-cycle controls, release
        testing, any feed-input controls arising from a deviation. Give cross-step credit
        and name the roll-up (PCMR-001). State what the step does NOT control alone.
    - id: discussion
      heading: "Discussion"
      scaffold: CCC
      register: argumentative
      length_band: M
      rigor: [bounded_conclusion, calibrated_hedging, adverse_before_mitigation]
      instructions: >-
        Interpret the whole: what is now understood, confidence in SDM representativeness,
        the deviations and their resolution (summarized, adverse-first), and the principal
        LIMITATIONS (scale-down, small-scale spiking, resin life-cycle) with how each is
        managed forward. State whether any parameter needed the most stringent (CPP vs
        WC-CPP) control.
    - id: conclusions
      heading: "Conclusions"
      scaffold: SCQA
      register: defensive
      length_band: S
      rigor: [bounded_conclusion, explicit_non_claim, capability_margin]
      instructions: >-
        Restate the resolution crisply: step well-understood and robust; region defined;
        ranges justified; CQAs meet acceptance at commercial scale with the tightest-Cpk
        named; deviations resolved without impact; roll-up to PCMR-001. No new facts.
    - id: deviations
      heading: "Deviations from the plan"
      scaffold: SCQA
      register: defensive
      length_band: M   # S if all deviations are minor 'retained'; L for invalidate+re-execute
      rigor: [adverse_before_mitigation, deferral_names_a_location, table_narration]
      pull: [dev_register, dev_facts, "dev_* scalars"]
      instructions: >-
        AUTHORED from the brief's structured deviation facts (Option A). Open with the
        count and that each was investigated, resolved and impact-assessed. dev_register
        table, narrated. Then one subsection per deviation: state the ADVERSE finding
        first (what went wrong, magnitude via the dev_* scalar), then investigation +
        root cause, then impact assessment and disposition. For a 'retained' minor
        deviation, argue why the value falls inside the studied range and does not alter
        the fitted effects. For an 'invalidate + re-execute' deviation, reference the
        REAL superseded study (brief 'superseded study' block): the first execution's
        settings and anomaly, that the affected designs were invalidated and re-executed,
        and root-cause confirmation from the requalified data — the superseded dataset is
        referenced, the requalified one analysed. Never invent numbers; scalars only.
    - id: appendices
      heading: "Appendices A-D"
      scaffold: CCC
      register: boilerplate
      length_band: L
      rigor: [table_narration]
      subsections:
        - {id: appA, heading: "Appendix A — Screening design matrix and responses",
           note: "D.coded_matrix_df(key,'screening') split into coded settings + responses."}
        - {id: appB, heading: "Appendix B — Response-surface design matrix and responses",
           note: "D.coded_matrix_df(key,'rsm') split similarly."}
        - {id: appC, heading: "Appendix C — Full effect and coefficient tables",
           note: "D.screening_effects_df for all responses; D.rsm_coeff_df for the
                  remaining responses not shown in Results."}
        - {id: appD, heading: "Appendix D — Analytical methods summary",
           note: "Static methods table (technique / analyte / AMV / reportable)."}
      instructions: >-
        Boilerplate register: a one-line intro per appendix, then the helper-emitted
        table. Appendices carry depth without prose padding.

# -------------------------------------------------------------------------------------
report_nondoe:
  applies_to: [harvest, ufdf]
  inherits: report_doe
  overrides:
    note: >-
      Same arc and front/closing matter, but NO DoE. Do not fabricate screening/RSM.
    sections:
      study_design: >-
        Replace screening/RSM subsections with the univariate / qualitative
        characterization design (ranges assessed one-at-a-time, verification runs).
      results: >-
        Replace screening-effects / RSM-models / mechanistic subsections with
        univariate results and qualitative/mass-balance characterization; narrate the
        capability and robustness directly. Shorter is correct (CLAUDE.md depth targets).
      design_space: >-
        Usually a proven-acceptable-range / operating-range statement rather than a
        multivariate region; state that explicitly.
      appendices: >-
        No design matrices; keep analytical-methods and any univariate data tables.

# -------------------------------------------------------------------------------------
plan:
  id_scheme: "PCP-00N"
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    A protocol: PROSPECTIVE (future tense for what WILL be done), ~15-22 pp. It states
    what will be studied and the acceptance/decision criteria BEFORE data exist — so it
    uses plan_params(key) (no post-hoc classification) not report_params, and states no
    findings. DoE vs non-DoE handled per-section as in the reports.
  sections:
    - id: purpose_scope
      heading: "Purpose and scope"
      scaffold: SCQA
      register: procedural
      length_band: S
      instructions: >-
        Why this characterization exists and what it covers (this step, these attributes,
        this scale-down model). Prospective voice.
    - id: objectives
      heading: "Objectives"
      scaffold: SCQA
      register: procedural
      length_band: S
      instructions: "Numbered objectives, mirroring the report's (i)-(v) but as intentions."
    - id: related_documents
      heading: "Related documents"
      scaffold: CCC
      register: boilerplate
      length_band: XS
      pull: [related_docs_md, sop_table]
      instructions: "related_docs_md(DOC) table + SOP/AMV table. One-line intro each."
    - id: prior_knowledge
      heading: "Prior knowledge and quality risk basis"
      scaffold: SCQA
      register: argumentative
      length_band: M
      subsections:
        - {id: uo_description, heading: "Unit-operation description and prior knowledge"}
        - {id: cqas_in_scope, heading: "Quality attributes in scope", note: "cqas_for / cqas_by_keys"}
        - {id: risk_prioritization, heading: "Risk-based prioritization of parameters", note: "RA-001 basis"}
      instructions: "As the report's, but framed as the BASIS for the planned scope."
    - id: materials_methods
      heading: "Materials and methods"
      scaffold: CCC
      register: procedural
      length_band: L
      subsections:
        - {id: sdm_qualification, heading: "Scale-down model and its qualification"}
        - {id: operation, heading: "Cell line, media and culture operation | Operation"}
        - {id: analytical_methods, heading: "Analytical methods", note: "sop_table(amvs=<KEY>_AMV_REFS)"}
        - {id: sampling_plan, heading: "Sampling plan"}
        - {id: statistical_methods, heading: "Statistical methods", note: "the planned analysis"}
      instructions: "How the study WILL be run and analysed. Same rigor as the report's M&M."
    - id: study_design
      heading: "Study design"
      scaffold: SCQA
      register: analytical
      length_band: M
      pull: [plan_params, "D.factor_legend_df"]
      subsections:
        - {id: factors_ranges, heading: "Factors, ranges and study type", note: "plan_params(key)"}
        - {id: screening_design, heading: "Screening design", note: "DoE steps only"}
        - {id: rsm_design, heading: "Response-surface design", note: "DoE steps only"}
        - {id: univariate, heading: "Univariate assessment"}
      instructions: >-
        The planned design. plan_params(key) (Range studied + NOR + study type, NO
        classification). Non-DoE steps: univariate/qualitative design only.
    - id: acceptance_criteria
      heading: "Acceptance and decision criteria"
      scaffold: SCQA
      register: defensive
      length_band: M
      rigor: [bounded_conclusion]
      instructions: >-
        The prospective decision rules: model-adequacy thresholds, how the operating
        region / PAR will be declared, what constitutes a pass. Plan-specific; states
        criteria, not outcomes.
    - id: proven_acceptable_ranges
      heading: "Proven acceptable ranges (planned analysis)"
      scaffold: SCQA
      register: analytical
      length_band: M
      instructions: >-
        Describe the PLANNED PAR determination (prospective). For each CQA, state the
        acceptance basis — the drug-substance specification, or, for a viral-clearance CQA,
        the required step contribution back-calculated from the cumulative requirement — and
        the two analyses that WILL be run per parameter: (1) at set-point (other factors
        fixed) and (2) NOR-propagated (other factors varied within their NOR by Monte-Carlo of
        the fitted DoE model). State the decision rule (the PAR is the parameter range over
        which the CQA remains within acceptance under the analysis) and that each PAR will be
        reported with a green-shaded acceptable-region plot. No results here.
    - id: data_management
      heading: "Data management and integrity"
      scaffold: CCC
      register: boilerplate
      length_band: S
      instructions: "ALCOA+, systems, review. Short, procedural."
    - id: roles
      heading: "Roles and responsibilities"
      scaffold: CCC
      register: boilerplate
      length_band: S
      instructions: "RACI-style prose or short table over the functions."
    - id: deliverables_schedule
      heading: "Deliverables and schedule"
      scaffold: CCC
      register: boilerplate
      length_band: S
      instructions: "The report (PCR-00N) as the deliverable; phase sequence. No real dates."
    - id: risks_assumptions
      heading: "Risks and assumptions"
      scaffold: SCQA
      register: argumentative
      length_band: S
      instructions: "Study risks (SDM representativeness, material supply) + assumptions."
    - id: approvals_body
      heading: "Approvals"
      scaffold: CCC
      register: boilerplate
      length_band: XS
      instructions: "Approval statement referencing the front-matter Approvals table."
    - id: appendices
      heading: "Appendices A-B — Planned design matrices"
      scaffold: CCC
      register: boilerplate
      length_band: M
      instructions: >-
        Planned (not executed) coded design matrices for DoE steps; omit for non-DoE.

# =====================================================================================
# CORPUS-LEVEL DOCUMENTS
# -------------------------------------------------------------------------------------
# The four one-off documents that frame the per-unit-operation package. They use the same
# meta.register_rules, scaffolds and rigor glossary as the per-step documents; only the
# section list differs. Structures follow pc_package/TASKS.md "Transfer & master documents".
#
# Dependency: PCMR-001 rolls up every PCR-00N and is written LAST. The other three are
# independent of each other (cross-references resolve by ID, not by text).
# =====================================================================================

transfer_plan:
  id_scheme: PTP-001
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    Prospective tech-transfer plan moving the A-Mab drug-substance process from the sending
    site (Cambridge, MA — Development) to the receiving site (Grafton, WI — Commercial DS).
    Grounded in ICH Q10 (technology transfer) and the FDA 2011 lifecycle approach. It is the
    PARENT of the characterization package: it frames why every PCP/PCR exists. ~15-20 pp.
  sections:
    - id: purpose_scope
      heading: "Purpose and scope"
      register: procedural
      length_band: S
      instructions: >-
        What is being transferred, between which two sites, and why. Name the product, the
        process train and the document package this plan parents. State explicitly what is
        out of scope (drug product, and the commercial PPQ execution itself).
    - id: product_process
      heading: "Product and process description"
      register: procedural
      length_band: M
      instructions: >-
        A-Mab and the drug-substance train, Steps 3-10, via process_steps_df(). Narrate the
        table: name each step's role in one clause. Keep it descriptive; no results.
    - id: sites
      heading: "Sending and receiving sites"
      register: boilerplate
      length_band: S
      instructions: >-
        The two sites and their roles, from SENDING_SITE / RECEIVING_SITE. Flat and short.
        State which activities remain at development and which move.
    - id: equivalency
      heading: "Site equivalency analysis"
      register: argumentative
      length_band: M
      rigor: [bounded_conclusion, deferral_names_a_location]
      instructions: >-
        Compare the two sites on the dimensions that matter to the process: equipment train
        and scale, control capability, utilities, analytical capability, quality system.
        Where they differ, say what the difference means for the process and how it is
        managed. This is the argument that the receiving site can run what the sending site
        developed; it must be bounded, not asserted.
    - id: sdm_comparability
      heading: "Scale-down model and comparability strategy"
      register: procedural
      length_band: M
      rigor: [deferral_names_a_location]
      instructions: >-
        How the qualified scale-down models support the transfer, and how comparability
        between sites will be demonstrated. Name the per-step plans (PCP-003 through
        PCP-010) that execute the characterization on those models.
    - id: transfer_elements
      heading: "Transfer of the process, methods and control strategy"
      register: procedural
      length_band: L
      instructions: >-
        Three sub-sections: the manufacturing process (batch records, process description,
        set-points and ranges), the analytical methods (transfer and re-qualification at the
        receiving site, sop_table / AMV references), and the control strategy. State what
        each transfer step delivers and who signs it off.
    - id: ppq_strategy
      heading: "Process performance qualification strategy"
      register: procedural
      length_band: M
      instructions: >-
        How Stage 2 follows from this transfer: the PPQ batch strategy, what the
        characterization package must deliver before PPQ can start, and the link to
        PCMP-001 / PCMR-001. Prospective throughout.
    - id: gap_analysis
      heading: "Gap analysis"
      register: defensive
      length_band: M
      rigor: [adverse_before_mitigation, deferral_names_a_location]
      instructions: >-
        The identified transfer gaps, each with its impact and the action that closes it.
        State the gap plainly FIRST, then the mitigation, then the residual position. A gap
        with no owner or no closing action is not a gap statement, it is a worry.
    - id: roles
      heading: "Roles and responsibilities"
      register: boilerplate
      length_band: S
      instructions: "Three flat sentences and a table. Sending site, receiving site, quality."
    - id: schedule
      heading: "Deliverables and schedule"
      register: boilerplate
      length_band: S
      instructions: "The deliverables this plan commits to, and their sequence. Short."
    - id: approvals_body
      heading: "Approvals"
      register: boilerplate
      length_band: XS
      instructions: "One sentence plus the approval table."

risk_assessment:
  id_scheme: RA-001
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    The PRE-characterization risk assessment, derived from PTP-001. Its output is the
    characterization SCOPE: which parameter gets which study type. It is written BEFORE the
    studies, so it uses INITIAL occurrence/detection and the study-type decision, NEVER a
    post-characterization residual RPN and NEVER a final parameter classification. Content
    source: pc_package/ra_content.py (curated failure-mode / effect / control text) and
    refs/grounding/amab_risk.json (the risk-ranking-and-filtering rule). ~15-20 pp.
  sections:
    - id: purpose_scope
      heading: "Purpose and scope"
      register: procedural
      length_band: S
      instructions: >-
        Why this assessment exists and what it decides. State clearly that it is performed
        before characterization and that its output is the study scope, not a classification.
        Name PTP-001 as the parent and the PCP-00N documents as the consumers.
    - id: methodology
      heading: "Risk assessment methodology"
      register: procedural
      length_band: M
      instructions: >-
        The risk-ranking-and-filtering method: severity from the potential impact on a CQA,
        combined with the potential for interaction with other parameters, scored to give a
        study-type decision. Give the scoring scales and the thresholds that map a score to
        multivariate, univariate or no study. Cite @amab2009 and @ichq9. State that
        criticality is treated as a continuum (Q9), not a binary.
    - id: cqas_at_risk
      heading: "Quality attributes at risk"
      register: argumentative
      length_band: M
      instructions: >-
        The CQAs the process must control, with criticality and the step that sets each.
        This is the severity axis of the assessment; it is the reason a parameter scores.
    - id: parameter_risk
      heading: "Parameter risk ranking by unit operation"
      register: analytical
      length_band: XL
      rigor: [table_narration]
      instructions: >-
        The technical core. Per unit operation: the parameters carried into the assessment,
        their failure mode, effect and existing control, and the resulting score. Narrate
        each step's table by naming the parameters that drive the outcome and why; do not
        walk every row. Steps with no CQA impact (harvest, UF/DF) are correctly short.
    - id: study_assignment
      heading: "Characterization study assignment"
      register: argumentative
      length_band: M
      rigor: [bounded_conclusion]
      instructions: >-
        The OUTPUT of this document: which parameters go into a multivariate design, which
        are assessed univariately, and which are not studied because the risk is low. Give
        the reason for each group. State the boundary: this assignment is prospective and
        will be revisited after the studies report.
    - id: assumptions
      heading: "Assumptions and limitations"
      register: defensive
      length_band: S
      rigor: [bounded_conclusion]
      instructions: >-
        What this assessment assumes (platform transferability, the completeness of the
        parameter list) and what it cannot yet know. Short and honest.
    - id: outputs
      heading: "Outputs and downstream use"
      register: boilerplate
      length_band: S
      instructions: "Which document consumes this assessment, per step. Flat."
    - id: approvals_body
      heading: "Approvals"
      register: boilerplate
      length_band: XS
      instructions: "One sentence plus the approval table."

master_plan:
  id_scheme: PCMP-001
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    The umbrella plan over every per-unit-operation plan. It states once what the individual
    PCP-00N documents would otherwise each restate: the CQA framework, the common scale-down
    and statistical approach, and the acceptance-criteria framework. Prospective. ~15-20 pp.
  sections:
    - id: purpose_scope
      heading: "Purpose and scope"
      register: procedural
      length_band: S
      instructions: >-
        What the characterization campaign covers, which steps, and how this plan relates to
        PTP-001 (parent), RA-001 (scope) and the PCP-00N documents (children).
    - id: strategy
      heading: "Stage 1 characterization strategy"
      register: argumentative
      length_band: M
      instructions: >-
        The enhanced, quality-by-design approach: prior knowledge and risk assessment build
        process understanding, characterization bounds it, and the result is a control
        strategy. Cite @fda2011, @ichq8, @ichq9, @ichq11.
    - id: cqa_framework
      heading: "Critical quality attribute framework"
      register: analytical
      length_band: M
      rigor: [table_narration]
      instructions: >-
        The full CQA register with acceptance criteria and criticality, and which step sets
        each. Narrate the attributes that drive the campaign; do not walk every row.
    - id: risk_basis
      heading: "Risk-based prioritization"
      register: argumentative
      length_band: M
      instructions: >-
        Summarize RA-001's outcome across the whole train: how many parameters go to
        multivariate study, how many to univariate, and the reasoning. Reference RA-001
        rather than re-deriving it.
    - id: sdm_strategy
      heading: "Scale-down model strategy"
      register: procedural
      length_band: M
      rigor: [deferral_names_a_location]
      instructions: >-
        The common approach to scale-down models and their qualification across the train,
        so each PCP-00N need only state its step-specific detail.
    - id: statistical_approach
      heading: "Common statistical approach"
      register: analytical
      length_band: M
      rigor: [screening_identifies_rsm_predicts]
      instructions: >-
        The shared statistical method: screening then response surface, the significance
        level, model adequacy criteria, and how capability is estimated. STATE the
        screening-identifies / RSM-predicts division once, here, for the whole campaign.
    - id: acceptance_framework
      heading: "Acceptance criteria framework"
      register: defensive
      length_band: M
      rigor: [bounded_conclusion]
      instructions: >-
        The framework each PCP-00N instantiates: what makes a scale-down model qualified, a
        model adequate, an operating region acceptable, and a parameter classified. Where a
        numeric threshold is not grounded in the model, say the criterion is defined per
        study rather than inventing a number.
    - id: plan_register
      heading: "Register of characterization plans"
      register: boilerplate
      length_band: S
      instructions: "The PCP-003 to PCP-010 list with each step's subject. Flat, one table."
    - id: schedule
      heading: "Deliverables and schedule"
      register: boilerplate
      length_band: S
      instructions: "Deliverables and sequence. Short."
    - id: approvals_body
      heading: "Approvals"
      register: boilerplate
      length_band: XS
      instructions: "One sentence plus the approval table."

master_report:
  id_scheme: PCMR-001
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    The roll-up of every per-unit-operation report. WRITTEN LAST. It summarizes and CITES the
    PCR-00N documents rather than re-deriving them, and its numbers come from the model
    (report_values.json, capability.csv, viral_clearance.csv, parameter_classification.csv).
    It is the document an assessor reads to see whether the process as a whole is ready for
    Stage 2. ~25-30 pp.
  sections:
    - id: exec_summary
      heading: "Executive summary"
      unnumbered: true
      register: defensive
      length_band: M
      rigor: [bounded_conclusion, capability_margin, explicit_non_claim, cross_step_credit]
      instructions: >-
        The whole campaign's answer up front: the process is characterized, the control
        strategy is defined, and the outcome against each requirement. Give the tightest
        capability with its margin, the cumulative viral clearance against its requirement,
        and the parameter-classification counts. State one explicit non-claim (Stage 2 has
        not yet been executed). Every number inline.
    - id: introduction
      heading: "Introduction"
      register: procedural
      length_band: M
      instructions: >-
        The campaign, its documents, and the regulatory basis. Name PTP-001, RA-001,
        PCMP-001 and every PCR-00N.
    - id: process_description
      heading: "Process description and performance"
      register: procedural
      length_band: M
      rigor: [table_narration]
      instructions: >-
        The train, Steps 3-10, with each step's role and performance. Narrate the notable
        steps rather than every row.
    - id: cqa_outcomes
      heading: "Consolidated quality attribute outcomes"
      register: analytical
      length_band: L
      rigor: [table_narration, cross_step_credit]
      instructions: >-
        Every drug-substance CQA, its acceptance criterion and its outcome, with the step
        that sets it and the steps that clear it. Give cross-step credit properly: name the
        contributing documents. Where an attribute is controlled by several steps, say so.
    - id: parameter_classification
      heading: "Parameter classification summary"
      register: analytical
      length_band: M
      rigor: [table_narration]
      instructions: >-
        The consolidated classification across all parameters with the counts by class.
        Narrate the exceptions: the single CPP and why it is the only one, and the
        parameters whose classification rests on bounding rather than on a measured effect.
    - id: capability
      heading: "Process capability"
      register: analytical
      length_band: M
      rigor: [capability_margin, bounded_conclusion]
      instructions: >-
        Commercial-scale capability across every CQA, the tightest Cpk with its margin, and
        the bound: this is estimated from qualified scale-down models with parameters inside
        their NORs, and is confirmed at commercial scale during Stage 2.
    - id: viral_clearance
      heading: "Viral clearance summary"
      register: analytical
      length_band: M
      rigor: [cross_step_credit, bounded_conclusion]
      instructions: >-
        The modular clearance claim: each contributing step's log-reduction, the cumulative
        total against its requirement, and the orthogonality argument. Name the steps that
        are credited and the steps that are not. Cite @ichq5a.
    - id: control_strategy
      heading: "Overall control strategy"
      register: argumentative
      length_band: L
      rigor: [cross_step_credit, explicit_non_claim]
      instructions: >-
        How the elements combine: parameter ranges, in-process controls, release testing,
        life-cycle controls and feed-input controls. State what the control strategy does
        NOT cover.
    - id: deviations
      heading: "Deviations across the campaign"
      register: defensive
      length_band: M
      rigor: [adverse_before_mitigation]
      instructions: >-
        The deviations recorded across the campaign, adverse magnitude first, then the
        disposition. Reference each step's report for the investigation; do not re-tell it.
    - id: conclusions
      heading: "Conclusions and Stage 2 readiness"
      register: defensive
      length_band: M
      rigor: [bounded_conclusion, explicit_non_claim]
      instructions: >-
        What the campaign established, what remains for Stage 2, and the bound on every
        claim made. No new facts.
