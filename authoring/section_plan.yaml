investigation_report:
  applies_to: [INV-001]
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    A QA-owned investigation report in the form a site quality system issues it. It is shorter
    than a characterization report and more formal: numbered sections, an event description
    with dates, a scope statement, the investigation itself with its findings numbered
    F1..Fn, root cause, impact assessment per affected document, CAPA with owners and due
    dates, effectiveness check, and closure. The facts are the brief's: campaign chronology,
    the Version 1.0 and Version 2.0 criteria, the verification, the method decision AMD-001
    and its comparability data, the capability change. Tables are the complex ones in
    pc_package/tables.py. The investigation's scope is the acceptance criteria, the method
    for fragments, the capability side and the execution records; the PAR computation itself
    is outside its scope.
  sections:
    - {id: summary, heading: "Summary", unnumbered: true, length_band: S,
       covers: "The event, the classification, the root cause in one sentence, the CAPA and the
                outcome: which documents were revised and which conclusions changed."}
    - {id: event, heading: "Event description", length_band: S,
       covers: "What was found, by whom, when (the trigger and the dates), and the immediate
                actions (the hold on the Version 1.0 documents for BLA use)."}
    - {id: scope, heading: "Scope", length_band: S,
       covers: "Which documents, studies and decisions are in scope, and what is not."}
    - {id: background, heading: "Background", length_band: M,
       covers: "How the Version 1.0 criteria came about: the PCR-005 analysis against the
                drug-substance limit, the in-process limits added at analysis time, the
                rule and the margin each used (T.criteria_change())."}
    - {id: investigation, heading: "Investigation", length_band: L,
       covers: "The findings, numbered: criteria not in the approved protocols; margins
                chosen so each step passed at its set-point; capability-based limits judged
                against the data they came from; nominal rather than worst-case downstream
                clearance; acidic variants assessed one-sided against a two-sided range; no
                execution dates in the records; fragments by SEC in capture-stage matrices
                (T.method_comparability()). Each with its evidence."}
    - {id: root_cause, heading: "Root cause", length_band: S,
       covers: "Why the criteria were not defined before execution; the contributing causes."}
    - {id: impact, heading: "Impact assessment", length_band: M,
       covers: "Per document and per conclusion: what the Version 2.0 criteria change
                (T.iac_derivation(), T.worst_case_verification()), the capability change, the
                fragment results that move, and the product impact (none on released
                material: no GMP batch was dispositioned on these documents)."}
    - {id: capa, heading: "Corrective and preventive actions", length_band: M,
       covers: "The CAPA table (action, owner function, due date, status): PCMP-001
                Version 2.0 with a priori criteria, protocol amendments, reports reissued,
                AMD-001 applied, the procedure change that puts acceptance criteria into the
                protocol before execution."}
    - {id: effectiveness, heading: "Effectiveness check", length_band: S,
       covers: "How and when the CAPA is verified effective."}
    - {id: conclusion, heading: "Conclusion and closure", length_band: S,
       covers: "The classification confirmed, the CAPA status, closure."}
