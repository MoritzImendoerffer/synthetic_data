# =====================================================================================
# section_plan.yaml — the section plans for the A-Mab PC corpus
# -------------------------------------------------------------------------------------
# One-pass authoring: a single agent writes a whole document in section order, holding
# it all in one context. This file is that agent's OUTLINE and nothing more: the sections,
# in order, with their headings, subsections, the helpers each typically draws on
# ("pull:", a menu, not an instruction to use all of them), a length band that is a lint
# hint and never a target, and one plain sentence saying what the section covers.
#
# What this file no longer carries, since 2026-08-19 (work unit
# 2026-08-18_03_author-facing-apparatus, TASK-007). Until then every section also named a
# paragraph scaffold, a register (defensive / analytical / …) and a list of
# "rigor obligations" (bounded_conclusion, explicit_non_claim, table_narration, "state
# directions + mechanism", …) that the author was to perform. Measured on 2026-08-18, each
# of the eight sentences the project owner rejected in PCR-005 was one of those obligations
# being performed — "is put to no other use in this report" is explicit_non_claim; "follow
# from the physical chemistry … and confirm the expectations recorded in §2.1" is the
# instruction "establish the mechanistic expectation now so Results can confirm", verbatim.
# An author told to perform a move writes a sentence whose function is the move. On
# 2026-08-19 the same section written with no obligations at all was preferred blind
# (docs/results/2026-08-19-apparatus-probe.md). The obligations now live in
# authoring/REVIEW_CHECKLIST.md as QUESTIONS A REVIEWER ASKS OF A FINISHED SECTION, and
# nothing in this file tells the author how to argue.
#
# Voice comes from authoring/WRITING_GUIDE.md and authoring/REGISTER_EXEMPLAR.md, facts and
# helpers from the brief (authoring/out/<DOC>.brief.md), world canon from
# authoring/STORY_BIBLE.md. Length is EMERGENT: the band is a lint hint, never a target to
# pad toward.
#
# Seven document classes are planned here.
#
# Per unit operation (Steps 3-10):
#   report_doe     PCR-00N for a step WITH a DoE  (bioreactor, protein_a,
#                  viral_inactivation, cex, aex, virus_filtration)
#   report_nondoe  PCR-00N for a step WITHOUT a DoE (harvest, ufdf) — univariate /
#                  qualitative characterization; NEVER fabricate a DoE
#   plan           PCP-00N (protocol) for any step; DoE vs non-DoE handled per-section
#
# Corpus level (one document each, structures per pc_package/TASKS.md):
#   transfer_plan    PTP-001  — parent; frames why the whole package exists
#   risk_assessment  RA-001   — PRE-characterization; output is the study scope
#   master_plan      PCMP-001 — umbrella over the PCP-00N documents
#   master_report    PCMR-001 — roll-up of the PCR-00N documents; WRITTEN LAST
#
# Canonical orders are the CLAUDE.md orders.
#
# Grounding rule (absolute): every number is an inline expression from the brief's
# helper inventory. If a needed value has no helper, write <<NEEDS: ...>> and continue.
# =====================================================================================

meta:
  length_bands: {XS: "<0.5 pp", S: "0.5-1 pp", M: "1-2.5 pp", L: "2.5-4 pp", XL: ">4 pp"}
  voice: >-
    authoring/WRITING_GUIDE.md and authoring/REGISTER_EXEMPLAR.md, modelled on the four
    published human sources in refs/text/ and never on an existing document in pc_package/.
    The gate is authoring/check_style.py; the reviewer's checklist is
    authoring/REVIEW_CHECKLIST.md.
  notes:
    - >-
      Coreference across sections comes from naming the same thing the same way and from
      explicit cross-references ("see §7"), not from restating a claim in fresh words.
    - >-
      Deviation prose is authored from the brief's structured deviation facts (Option A).
      Where a deviation invalidated and re-executed a DoE, a real superseded dataset exists
      (see the brief's 'superseded study' block) and is referenced, not analysed.
    - >-
      Ground every claim. Nothing is added to, weakened or corrected in the document after
      authoring. The planted weak-claim feature is RETIRED (authoring/WEAK_CLAIMS.md): a
      claim injected into a finished document contradicts the prose around it instead of
      merely lacking support. If it is ever revived, the claims must be named in the brief
      so the author writes them into the argument in one pass.

# -------------------------------------------------------------------------------------
report_doe:
  applies_to: [bioreactor, protein_a, viral_inactivation, cex, aex, virus_filtration]
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  sections:
    - id: exec_summary
      heading: "Executive summary"
      unnumbered: true
      length_band: M
      pull: [report_params, cqas_for, cqas_by_keys, cap_for, doe_runs, dev_register, pct]
      covers: >-
        The step, its role in the train and the study basis (PCP-00N, the qualified
        scale-down model, the regulatory references), then the outcomes: parameter counts
        and classes, the CQAs the step sets or clears, model adequacy, capability and its
        margin, whether deviations were recorded and resolved, and the roll-up to PCMR-001.
    - id: introduction
      heading: "Introduction"
      length_band: M
      subsections:
        - {id: product_unit_op, heading: "Product and unit operation",
           note: "A-Mab and the platform train; this step's mode of operation and what CQA
                  it forms, sets or clears."}
        - {id: objectives, heading: "Objectives",
           note: "Numbered (i)-(v): quantify parameter-response relationships; define the
                  operating region; establish PAR/NOR; classify each parameter; justify
                  Stage 2 ranges and the control strategy."}
        - {id: regulatory_basis, heading: "Regulatory and scientific basis",
           note: "Lifecycle (FDA 2011), QbD (ICH Q8/Q9/Q11), Q5A(R2) for viral steps, the
                  A-Mab case study; criticality as a continuum (ICH Q9); FDA 2011 Stage 1."}
      covers: >-
        The product, the platform, this step's role and objectives, and the regulatory
        basis, citing only existing references.bib keys and naming the paired plan PCP-00N;
        no results.
    - id: prior_knowledge
      heading: "Prior knowledge and quality risk basis"
      length_band: M
      subsections:
        - {id: platform_knowledge, heading: "Platform and prior-product knowledge",
           note: "Platform behaviour from prior products (X/Y/Z-Mab, see STORY_BIBLE) and
                  A-Mab clinical/engineering experience; what each factor is expected to do
                  and why (the brief's §2b mechanism, when present)."}
        - {id: cqas_in_scope, heading: "Quality attributes in scope",
           note: "Table via cqas_for(key) (sets) and/or cqas_by_keys([...]) (clears).
                  Tool #1 = Impact x Uncertainty; H/VH => Critical."}
        - {id: risk_prioritization, heading: "Risk-based prioritization and parameter selection",
           note: "RA-001 set the scope by risk-ranking-and-filtering: which parameters went
                  to DoE, which to univariate assessment, and the ranges."}
      covers: >-
        What was known before the study — platform and prior-product experience, the CQAs
        in scope with their criticality, and the RA-001 prioritization that produced this
        study's factor set and ranges.
    - id: materials_methods
      heading: "Materials and methods"
      length_band: L
      subsections:
        - {id: sdm_qualification, heading: "Scale-down model and its qualification",
           note: "SDM operated at commercial equivalents (cite the operation SOP + SOP-1001);
                  qualified against at-scale data by matching input/output attributes; the
                  centre-point reproducibility is the pure-error term for lack of fit. For
                  viral steps: qualified small-scale spiking model (Q5A)."}
        - {id: operation, heading: "Cell line, media and culture operation | Operation",
           note: "Step operation in commercial-equivalent terms. Inputs controlled to
                  platform spec are identity/quality-controlled, not characterized."}
        - {id: analytical_methods, heading: "Analytical methods",
           note: "Validated methods table via sop_table(sops=[], amvs=<KEY>_AMV_REFS); which
                  assay measures which response; performance detail in Appendix D."}
        - {id: sampling_plan, heading: "Sampling plan",
           note: "What was sampled where; centre-point replicate counts (screening vs RSM)."}
        - {id: statistical_methods, heading: "Statistical methods",
           note: "Coded factors (setpoint=0, edges=+/-1); screening = 2FI OLS, effect =
                  2x coded coef; RSM = full quadratic; alpha=0.05; adequacy by
                  R2/adjR2/predR2(PRESS)/F/ANOVA lack of fit vs pure error; robust = no
                  active factor; capability by Monte-Carlo of V['n_monte_carlo'] batches,
                  one-sided Cpk."}
      covers: >-
        How the study was run: the scale-down model and why it supports the claims made on
        it, the operation, the analytical methods and their variance, the sampling, and the
        statistical methods; a long, methodical section.
    - id: study_design
      heading: "Study design"
      length_band: M
      subsections:
        - {id: factors_ranges, heading: "Factors, ranges and the knowledge space",
           note: "report_params(key) table (PAR = knowledge-space edges, NOR = routine);
                  D.factor_legend_df(key) for the coded A-D legend."}
        - {id: screening_design, heading: "Screening design",
           note: "Two-level full factorial (or fractional) in the screening factors + n
                  centre points; doe_runs(key,'screening') runs; estimates all main
                  effects + 2FI. Matrix in Appendix A."}
        - {id: rsm_design, heading: "Response-surface design",
           note: "Face-centred CCD in the RSM_TOP subset; doe_runs(key,'rsm') runs; adds
                  curvature. Matrix in Appendix B."}
        - {id: univariate, heading: "Univariate assessment",
           note: "Factors assessed one at a time and why they were not in the multivariate
                  design."}
      covers: >-
        The factors, their ranges and why those ranges, the screening design, the
        response-surface design and the univariate assessments.
    - id: results
      heading: "Results"
      length_band: XL
      subsections:
        - {id: centerpoint, heading: "Centre-point performance and reproducibility",
           note: "D.center_cv_df(key,'rsm'): the %CV per response, the least precise
                  response; this is the pure-error basis for lack of fit."}
        - {id: screening_effects, heading: "Screening: factor effects",
           note: "D.fit_summary_df(key,'screening') + D.screening_effects_df(key,resp): the
                  largest effects, their directions, the significant interactions; the
                  magnitudes are refined by the RSM."}
        - {id: rsm_models, heading: "Response-surface models",
           note: "D.fit_summary_df(key,'rsm'): adequacy (R2 range, adjR2, lack of fit);
                  D.rsm_coeff_df, D.anova_lof_df for the key responses; fig_rsm_contours,
                  fig_diagnostics."}
        - {id: mechanistic, heading: "Mechanistic interpretation",
           note: "Why the surfaces have the shape they have, from the physical chemistry of
                  the step (the brief's §2b), and what that means for how the step is
                  operated."}
      covers: >-
        The technical core: centre-point reproducibility, the screening effects, the
        response-surface models with their adequacy and diagnostics, and the physical
        interpretation of the surfaces; the screening design identifies effects and the
        response-surface model is the predictive one.
    - id: design_space
      heading: "Design space"
      length_band: M
      pull: [report_params, "CFG.unit_op(key).param(...).nor"]
      covers: >-
        The multivariate region in the well-controlled CPPs over which the governed CQAs
        stay within limit, its principal planes, the NOR inside the characterized region
        inside the PAR knowledge space, and what movement within and outside it means for
        change control.
    - id: proven_acceptable_ranges
      heading: "Proven acceptable ranges"
      length_band: L
      pull: [par_table, par_at_design_centre, par_nor_propagated, fig_par, governing_factor, acceptance_for]
      covers: >-
        The per-CQA, per-parameter proven acceptable ranges from D.par_table(UO) — the
        acceptance basis (D.acceptance_for(UO, resp): the study-provided specification, or
        for a viral-clearance CQA the step-level log reduction back-calculated from the
        cumulative requirement), the range at set-point and the NOR-propagated range, a PAR
        plot per governed CQA via D.fig_par(UO, resp, D.governing_factor(UO, resp)) with the
        acceptable region shaded green, and how the univariate PARs relate to the
        multivariate design space.
    - id: capability
      heading: "Process capability and robustness"
      length_band: M
      pull: [cap_for, "V['n_monte_carlo']"]
      covers: >-
        The Monte-Carlo capability of V['n_monte_carlo'] NOR-bounded batches from
        cap_for(keys), one-sided Cpk per CQA with its margin to the limit, which capability
        is tightest, and this step's contribution to attributes shared with other steps.
    - id: parameter_classification
      heading: "Parameter classification"
      length_band: M
      pull: [report_params]
      covers: >-
        One bulleted rationale per parameter (the one place prose bullets are idiomatic in
        the corpus): the class and why, from the demonstrated effects and the operating-region
        risk, including the factors with no significant effect, and the KPP/CPP summary.
    - id: control_strategy
      heading: "Contribution to the control strategy"
      length_band: M
      covers: >-
        This step's control contributions — parameter ranges, in-process monitoring,
        life-cycle controls, release testing, any feed-input controls arising from a
        deviation — with the attributes other steps control named by document, and the
        roll-up to PCMR-001.
    - id: discussion
      heading: "Discussion"
      length_band: M
      covers: >-
        What is now understood, confidence in the scale-down model's representativeness, the
        deviations and their resolution in summary, the principal limitations (scale-down,
        small-scale spiking, resin life-cycle) and how each is managed forward.
    - id: conclusions
      heading: "Conclusions"
      length_band: S
      covers: >-
        The resolution in brief: the region defined, the ranges justified, the CQAs meeting
        acceptance at commercial scale with the tightest Cpk named, deviations resolved, and
        the roll-up to PCMR-001; no new facts.
    - id: deviations
      heading: "Deviations from the plan"
      length_band: M   # S if all deviations are minor 'retained'; L for invalidate+re-execute
      pull: [dev_register, dev_facts, "dev_* scalars"]
      covers: >-
        The deviations, authored from the brief's structured facts (Option A): the count and
        the dev_register table, then one subsection per deviation with what went wrong and
        its magnitude (the dev_* scalars), the investigation and root cause, the impact
        assessment and the disposition; for an invalidate-and-re-execute deviation, the real
        superseded study is referenced and the requalified dataset analysed.
    - id: appendices
      heading: "Appendices A-D"
      length_band: L
      subsections:
        - {id: appA, heading: "Appendix A — Screening design matrix and responses",
           note: "D.coded_matrix_df(key,'screening') split into coded settings + responses."}
        - {id: appB, heading: "Appendix B — Response-surface design matrix and responses",
           note: "D.coded_matrix_df(key,'rsm') split similarly."}
        - {id: appC, heading: "Appendix C — Full effect and coefficient tables",
           note: "D.screening_effects_df for all responses; D.rsm_coeff_df for the
                  remaining responses not shown in Results."}
        - {id: appD, heading: "Appendix D — Analytical methods summary",
           note: "Static methods table (technique / analyte / AMV / reportable)."}
      covers: >-
        A one-line introduction per appendix, then the helper-emitted table; the appendices
        carry depth without prose.

# -------------------------------------------------------------------------------------
report_nondoe:
  applies_to: [harvest, ufdf]
  inherits: report_doe
  overrides:
    note: >-
      Same arc and front/closing matter, but NO DoE. Do not fabricate screening/RSM.
    sections:
      study_design: >-
        Replace screening/RSM subsections with the univariate / qualitative
        characterization design (ranges assessed one at a time, verification runs).
      results: >-
        Replace the screening-effects / RSM-models / mechanistic subsections with
        univariate results and qualitative/mass-balance characterization, and the
        capability and robustness directly. Shorter is correct (CLAUDE.md depth targets).
      design_space: >-
        Usually a proven-acceptable-range / operating-range statement rather than a
        multivariate region; say so.
      appendices: >-
        No design matrices; keep analytical-methods and any univariate data tables.

# -------------------------------------------------------------------------------------
plan:
  id_scheme: "PCP-00N"
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    A protocol: PROSPECTIVE (future tense for what WILL be done), ~15-22 pp. It states
    what will be studied and the acceptance/decision criteria BEFORE data exist — so it
    uses plan_params(key) (no post-hoc classification) not report_params, and states no
    findings. DoE vs non-DoE handled per-section as in the reports.
  sections:
    - id: purpose_scope
      heading: "Purpose and scope"
      length_band: S
      covers: >-
        Why this characterization exists and what it covers: this step, these attributes,
        this scale-down model.
    - id: objectives
      heading: "Objectives"
      length_band: S
      covers: "Numbered objectives, mirroring the report's (i)-(v) but as intentions."
    - id: related_documents
      heading: "Related documents"
      length_band: XS
      pull: [related_docs_md, sop_table]
      covers: "The related_docs_md(DOC) table and the SOP/AMV table, one line of introduction each."
    - id: prior_knowledge
      heading: "Prior knowledge and quality risk basis"
      length_band: M
      subsections:
        - {id: uo_description, heading: "Unit-operation description and prior knowledge"}
        - {id: cqas_in_scope, heading: "Quality attributes in scope", note: "cqas_for / cqas_by_keys"}
        - {id: risk_prioritization, heading: "Risk-based prioritization of parameters", note: "RA-001 basis"}
      covers: "As the report's, framed as the basis for the planned scope."
    - id: materials_methods
      heading: "Materials and methods"
      length_band: L
      subsections:
        - {id: sdm_qualification, heading: "Scale-down model and its qualification"}
        - {id: operation, heading: "Cell line, media and culture operation | Operation"}
        - {id: analytical_methods, heading: "Analytical methods", note: "sop_table(amvs=<KEY>_AMV_REFS)"}
        - {id: sampling_plan, heading: "Sampling plan"}
        - {id: statistical_methods, heading: "Statistical methods", note: "the planned analysis"}
      covers: "How the study will be run and analysed, at the depth of the report's methods."
    - id: study_design
      heading: "Study design"
      length_band: M
      pull: [plan_params, "D.factor_legend_df"]
      subsections:
        - {id: factors_ranges, heading: "Factors, ranges and study type", note: "plan_params(key)"}
        - {id: screening_design, heading: "Screening design", note: "DoE steps only"}
        - {id: rsm_design, heading: "Response-surface design", note: "DoE steps only"}
        - {id: univariate, heading: "Univariate assessment"}
      covers: >-
        The planned design from plan_params(key) — range studied, NOR and study type, no
        classification; univariate/qualitative design only for the non-DoE steps.
    - id: acceptance_criteria
      heading: "Acceptance and decision criteria"
      length_band: M
      covers: >-
        The prospective decision rules: model-adequacy thresholds, how the operating region
        and the PARs will be declared, what constitutes a pass; criteria, not outcomes.
    - id: proven_acceptable_ranges
      heading: "Proven acceptable ranges (planned analysis)"
      length_band: M
      covers: >-
        The planned PAR determination: per CQA the acceptance basis (the drug-substance
        specification, or for a viral-clearance CQA the required step contribution
        back-calculated from the cumulative requirement), the two analyses to be run per
        parameter (at set-point; NOR-propagated by Monte-Carlo of the fitted model), the
        decision rule, and that each PAR will be reported with a green-shaded plot; no results.
    - id: data_management
      heading: "Data management and integrity"
      length_band: S
      covers: "ALCOA+, the systems, the review; short and procedural."
    - id: roles
      heading: "Roles and responsibilities"
      length_band: S
      covers: "RACI-style prose or a short table over the functions."
    - id: deliverables_schedule
      heading: "Deliverables and schedule"
      length_band: S
      covers: "The report (PCR-00N) as the deliverable and the phase sequence; no real dates."
    - id: risks_assumptions
      heading: "Risks and assumptions"
      length_band: S
      covers: "The study risks (SDM representativeness, material supply) and the assumptions."
    - id: approvals_body
      heading: "Approvals"
      length_band: XS
      covers: "An approval statement referencing the front-matter Approvals table."
    - id: appendices
      heading: "Appendices A-B — Planned design matrices"
      length_band: M
      covers: "The planned (not executed) coded design matrices for DoE steps; omitted for non-DoE."

# =====================================================================================
# CORPUS-LEVEL DOCUMENTS
# -------------------------------------------------------------------------------------
# The four one-off documents that frame the per-unit-operation package; only the section
# list differs from the per-step documents. Structures follow pc_package/TASKS.md
# "Transfer & master documents".
#
# Dependency: PCMR-001 rolls up every PCR-00N and is written LAST. The other three are
# independent of each other (cross-references resolve by ID, not by text).
# =====================================================================================

transfer_plan:
  id_scheme: PTP-001
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    Prospective tech-transfer plan moving the A-Mab drug-substance process from the sending
    site (Cambridge, MA — Development) to the receiving site (Grafton, WI — Commercial DS).
    Grounded in ICH Q10 (technology transfer) and the FDA 2011 lifecycle approach. It is the
    PARENT of the characterization package: it frames why every PCP/PCR exists. ~15-20 pp.
  sections:
    - id: purpose_scope
      heading: "Purpose and scope"
      length_band: S
      covers: >-
        What is being transferred, between which two sites and why: the product, the process
        train, the document package this plan parents, and what is out of scope (drug product,
        the commercial PPQ execution itself).
    - id: product_process
      heading: "Product and process description"
      length_band: M
      covers: "A-Mab and the drug-substance train, Steps 3-10, via process_steps_df(), each step's role; no results."
    - id: sites
      heading: "Sending and receiving sites"
      length_band: S
      covers: "The two sites and their roles from SENDING_SITE / RECEIVING_SITE; which activities remain at development and which move."
    - id: equivalency
      heading: "Site equivalency analysis"
      length_band: M
      covers: >-
        The two sites compared on equipment train and scale, control capability, utilities,
        analytical capability and quality system, what each difference means for the process
        and how it is managed.
    - id: sdm_comparability
      heading: "Scale-down model and comparability strategy"
      length_band: M
      covers: >-
        How the qualified scale-down models support the transfer, how comparability between
        sites will be demonstrated, and the per-step plans (PCP-003 to PCP-010) that execute
        the characterization on those models.
    - id: transfer_elements
      heading: "Transfer of the process, methods and control strategy"
      length_band: L
      covers: >-
        Three sub-sections: the manufacturing process (batch records, process description,
        set-points and ranges), the analytical methods (transfer and re-qualification at the
        receiving site, sop_table / AMV references), and the control strategy, with what each
        transfer step delivers and who signs it off.
    - id: ppq_strategy
      heading: "Process performance qualification strategy"
      length_band: M
      covers: >-
        How Stage 2 follows from this transfer: the PPQ batch strategy, what the
        characterization package must deliver before PPQ can start, and the link to
        PCMP-001 / PCMR-001; prospective throughout.
    - id: gap_analysis
      heading: "Gap analysis"
      length_band: M
      covers: "The identified transfer gaps, each with its impact, the action that closes it and its owner."
    - id: roles
      heading: "Roles and responsibilities"
      length_band: S
      covers: "Sending site, receiving site, quality; three sentences and a table."
    - id: schedule
      heading: "Deliverables and schedule"
      length_band: S
      covers: "The deliverables this plan commits to and their sequence."
    - id: approvals_body
      heading: "Approvals"
      length_band: XS
      covers: "One sentence plus the approval table."

risk_assessment:
  id_scheme: RA-001
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    The PRE-characterization risk assessment, derived from PTP-001. Its output is the
    characterization SCOPE: which parameter gets which study type. It is written BEFORE the
    studies, so it uses INITIAL occurrence/detection and the study-type decision, NEVER a
    post-characterization residual RPN and NEVER a final parameter classification. Content
    source: pc_package/ra_content.py (curated failure-mode / effect / control text) and
    refs/grounding/amab_risk.json (the risk-ranking-and-filtering rule). ~15-20 pp.
  sections:
    - id: purpose_scope
      heading: "Purpose and scope"
      length_band: S
      covers: >-
        Why this assessment exists and what it decides: performed before characterization,
        its output is the study scope and not a classification; PTP-001 is the parent and
        the PCP-00N documents are the consumers.
    - id: methodology
      heading: "Risk assessment methodology"
      length_band: M
      covers: >-
        The risk-ranking-and-filtering method — severity from the potential impact on a CQA,
        combined with the potential for interaction with other parameters, scored to a
        study-type decision — with the scoring scales and thresholds, citing @amab2009 and
        @ichq9, criticality as a continuum.
    - id: cqas_at_risk
      heading: "Quality attributes at risk"
      length_band: M
      covers: "The CQAs the process must control, their criticality and the step that sets each: the severity axis of the assessment."
    - id: parameter_risk
      heading: "Parameter risk ranking by unit operation"
      length_band: XL
      covers: >-
        The technical core, per unit operation: the parameters carried into the assessment,
        their failure mode, effect and existing control, and the resulting score, with the
        parameters that drive each step's outcome named; steps with no CQA impact (harvest,
        UF/DF) are correctly short.
    - id: study_assignment
      heading: "Characterization study assignment"
      length_band: M
      covers: >-
        The output of this document: which parameters go into a multivariate design, which
        are assessed univariately, which are not studied because the risk is low, and the
        reason for each group; the assignment is prospective and revisited after the studies
        report.
    - id: assumptions
      heading: "Assumptions and limitations"
      length_band: S
      covers: "What this assessment assumes (platform transferability, completeness of the parameter list) and what it cannot yet know."
    - id: outputs
      heading: "Outputs and downstream use"
      length_band: S
      covers: "Which document consumes this assessment, per step."
    - id: approvals_body
      heading: "Approvals"
      length_band: XS
      covers: "One sentence plus the approval table."

master_plan:
  id_scheme: PCMP-001
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    The umbrella plan over every per-unit-operation plan. It states once what the individual
    PCP-00N documents would otherwise each restate: the CQA framework, the common scale-down
    and statistical approach, and the acceptance-criteria framework. Prospective. ~15-20 pp.
  sections:
    - id: purpose_scope
      heading: "Purpose and scope"
      length_band: S
      covers: "What the campaign covers, which steps, and how this plan relates to PTP-001 (parent), RA-001 (scope) and the PCP-00N documents (children)."
    - id: strategy
      heading: "Stage 1 characterization strategy"
      length_band: M
      covers: >-
        The enhanced, quality-by-design approach: prior knowledge and risk assessment build
        process understanding, characterization bounds it, and the result is a control
        strategy; cite @fda2011, @ichq8, @ichq9, @ichq11.
    - id: cqa_framework
      heading: "Critical quality attribute framework"
      length_band: M
      covers: "The full CQA register with acceptance criteria and criticality, and which step sets each."
    - id: risk_basis
      heading: "Risk-based prioritization"
      length_band: M
      covers: "RA-001's outcome across the whole train — how many parameters go to multivariate study, how many to univariate, and the reasoning — by reference to RA-001."
    - id: sdm_strategy
      heading: "Scale-down model strategy"
      length_band: M
      covers: "The common approach to scale-down models and their qualification across the train, so each PCP-00N need only state its step-specific detail."
    - id: statistical_approach
      heading: "Common statistical approach"
      length_band: M
      covers: >-
        The shared statistical method — screening then response surface, the significance
        level, model adequacy criteria, how capability is estimated — and, once for the whole
        campaign, that the screening design identifies effects and the response-surface model
        is the predictive one.
    - id: acceptance_framework
      heading: "Acceptance criteria framework"
      length_band: M
      covers: >-
        The framework each PCP-00N instantiates: what makes a scale-down model qualified, a
        model adequate, an operating region acceptable and a parameter classified; where a
        numeric threshold is not grounded in the model, the criterion is defined per study.
    - id: plan_register
      heading: "Register of characterization plans"
      length_band: S
      covers: "The PCP-003 to PCP-010 list with each step's subject, one table."
    - id: schedule
      heading: "Deliverables and schedule"
      length_band: S
      covers: "Deliverables and sequence."
    - id: approvals_body
      heading: "Approvals"
      length_band: XS
      covers: "One sentence plus the approval table."

master_report:
  id_scheme: PCMR-001
  front_matter: [title_block, syn_banner, approvals, abbreviations]
  closing: [references_unnumbered, refs_div]
  note: >-
    The roll-up of every per-unit-operation report. WRITTEN LAST. It summarizes and CITES the
    PCR-00N documents rather than re-deriving them, and its numbers come from the model
    (report_values.json, capability.csv, viral_clearance.csv, parameter_classification.csv).
    It is the document an assessor reads to see whether the process as a whole is ready for
    Stage 2. ~25-30 pp.
  sections:
    - id: exec_summary
      heading: "Executive summary"
      unnumbered: true
      length_band: M
      covers: >-
        The whole campaign's outcome: the process characterized, the control strategy
        defined, the outcome against each requirement, the tightest capability with its
        margin, the cumulative viral clearance against its requirement, the
        parameter-classification counts, and that Stage 2 has not yet been executed.
    - id: introduction
      heading: "Introduction"
      length_band: M
      covers: "The campaign, its documents and the regulatory basis, naming PTP-001, RA-001, PCMP-001 and every PCR-00N."
    - id: process_description
      heading: "Process description and performance"
      length_band: M
      covers: "The train, Steps 3-10, with each step's role and performance."
    - id: cqa_outcomes
      heading: "Consolidated quality attribute outcomes"
      length_band: L
      covers: >-
        Every drug-substance CQA, its acceptance criterion and its outcome, with the step that
        sets it and the steps that clear it, naming the contributing documents.
    - id: parameter_classification
      heading: "Parameter classification summary"
      length_band: M
      covers: >-
        The consolidated classification across all parameters with the counts by class, the
        single CPP and why it is the only one, and the parameters whose classification rests
        on bounding rather than on a measured effect.
    - id: capability
      heading: "Process capability"
      length_band: M
      covers: >-
        Commercial-scale capability across every CQA, the tightest Cpk with its margin, and
        that it is estimated from qualified scale-down models with parameters inside their
        NORs and confirmed at commercial scale during Stage 2.
    - id: viral_clearance
      heading: "Viral clearance summary"
      length_band: M
      covers: >-
        The modular clearance claim: each contributing step's log reduction, the cumulative
        total against its requirement, the orthogonality argument, which steps are credited
        and which are not; cite @ichq5a.
    - id: control_strategy
      heading: "Overall control strategy"
      length_band: L
      covers: >-
        How the elements combine — parameter ranges, in-process controls, release testing,
        life-cycle controls and feed-input controls — and what the control strategy does not
        cover.
    - id: deviations
      heading: "Deviations across the campaign"
      length_band: M
      covers: "The deviations recorded across the campaign, their magnitude and disposition, with each step's report referenced for the investigation."
    - id: conclusions
      heading: "Conclusions and Stage 2 readiness"
      length_band: M
      covers: "What the campaign established, what remains for Stage 2, and the bound on every claim made; no new facts."
