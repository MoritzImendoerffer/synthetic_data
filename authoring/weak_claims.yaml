# =====================================================================================
# weak_claims.yaml — labeled benchmark negatives, ASSIGNED BEFORE AUTHORING
# -------------------------------------------------------------------------------------
# The corpus's default invariant is that every claim is grounded (CLAUDE.md golden rule 3).
# This file is the controlled exception: a small number of fluent, in-register but
# UNSUPPORTED or OVERSTATED claims, so an evidence-grounding benchmark has labeled
# negatives — claim verification, overstatement detection, "does the cited evidence
# actually support this sentence?".
#
# READ authoring/WEAK_CLAIMS.md FIRST. The short version of why this file looks the way
# it does:
#
#   The first attempt PLANTED these claims into finished documents. That failed. A claim
#   written against settled prose cannot be merely unsupported — it lands in a paragraph
#   that has already answered the question it overreaches on, so it reads as a
#   CONTRADICTION of its neighbour. That turns an evidence-grounding task into a much
#   easier contradiction-detection task, and every gate passes it silently.
#
# So each claim now has two phases, and the order is the whole point:
#
#   assignment:  written BEFORE the document. Says which fact the claim distorts, what
#                the author should assert instead, and where to put it. Surfaced in the
#                author's brief, so the claim is written INTO the argument in one pass and
#                the surrounding prose accommodates it.
#   captured:    filled in AFTER the document is rendered. Records the author's actual
#                wording verbatim, so the annex can ground the span.
#
# `captured` is a post-hoc step, but it RECORDS what was written — it never changes the
# document. That distinction is the line between this and the retired approach.
#
# Rules
#   * The author writes ONLY the claims named in their brief (WRITING_GUIDE §7a). Every
#     other claim in the document must be fully grounded.
#   * A claim must be UNSUPPORTED, not CONTRADICTED. If a neighbouring sentence rebuts it,
#     the placement is wrong — fix the placement, not the neighbour.
#   * Each claim must still read as in-register prose. A negative that is detectable by
#     style rather than by evidence is worthless; check_style.py measures the document as
#     a whole, so a clumsy plant will not be caught by the gate — it is on you.
# =====================================================================================

meta:
  purpose: >-
    Labeled negative examples for evidence-grounding tasks: a model must flag these as
    unsupported or overstated despite their fluent, in-register phrasing, and (harder)
    distinguish them from the grounded claims around them.
  weakness_types:
    unsupported_prior_knowledge: >-
      Appeals to prior or platform experience with no citation and no data — typically to
      wave away a result or justify not studying something.
    overstated_outcome: >-
      Claims more than the study design or the statistics support — e.g. presenting the
      screening model as the predictive / design-space model, or "proves".
    unbounded_generalization: >-
      A robustness or capability claim with no range, model or scale-down bound.
    missing_citation: >-
      A factual claim that requires a reference (a guidance, a prior product, the case
      study) and gives none.
  annex_representation: >-
    build_weak_claims_annex.py verifies each captured quote appears verbatim in the
    rendered document and emits it as a ground-truth assertion with support =
    "unsupported", the weakness_type and the rationale. build_ground_truth.py merges the
    same records, so the annex both GROUNDS the span (the quote exists) and LABELS it weak.
  gate_note: >-
    The render, numeral and register gates deliberately do NOT reject these. They check
    executable expressions, typed numerals and sentence-level register — not whether a
    claim is supported. That gap is the point: the weakness is a content judgement and the
    label lives in the annex.

claims:

  PCR-003:
    - id: WC-003-01
      section: results
      weakness_type: unsupported_prior_knowledge
      assignment:
        distorts: >-
          Dissolved oxygen is classified KPP and assessed univariately. This campaign
          generated no A-Mab data on its effect on the glycan profile, so nothing in the
          report supports a claim about that effect in either direction.
        write: >-
          Dismiss dissolved oxygen as an influence on glycosylation by appealing to
          unnamed platform manufacturing experience. No citation, no data, and absolute in
          tone, so the reader is invited to accept it because it sounds authoritative.
        placement: >-
          In the screening-effects discussion, where the active factors are being
          separated from the inactive ones. Do NOT put it next to a sentence that cites
          prior knowledge properly or that reports a univariate result — it must lack
          support, not be rebutted by its neighbour.
      captured:
        quote: >-
          Platform manufacturing experience across the humanized IgG1 programmes has
          established that dissolved oxygen does not influence the glycan profile at any
          level a production vessel can hold.
        note: >-
          Well placed. The preceding sentence grants dissolved oxygen "a credible route to
          the glycan attributes, because oxygen supply sets the redox state of the culture
          and the supply of nucleotide sugar donors" — so the claim acknowledges a
          mechanism and then waves it away on unnamed authority. That is the authentic
          shape of an unsupported dismissal, and it is not a contradiction: no neighbour
          reports an A-Mab result for dissolved oxygen, because none exists.
        rationale: >-
          Attributes a factor-effect conclusion to unnamed "prior manufacturing
          experience" with no citation and no data, and uses it to dismiss a parameter the
          report elsewhere classifies from evidence. "At any level a production vessel can
          hold" generalises past any range the campaign examined.
        correct_version: >-
          Cite the prior knowledge from references.bib, or state that no A-Mab data were
          generated for dissolved oxygen and that its classification rests on RA-001 and
          the platform. A parameter is classified from data or from a cited basis, never
          by appeal to unreferenced experience.

    - id: WC-003-02
      section: results
      weakness_type: overstated_outcome
      assignment:
        distorts: >-
          The screening design identifies which factors are active; the response-surface
          model is the predictive model and the basis of the design space. The report
          states this division correctly elsewhere, and the screening fit is near-saturated
          with little predictive latitude.
        write: >-
          Credit the screening design itself with establishing the multivariate design
          space and with demonstrating robustness across conditions the study did not
          examine. Use confident, conclusive verbs.
        placement: >-
          In the screening section, before the response-surface models are introduced.
          Critically, do NOT place it in the same paragraph as the
          screening-identifies/RSM-predicts framing sentence — a reader who sees both in
          one breath detects a contradiction rather than an overstatement.
      captured:
        quote: >-
          Taken together, the screening results establish the multivariate design space for
          the five well-controlled culture parameters. The effect estimates are large and
          consistent in direction, and they demonstrate that the step remains robust at
          parameter combinations beyond those examined here.
        note: >-
          Placement checked. The screening-identifies / RSM-predicts framing lives in §4.3
          and is restated at the head of §5.3, never in this paragraph or its neighbours,
          which are pure effect narration. The screening predicted-R² values that would
          refute it sit in an Appendix C table rather than in a sentence. The galactosylation
          edge of failure is INSIDE the examined region, so it does not collide with a claim
          about combinations "beyond those examined".
        rationale: >-
          Presents the near-saturated screening model as the predictive and design-space
          model, which is the response-surface model's role, and generalises to conditions
          outside the characterized ranges. "Establish" and "demonstrate" claim proof the
          statistics do not support.
        correct_version: >-
          The screening design identifies the active factors; the response-surface model
          is the predictive model and the basis of the design space, and robustness is
          claimed only within the characterized ranges.

  PCR-009:
    - id: WC-009-01
      section: capability
      weakness_type: unbounded_generalization
      assignment:
        distorts: >-
          MVM clearance falls as the volumetric load rises, and the claim holds only up to
          the stated load limit and only on the qualified scale-down spiking model.
          Capability is estimated from that model with the parameters inside their NORs,
          and Stage 2 confirms it at commercial scale.
        write: >-
          Turn the scale-down capability estimate into an open-ended guarantee of viral
          safety at commercial scale, with no load bound, no model bound and no mention of
          Stage-2 confirmation.
        placement: >-
          At the close of the capability section. Keep it away from the load-limit
          sentence and from the "three bounds apply to this claim" passage — those state
          exactly the bounds this claim omits, and adjacency would make it a contradiction
          instead of an overreach.
      captured:
        quote: >-
          The margins recorded above are wide on both model viruses, and they establish the
          small-virus safety of A-Mab drug substance at commercial scale.
        note: >-
          The subtlest of the four. It closes the capability section three paragraphs after
          the "Three bounds apply to these figures" passage that names the very bounds it
          omits, and the load limit sits in different sections entirely. Its immediate
          neighbour supplies apparent SUPPORT rather than a rebuttal — "Across the 2,000
          simulated batches no batch fell below the acceptance limit for either virus" — so
          a reader must trace simulation to scale-down spiking model to unconfirmed-at-scale
          before the overreach is visible. The subject is "the margins", not "this step", so
          it does not collide with the cross-step-credit paragraph above it.
        rationale: >-
          States commercial-scale viral safety from a scale-down estimate, omitting the load
          limit that the report's own principal finding establishes, the scale-down bound,
          and the Stage-2 confirmation the lifecycle framework requires. The margins are
          real; what is unsupported is the leap from them to safety at commercial scale.
        correct_version: >-
          Capability is estimated from the qualified scale-down model with the parameters
          within their normal operating ranges and the volumetric load at or below its
          limit; it is confirmed at commercial scale during Stage 2.

  PCP-006:
    - id: WC-006-01
      section: prior_knowledge
      weakness_type: missing_citation
      assignment:
        distorts: >-
          The transferability of low-pH inactivation knowledge from the prior products
          rests on the A-Mab case study, which the corpus cites as @amab2009. The platform
          claim is legitimate; what makes this weak is asserting it with no reference.
        write: >-
          Assert that the inactivation kinetics established on the prior products transfer
          directly to A-Mab, as a matter of settled platform fact, without citing anything.
        placement: >-
          In the platform prior-knowledge subsection. Do not place it adjacent to a
          correctly cited sentence — a bare assertion sitting beside a cited one reads as
          an editing slip rather than as an unsupported claim.
      captured:
        quote: >-
          The inactivation kinetics established on the prior products transfer directly to
          A-Mab, and the low-pH hold is treated here as a settled platform operation.
        rationale: >-
          A transferability claim of this weight requires a reference. The document cites
          @amab2009 elsewhere for exactly this basis, so the omission is not a stylistic
          choice; the claim stands on nothing a reader can check.
        correct_version: >-
          Cite the A-Mab case study for the platform inactivation data, and state which
          prior products the kinetics were established on.
