# =====================================================================================
# weak_claims.yaml — deliberately planted, LABELED weak claims (a benchmark feature)
# -------------------------------------------------------------------------------------
# The corpus's default invariant is that every claim is grounded (CLAUDE.md golden rule 3).
# This file is the controlled EXCEPTION: a small number of fluent, in-register but
# UNSUPPORTED / OVERSTATED claims are planted into a report so the benchmark has labeled
# negative examples for evidence-grounding NLP tasks (claim verification, hallucination /
# overstatement detection, "does the evidence support this sentence?").
#
# Each claim:
#   * appears VERBATIM in the report prose (so it is span-groundable like any annex quote),
#   * is not a typed measurement (so the numeral lint does not flag it) and renders cleanly
#     (so the render gate passes) — which is exactly why a *content* label is needed,
#   * is LABELED here and, via build_weak_claims_annex.py, in the ground-truth annex, with
#     its weakness_type, a rationale, and the grounded (correct) version it distorts.
#
# This is the ONLY sanctioned way to write an ungrounded claim. It is not licence to relax
# grounding elsewhere: a claim that is not registered here must still be fully supported.
# =====================================================================================

meta:
  purpose: >-
    Labeled negative examples for evidence-grounding tasks: a model must flag these as
    unsupported / overstated despite their fluent, in-register phrasing, and (harder)
    contrast them with the grounded claims around them.
  weakness_types:
    unsupported_prior_knowledge: >-
      Appeals to prior / platform experience with no citation and no data — often used to
      wave away a result or justify not studying a parameter.
    overstated_outcome: >-
      Claims more than the study design or statistics support — e.g. presenting the
      screening model as the predictive / design-space model (the RSM is), or "proves".
    unbounded_generalization: >-
      A robustness or capability claim with no range / model / scale-down bound — e.g.
      "robust to all conditions", "guaranteed indefinitely", "no confirmation required".
    missing_citation: >-
      A factual claim that requires a reference (a guidance, a prior product, a case study)
      and gives none.
  annex_representation: >-
    build_weak_claims_annex.py emits each claim as a ground-truth assertion with
    support = "unsupported", the verbatim quote (checked to appear in the document),
    the weakness_type and the rationale. When the full annex is built
    (pc_package/build_ground_truth.py), the same records are merged in — so the annex both
    GROUNDS the span (the quote exists) and LABELS it weak (support = unsupported).
  gate_note: >-
    The render + numeral gates deliberately do NOT reject these — they check executable
    expressions and typed numerals, not prose overstatement. That gap is the point: the
    label lives in the annex, not the gate.

claims:
  PCR-003:
    - id: WC-003-01
      section: results
      weakness_type: unsupported_prior_knowledge
      quote: >-
        Extensive prior manufacturing experience with this platform has consistently shown
        that dissolved oxygen has no bearing whatsoever on the glycosylation profile, so its
        contribution can be discounted.
      rationale: >-
        Attributes a factor-effect conclusion to unnamed "prior manufacturing experience"
        with no citation and no data, and uses it to dismiss a parameter that is in fact
        classified KPP and assessed univariately. Absolute ("no bearing whatsoever",
        "discounted") on no evidence.
      correct_version: >-
        Cite the prior knowledge (references.bib) or present the univariate dissolved-oxygen
        result; a parameter is classified from data, not dismissed by appeal to unreferenced
        experience.
    - id: WC-003-02
      section: results
      weakness_type: overstated_outcome
      quote: >-
        The screening design alone conclusively establishes the multivariate design space
        and proves that the process is robust to all foreseeable operating conditions.
      rationale: >-
        Presents the near-saturated screening model as the predictive / design-space model
        (that is the response-surface model's role — WRITING_GUIDE framing rule), and
        generalizes to "all foreseeable operating conditions", which the characterized
        ranges do not cover. "Conclusively", "proves" overstate the statistics.
      correct_version: >-
        The screening design identifies the active factors; the response-surface model is
        the predictive / design-space model, and robustness is claimed only within the
        characterized ranges.
    - id: WC-003-03
      section: exec_summary
      weakness_type: unbounded_generalization
      quote: >-
        Because every attribute met its acceptance criterion at scale-down, the commercial
        process is guaranteed to produce in-specification drug substance indefinitely, and no
        further confirmation at commercial scale is required.
      rationale: >-
        Overstates a scale-down Monte-Carlo capability estimate as an indefinite commercial
        guarantee and denies the need for Stage-2 at-scale confirmation, contradicting the
        lifecycle framework (FDA 2011) the report itself cites. No scale-down or
        assumption bound.
      correct_version: >-
        Capability is estimated from the qualified scale-down model with parameters within
        their NORs and is confirmed at commercial scale during Stage 2; it is not an
        indefinite guarantee.
