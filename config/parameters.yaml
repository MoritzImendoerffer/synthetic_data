# =====================================================================================
# Analytical model (Rev 2.0): which method measured fragments in which study, and how SEC
# reads them in each matrix. Every value below is drawn AFTER the DoE run, from its own RNG
# stream (seed + rng_offset + study index), so no pre-existing response moves: Rev 1.0 and
# Rev 2.0 analyse the same experiments (tests/test_analytics.py proves it).
#
# The finding the model encodes: SEC LMW is biased HIGH wherever the matrix still carries host
# cell protein, because part of it elutes in the LMW window. The bias is bounded by mass: host cell
# protein at 9,000 ng/mg is 0.9 % of the protein in the sample, and only the fraction of it that
# elutes in the LMW window (`lmw_fraction`) can appear as "fragments". Leached Protein A, at a few
# ppm, is too little to matter and is not part of the model. The bias scales with the pool's own
# HCP, so in the Protein A screening design SEC "sees" the load and elution-pH effects that are
# really HCP effects. After CEX the matrix is clean and SEC agrees with CE-SDS within the
# precision of either method. AMD-001 moved fragments to nrCE-SDS for every study executed after
# 2026-03-20, at every step, so that one method spans the train (fragment levels at two steps can
# only be compared when one method measured both).
# Corrected 2026-10-08 after the INV-001 review: the first version of this model also added
# 0.06 % per ppm of leached Protein A and let the HCP term exceed the HCP mass present, which is
# physically impossible.
# =====================================================================================
analytics:
  rng_offset: 7000
  methods:
    sec:   {id: AMV-3011, name: "Size variants by SEC-HPLC",              sop: SOP-3011, sd_abs: 0.04}
    cesds: {id: AMV-3020, name: "Purity by non-reduced CE-SDS",          sop: SOP-3015, sd_abs: 0.06, loq: 0.10}
  # SEC LMW bias (absolute %) = lmw_fraction * pool HCP (ng/mg) / 1e4  (1e4 ng/mg = 1 %)
  sec_bias: {lmw_fraction: 0.50}
  # true fragment model (clipped species, % of product)
  fragments:
    harvest_base: 1.10              # at the end of culture, nominal duration
    harvest_duration_coef: 0.12     # per coded culture-duration unit (longer run, more clipping)
    harvest_hold_rate_2_8: 0.015    # % per day, clarified harvest at 2-8 C
    harvest_hold_rate_rt: 0.080     # % per day, clarified harvest at room temperature
    protein_a_passthrough: 0.82     # Fab-type fragments lack Fc and are lost in the flow-through
    protein_a_elution_ph_coef: -0.06  # per coded elution pH (lower pH, a little more)
    vi_delta_180: 0.12              # added over 180 min at the design-centre temperature
    vi_temp_coef: 0.30              # relative, per coded temperature
    cex_clearance_fold: 1.55        # fragments elute ahead of the main peak and are cut in part
    cex_stop_collect_coef: -0.10    # relative change of the fold per coded stop-collect
  # which method measured fragments in which study: "sec", "cesds", or both. Absent = not tested.
  # retest: CE-SDS on retained RSM samples (screening samples were not retained past 30 days).
  plan:
    S-PA-SCR:  [sec]
    S-PA-RSM:  [sec, cesds]         # cesds from retained samples, S-PA-RET
    S-VI-SCR:  [sec]
    S-VI-RSM:  [sec, cesds]         # cesds from retained samples, S-VI-RET
    S-CEX-SCR: [sec]
    S-CEX-RSM: [sec, cesds]         # run in parallel, the comparability that led to AMD-001
    S-AEX-SUP: [sec]
    S-AEX-SCR: [cesds]
    S-AEX-RSM: [cesds]
    S-VF-DOE:  [cesds]
    S-VF-RSM:  [cesds]
    # hold studies (appended last, so no stream index above moves): made in September 2026, after
    # AMD-001, so fragments by nrCE-SDS at every time point and SEC for aggregate only (owner, 2026-10-09)
    S-HAR-HLD: [cesds]
    S-PA-HLD:  [cesds]
    S-VI-HLD:  [cesds]
    # INV-002 augmentations (appended last, so no index above moves; only the studies the rule gives a step are run): nrCE-SDS, after AMD-001
    S-PA-AUG:  [cesds]
    S-VI-AUG:  [cesds]
    S-CEX-AUG: [cesds]
    S-AEX-AUG: [cesds]
    S-VF-AUG:  [cesds]
    S-VI-OFAT: [cesds]
    S-CEX-VER: [cesds]
    S-VI-WC:   [cesds]
  # intermediate hold studies (A-Mab Table 4.17 is the model for the VI pool), made during the Version 2.0
  # re-analysis (owner, 2026-10-09): nrCE-SDS on every sample (cesds_days = days)
  holds:
    harvest:            {study: S-HAR-HLD, temps: ["2-8 °C", "21 °C"], days: [0, 1, 3, 5, 7], cesds_days: [0, 1, 3, 5, 7], hmw0: 1.10, hmw_rate: [0.005, 0.030], acid0: 21.5, acid_rate: [0.03, 0.22]}
    protein_a:          {study: S-PA-HLD,  temps: ["2-8 °C", "21 °C"], days: [0, 1, 3, 5, 7], cesds_days: [0, 1, 3, 5, 7], hmw0: 1.60, hmw_rate: [0.010, 0.045], acid0: 21.8, acid_rate: [0.02, 0.15]}
    viral_inactivation: {study: S-VI-HLD,  temps: ["21 °C", "25 °C"],  days: [0, 1, 3, 5, 7], cesds_days: [0, 1, 3, 5, 7], hmw0: 1.80, hmw_rate: [0.035, 0.045], acid0: 22.4, acid_rate: [0.10, 0.16]}
  # scale-down model qualification (S-xx-SDM): set-point runs at both scales
  sdm:
    n_scale_down: 3
    n_manufacturing: 5
    # Offsets, not equivalence (owner's decision 2026-10-08: "it is ok if the models have
    # different means as long as the offset can be determined with sufficient precision").
    # offset = scale-down mean minus manufacturing mean, with its two-sided `offset_ci`
    # interval. Every Version 2.0 judgement subtracts it from the scale-down prediction. The
    # model is qualified for an output when its conclusion over the NOR is the same with the
    # offset at either end of the interval (doe_report.offset_qualification). Stated in
    # PCMP-001 Version 2.0 before any report used it.
    apply_offset: true
    offset_ci: 0.90
    assay_cv:                     # analytical repeatability on each qualification result
      acidic_variants: 0.02       # icIEF; without it low-pH inactivation passes the feed through unchanged
    scale_offset:                 # multiplicative, manufacturing scale only; a recorded scale effect
      # leached Protein A is higher at manufacturing scale: the manufacturing load is held longer
      # before capture, so host cell proteases in it cleave more ligand from the resin. (Leaching
      # by itself is highest on NEW resin and falls with use, so cycle number is not the cause.)
      protein_a: {leached_protein_a_ppm: 1.15}
    column:                       # column efficiency per run, mean and sd (chromatography steps)
      plates_per_m: [2600, 180]
      asymmetry: [1.18, 0.07]
    # Six set-point runs beyond the three PCP-005 planned, made during the Version 2.0
    # re-analysis to narrow the offset interval of pool host cell protein, the output that sets
    # the Protein A ranges. The plan did not foresee them, so PCR-005 records them as a
    # discrepancy from the plan (campaign.plan_discrepancies, PD-005-01), not as a deviation: no
    # procedure or GMP requirement was departed from. The qualification conclusion is the same
    # on the three planned runs alone, and the report shows it.
    supplementary:
      protein_a: {study: S-PA-SDM2, n: 6}
  # OFAT stability study at the re-centred inactivation pH (owner, 2026-10-09): the low-pH hold at pH 3.40
  # against the former set-point 3.50 as control, at the set-point temperature, over the hold times of
  # the NOR and the range studied, in duplicate. Time 0 is the pH-adjusted load before the hold.
  # owner, 2026-10-09: the XMuLV clearance that PCP-006 Version 1.0 required on every run of the A-Mab
  # concentration study and S-VI-UNI did not measure (DEV-006-03), at the two ends of the range studied,
  # in duplicate, the other parameters at their set-points as characterized (PD-006-06)
  vi_concentration:
    study: S-VI-UNI2
    parameter: protein_conc
    replicates: 2
  vi_ofat:
    study: S-VI-OFAT
    ph: [3.4, 3.5]
    hold_min: [0, 60, 90, 105, 120, 180]
    temperature: 21
    replicates: 2
  # Small-scale cation exchange runs on the worst-case material of the re-centred low-pH step (pH 3.40,
  # the longest hold and the highest temperature of the NOR in force), at the CEX set-point. The number
  # of runs is computed (amab_process/adequacy.verification_runs): each run's clearance fold is compared
  # with the fold the Version 2.0 criteria rely on, by a one-sided 95 % lower confidence bound on the mean
  # log fold, with the run-to-run SD from the CEX data; n is the smallest number of runs, at most
  # ``n_max``, that gives a power of ``power`` when CEX clears as its data show.
  # S-VI-WC (owner's decision 3, 2026-10-09): after the hold-time NOR was revised to 100-120 min, the
  # low-pH hold at the harshest combination within the PAR for the product (the lower end of the pH
  # range studied and of the pH PAR, the upper end of the hold-time and temperature NORs in force),
  # each run followed by a cation exchange run at set-point; as many runs as the CEX verification.
  vi_worst_case:
    study: S-VI-WC
    load_from: {ph: range_low, hold_time: nor_high, temperature: nor_high}
  # S-BRX-OSM (owner's decision 4, 2026-10-09: "get more data"; narrowing the osmolality NOR to the
  # set-point is not accepted): osmolality at three levels with the four response-surface parameters at
  # their least favourable NOR combination for acidic variants. Runs per level from the precision of
  # the prediction at the NOR high (analytics.osmolality_runs). Osmolality is set independently of pCO2.
  osmolality_study:
    study: S-BRX-OSM
    factor: osmolality
    levels: [nor_low, setpoint, nor_high]
    at: {pH: nor_high, temperature: nor_low, duration: nor_high, co2: nor_high}
    se_fraction: 0.5
    control: "sodium chloride added with each feed to the target osmolality, with pCO2 held at its level by the sparge"
  cex_verification:
    study: S-CEX-VER
    load_from: {ph: 3.4, hold_time: 120, temperature: 23}
    attributes: [aggregates_hmw, fragments_lmw]
    power: 0.80
    n_max: 3
    reps: 100000
  # Univariate studies of the two steps without a design (owner's option A, 2026-10-08):
  # S-HAR-UNI and S-UFDF-UNI. Each parameter at five levels (low, low-mid, set-point, mid-high,
  # high; the mid levels halfway between set-point and the range ends), in duplicate, the other
  # parameters at set-point. Effects are in process.harvest.model / process.ufdf.model. Every
  # result carries the repeatability of its method: an AMV id reads precision_pct from
  # deviations.methods, a number is a CV of our own.
  univariate_nodoe:
    # the Version 2.0 studies (decision 2, option c); S-HAR-UNI and S-UFDF-UNI are the Version 1.0
    # studies, which Version 1.0 narrated without a result for any parameter effect
    studies: {harvest: S-HAR-UNI2, ufdf: S-UFDF-UNI2}
    levels: [low, low-mid, set-point, mid-high, high]
    replicates: 2
    # Post-clarification turbidity is the outcome of the other two harvest parameters, not a
    # setting. PCMP-001 plans it one factor at a time, so it is studied as a challenge: clarified
    # filtrate adjusted to each level with centrate, the level measured (that response), centrate
    # turbidity not reported, the attributes recorded.
    challenge: {harvest: {turbidity: clarified_turbidity_ntu}}
    responses:
      harvest: [centrate_turbidity_ntu, clarified_turbidity_ntu, hcp_out_ng_mg, aggregate_out_pct, step_yield]
      ufdf: [residual_buffer_pct, ds_concentration_g_per_l, aggregate_out_pct, step_yield]
    assay:
      centrate_turbidity_ntu: AMV-3015
      clarified_turbidity_ntu: AMV-3015
      hcp_out_ng_mg: AMV-3012
      aggregate_out_pct: AMV-3221
      ds_concentration_g_per_l: AMV-3019
      residual_buffer_pct: 0.05           # conductivity-based residual buffer estimate; our assumption
  # CEX fraction comparability (S-CEX-FRC): sample sets and their count
  comparability:
    - {sample: "Protein A pool",  step: protein_a,          n: 4}
    - {sample: "VI pool",         step: viral_inactivation, n: 4}
    - {sample: "CEX load",        step: viral_inactivation, n: 2}
    - {sample: "CEX fraction F2", step: cex, n: 1, frag_mult: 2.6}
    - {sample: "CEX fraction F3", step: cex, n: 1, frag_mult: 1.1}
    - {sample: "CEX fraction F4", step: cex, n: 1, frag_mult: 0.7}
    - {sample: "CEX fraction F5", step: cex, n: 1, frag_mult: 0.5}
    - {sample: "CEX pool",        step: cex,                n: 4}
    - {sample: "AEX pool",        step: aex,                n: 2}
