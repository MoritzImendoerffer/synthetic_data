# =====================================================================================
# A-Mab drug-substance process — parameter & model configuration
# -------------------------------------------------------------------------------------
# Single numeric source of truth for the process model, the process-characterization
# report and the post-PC FMEA. Every value is grounded in the A-Mab Case Study v2.1
# (CMC Biotech Working Group, 2009); source pages are cited inline. Coefficients for
# the production-bioreactor response surface are the scaled estimates from Table 3.16
# (per half-range, i.e. a coded factor of +1 = move from centre to the high DoE edge).
#
# Conventions
#   * CQA values are in the units given in `cqas[].unit`.
#   * For a response-surface factor, `range: [lo, hi]` are the DoE / characterization
#     edges; the coded factor maps setpoint(=centre) -> 0 and [lo, hi] -> [-1, +1].
#   * classification: CPP | WC-CPP | KPP | GPP | non-CPP  (A-Mab continuum, see risk.*)
# =====================================================================================

meta:
  product: "A-Mab"
  modality: "Humanized IgG1 monoclonal antibody (anti-CD20-like), MOA primarily ADCC"
  seed: 20240724                    # master RNG seed -> full reproducibility
  n_ppq_batches: 5                  # PPQ / validation campaign batches
  n_monte_carlo: 2000               # commercial-scale batch simulations for capability
  drug_substance_target_g_per_l: 75 # UF/DF DS concentration (Ch. 5)
  commercial_scale_l: 15000         # production bioreactor working volume (Process 2)

# -------------------------------------------------------------------------------------
# Critical Quality Attributes (A-Mab Chapter 2; Tables 2.7-2.29, 2.28/2.29 summary)
# criticality_score = Tool #1 Impact x Uncertainty (2..140); level VL/L/M/H/VH.
# -------------------------------------------------------------------------------------
cqas:
  - key: afucosylation
    name: "Afucosylation"
    unit: "% of glycans"
    category: "glycosylation"
    acceptance: [2.0, 13.0]          # correlates 70-130% ADCC (p.37-42)
    clinical: [5.0, 10.0]
    criticality_level: "H"
    tool1_impact: 20                 # Very High (efficacy via ADCC)
    tool1_uncertainty: 3
    tool1_score: 60
    tool2_severity: 7
    set_by: "bioreactor"
    downstream_modified: false

  - key: galactosylation
    name: "Galactosylation (total %Gal)"
    unit: "% (G1+G2 equiv.)"
    category: "glycosylation"
    acceptance: [10.0, 40.0]         # affects CDC (p.37-42)
    clinical: [10.0, 30.0]
    criticality_level: "H"
    tool1_impact: 16
    tool1_uncertainty: 3
    tool1_score: 48
    tool2_severity: 7
    set_by: "bioreactor"
    downstream_modified: false

  - key: high_mannose
    name: "High Mannose"
    unit: "% of glycans"
    category: "glycosylation"
    acceptance: [3.0, 10.0]
    clinical: [3.0, 10.0]
    criticality_level: "VH"
    tool1_impact: 16
    tool1_uncertainty: 5
    tool1_score: 80
    tool2_severity: 7
    set_by: "bioreactor"
    downstream_modified: false

  - key: aggregates_hmw
    name: "Aggregates (HMW)"
    unit: "% HMW (SEC)"
    category: "size variant"
    acceptance: [0.0, 5.0]           # 5% upper from prior X-Mab clinical (p.36)
    clinical: [1.0, 3.0]
    criticality_level: "H"
    tool1_impact: 12
    tool1_uncertainty: 5
    tool1_score: 60
    tool2_severity: 5
    set_by: "bioreactor"
    downstream_modified: true        # VI raises, CEX reduces (main polish)

  - key: acidic_variants
    name: "Acidic charge variants (deamidation)"
    unit: "% (CEX/icIEF)"
    category: "charge variant"
    acceptance: [18.0, 40.0]         # 18% = range-of-experience floor; 40% = design-space upper (p.42-44, Table 3.17)
    clinical: [18.0, 24.0]
    criticality_level: "VL"
    tool1_impact: 2
    tool1_uncertainty: 2
    tool1_score: 4
    tool2_severity: 3
    set_by: "bioreactor"
    downstream_modified: true        # VI minor, CEX/AEX slight

  - key: hcp
    name: "Host Cell Protein (HCP)"
    unit: "ng/mg"
    category: "process impurity"
    acceptance: [0.0, 100.0]         # 100 ng/mg upper from X-Mab (p.45-47)
    clinical: [5.0, 20.0]
    criticality_level: "M-H"
    tool1_impact: 12
    tool1_uncertainty: 3
    tool1_score: 36
    tool2_severity: 5
    set_by: "bioreactor"             # generated upstream, cleared downstream
    downstream_modified: true        # Protein A, CEX, AEX all clear

  - key: residual_dna
    name: "Residual DNA"
    unit: "ng/dose"
    category: "process impurity"
    acceptance: [0.0, 0.001]         # < 1e-3 ng/dose: A-Mab's claimed acceptable range (Table 2.17, p.47-48), set far below the WHO recommendation of 10 ng/dose that A-Mab cites as the regulatory ceiling
    clinical: [0.0, 0.001]
    criticality_level: "VL"
    tool1_impact: 2
    tool1_uncertainty: 3
    tool1_score: 6
    tool2_severity: 1
    set_by: "bioreactor"
    downstream_modified: true        # Protein A + AEX clear (modular)

  - key: leached_protein_a
    name: "Leached Protein A"
    unit: "ppm"
    category: "process impurity"
    acceptance: [0.0, 5.0]           # no formal spec; low-moderate criticality (p.48)
    clinical: [0.0, 2.0]
    criticality_level: "L-M"
    tool1_impact: 16
    tool1_uncertainty: 1
    tool1_score: 16
    tool2_severity: 5
    set_by: "protein_a"
    downstream_modified: true        # CEX/AEX clear

  - key: lrv_xmulv
    name: "Viral clearance — XMuLV (enveloped)"
    unit: "log10 (cumulative)"
    category: "viral safety"
    acceptance: [16.7, 30.0]         # total > 16.7 (p.165)
    clinical: [16.7, 30.0]
    criticality_level: "VH"
    tool1_impact: 20
    tool1_uncertainty: 1
    tool1_score: 20
    tool2_severity: 9
    set_by: "viral_inactivation"
    downstream_modified: true        # VI + AEX + VF sum

  - key: lrv_mvm
    name: "Viral clearance — MVM (parvovirus)"
    unit: "log10 (cumulative)"
    category: "viral safety"
    acceptance: [8.6, 20.0]          # total > 8.6 (p.165)
    clinical: [8.6, 20.0]
    criticality_level: "VH"
    tool1_impact: 20
    tool1_uncertainty: 1
    tool1_score: 20
    tool2_severity: 9
    set_by: "aex"
    downstream_modified: true        # AEX + VF sum

  - key: fragments_lmw
    name: "Fragments (LMW, clipped species)"
    unit: "% (nrCE-SDS)"
    category: "size variant"
    # A-Mab lists fragmentation among the typical quality attributes of a monoclonal antibody
    # (Table 2.2, p.30) and gel electrophoresis beside HPSEC as a size-variant method (p.29),
    # but gives no limit. The criterion is
    # sponsor-set (Rev 2.0, RA-001 Rev 2.0): the sum of clipped species (Fab, Fab+Fc) by
    # non-reduced CE-SDS. HHL, HH, HL and free light chain (species lacking one or more
    # interchain disulfide bonds, which dissociate under SDS) are reported separately and NOT in
    # this sum, which is what makes the value comparable with SEC LMW.
    acceptance: [0.0, 2.0]
    clinical: [0.0, 1.0]
    criticality_level: "L"
    tool1_impact: 4
    tool1_uncertainty: 3
    tool1_score: 12
    tool2_severity: 3
    set_by: "harvest"                # clipping in culture and during the harvest hold
    downstream_modified: true        # VI adds a little, CEX clears partially

# =====================================================================================
# In-process acceptance criteria (the limit a step's OWN output must meet).
#
# The criteria in `cqas:` above are drug-substance criteria. They are the right yardstick
# for the drug substance and the wrong one for an intermediate: the Protein A pool carries
# ~9100 ng/mg host cell protein against a drug-substance limit of 100 ng/mg, because CEX and
# AEX have not run yet. Judging an intermediate against the drug-substance limit made the
# proven-acceptable-range analysis return "none (set-point breaches)" for every host cell
# protein row of PCR-005 and PCR-007, which reads as a failing step and is not what it means.
#
# A-Mab names this exact device -- "set arbitrary in-process limits on HCP at each step,
# which would then determine acceptable parameter ranges for each step" (p.158) -- and
# declines it to keep its design space wide. This corpus adopts it, so that each step is
# judged against a criterion that applies to it.
#
# Nothing here is a literal limit: every entry is a RULE evaluated against the seeded
# outputs, so changing meta.seed moves the limits with the data (golden rules 1 and 2).
#   from_capability   -> mean + capability_alert_sigma * sd of outputs/data/capability.csv.
#                        For attributes the downstream train does not change (the glycans,
#                        acidic variants), demonstrated capability IS the step's capability,
#                        so a 2-sigma alert limit is the conventional in-process control.
#   from_modular_claim-> the log-reduction claimed for that step in viral_clearance.csv,
#                        less viral_assay_allowance. The step must deliver what the modular
#                        clearance claim relies on, not merely the residue left over after
#                        every other step has over-delivered.
#   max / min         -> a step-level limit with no drug-substance analogue. `basis` records
#                        why; each sits far below the concentration the downstream train can
#                        still bring to specification, and above the nominal train value.
# =====================================================================================
# SUPERSEDED at Rev 2.0 (INV-001). Retained unchanged as DATA, so INV-001 and every revised
# document can tabulate the Rev 1.0 criteria beside the Rev 2.0 ones (amab_process/iac.py
# rev1_criteria -> outputs/data/criteria_rev1.csv). Nothing judges a step against it any more.
rev1_ipc_limits:
  capability_alert_sigma: 2.5
  viral_assay_allowance: 0.35        # log10, analytical variability of the clearance assay

  # `margin` is the safety factor between the in-process limit and the ceiling the
  # backward calculation returns -- the concentration above which the downstream train can
  # no longer bring the batch to specification. A limit set AT that ceiling would leave the
  # drug substance dependent on every downstream step delivering its nominal clearance
  # exactly. Every margin here is at least 4x. Where a step's margin differs it is because
  # the limit must also sit above that step's own nominal and design-centre values; a limit
  # below either would put the process outside its own in-process limit at its set-point.
  # Renamed 2026-08-21, from "assurance factor": two independent reviewers called that term
  # invented, and "safety factor" occurs 8 times in refs/text/amab.txt against 0 for the
  # former. PCP-007 and PCMR-001 both say "safety factor" in their prose; this comment now
  # uses the same word for the same quantity. The VALUES are untouched.
  steps:
    bioreactor:
      # Glycans and charge variants are NOT cleared or modified downstream, so there is no
      # clearance chain to calculate backwards through: the drug-substance criterion already
      # applies at this step, and it is far wider than the process's own spread. The binding
      # in-process control is therefore the demonstrated capability, as a 2-sigma alert limit.
      afucosylation:         {from_capability: afucosylation}
      galactosylation:       {from_capability: galactosylation}
      high_mannose:          {from_capability: high_mannose}
      acidic_variants:       {from_capability: acidic_variants}
      aggregates_hmw:        {from_ds_backcalc: {cqa: aggregates_hmw,
                                                 clearance_column: aggregate_clearance_fold,
                                                 increase_column: aggregate_delta_pct,
                                                 margin: 6.8}}
    protein_a:
      pool_hcp_ng_mg:        {from_ds_backcalc: {cqa: hcp,
                                                 clearance_column: hcp_clearance_fold,
                                                 margin: 4.5}}
      # leached_protein_a_ppm deliberately has NO in-process limit. The backward calculation is
      # not informative for it (CEX and AEX clear 3 log10 together, so the ceiling is ~5000 ppm
      # against a 3.6 ppm pool), but it needs no ad-hoc substitute either: the drug-substance
      # criterion of 5 ppm is itself nearly binding at the capture pool, which runs at 3.6 ppm
      # nominal and reaches 5.1 ppm at the worst point under normal operating range variation.
      # It therefore keeps the drug-substance criterion from `cqas:`, and every limit in this
      # block stays a derived one.
    viral_inactivation:
      aggregate_out_pct:     {from_ds_backcalc: {cqa: aggregates_hmw,
                                                 clearance_column: aggregate_clearance_fold,
                                                 increase_column: aggregate_delta_pct,
                                                 margin: 6.0}}
      # xmulv_lrf keeps the modular back-calculation in `acceptance_for`: the LRF claimed for
      # this step (7.10) sits above the response-surface prediction at the design centre, so a
      # criterion set from the claim would report no acceptable range at the step's own centre.
    cex:
      aggregate_out_pct:     {from_ds_backcalc: {cqa: aggregates_hmw,
                                                 clearance_column: aggregate_clearance_fold,
                                                 increase_column: aggregate_delta_pct,
                                                 margin: 5.0}}
      hcp_out_ng_mg:         {from_ds_backcalc: {cqa: hcp,
                                                 clearance_column: hcp_clearance_fold,
                                                 margin: 3.2}}
    aex:
      hcp_out_ng_mg:         {from_ds_backcalc: {cqa: hcp,
                                                 clearance_column: hcp_clearance_fold,
                                                 margin: 4.6}}
      # Both viral attributes at this step keep the modular back-calculation in
      # `acceptance_for`. Their clearance is credited from this process's own studies, so the
      # criterion that applies is the cumulative requirement less what the other steps deliver.
      # Virus filtration is the exception below, and for a reason: its claim is a filter-specific
      # platform claim, so the step is held to the claim itself.
    virus_filtration:
      mvm_lrf:               {from_modular_claim: true}
      xmulv_lrf:             {from_modular_claim: true}

# =====================================================================================
# Intermediate acceptance criteria (Rev 2.0, PCMP-001 Rev 2.0 section on acceptance criteria).
#
# Specification-driven: each drug-substance criterion is carried backward through the train
# using the WORST CASE each downstream step showed on the platform. No margin is applied and none
# is needed, because the conservatism is in the worst cases, and every one of them is known
# before this campaign's first study ran. amab_process/iac.py derive() reads this block and the
# CQA criteria and nothing else (tests/test_iac.py).
#
# Platform values: the worst result across the characterization and manufacturing history of
# the prior products X-Mab, Y-Mab and Z-Mab (STORY_BIBLE §4). These are inputs, recorded facts
# about other products, not outputs of this model. Where A-Mab states a typical range, the
# platform worst case sits at or below its lower end: CEX host cell protein clearance 50-100x
# (A-Mab p.134-140) has a platform minimum of 40x; CEX aggregate clearance 2-3x has 2.0x; the low-pH
# hold raised aggregate by up to 0.7 % over 180 min (A-Mab Table 4.16).
#   fold_min : lowest clearance fold the step has shown for the attribute
#   add_max  : largest increase the step has added to the attribute
# Viral claims are the platform claims A-Mab states for each step: low-pH inactivation > 6.6 LRF
# for XMuLV (p.131), AEX XMuLV > 5.5 and MVM > 4.0, and virus filtration >= 4.62 for both
# (p.165). Their sums, 16.72 and 8.62, meet the cumulative requirements of 16.7 and 8.6.
# =====================================================================================
iac:
  # Widening (owner, 2026-10-08: "if the data supports it a criterion could be widened but it
  # needs good arguments"; switched on the same day). iac_verification.csv computes
  # `widening_supported`: the 95 % confidence bound of the A-Mab worst case within the NOR beats
  # the platform value. Where it does, final() replaces the platform value with that bound, never
  # with the point prediction, and the report argues the widening. The rule is stated in PCMP-001
  # before any study, so it is not a criterion fitted to its data (INV-001).
  allow_widening: true
  platform:
    viral_inactivation:
      aggregates_hmw:    {add_max: 0.70, source: "X/Y/Z-Mab low-pH hold, 180 min; A-Mab Table 4.16"}
      fragments_lmw:     {add_max: 0.15, source: "X/Y/Z-Mab low-pH hold, 180 min, nrCE-SDS"}
      acidic_variants:   {add_max: 1.00, source: "X/Y/Z-Mab low-pH hold, 180 min"}
    cex:
      hcp:               {fold_min: 40.0, source: "X/Y/Z-Mab CEX, lowest of 31 runs at characterization edges"}
      aggregates_hmw:    {fold_min: 2.0,  source: "X/Y/Z-Mab CEX; A-Mab 2-3x"}
      fragments_lmw:     {fold_min: 1.3,  source: "Y-Mab and Z-Mab CEX, nrCE-SDS"}
      leached_protein_a: {fold_min: 3.16, source: "X/Y/Z-Mab CEX, 0.5 log10"}
    aex:
      hcp:               {fold_min: 4.0,  source: "X/Y/Z-Mab AEX flow-through"}
      leached_protein_a: {fold_min: 10.0, source: "X/Y/Z-Mab AEX flow-through, 1 log10"}
  viral_claims:
    viral_inactivation: {xmulv_lrf: 6.6}
    aex:                {xmulv_lrf: 5.5, mvm_lrf: 4.0}
    virus_filtration:   {xmulv_lrf: 4.62, mvm_lrf: 4.62}
  # the step responses each criterion applies to
  responses:
    bioreactor:         [afucosylation, galactosylation, high_mannose, acidic_variants, aggregates_hmw]
    protein_a:          [pool_hcp_ng_mg, leached_protein_a_ppm, lmw_cesds_pct]
    viral_inactivation: [aggregate_out_pct, xmulv_lrf, acidic_variants, lmw_cesds_pct]
    cex:                [aggregate_out_pct, hcp_out_ng_mg, lmw_cesds_pct]
    aex:                [hcp_out_ng_mg, xmulv_lrf, mvm_lrf, lmw_cesds_pct]
    virus_filtration:   [mvm_lrf, xmulv_lrf, lmw_cesds_pct]   # fragments added 2026-10-08: measured by nrCE-SDS (S-VF-DOE, S-VF-RSM) and judged like anion exchange

# =====================================================================================
# Process train (A-Mab Steps 3-10). Each step: parameters (setpoint / NOR / PAR /
# classification / study), plus model blocks used by the Python unit-op modules.
# =====================================================================================
process:

  # ---------------------------------------------------------------------------------
  # STEP 3 — Production Bioreactor (fed-batch). Design space defined on 2 L SDM.
  # RSM coefficients = Table 3.16 scaled estimates (per half-range). (p.61-93)
  # ---------------------------------------------------------------------------------
  bioreactor:
    step: 3
    name: "Production Bioreactor"
    mode: "Fed-batch cell culture, 15,000 L"
    parameters:
      - {key: pH,          name: "Culture pH",            unit: "pH",     setpoint: 6.85, range: [6.6, 7.1],  nor: [6.75, 6.95], classification: "WC-CPP", study: "multivariate"}
      - {key: temperature, name: "Culture temperature",   unit: "°C",     setpoint: 35.0, range: [34.0, 36.0],nor: [34.5, 35.5], classification: "WC-CPP", study: "multivariate"}
      # labels corrected on 2026-10-09 (owner, "Fix all"): pCO2 is a partial pressure, osmolality is per kg of
      # water, dissolved oxygen is a share of air saturation, the medium is a multiple of its standard strength
      - {key: co2,         name: "CO2 partial pressure (pCO2)", unit: "mmHg",   setpoint: 100,  range: [40, 160],   nor: [70, 130],    classification: "WC-CPP", study: "multivariate"}
      - {key: osmolality,  name: "Osmolality",            unit: "mOsm/kg",   setpoint: 400,  range: [360, 440],  nor: [375, 425],   classification: "WC-CPP", study: "multivariate"}
      - {key: duration,    name: "Culture duration",      unit: "days",   setpoint: 17,   range: [15, 19],    nor: [16, 18],     classification: "WC-CPP", study: "multivariate"}
      # study: "multivariate" MUST mean "a factor of this step's seeded DoE" — the
      # invariant is enforced by tests/test_config.py::test_multivariate_matches_doe_factors.
      # do / medium_conc / feed_vol are NOT factors of the bioreactor design (which carries
      # pH, temperature, co2, osmolality, duration), so they are univariate here.
      - {key: do,          name: "Dissolved oxygen",      unit: "% air saturation",  setpoint: 50,   range: [30, 70],    nor: [40, 60],     classification: "KPP",    study: "univariate"}
      - {key: ivcc,        name: "Initial viable cell conc.", unit: "10⁶ cells/mL", setpoint: 1.0, range: [0.5, 1.5], nor: [0.8, 1.2], classification: "KPP", study: "univariate"}
      - {key: medium_conc, name: "Basal medium concentration", unit: "× standard", setpoint: 1.2, range: [0.8, 1.6], nor: [1.0, 1.4], classification: "GPP", study: "univariate"}
      - {key: feed_vol,    name: "Nutrient feed-1 volume", unit: "% of working volume", setpoint: 12,   range: [9, 15],     nor: [10, 14],     classification: "KPP",    study: "univariate"}
    # Mechanistic growth/production (logistic + Luedeking-Piret-like); titer in g/L.
    kinetics:
      mu_max: 0.68            # 1/day max specific growth rate at centre
      vcd_max: 12.0           # e6 cells/mL carrying capacity at centre
      vcd0_ref: 1.0           # reference inoculation density (e6/mL)
      qp: 0.30               # g/L per (e6/mL * day) integral-productivity constant (Process-2 titer ~4.5 g/L)
      # coded sensitivities of kinetic constants (higher T -> faster growth, shorter run)
      mu_temp: 0.12
      mu_pH: 0.05
      vcdmax_pH: -1.0        # lower pH -> higher peak/integral VCD & titer
      vcdmax_temp: -0.6      # lower T  -> higher integral VCD & titer (longer run)
      titer_do: 0.15
      titer_cv: 0.05         # lognormal batch CV on titer
    rsm:                     # response-surface CQA models (coded factors)
      centre:               # centre-point (Process-2) CQA values
        afucosylation: 8.0
        galactosylation: 26.0
        acidic_variants: 22.0
        aggregates_hmw: 1.5
      # harvest impurity load (clarified broth), driven mainly by duration/viability
      harvest_centre:
        hcp: 5.0e+5           # ng/mg in clarified broth (pre-Protein A)
        residual_dna_rel: 1.0e+3   # relative DNA load (arb. units, cleared downstream)
      linear:               # coded +1 effect (Table 3.16)
        afucosylation:   {temperature: -0.62, pH: -0.99, co2: -0.53, osmolality: -0.75, duration: -1.36}
        galactosylation: {temperature: 1.67,  pH: -2.43, co2: -2.42, osmolality: -1.37, duration: -3.76}
        acidic_variants: {temperature: 1.6,   pH: -2.1,  co2: -4.0,  osmolality: -1.0}
        aggregates_hmw:  {pH: 0.4, duration: 0.3}
        hcp:             {duration: 2.0e+5}
        residual_dna_rel: {duration: 4.7e+2}
      interactions:         # coded a*b effect (Table 3.16)
        afucosylation:   {"temperature*pH": -0.57, "co2*pH": -0.84, "pH*duration": 1.35, "temperature*duration": 0.32}
        galactosylation: {"temperature*pH": 1.88, "temperature*osmolality": 2.04, "co2*pH": 1.96, "co2*osmolality": 0.65, "pH*duration": 2.96, "osmolality*duration": 0.71}
        acidic_variants: {"temperature*pH": 1.1, "co2*pH": -0.4, "pH*duration": -0.3}
      quadratic:
        afucosylation:   {pH: -1.09}
      noise_cv:            # multiplicative lognormal CV per response (analytical+biological)
        afucosylation: 0.06
        galactosylation: 0.05
        acidic_variants: 0.05
        aggregates_hmw: 0.07
        high_mannose: 0.08
    high_mannose_centre: 6.0   # % (VH CQA); modelled ~ tracks pH & DO weakly

  # ---------------------------------------------------------------------------------
  # STEP 4 — Harvest / Clarification (no CQA impact; sets feed to Protein A). (p.85-86)
  # ---------------------------------------------------------------------------------
  harvest:
    step: 4
    name: "Harvest / Clarification"
    parameters:
      - {key: centrifuge_g, name: "Centrifugation (rcf)", unit: "g",   setpoint: 9000, range: [6000, 12000], nor: [8000, 10000], classification: "KPP", study: "univariate"}
      - {key: depth_filter_load, name: "Depth filter load", unit: "L/m2", setpoint: 120, range: [80, 160], nor: [100, 140], classification: "KPP", study: "univariate"}
      - {key: turbidity,   name: "Post-clarification turbidity", unit: "NTU", setpoint: 5, range: [1, 20], nor: [1, 10], classification: "GPP", study: "univariate"}
    yield: {base: 0.95, cv: 0.02}
    # Clarification performance for the univariate study S-HAR-UNI (owner's option A,
    # 2026-10-08). Our own model, not from the source: A-Mab p.85 assumes "for simplicity" that
    # harvest has no impact on product quality, and that assumption is kept (no attribute
    # responds here). Deterministic, with no RNG draw, so no stream moves.
    model:
      # centrate turbidity falls with rcf and levels off: floor + excess * exp(-(rcf - ref) / scale)
      centrate_turbidity: {floor_ntu: 40.0, excess_ntu: 80.0, rcf_ref_g: 6000, rcf_scale_g: 2000}
      # clarified (depth filtrate) turbidity is flat until the filter nears capacity, then rises
      # steeply: base * (centrate / centrate at set-point) ** feed_exponent + knee * exp((load - capacity) / width)
      clarified_turbidity: {base_ntu: 4.0, feed_exponent: 0.15, knee_ntu: 2.0, capacity_l_m2: 150, width_l_m2: 8}

  # ---------------------------------------------------------------------------------
  # STEP 5 — Protein A Affinity Chromatography (capture). 19-run, 6-factor Res-IV FF.
  # HCP rises with higher load & lower elution pH (Fig 4.2). (p.113-126)
  # ---------------------------------------------------------------------------------
  protein_a:
    step: 5
    name: "Protein A Chromatography"
    parameters:
      # No narrowing at Version 2.0. Earlier narrowings (20-38, 20-37, 20-36) rested on analyses later corrected:
      # with every model selected (INV-002 CA3) the anion exchange host cell protein model is adequate, the
      # Protein A criterion widens, and the qualification holds over the NOR as characterized (owner, 2026-10-09)
      # nor_v2 (owner, 2026-10-09, decision 1): criteria widen only on the 95 % prediction bound of a single batch.
      # At the resulting pool host cell protein criterion the scale-down model is not qualified for that output at
      # the load NOR 20-40 g/L (the conclusion fails with the offset at the unfavourable end of its interval); at
      # 20-39 g/L it is. PCR-005 Version 2.0 narrows the NOR in force.
      - {key: load,        name: "Protein load",        unit: "g/L resin", setpoint: 30,  range: [10, 50],   nor: [20, 40],  classification: "WC-CPP", study: "multivariate", nor_v2: [20, 39]}
      - {key: elution_ph,  name: "Elution buffer pH",   unit: "pH",        setpoint: 3.55,range: [3.2, 3.9], nor: [3.4, 3.7],classification: "WC-CPP", study: "multivariate"}
      - {key: flow,        name: "Load flow rate",      unit: "cm/hr",     setpoint: 200, range: [100, 300], nor: [150, 250],classification: "KPP",    study: "multivariate"}
      - {key: end_collect, name: "End of pool collect", unit: "CV",        setpoint: 2.6, range: [2.0, 3.2], nor: [2.3, 2.9],classification: "KPP",    study: "multivariate"}
      - {key: temperature, name: "Operating temperature", unit: "°C",      setpoint: 22,  range: [15, 30],   nor: [18, 26],  classification: "GPP",    study: "univariate"}
      - {key: bed_height,  name: "Bed height",          unit: "cm",        setpoint: 20,  range: [10, 30],   nor: [15, 25],  classification: "GPP",    study: "univariate"}
    model:
      hcp_base: 8000.0        # ng/mg output at centre (robust ~6500-9500)
      hcp_load_coef: 0.45     # ln-HCP rises with coded load
      hcp_ph_coef: -0.55      # ln-HCP rises as elution pH drops (coef on coded pH)
      hcp_cv: 0.12
      dna_lrv: 2.5            # log10 DNA clearance
      leached_pa_base: 3.0    # ppm introduced at centre
      leached_pa_cv: 0.20
      yield_base: 0.95
      yield_load_flow: -0.05  # high load x high flow drops yield
      yield_end_collect: 0.04 # more CV collected -> higher yield (to a point)
      yield_cv: 0.02
      aggregate_passthrough: 1.0

  # ---------------------------------------------------------------------------------
  # STEP 6 — Low-pH Viral Inactivation. pH=CPP, time/temp=WC-CPP, conc=GPP. (p.127-133)
  # Aggregate 1.8->2.5% over 0-180 min (Table 4.16); XMuLV LRF > 6.6.
  # ---------------------------------------------------------------------------------
  viral_inactivation:
    step: 6
    name: "Low-pH Viral Inactivation"
    parameters:
      # nor_v2 and setpoint_v2 (owner, 2026-10-09): on the selected XMuLV model (main effects of pH, hold time and
      # temperature) the claim of 6.6 holds at the least favourable NOR combination only up to pH 3.5; the
      # NOR-propagated PAR of pH ends at about 3.54. With the set-point at 3.5 the margin to that edge was 0.04 pH
      # units, which large-scale pH control cannot hold, so the set-point is re-centred to 3.40 and the NOR is
      # 3.30-3.50 (±0.1). Supported by the OFAT stability study at pH 3.4 (S-VI-OFAT) and small-scale cation
      # exchange verification runs on that material (S-CEX-VER), discrepancies from the plan in PCR-006.
      - {key: ph,          name: "Inactivation pH",  unit: "pH",   setpoint: 3.5, range: [3.2, 4.0], nor: [3.4, 3.6],   classification: "CPP",    study: "multivariate", nor_v2: [3.3, 3.5], setpoint_v2: 3.4}
      # nor_v2: PCR-006 Version 2.0: XMuLV claim of 6.6 not met at the worst corner of the characterized NOR (owner's option C, 2026-10-08)
      # setpoint_v2 (owner, 2026-10-09): re-centred in the NOR in force; at 90 min the set-point sat on its NOR edge.
      # Revised (owner, 2026-10-09, decision 3b): with the hold-time NOR at 90-120 min the pH NOR edge (3.5) sat only
      # 0.04 from the XMuLV PAR edge at the least favourable combination of the other NORs; the hold-time NOR is raised
      # to 100-120 min (margin 0.11) with the set-point at its middle. The revision triggered confirmation runs at the
      # harshest combination within the PAR (pH 3.20, 120 min, NOR-high temperature): study S-VI-WC, PD-006-03.
      - {key: hold_time,   name: "Hold time",        unit: "min",  setpoint: 90,  range: [60, 180],  nor: [60, 120],    classification: "WC-CPP", study: "multivariate", nor_v2: [100, 120], setpoint_v2: 110}
      # nor_v2: PCR-006 Version 2.0, with the hold time (option C)
      - {key: temperature, name: "Temperature",      unit: "°C",   setpoint: 21,  range: [15, 25],   nor: [19, 23],     classification: "WC-CPP", study: "multivariate", nor_v2: [20, 23]}
      - {key: protein_conc,name: "A-Mab concentration", unit: "g/L", setpoint: 20, range: [5, 35],   nor: [5, 35],      classification: "GPP",    study: "univariate"}
    model:
      # aggregate delta (%) = agg_time_max * (time/180) with temp modifier; centre input ~2%
      agg_delta_180: 0.7      # +0.7% aggregate from 0->180 min at centre
      agg_temp_coef: 0.10     # + per coded temperature
      agg_cv: 0.05
      # XMuLV log-reduction kinetics
      lrv_base: 6.8           # at pH 3.5, 90 min, 21C
      lrv_ph_coef: -0.8       # higher pH -> lower LRV (per coded pH; pH up = +)
      lrv_time_coef: 0.5      # longer -> higher
      lrv_temp_coef: 0.3      # warmer -> higher
      lrv_cv: 0.06
      acidic_delta: 0.6       # + acidic variants over hold (minor, non-CQA-limiting)

  # ---------------------------------------------------------------------------------
  # STEP 7 — Cation Exchange (CEX), bind-elute. 4-factor 2^4 full-factorial screen
  # (19 runs) + face-centred CCD (28 runs) in load/wash-cond/elution-pH/stop-collect;
  # flow is a univariate GPP. Main aggregate polish (2-3x) + HCP 50-100x. (p.134-140)
  # ---------------------------------------------------------------------------------
  cex:
    step: 7
    name: "Cation Exchange Chromatography"
    parameters:
      - {key: load,        name: "Protein load",       unit: "g/L resin", setpoint: 25,  range: [10, 40],  nor: [18, 32],   classification: "WC-CPP", study: "multivariate"}
      - {key: wash_cond,   name: "Load/Wash conductivity", unit: "mS/cm",  setpoint: 5.0, range: [3.0, 7.0],nor: [4.0, 6.0], classification: "WC-CPP", study: "multivariate"}
      - {key: elution_ph,  name: "Elution buffer pH",  unit: "pH",        setpoint: 6.0, range: [5.8, 6.2],nor: [5.85, 6.15],classification: "WC-CPP", study: "multivariate"}
      - {key: stop_collect,name: "Elution stop collect", unit: "AU (OD280, descending)", setpoint: 1.0, range: [0.5, 1.5],nor: [0.7, 1.3], classification: "WC-CPP", study: "multivariate"}
      - {key: flow,        name: "Elution flow rate",  unit: "cm/hr",     setpoint: 200, range: [100, 300],nor: [150, 250], classification: "GPP",    study: "univariate"}
    model:
      agg_clearance_base: 2.5   # fold reduction at centre (2-3x)
      agg_load_coef: -0.30      # higher load -> less clearance (per coded load)
      agg_ph_coef: -0.15
      agg_stopcollect_coef: -0.12
      agg_cv: 0.06
      hcp_clearance_base: 70.0  # fold (50-100x)
      hcp_load_coef: -0.35      # higher load -> less clearance
      hcp_wash_cond_coef: 0.40  # higher conductivity -> more clearance (log)
      hcp_cv: 0.15
      dna_lrv: 1.5
      leached_pa_lrv: 1.0
      yield_base: 0.92
      yield_load_coef: -0.03
      yield_cv: 0.02

  # ---------------------------------------------------------------------------------
  # STEP 8 — Anion Exchange (AEX), flow-through. Final polish + viral clearance claim
  # (XMuLV > 5.5, MVM > 4.0). HCP ~ load pH & Eq/Wash-1 conductivity. (p.140-151)
  # ---------------------------------------------------------------------------------
  aex:
    step: 8
    name: "Anion Exchange Chromatography"
    parameters:
      - {key: load_ph,     name: "Load pH",             unit: "pH",        setpoint: 7.5, range: [7.2, 7.8], nor: [7.35, 7.65], classification: "WC-CPP", study: "multivariate"}
      - {key: wash1_cond,  name: "Equil/Wash-1 conductivity", unit: "mS/cm", setpoint: 2.6, range: [1.6, 3.6], nor: [2.1, 3.1], classification: "WC-CPP", study: "multivariate"}
      - {key: load_cond,   name: "Load conductivity",   unit: "mS/cm",     setpoint: 5.5, range: [3.0, 8.0], nor: [4.0, 7.0],  classification: "WC-CPP", study: "multivariate"}
      - {key: load,        name: "Protein load",        unit: "g/L resin", setpoint: 200, range: [50, 300],  nor: [120, 280],  classification: "WC-CPP", study: "multivariate"}
      - {key: flow,        name: "Operating flow rate", unit: "cm/hr",     setpoint: 300, range: [150, 450], nor: [200, 400],  classification: "WC-CPP", study: "univariate"}
    model:
      hcp_clearance_base: 8.0    # fold at centre (post-CEX ~150 -> ~18 -> further)
      hcp_ph_coef: 0.35          # higher pH -> more HCP clearance
      hcp_cond_coef: -0.40       # higher Eq/Wash-1 conductivity -> less clearance
      hcp_cv: 0.15
      dna_lrv: 4.0
      leached_pa_lrv: 2.0
      lrv_xmulv_base: 6.4
      lrv_mvm_base: 4.9
      lrv_ph_coef: 0.6           # clearance falls as pH drops (coef on coded pH)
      lrv_cond_coef: -0.5        # clearance falls as conductivity rises
      lrv_cv: 0.05
      yield_base: 0.97           # flow-through, high yield
      yield_cv: 0.015

  # ---------------------------------------------------------------------------------
  # STEP 9 — Small Virus Retentive Filtration. Pressure & filtration volume = WC-CPP;
  # LRV >= 4.62 (MVM & XMuLV) for load <= 105 L/m2. (p.152-166)
  # ---------------------------------------------------------------------------------
  virus_filtration:
    step: 9
    name: "Small Virus Retentive Filtration"
    parameters:
      - {key: filtration_volume, name: "Filtration volume (load)", unit: "L/m2", setpoint: 90, range: [50, 140], nor: [50, 105], classification: "WC-CPP", study: "multivariate"}
      - {key: pressure,    name: "Filtration pressure", unit: "psi", setpoint: 13, range: [8, 30], nor: [10, 20], classification: "WC-CPP", study: "multivariate"}
    model:
      lrv_mvm_base: 5.5          # at 90 L/m2
      lrv_mvm_volume_coef: -0.018 # LRV drops per L/m2 above ~ centre
      lrv_xmulv_base: 6.3        # no breakthrough; robust
      lrv_cv: 0.04
      yield_base: 0.98
      yield_cv: 0.01

  # ---------------------------------------------------------------------------------
  # STEP 10 — UF/DF (formulation). NOT characterized in the A-Mab DS section (p.140);
  # included for mass balance only; concentrates to DS target. (Formulation = Ch. 5)
  # ---------------------------------------------------------------------------------
  ufdf:
    step: 10
    name: "Ultrafiltration / Diafiltration (formulation)"
    characterized: false
    parameters:
      - {key: diavolumes,  name: "Number of diavolumes", unit: "DV",   setpoint: 8,  range: [7, 10],  nor: [7, 9],   classification: "KPP", study: "univariate"}
      - {key: tmp,         name: "Transmembrane pressure", unit: "psi", setpoint: 12, range: [10, 15], nor: [10, 14], classification: "KPP", study: "univariate"}
      - {key: final_conc,  name: "Final DS concentration", unit: "g/L", setpoint: 75, range: [65, 85], nor: [70, 80], classification: "KPP", study: "univariate"}
    yield: {base: 0.96, cv: 0.015}
    # Effects for the univariate study S-UFDF-UNI (owner's option A, 2026-10-08). The source
    # gives nothing to calibrate against (A-Mab p.86: UF/DF "not included in case study"), so
    # these are our own additions. Coded from set-point (c = (x - setpoint) / scale); every term
    # is zero at set-point and deterministic, so no RNG stream moves.
    model:
      residual_buffer_pct_at_0dv: 100.0   # residual = 100 % * exp(-DV); 8 DV gives 0.034 %
      conc_scale_g_l: 10.0
      tmp_scale_psi: 2.5
      aggregate_conc: 0.06                # % HMW per +10 g/L final concentration
      aggregate_tmp: 0.04                 # % HMW per +2.5 psi TMP
      aggregate_conc_tmp: 0.02            # interaction, % HMW per coded unit squared
      yield_conc: -0.004                  # step yield (fraction) per +10 g/L

# =====================================================================================
# Risk-assessment scales (A-Mab post-characterization Drug-Product FMEA, Tables 5.22-
# 5.24; CPP rule p.212). Used verbatim by the post-PC FMEA workbook.
# =====================================================================================
risk:
  method: "Post-characterization FMEA — RPN = Severity x Occurrence x Detection"
  cpp_rule: "Severity >= 8 OR RPN > 72  => CPP.  48 < RPN <= 72 (Sev < 8) => Medium, further analysis.  RPN <= 48 (Sev < 8) => not a CPP."
  thresholds: {cpp_rpn: 72, medium_rpn: 48, cpp_severity: 8}
  severity_scale:   # Table 5.22
    - {score: 10, label: "Very High", meaning: "Definite impact to product quality; lot(s) rejected"}
    - {score: 8,  label: "High",      meaning: "Probable impact; significant supplemental testing / re-processing"}
    - {score: 6,  label: "Moderate",  meaning: "Potential impact; supplemental t=0 testing / minor re-processing"}
    - {score: 4,  label: "Slight",    meaning: "Unlikely impact; no supplemental testing / no re-processing"}
    - {score: 2,  label: "Low/None",  meaning: "No impact to product quality"}
  occurrence_scale: # Table 5.23
    - {score: 10, label: "Very High", meaning: "Failure ~ once per 100 units"}
    - {score: 8,  label: "High",      meaning: "Failure ~ once per 1,000 units"}
    - {score: 6,  label: "Moderate",  meaning: "Failure ~ once per 2,000 units"}
    - {score: 4,  label: "Low",       meaning: "Failure ~ once per 5,000 units"}
    - {score: 2,  label: "Minimal",   meaning: "Failure ~ once per 10,000 units or lower"}
  detection_scale:  # Table 5.24
    - {score: 10, label: "None",      meaning: "Not detected by in-process or CofA testing"}
    - {score: 8,  label: "Low",       meaning: "Not detected in-process; caught by CofA testing"}
    - {score: 6,  label: "Moderate",  meaning: "Detected downstream before CofA, not during the unit op"}
    - {score: 4,  label: "High",      meaning: "Detected in the next downstream operation"}
    - {score: 2,  label: "Very High", meaning: "Immediately detected by in-process monitoring / inspection"}

# =====================================================================================
# Messy-campaign facts — deviations / excursions and their supporting analytical
# methods, equipment, material lots and prior documents. SEEDED SOURCE OF TRUTH for the
# narrated-deviation sections of the characterization reports (the ema_docgen density
# pass). These are recorded events, not random draws, so they are fixed constants here
# (seed-independent): changing meta.seed regenerates them identically. Numbers surface
# as helper scalars via amab_process/deviations.py -> outputs/data/deviations*.csv +
# report_values.json, and are exposed as inline-expression names (e.g. dev_007_02_tmax)
# by pc_package/_pcpkg.py, under the uniform rule scalar = id.lower().replace('-','_')
# + '_' + field. Every event is dispositioned "retained" — each was assessed and the
# run/data kept — so no DoE dataset is altered. Values sit inside each unit operation's
# characterized range (PAR); several sit above the NOR to motivate the investigation.
# =====================================================================================
deviations:

  # -- shared analytical-method performance records ---------------------------------
  # precision_pct = intermediate-precision %RSD (log10 SD for infectivity assays);
  # variance_fraction = share of total observed variance attributable to the assay.
  methods:
    - {id: AMV-3221, name: "Aggregate by SEC-HPLC (verification-qualified)", precision_pct: 3.8, loq: 0.20, loq_unit: "% HMW", accuracy_pct: 99.1, variance_fraction: 0.34}
    - {id: AMV-3016, name: "Leached Protein A by ELISA",                      precision_pct: 6.5, loq: 0.25, loq_unit: "ppm",   accuracy_pct: 97.4, variance_fraction: 0.41}
    - {id: AMV-3017, name: "XMuLV Infectivity Titre (TCID50)",               precision_pct: 0.30, loq: 1.5, loq_unit: "log10 TCID50/mL", accuracy_pct: 96.0, variance_fraction: 0.28}
    - {id: AMV-3019, name: "Protein Concentration by A280 (UV)",             precision_pct: 1.2, loq: 0.5, loq_unit: "g/L",     accuracy_pct: 99.6, variance_fraction: 0.22}
    # the antibody titre of a harvest or a capture load; sets the protein load of a capture run
    - {id: AMV-3021, name: "Product Titre by Protein A Affinity HPLC",       precision_pct: 2.0, loq: 0.05, loq_unit: "g/L",    accuracy_pct: 98.5, variance_fraction: 0.25}
    - {id: AMV-3010, name: "Released N-Glycan Map (2-AB HILIC-UPLC)",        precision_pct: 2.5, loq: 0.5, loq_unit: "% glycan", accuracy_pct: 99.0, variance_fraction: 0.30}
    - {id: AMV-3015, name: "Turbidity by Nephelometry (NTU)",               precision_pct: 4.0, loq: 0.5, loq_unit: "NTU",     accuracy_pct: 98.0, variance_fraction: 0.38}
    - {id: AMV-3018, name: "MVM Infectivity Titre (TCID50/qPCR)",           precision_pct: 0.32, loq: 1.4, loq_unit: "log10 TCID50/mL", accuracy_pct: 96.0, variance_fraction: 0.30}
    - {id: AMV-3012, name: "Host-Cell Protein by ELISA",                    precision_pct: 9.5, loq: 1.0, loq_unit: "ng/mg", accuracy_pct: 95.0, variance_fraction: 0.40}

  # -- shared equipment / calibration records ---------------------------------------
  equipment:
    - {id: EQ-CHR-118, description: "temperature-controlled chromatography chamber",   calibration_status: in_calibration_at_execution, cal_due: "2026-05-30"}
    - {id: EQ-BRX-205, description: "production scale-down bioreactor pCO2 probe",      calibration_status: in_calibration_at_execution, cal_due: "2026-06-14"}
    - {id: EQ-TFF-142, description: "ultrafiltration / diafiltration TFF skid",         calibration_status: in_calibration_at_execution, cal_due: "2026-04-22"}
    - {id: EQ-TFF-188, description: "ultrafiltration / diafiltration TFF skid (second)", calibration_status: in_calibration_at_execution, cal_due: "2027-03-31"}

  # -- shared material-lot records --------------------------------------------------
  lots:
    - {id: LOT-BUF-2287, material: "Tris load/wash buffer (CEX)",       vendor: "Fern Scientific",     expiry: "2026-02-11", used_in: "screening run 6"}
    - {id: LOT-FED-3120, material: "nutrient feed-1 medium",            vendor: "Fern Scientific",     expiry: "2026-09-30", used_in: "screening centre point"}
    - {id: LOT-DF-4408,  material: "depth-filter media",                vendor: "Cardinal Filtration", expiry: "2027-01-31", used_in: "clarification run 3"}
    # RSM run 23 is an axial run in end-of-pool-collect at the CENTRE level of elution pH, so
    # its design elution pH is the 3.55 set-point and the measured 3.38 is genuinely BELOW target, as DEV-005-01 states. Run 9 sits on the
    # pH-3.20 face, where 3.38 would have been above target and the deviation summary would
    # contradict the design matrix.
    - {id: LOT-BUF-5290, material: "Protein A elution buffer",          vendor: "Fern Scientific",     expiry: "2026-08-20", used_in: "RSM run 23"}
    - {id: LOT-VF-9331,  material: "small-virus retentive filter",      vendor: "Meridian Membranes",  expiry: "2027-03-15", used_in: "verification run"}
    - {id: LOT-CEX-8842, material: "CEX eluate AEX-load (non-representative, deamidated)", vendor: "in-process", expiry: "2026-03-05", used_in: "AEX first (invalidated) DoE execution"}
    - {id: LOT-CEX-8851, material: "CEX eluate AEX-load (requalified, representative)",    vendor: "in-process", expiry: "2026-04-12", used_in: "AEX re-executed DoE (reported)"}
    - {id: LOT-BUF-8815, material: "AEX equilibration / wash-1 buffer",  vendor: "Fern Scientific",     expiry: "2026-05-20", used_in: "AEX screening run (off-pH excursion)"}

  # -- shared prior-document references ----------------------------------------------
  prior_docs:
    - {id: RA-004,   title: "Alternate Protein A Resin Risk Assessment",       date: "2025-11-03", decision: "independent characterization required; no bridging from platform data"}
    - {id: SOP-2103, title: "Buffer Preparation, Release and Expiry Control",  date: "2025-06-18", decision: "retained-sample re-test authorised for expiry deviations"}

  # -- per-report deviation events ---------------------------------------------------
  # Each event: id, unit-operation step key, type, one-line summary (register table),
  # detected_during, root_cause, disposition, optional linked lot/equipment/method/
  # prior_doc, and `values` (numbers surfaced as helper scalars). `ci_hw` is DERIVED by
  # the generator as the relative 95% CI half-width of the verification set from the
  # linked method's precision and the verification n (a deliberate multi-hop fact).
  events:

    PCR-003:
      - {id: DEV-003-01, step: bioreactor, type: deviation, summary: "Dissolved-CO2 probe drift during screening run 4",            detected_during: "in-process monitoring vs offline reference", root_cause: probe_drift_between_calibrations, disposition: retained, equipment: EQ-BRX-205, values: {offset_mmhg: 6.5}}
      - {id: DEV-003-02, step: bioreactor, type: deviation, summary: "Nutrient feed-1 under-delivery on a centre-point batch",       detected_during: "post-execution mass reconciliation",         root_cause: feed_pump_calibration_offset,   disposition: retained, lot: LOT-FED-3120, method: AMV-3010, values: {feed_deficit_pct: 4.2, ver_n: 3}}

    PCR-004:
      - {id: DEV-004-01, step: harvest, type: deviation, summary: "Depth-filter lot pre-use flush turbidity above alert",           detected_during: "pre-use filter flush",              root_cause: insufficient_initial_flush_volume, disposition: retained, lot: LOT-DF-4408, values: {flush_turbidity_ntu: 6.0}}
      - {id: DEV-004-02, step: harvest, type: deviation, summary: "Post-clarification turbidity excursion above NOR on one run",     detected_during: "in-process turbidity monitoring",   root_cause: depth_filter_loading_near_maximum,  disposition: retained, method: AMV-3015, values: {turbidity_max_ntu: 12.5}}

    PCR-005:
      - {id: DEV-005-01, step: protein_a, type: deviation, summary: "Elution-buffer pH prepared below target on an RSM run",         detected_during: "post-run review of the buffer preparation record (the buffer had passed release on an incorrectly calibrated pH meter)", root_cause: titration_endpoint_error, disposition: retained, lot: LOT-BUF-5290, values: {ph_measured: 3.38}}
      # first_over_reported (2026-10-09, PCR-005 review run 3): the first, out-of-trend result as a
      # multiple of the reported re-assay, so that a report can give both results and the analysis
      # with each. The cause (carryover) was suspected, not confirmed, and a result set aside on an
      # unconfirmed cause is reported beside the one used. A ratio, not a value, for the reason below.
      - {id: DEV-005-02, step: protein_a, type: deviation, summary: "Leached Protein A result of RSM run 11 initially out of trend; re-assayed",   detected_during: "analytical review",           root_cause: assay_carryover_suspected, disposition: retained, method: AMV-3016, values: {run: 11, first_over_reported: 1.8}}
      # DEV-005-02 carries no re-assay VALUE: the reported result of RSM run 11 in the DoE data IS
      # the re-assay, so the report reads it from the table. A fixed value here once disagreed with
      # the seeded data (1.6 ppm against a data minimum of 1.70; PCR-005 Version 2.0 review).

    PCR-006:
      - {id: DEV-006-01, step: viral_inactivation, type: deviation, summary: "Hold-time record discrepancy between DCS and manual log", detected_during: "batch-record reconciliation", root_cause: clock_synchronisation_offset, disposition: retained, values: {time_discrepancy_min: 4}}
      - {id: DEV-006-02, step: viral_inactivation, type: deviation, summary: "XMuLV infectivity assay cytotoxicity at low dilution",     detected_during: "assay review",                root_cause: sample_matrix_cytotoxicity,   disposition: retained, method: AMV-3017, values: {cytotox_dilution: 8}}
      # owner, 2026-10-09: PCP-006 Version 1.0 §6.4 required XMuLV clearance on every run of the A-Mab
      # concentration study; S-VI-UNI measured aggregate and acidic variants only, and PCR-006 Version 1.0 did
      # not notice. Found in the Version 2.0 re-analysis; closed by study S-VI-UNI2 (PD-006-06).
      - {id: DEV-006-03, step: viral_inactivation, type: deviation, summary: "XMuLV clearance not measured on the A-Mab concentration runs, as the plan required", detected_during: "Version 2.0 re-analysis (plan against study record)", root_cause: spiking_scheduled_for_the_designed_studies_only, disposition: closed_by_confirmation_study, study: S-VI-UNI, values: {conc_low_g_per_l: 5, conc_high_g_per_l: 35}}

    PCR-007:
      - {id: DEV-007-01, step: cex, type: deviation, summary: "Expired Tris load/wash buffer lot used in screening run 6",           detected_during: "post-execution documentation review", root_cause: material_expiry_not_checked_at_preparation, disposition: retained, lot: LOT-BUF-2287, prior_doc: SOP-2103, values: {retest_ph: 5.02, retest_cond: 5.06}}
      - {id: DEV-007-02, step: cex, type: deviation, summary: "Column inlet temperature excursion during RSM run 14",                detected_during: "equipment history review",            root_cause: controller_setpoint_drift,               disposition: retained, equipment: EQ-CHR-118, method: AMV-3221, values: {tmax: 26.4, duration: 38, ver_n: 3}}

    # Anion exchange is the only step whose first DoE execution was INVALIDATED and
    # re-executed (DEV-008-01) — so its study was really run twice. The superseded first
    # execution is a real seeded dataset (outputs/data/doe_aex_{screening,rsm}_superseded.csv);
    # `superseded` carries the deamidation model coefficient and the reproducible seed offset
    # applied by scripts/generate_superseded.py. DEV-008-02 (UV pool-stop) and DEV-008-03
    # (a realistic Equil/Wash-1 buffer-pH excursion) accompany it.
    PCR-008:
      - {id: DEV-008-01, step: aex, type: deviation, summary: "Non-representative (deamidated) load in the first DoE execution; designs invalidated and re-executed", detected_during: "load-material charge-variant verification by icIEF (AMV-3013)", root_cause: extended_neutralized_hold_promoted_asparagine_deamidation, disposition: invalidated_and_re_executed, lot: LOT-CEX-8842, method: AMV-3013, superseded: {kinds: [screening, rsm], hcp_deam_corner_coef: 1.4, seed_offset: 800}, values: {acidic_variants_deamidated_pct: 33.5, acidic_variants_requalified_pct: 21.0, neutralized_hold_h: 36}}
      - {id: DEV-008-02, step: aex, type: deviation, summary: "Trailing-edge UV pool-collection set-point slightly permissive in both executions", detected_during: "post-execution pool-fraction reconciliation (AMV-3012)", root_cause: permissive_uv_pool_stop_setpoint, disposition: corrected_by_modelling_and_verification_runs, method: AMV-3012, values: {uv_pool_stop_original_mau: 180, uv_pool_stop_corrected_mau: 120, ver_n: 3, ver_robust_n: 2}}
      - {id: DEV-008-03, step: aex, type: deviation, summary: "Equilibration/Wash-1 buffer released below its pH acceptance range on one screening run", detected_during: "buffer release testing per SOP-2103", root_cause: titration_endpoint_error_at_buffer_preparation, disposition: retained, lot: LOT-BUF-8815, prior_doc: SOP-2103, values: {buffer_ph_measured: 7.32, buffer_ph_low_limit: 7.40, buffer_ph_target: 7.50}}

    PCR-009:
      - {id: DEV-009-01, step: virus_filtration, type: deviation, summary: "Transient filtration-pressure excursion above NOR",       detected_during: "in-process pressure monitoring", root_cause: pump_ramp_overshoot,           disposition: retained, values: {pmax_psi: 22}}
      - {id: DEV-009-02, step: virus_filtration, type: deviation, summary: "Filter membrane lot flux below vendor-typical value",      detected_during: "pre-use flux verification",      root_cause: membrane_lot_permeability_variation, disposition: retained, lot: LOT-VF-9331, method: AMV-3018, values: {flux_deficit_pct: 12}}

    PCR-010:
      - {id: DEV-010-01, step: ufdf, type: deviation, summary: "Transmembrane-pressure excursion above NOR during concentration",     detected_during: "in-process TMP monitoring",  root_cause: membrane_fouling_transient, disposition: retained, equipment: EQ-TFF-142, values: {tmp_max_psi: 14.6}}
      - {id: DEV-010-02, step: ufdf, type: deviation, summary: "Final DS concentration below target on one run; topped up",           detected_during: "final concentration check",  root_cause: residual_hold_up_volume,    disposition: retained, method: AMV-3019, values: {conc_pre_g_per_l: 71.5}}

# =====================================================================================
# Campaign chronology (Rev 2.0). Recorded facts, seed-independent. Every study window ends
# before the cal_due of the equipment it used and before the Rev 1.0 effective date, which is
# what resolves the calibration-date tension (docs/next/seeded-data-tensions.md item 2): the
# equipment WAS in calibration when the study ran, and the documents were issued later.
# Lot expiries in `deviations.lots` are consistent with these windows. LOT-BUF-2287 expired
# on 2026-02-11 and was used in CEX screening run 6, inside the CEX screening window, which is
# exactly DEV-007-01.
# =====================================================================================
campaign:
  revisions:
    - {rev: "1.0", effective: "2026-07-24", reason: "Initial issue"}
    # the reason is common to every document; what changed in each is in its "Changes in this revision"
    # (PCP-003 review: a bioreactor plan listed "fragments by nrCE-SDS", which it does not adopt)
    - {rev: "2.0", effective: "2026-09-30", reason: "Reissued under INV-001 and INV-002: a priori intermediate acceptance criteria, re-analysis of the studies, execution dates recorded; changes listed in the document"}
  # Version 1.0 approval date of each PLAN, before the studies it governs began. The Version 1.0
  # title blocks of the whole package carried 2026-07-24, the date the package was compiled for
  # the BLA, which made every plan look approved after its own studies (INV-001 finding 5).
  # Reports and PCMR-001 were approved at 2026-07-24 and are not listed.
  plan_approval:
    PTP-001: "2025-06-16"
    RA-001: "2025-07-14"
    PCMP-001: "2025-08-04"
    # before S-BRX-SDM, which was re-dated to 2025-08-11 to hold a full culture (INV-001 and PCP-003
    # authors, 2026-10-09: the earlier 2025-08-25 put the plan's approval after its first study)
    PCP-003: "2025-08-07"
    PCP-004: "2025-10-20"
    PCP-005: "2025-11-03"
    PCP-006: "2026-01-05"
    PCP-007: "2026-02-02"
    PCP-008: "2026-02-02"
    PCP-009: "2026-04-13"
    PCP-010: "2026-02-23"
  # campaign-wide decision thresholds, stated in PCMP-001 Version 2.0 before any report used them
  thresholds:
    cpk_target: 1.33              # capability expected of a CQA in routine manufacture
    cpk_minimum: 1.00             # below this a CQA needs an action in the control strategy
    lof_alpha: 0.05               # lack-of-fit test
    max_r2_minus_pred_r2: 0.20    # predicted R2 may fall short of R2 by at most this
    effect_alpha: 0.05            # a model term is significant (an attribute is "affected") below this p
  # Discrepancies from the plan: something a report did that its approved plan did not foresee,
  # with no departure from a procedure or a GMP requirement (owner, 2026-10-08: "reports can do
  # stuff which was not planned but a discrepancy has to describe it. Note that the word
  # 'deviation' has a very clear meaning in the GMP world"). Deviations stay in
  # deviations.events. Numbers are not stored here; the report reads them from the data
  # (analytics.sdm.n_scale_down, analytics.sdm.supplementary).
  plan_discrepancies:
    PCR-005:
      - id: PD-005-01
        step: protein_a
        plan: PCP-005
        subject: "Supplementary set-point runs in the scale-down model qualification"
        planned: "set-point runs of the scale-down model in study S-PA-SDM"
        done: "further set-point runs in study S-PA-SDM2, made during the Version 2.0 re-analysis"
        reason: "to narrow the confidence interval of the offset for pool host cell protein, the output that sets the ranges of the step"
        studies: [S-PA-SDM2]
      - id: PD-005-02
        step: protein_a
        plan: PCP-005
        subject: "Conclusions resting on an influence analysis"
        planned: "response-surface models meeting every model-adequacy criterion of the plan, used for the ranges and the design space"
        done: "an influence analysis for every output with a criterion (each run with a Cook's distance above 4/n deleted in turn, the model selection repeated and the output judged over the NOR again), and the size of each residual trend against the criterion of its output"
        reason: "no selected model meets criterion 5 of the plan, on influential runs and residual trends"
      # owner, 2026-10-09: "make sure to describe the analysis method in the report adequately. Write it
      # as discrepancy to the plan." The analysis method of pool host cell protein departs from PCP-005
      # and PCMP-001 in three linked ways; PCR-005 describes the method in full in its statistical methods.
      - id: PD-005-03
        step: protein_a
        plan: PCP-005
        subject: "Response-surface run 23 analysed at its recorded elution buffer pH"
        planned: "every run analysed at its design setting"
        done: "run 23 analysed at the elution buffer pH recorded under DEV-005-01, the setting the run was made at"
        reason: "the deviation record shows the buffer below its target pH; analysing the run at the recorded setting is the conservative reading"
      # numbered 05 so that the computed model-selection discrepancy keeps PD-005-04 (owner, 2026-10-09)
      - id: PD-005-05
        step: protein_a
        plan: PCP-005
        subject: "Hold study of the Protein A eluate, made during the Version 2.0 re-analysis"
        planned: "no hold study; Version 1.0 of the plan did not foresee one"
        done: "the Protein A eluate held at two temperatures for seven days, aggregate by SEC, acidic variants by icIEF and fragments by nrCE-SDS at every time point (study S-PA-HLD)"
        reason: "Version 2.0 judges a held intermediate against its intermediate acceptance criteria, and Version 1.0 had no hold result to judge"
        studies: [S-PA-HLD]
    PCR-003:
      - id: PD-003-01
        step: bioreactor
        plan: PCP-003
        subject: "Osmolality study at the least favourable NOR combination for acidic variants"
        planned: "osmolality in the screening design only, held at its set-point in the response-surface design"
        done: "osmolality at its NOR low, set-point and NOR high, with the four response-surface parameters at their least favourable NOR combination for acidic variants, osmolality adjusted independently of pCO2 (study S-BRX-OSM), the number of runs from the precision of the prediction at the NOR high"
        reason: "the screening showed osmolality lowering acidic variants, the attribute nearest its lower limit, and the response-surface design could not show its size at the worst case; narrowing the osmolality NOR was not accepted, so the effect was measured"
        studies: [S-BRX-OSM]
    PCR-004:
      - id: PD-004-01
        step: harvest
        plan: PCP-004
        subject: "Univariate study with recorded results, made during the Version 2.0 re-analysis"
        planned: "a univariate study of each harvest parameter (study S-HAR-UNI), which Version 1.0 described and narrated without a result for any parameter effect"
        done: "a further univariate study, each parameter at five levels in duplicate with the others at set-point, post-clarification turbidity as a challenge (study S-HAR-UNI2)"
        reason: "to give the harvest parameters the recorded results that Version 1.0 lacked"
        studies: [S-HAR-UNI2]
      - id: PD-004-02
        step: harvest
        plan: PCP-004
        subject: "Hold study of the clarified harvest, made during the Version 2.0 re-analysis"
        planned: "no hold study; Version 1.0 of the plan did not foresee one"
        done: "the clarified harvest held at two temperatures for seven days, aggregate by SEC, acidic variants by icIEF and fragments by nrCE-SDS at every time point (study S-HAR-HLD)"
        reason: "Version 2.0 judges a held intermediate against its intermediate acceptance criteria, and Version 1.0 had no hold result to judge"
        studies: [S-HAR-HLD]
    PCR-010:
      - id: PD-010-01
        step: ufdf
        plan: PCP-010
        subject: "Univariate study with recorded results, made during the Version 2.0 re-analysis"
        planned: "a univariate study of each UF/DF parameter at its range edges and set-point (study S-UFDF-UNI), which Version 1.0 described and narrated without a result for any parameter effect"
        done: "a further univariate study, each parameter at five levels in duplicate with the others at set-point (study S-UFDF-UNI2)"
        reason: "to give the UF/DF parameters the recorded results that Version 1.0 lacked"
        studies: [S-UFDF-UNI2]
    PCR-006:
      - id: PD-006-01
        step: viral_inactivation
        plan: PCP-006
        subject: "OFAT stability study at the re-centred inactivation pH"
        planned: "no study at the Version 2.0 set-points; the response-surface design covers pH 3.2 to 4.0"
        done: "a low-pH hold at pH 3.40 against pH 3.50 as control, over hold times 0 to 180 min, in duplicate (study S-VI-OFAT)"
        reason: "Version 2.0 re-centres the pH and hold-time set-points to give the XMuLV claim a margin that large-scale pH control can hold; the study shows the quality attributes in scope at the new pH directly"
        studies: [S-VI-OFAT]
      - id: PD-006-02
        step: viral_inactivation
        plan: PCP-006
        subject: "Small-scale cation exchange verification runs on material inactivated at pH 3.40"
        planned: "no downstream verification"
        done: "cation exchange runs at set-point on the worst-case material of the re-centred step (study S-CEX-VER), the number of runs from a simulation"
        reason: "to confirm that cation exchange clears aggregate and fragments from that material at least as well as the Version 2.0 criteria assume"
        studies: [S-CEX-VER]
      - id: PD-006-03
        step: viral_inactivation
        plan: PCP-006
        subject: "Confirmation runs at the harshest combination within the PAR after the hold-time NOR was revised"
        planned: "no study at the Version 2.0 NOR"
        done: "low-pH holds at the lower end of the pH PAR, the upper end of the hold-time NOR and the upper end of the temperature NOR, each followed by a cation exchange run at set-point (study S-VI-WC), as many runs as the cation exchange verification"
        reason: "the hold-time NOR was revised to give the upper edge of the pH NOR a margin to the XMuLV PAR edge; the revision moves routine operation toward longer holds, so the runs confirm that the harshest combination within the PAR harms neither product quality nor cation exchange"
        studies: [S-VI-WC]
      # numbered 05 and 06 so that the computed model-selection discrepancy keeps PD-006-04 (owner, 2026-10-09)
      - id: PD-006-05
        step: viral_inactivation
        plan: PCP-006
        subject: "Hold study of the neutralized low-pH pool, made during the Version 2.0 re-analysis"
        planned: "no hold study; Version 1.0 of the plan did not foresee one"
        done: "the neutralized pool held at two temperatures for seven days, aggregate by SEC, acidic variants by icIEF and fragments by nrCE-SDS at every time point (study S-VI-HLD)"
        reason: "Version 2.0 judges a held intermediate against its intermediate acceptance criteria, and Version 1.0 had no hold result to judge"
        studies: [S-VI-HLD]
      - id: PD-006-06
        step: viral_inactivation
        plan: PCP-006
        subject: "XMuLV clearance at the two ends of the A-Mab concentration range"
        planned: "XMuLV clearance measured on every run of the A-Mab concentration study (study S-VI-UNI)"
        done: "XMuLV-spiked low-pH holds at the low and the high end of the A-Mab concentration range, in duplicate, the other parameters at their set-points as characterized (study S-VI-UNI2)"
        reason: "the concentration study did not measure XMuLV clearance (DEV-006-03), so the clearance across the concentration range had no result"
        studies: [S-VI-UNI2]
  # A run whose factor setting was recorded off its design value is analysed, in Version 2.0, at the
  # recorded setting (owner, 2026-10-09: DEV-005-01, RSM run 23, elution buffer measured at pH 3.38 after
  # it had passed release on a miscalibrated meter). Version 1.0 analysed it at the design setting, and
  # the Version 1.0 reproduction (doe_report.rev1_criteria_in_force, planned_full_models) still does.
  # The value comes from the deviation record (deviations.events, `value_from`).
  setting_corrections:
    - {step: protein_a, kind: rsm, run: 23, factor: elution_ph, deviation: DEV-005-01, value_from: ph_measured}
  model_adequacy:
    investigation: INV-002
    decided: "2026-09-02"          # INV-002 approves the rule, the sample sizes and the designs
    # INV-002 root cause (2026-09-15): the plans prescribed the full quadratic as the predictive model and no
    # model selection. CA3 analyses every response-surface output by model selection (adequacy.select_model:
    # Box-Cox scale, AICc over all hierarchical submodels, block kept) from this date, before the criteria
    # were fixed at INV-001 closure; each report records it as a discrepancy from its plan (owner,
    # 2026-10-09: "Do not adapt the PCMP, just write it as discrepancy to the plan in the report").
    selection_adopted: "2026-09-15"
    assurance: 0.90                # P(the planned model, full quadratic + block, meets §7.2 after the augmentation)
    assurance_basis: "the probability of success customary for a confirmatory study, 0.80 to 0.90, taken at its upper end because a further failure would leave a criterion attribute without an adequate model"
    reps: 4000                     # simulated data sets per candidate augmentation size
    step: 2                        # candidate sizes 2, 4, ... runs
    max_fraction_of_planned: 1.0   # no augmentation larger than the planned design; the model is refitted instead
    # not tested on the drug substance: viral clearance is a process requirement, shown by spiking
    # studies against a cumulative claim. Its models are refitted, and an augmentation spikes no virus.
    not_specification: [xmulv_lrf, mvm_lrf]
    # the study each step would run if the rule gives it an augmentation, and when
    studies:
      bioreactor:         {id: S-BRX-AUG, start: "2026-09-03", end: "2026-09-24"}
      protein_a:          {id: S-PA-AUG,  start: "2026-09-21", end: "2026-09-24"}
      viral_inactivation: {id: S-VI-AUG,  start: "2026-09-21", end: "2026-09-24"}
      cex:                {id: S-CEX-AUG, start: "2026-09-21", end: "2026-09-24"}
      # started under the rule of 2026-09-02, before CA3 was adopted on 2026-09-15; the runs were
      # under way when it was adopted and were completed
      aex:                {id: S-AEX-AUG, start: "2026-09-10", end: "2026-09-24"}
      virus_filtration:   {id: S-VF-AUG,  start: "2026-09-21", end: "2026-09-24"}
  investigation_2:
    id: INV-002
    title: "Response-surface models below the model-adequacy criteria of PCMP-001 Version 2.0"
    opened: "2026-08-31"
    closed: "2026-09-28"
    trigger: "Re-analysis of the response-surface models against the model-adequacy criteria of PCMP-001 Version 2.0"
    classification: "minor"
    # the basis QA gave for the classification and for the assurance target (INV-002 review run 1:
    # "the record gives none")
    classification_basis: "no GMP batch was made or dispositioned on the analysis, no product quality impact, and the finding concerns the statistical analysis of development data, not their integrity"
    capa:
      - {id: CA1, action: "Augment each response-surface design that the rule names, with the number of runs INV-002 calculates, and re-evaluate its models on all runs with a block term", owner: "MSAT", due: "2026-09-30", status: "runs complete at closure; the re-evaluation on all runs is carried by the Version 2.0 reports, open at closure"}
      - {id: CA2, action: "Refit every other failing model by hierarchical backward elimination, and judge a response with no adequate model on its measured results", owner: "MSAT", due: "2026-09-30", status: "complete at closure"}
      - {id: CA3, action: "Analyse every response-surface output by model selection (Box-Cox scale, AICc over all hierarchical submodels of the full quadratic, block kept) and judge the selected model against PCMP-001 §7.2; each report records it as a discrepancy from its plan", owner: "MSAT", due: "2026-09-30", status: "adopted on 2026-09-15; applied by the Version 2.0 reports, open at closure"}
      - {id: PA1, action: "Check each new characterization plan before approval, by simulation at the expected effects and with the analysis the plan states, for an assurance of at least 0.90 that its planned models meet the model-adequacy criteria", owner: "Statistics", due: "2026-12-31", status: "open at closure"}
      - {id: PA2, action: "Revise SOP-1002 so that a characterization plan states its model-selection procedure", owner: "Quality Assurance", due: "2026-12-31", status: "open at closure"}
    # not "every planned model adequate": at a probability of success of 0.90 per model, 16 models all pass
    # only about 0.9^16 = 19 % of the time even when the check works (INV-002 review, 2026-10-09). Review
    # run 2: counting failures of a check that is optimistic for a selected model cannot detect what this
    # investigation found (selected models that pass and still mispredict new runs), so the check now
    # asks for the prediction of new runs, by a test stated in advance.
    effectiveness_check: {due: "2027-06-30", criterion: "for the next two characterization plans, the design-size check documented for every planned model before approval; and at their first analysis, for every attribute with a criterion, a selected model that meets the model-adequacy criteria and whose 95 % prediction intervals contain the step's confirmation runs at least as often as a one-sided binomial test at the 0.05 level allows; if no plan is approved by the due date, the check is made on the next characterization study of A-Mab"}
  investigation:
    id: INV-001
    title: "Acceptance criteria for proven-acceptable-range analysis set after data review"
    opened: "2026-08-03"
    closed: "2026-09-18"
    trigger: "QA review of PCMR-001 Rev 1.0 for BLA readiness"
    classification: "major"
  # INV-001 corrective (CA) and preventive (PA) actions. Recorded facts; status as at closure.
  capa:
    - {id: CA1, action: "Reissue PCMP-001 with a priori intermediate acceptance criteria", owner: "MSAT", due: "2026-09-30", status: "open at closure"}
    - {id: CA2, action: "Amend PCP-003 to PCP-010 with the criteria and the fragment method", owner: "MSAT", due: "2026-09-30", status: "open at closure"}
    - {id: CA3, action: "Reissue PCR-003 to PCR-010, PTP-001, RA-001 and PCMR-001 at Version 2.0", owner: "MSAT", due: "2026-09-30", status: "open at closure"}
    - {id: PA1, action: "Revise SOP-1002 so acceptance criteria are approved in the protocol before execution", owner: "Quality Assurance", due: "2026-11-30", status: "open at closure"}
    - {id: PA2, action: "Add to the report review checklist of SOP-4001 a check that every acceptance criterion is traceable to the approved protocol", owner: "Quality Assurance", due: "2026-11-30", status: "open at closure"}
    - {id: PA3, action: "Record execution dates and equipment calibration status in every study record", owner: "MSAT", due: "2026-10-31", status: "open at closure"}
  effectiveness_check: {due: "2027-03-31", criterion: "the next two characterization protocols approved with acceptance criteria and provenance, before execution"}
  method_decision: {id: AMD-001, date: "2026-03-20", title: "Fragments by non-reduced CE-SDS at every step, because SEC is biased in the capture and viral inactivation matrices"}
  studies:
    # scale-down model qualification (set-point runs against manufacturing scale), before each
    # step's first design; and the univariate studies of the parameters outside the designs
    # bioreactor windows hold a full culture (17 days at set-point, 18 at the longest) plus analytics
    # (PCP-003 review: 9 and 11 days could not hold one culture)
    - {id: S-BRX-SDM, step: bioreactor,         kind: qualification, start: "2025-08-11", end: "2025-09-05", equipment: EQ-BRX-205}
    - {id: S-BRX-UNI, step: bioreactor,         kind: univariate, start: "2025-10-06", end: "2025-10-31", equipment: EQ-BRX-205}
    - {id: S-PA-SDM,  step: protein_a,          kind: qualification, start: "2025-11-05", end: "2025-11-14"}
    - {id: S-PA-UNI,  step: protein_a,          kind: univariate, start: "2025-12-08", end: "2025-12-12"}
    - {id: S-VI-SDM,  step: viral_inactivation, kind: qualification, start: "2026-01-07", end: "2026-01-16"}
    - {id: S-VI-UNI,  step: viral_inactivation, kind: univariate, start: "2026-02-02", end: "2026-02-06"}
    - {id: S-CEX-SDM, step: cex,                kind: qualification, start: "2026-02-04", end: "2026-02-13"}
    - {id: S-CEX-UNI, step: cex,                kind: univariate, start: "2026-03-16", end: "2026-03-20"}
    - {id: S-AEX-SDM, step: aex,                kind: qualification, start: "2026-02-04", end: "2026-02-13"}
    - {id: S-AEX-UNI, step: aex,                kind: univariate, start: "2026-04-13", end: "2026-04-17"}
    - {id: S-VF-SDM,  step: virus_filtration,   kind: qualification, start: "2026-04-15", end: "2026-04-24"}
    - {id: S-PA-SDM2, step: protein_a,          kind: qualification, start: "2026-09-07", end: "2026-09-11"}
