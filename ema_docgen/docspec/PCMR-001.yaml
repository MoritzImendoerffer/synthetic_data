# PCMR-001 — PC Master Report
#
# NOTE: there is no peer document in the corpus to measure against — this is
# the only document of its class. Targets below are JUDGEMENT, set at roughly
# 1.4x current length and shaped by register, not derived from measurement the
# way the PCP/PCR docspecs are. Review them before running.
#
#   current prose : 1,260 words
#   this spec adds: ~773 words

doc_id: PCMR-001
source_qmd: PCMR-001_master_report.qmd
version: 1

sections:

  # ---- TIER 3 — synthesising -------------------------------------

  - id: executive_summary
    heading: "Executive summary"
    tier: 3
    register: defensive
    target_words: 330          # currently 164
    required_moves: [bounded_conclusion, capability_margin_statement, explicit_non_claim]
    forbidden_moves: [table_narration]

  # ---- TIER 2 — analytical ---------------------------------------

  - id: process_performance
    heading: "Process description and performance"
    tier: 2
    register: analytical
    target_words: 200          # currently 116
    required_moves: [step_linkage, table_narration]
    forbidden_moves: [forward_extensibility]

  - id: cqa_outcomes
    heading: "Consolidated CQA outcomes"
    tier: 2
    register: analytical
    target_words: 240          # currently 142
    required_moves: [table_narration, cross_step_credit_allocation]
    forbidden_moves: [forward_extensibility]

  - id: param_summary
    heading: "Parameter classification summary"
    tier: 2
    register: argumentative
    target_words: 180          # currently 95
    required_moves: [null_result_to_classification, conservative_default]
    forbidden_moves: [adverse_disclosure]

  - id: capability
    heading: "Process capability"
    tier: 2
    register: analytical
    target_words: 170          # currently 79
    required_moves: [capability_margin_statement, bounded_conclusion]
    forbidden_moves: [transferability_denial]

  - id: viral_summary
    heading: "Viral clearance summary"
    tier: 2
    register: analytical
    target_words: 180          # currently 96
    required_moves: [cross_step_credit_allocation, explicit_non_claim]
    forbidden_moves: [forward_extensibility]

  # ---- TIER 3 — synthesising -------------------------------------

  - id: control_strategy
    heading: "Overall control strategy"
    tier: 3
    register: argumentative
    target_words: 210          # currently 128
    required_moves: [cross_step_credit_allocation, explicit_non_claim]
    forbidden_moves: [table_narration]

  - id: conclusions
    heading: "Conclusions and Stage-2 readiness"
    tier: 3
    register: defensive
    target_words: 210          # currently 127
    required_moves: [bounded_conclusion, explicit_non_claim, forward_extensibility]
    forbidden_moves: [table_narration]
