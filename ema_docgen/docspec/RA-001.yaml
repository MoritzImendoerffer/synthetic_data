# RA-001 — Pre-Characterization Risk Assessment
#
# NOTE: there is no peer document in the corpus to measure against — this is
# the only document of its class. Targets below are JUDGEMENT, set at roughly
# 1.4x current length and shaped by register, not derived from measurement the
# way the PCP/PCR docspecs are. Review them before running.
#
#   current prose : 1,272 words
#   this spec adds: ~566 words

doc_id: RA-001
source_qmd: RA-001_risk_assessment.qmd
version: 1

sections:

  # ---- TIER 1 — establishing -------------------------------------

  - id: purpose_scope
    heading: "Purpose and scope"
    tier: 1
    register: procedural
    target_words: 300          # currently 253
    required_moves: []
    forbidden_moves: [mechanistic_warrant, adverse_disclosure]

  - id: two_assessments
    heading: "Two distinct criticality assessments"
    tier: 1
    register: argumentative
    target_words: 160          # currently 94
    required_moves: [explicit_non_claim, conservative_default]
    forbidden_moves: [worst_case_identification]

  - id: cqa_framework
    heading: "CQA criticality framework"
    tier: 1
    register: argumentative
    target_words: 180          # currently 57
    required_moves: [scoring_rubric_definition, conservative_default]
    forbidden_moves: [adverse_disclosure]

  # ---- TIER 2 — analytical ---------------------------------------

  - id: prospective_severity
    heading: "Prospective severity and initial risk"
    tier: 2
    register: argumentative
    target_words: 170          # currently 91
    required_moves: [conservative_default, permissive_inclusion_clause]
    forbidden_moves: [mechanistic_warrant]

  - id: param_ranking
    heading: "Process-parameter risk ranking and study-type assignment"
    tier: 2
    register: argumentative
    target_words: 240          # currently 136
    required_moves: [scoring_rubric_definition, discretionary_band, table_narration]
    forbidden_moves: [adverse_disclosure]

  - id: pre_char_ranking
    heading: "Pre-characterization risk ranking and study-type assignment"
    tier: 2
    register: argumentative
    target_words: 240          # currently 165
    required_moves: [discretionary_band, conservative_default]
    forbidden_moves: [worst_case_identification]

  # ---- TIER 3 — synthesising -------------------------------------

  - id: char_scope
    heading: "Characterization scope"
    tier: 3
    register: defensive
    target_words: 200          # currently 128
    required_moves: [explicit_non_claim, bounded_conclusion]
    forbidden_moves: [table_narration]
