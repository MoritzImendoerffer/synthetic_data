# Blank docspec. Copy to <DOC_ID>.yaml and fill in.
#
# For the twenty documents already in the corpus, a pre-populated docspec exists
# — use that instead. This template is for a document that does not exist yet.
#
# Full field reference: SCHEMA.md

doc_id: XXX-000                    # e.g. PCR-011
source_qmd: XXX-000_name.qmd       # filename under pc_package/
version: 1

sections:

  # ---- TIER 1 — establishing -------------------------------------------
  # Sections that CREATE identifiers and facts later tiers cite: materials,
  # equipment, lots, scale-down qualification, analytical method performance,
  # deviations. Always written first.

  - id: section_id                 # snake_case, unique; used for all build paths
    heading: "Exact heading text"  # must match the .qmd character for character,
                                   # unless new_section is true
    new_section: false             # true if the heading does not exist yet
    tier: 1                        # 1 establishing | 2 analytical | 3 synthesising
    register: procedural           # boilerplate | procedural | analytical |
                                   # argumentative | defensive  (AUTHORING.md §2)
    target_words: 300              # lint tolerance band only; NEVER shown to the
                                   # agent. Spread these widely — 150 to 3000.
    tolerance: 0.25                # optional; fractional band, default 0.25
    required_moves: []             # move names from AUTHORING.md §3
    forbidden_moves: []            # prevents register drift; matters as much as
                                   # required_moves
    factpack: null                 # optional path override; defaults to
                                   # factpack/<DOC_ID>/<id>.yaml
    notes: >-                      # optional; passed to the agent verbatim
      Free text. Use it to point at a reference section elsewhere in the corpus,
      or to say what this section is for.

  # ---- TIER 2 — analytical ---------------------------------------------
  # Results, models, classification, capability. Independent within the tier,
  # so they can be dispatched in parallel.

  # ---- TIER 3 — synthesising -------------------------------------------
  # Discussion, conclusions, executive summary. Written last so they can restate
  # claims that by then exist — which is where coreference difficulty for the
  # benchmark comes from.
