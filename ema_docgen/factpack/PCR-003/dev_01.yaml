  - id: DEV-003-01
    type: deviation
    description: >-
      The dissolved-CO2 probe reading diverged from its offline reference during
      screening run 4, indicating probe drift between scheduled calibrations. The
      divergence stayed within the pCO2 range bracketed by the characterization
      design.
    detected_during: in-process monitoring against the offline blood-gas reference
    investigation: >-
      The probe was recalibrated under SOP-2003 and the offset quantified against
      the calibration history for EQ-BRX-205, which was within its calibration
      interval at execution.
    root_cause: probe_drift_between_calibrations
    impact_on_conclusion: >-
      Dissolved CO2 is a well-controlled CPP studied across its full range; the
      transient offset falls inside that range and does not alter the fitted
      galactosylation effect or any other response. Run retained.
    disposition: retained
    values:
      offset_mmhg: dev_003_01_offset_mmhg

