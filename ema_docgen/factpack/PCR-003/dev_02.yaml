facts:

  - id: DEV-003-02
    type: deviation
    description: >-
      Nutrient feed-1 was under-delivered on a centre-point batch when a feed pump
      calibration offset went undetected until the post-batch mass reconciliation.
    detected_during: post-execution mass reconciliation of the feed additions
    investigation: >-
      The delivered feed mass was reconciled against the batch record and the pump
      recalibrated under SOP-2004. A confirmatory centre-point set was run and the
      released N-glycan profile compared against the design centre by AMV-3010.
    root_cause: feed_pump_calibration_offset
    impact_on_conclusion: >-
      Feed-1 volume governs integral productivity; the deficit slightly lowered
      titre but the confirmatory glycan means fell within the interval expected at
      the centre point, so the batch is retained and the effect estimates are
      unchanged.
    disposition: retained
    values:
      feed_deficit_pct: dev_003_02_feed_deficit_pct
      verification_n: dev_003_02_ver_n
      ci_halfwidth: dev_003_02_ci_hw

