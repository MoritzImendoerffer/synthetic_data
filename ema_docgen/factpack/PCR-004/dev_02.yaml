    type: deviation
    description: >-
      Post-clarification turbidity exceeded the normal operating range on one run
      when the depth filter was loaded near its maximum, while remaining inside the
      characterized range.
    detected_during: in-process turbidity monitoring
    investigation: >-
      The reading was confirmed against a duplicate sample by AMV-3015 and the
      total observed variance partitioned into the assay contribution and the
      process-attributable remainder.
