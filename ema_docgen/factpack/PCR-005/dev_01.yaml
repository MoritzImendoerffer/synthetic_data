facts:

  - id: DEV-005-01
    type: deviation
    description: >-
      The Protein A elution buffer for an RSM run was prepared with a pH below its
      target owing to a titration end-point error; the measured pH remained inside
      the characterized elution-pH range.
    detected_during: buffer release testing before use
    investigation: >-
      The prepared buffer pH was measured against the preparation record for
      LOT-BUF-5290 and the run's coded elution-pH level recomputed from the
      measured value before the response was fitted.
    root_cause: titration_endpoint_error
    impact_on_conclusion: >-
      Elution pH is a well-controlled CPP and lower pH raises leached Protein A and
      HCP; because the true level was recovered from the measurement and lies
      within the proven acceptable range, the run is retained at its actual coded
      setting.
    disposition: retained
    values:
      ph_measured: dev_005_01_ph_measured

  - id: LOT-BUF-5290
    type: lot
    identifier: LOT-BUF-5290
    material: Protein A elution buffer
    expiry: lot_buf_5290_expiry
    used_in: RSM run 9
    available_for: [dev_01]
