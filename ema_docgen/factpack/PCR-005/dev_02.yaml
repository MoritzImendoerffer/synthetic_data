facts:

  - id: DEV-005-02
    type: deviation
    description: >-
      A leached Protein A result was initially reported out-of-trend for its run;
      assay carryover from the preceding high-concentration sample was suspected.
    detected_during: analytical review of the leached Protein A series
    investigation: >-
      System suitability was re-established and the sample re-assayed under a
      qualified sequence by AMV-3016; the confirmed value replaced the flagged
      result after the total observed variance was partitioned into its assay and
      process components.
    root_cause: assay_carryover_suspected
    impact_on_conclusion: >-
      The re-assayed leached Protein A was within the range observed across the
      design and well below the level of concern; the original reading is
      attributed to assay carryover, and the run is retained on the confirmed
      value.
    disposition: retained
    values:
      retest_ppm: dev_005_02_retest_ppm

