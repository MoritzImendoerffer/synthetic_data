facts:

  - id: DEV-006-01
    type: deviation
    description: >-
      The recorded low-pH hold time differed between the distributed control system
      and the manual batch log for one run, owing to a clock-synchronisation offset
      between the two.
    detected_during: batch-record reconciliation
    investigation: >-
      The two records were reconciled and the hold reported against the shorter of
      the two times, the conservative choice for a viral-inactivation claim under
      SOP-2009.
    root_cause: clock_synchronisation_offset
    impact_on_conclusion: >-
      Hold time is a well-controlled CPP and longer holds only increase clearance;
      reporting against the shorter recorded time cannot over-state the XMuLV
      log-reduction, so the run is retained without impact on the inactivation
      claim.
    disposition: retained
    values:
      time_discrepancy_min: dev_006_01_time_discrepancy_min
