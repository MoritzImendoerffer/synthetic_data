facts:

  - id: DEV-006-02
    type: deviation
    description: >-
      The XMuLV infectivity assay showed cytotoxicity at the lowest sample dilution
      for one determination, invalidating that dilution while leaving the higher
      dilutions readable.
    detected_during: assay review of the XMuLV titration
    investigation: >-
      The titre was derived from the valid higher dilutions by AMV-3017, and the
      total observed variance apportioned between the assay contribution and the
      process-attributable remainder.
    root_cause: sample_matrix_cytotoxicity
    impact_on_conclusion: >-
      Excluding the cytotoxic dilution lowers the numerical titre and therefore
      reports the log-reduction conservatively; the inactivation claim is met on
      the valid dilutions, so the run is retained.
    disposition: retained
    values:
      cytotox_dilution: dev_006_02_cytotox_dilution

  - id: AMV-3017
    type: method_performance
    method_id: AMV-3017
    precision: amv_3017_precision
    loq: amv_3017_loq
    variance_contribution: amv_3017_var_frac
    available_for: [dev_02, analytical_methods]
