facts:

  - id: DEV-02
    type: deviation
    description: >-
      Column inlet temperature excursion during run 14 of the response-surface
      design, followed by a pool-collection stop-criterion found slightly
      permissive on review of both executions.
    detected_during: rsm_execution
    investigation: >-
      Chamber controller fault confirmed by the equipment history for EQ-CHR-118.
      Corrected stop-collect determined by modelling and confirmed by
      verification runs at the set-point.
    root_cause: controller_setpoint_drift
    impact_on_conclusion: >-
      Run retained. Temperature was not a factor in this design and the excursion
      falls inside the univariate range assessed in PCP-007 section 9. The
      stop-collect offset is common-mode and does not affect effect estimates or
      the operating region.
    disposition: retained
    values:
      excursion_max: dev_007_02_tmax
      excursion_duration: dev_007_02_duration
      verification_n: dev_007_02_ver_n
      ci_halfwidth: dev_007_02_ci_hw

