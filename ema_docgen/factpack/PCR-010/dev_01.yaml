facts:

  - id: DEV-010-01
    type: deviation
    description: >-
      Transmembrane pressure exceeded the normal operating range during the
      concentration phase of one run as the membrane fouled, while staying inside
      the characterized TMP range.
    detected_during: in-process TMP monitoring
    investigation: >-
      Flux and TMP were trended and a buffer flush performed on EQ-TFF-142, after
      which flux recovered and the run continued under SOP-2013.
    root_cause: membrane_fouling_transient
    impact_on_conclusion: >-
      UF/DF forms no product-quality CQA and the excursion lies within the studied
      TMP range; flux recovery after the flush confirms transient fouling rather
      than membrane damage, so the run is retained.
    disposition: retained
