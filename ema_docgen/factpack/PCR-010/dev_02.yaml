facts:

  - id: DEV-010-02
    type: deviation
    description: >-
      The final drug-substance concentration was below target on one run because of
      residual hold-up volume in the recirculation loop.
    detected_during: final concentration check
    investigation: >-
      The concentration was confirmed by A280 under AMV-3019 and the batch returned
      to a brief additional ultrafiltration to reach the target, with the total
      observed variance apportioned into its assay and process components.
    root_cause: residual_hold_up_volume
    impact_on_conclusion: >-
      Final concentration is a process-performance parameter, not a CQA, and the
      pre-adjustment value sits within the characterized range; the target was met
      after the additional ultrafiltration, so the run is retained.
    disposition: retained
    values:
      conc_pre_g_per_l: dev_010_02_conc_pre_g_per_l

