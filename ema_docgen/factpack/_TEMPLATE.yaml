# Blank fact pack. One per section: factpack/<DOC_ID>/<SECTION_ID>.yaml
#
# `scripts/init_factpacks.py` generates an empty stub like this for every
# section in a docspec. Fill in the ones that need facts; leave the rest empty.
#
# An empty fact pack is valid and means: this section may state nothing that is
# not already in the document or available from a helper. That is the correct
# setting for most analytical sections, whose material comes from the model.
#
# Full field reference: SCHEMA.md

doc_id: XXX-000
section_id: section_id

facts: []

# Remove the [] above and uncomment below to add facts.
#
# facts:
#
#   - id: DEV-007-01                 # cited by other sections; creates a
#                                    # multi-hop retrieval hook
#     type: deviation                # deviation | excluded_run | equipment |
#                                    # lot | method_performance |
#                                    # equivalence_test | prior_doc | incident
#     description: >-
#       What happened, in one or two sentences.
#     detected_during: post-execution documentation review
#     investigation: >-
#       What was done to establish the cause.
#     root_cause: short_snake_case_tag
#     impact_on_conclusion: >-
#       Effect on the study conclusion. Must be stated even when nil.
#     disposition: retained          # retained | excluded | reanalysed | ...
#     values:                        # NAMES of helper expressions, never numbers
#       retest_ph: dev_007_01_retest_ph
#     available_for: [deviations, results_rsm]   # optional; omit for all sections
#
# Numerics rule: `values` carries the NAME of an inline expression, never a
# literal. If no helper exists yet, put the name in anyway — the agent will emit
# <<NEEDS: ...>> and that is your signal to extend the generator.
