# Curated question-answer items, checked by build_qa.py.
#
# Hand-written for what the generators cannot reach: multi-document reasoning (L4), summarization
# (SUM) and questions the corpus cannot answer (NONE). Every number lives in a quote, never in
# this file on its own. build_qa.py grounds every quote against the rendered .docx; an item whose
# quote no longer grounds (a re-seed, a re-authored document) is reported STALE and left out.
# A NONE item lists absent_terms, which must occur in no Version 2.0 document.
#
# Fields: see qa/README.md. `docs` is computed by the script from the evidence.

# --------------------------------------------------------------------------- L4
- id: L4-curated-vi-ph-recentred
  level: L4
  question: >-
    Why was the inactivation pH set-point of the low-pH viral inactivation step changed after
    characterization, from what to what, and does the transfer plan carry the new value?
  answer: >-
    The plan studied a set-point of pH 3.5 (NOR 3.4-3.6). At the planned NORs the lowest mean
    predicted XMuLV log reduction (6.16 log10) fell short of the step claim of 6.60 log10, so PCR-006
    moved the set-point to pH 3.4 with a NOR of pH 3.3-3.5 (and narrowed the hold time and
    temperature NORs). PTP-001 carries pH 3.4, NOR 3.3-3.5, as a CPP.
  evidence:
    - {doc_id: PCP-006, quote: "A | Inactivation pH | pH | 3.5 a) | 3.2–4.0 | 3.4–3.6 b) | multivariate"}
    - {doc_id: PCR-006, quote: "F1. At the normal operating ranges (NORs) against which the studies were planned, the XMuLV claim was not met."}
    - {doc_id: PCR-006, quote: "The lowest mean predicted log reduction was 6.16"}
    - {doc_id: PCR-006, quote: "The pH set-point and NOR were therefore moved to pH 3.4 and pH 3.3–3.5, the hold-time NOR was narrowed to 100–120 min with its set-point at 110 min, and the temperature NOR was narrowed to 20–23 °C."}
    - {doc_id: PTP-001, quote: "Low-pH viral inactivation | Inactivation pH | pH | 3.4 c3) | 3.3–3.5 c2) | 3.2–4 | CPP"}
  reasoning:
    - PCP-006 plans the step at pH 3.5, NOR 3.4-3.6.
    - PCR-006 finds the XMuLV claim not met at the planned NORs (6.16 against 6.60 log10).
    - PCR-006 moves the pH set-point and NOR, and narrows the hold time and temperature NORs.
    - PTP-001 carries the new set-point and NOR into transfer.

- id: L4-curated-acidic-cpk-two-sided
  level: L4
  question: >-
    INV-001 found that the capability of acidic variants had been assessed against one end of its
    range. What index did Version 1.0 print, what does the two-sided calculation give, and what Cpk
    does the Version 2.0 bioreactor report give for acidic variants in the drug substance?
  answer: >-
    Version 1.0 printed 4.3, computed against the upper limit alone. Against both ends INV-001
    computes 1.03. PCR-003 Version 2.0 gives a Cpk of 1.05, between the minimum of 1.00 and the
    target of 1.33.
  evidence:
    - {doc_id: INV-001, quote: "The capability index beside it was computed against the upper end alone and printed as 4.3."}
    - {doc_id: INV-001, quote: "Computed against both ends, the index is 1.03, because the mean lies 3.1 SD above the lower limit and 12.8 SD below the upper limit."}
    - {doc_id: PCR-003, quote: "In the integrated model of the train the capability index of acidic variants in the drug substance is a Cpk of 1.05, between the minimum of 1.00 and the target of 1.33, and every other attribute that the step sets has a Cpk above the target."}
  reasoning:
    - INV-001 finding F4 gives the one-sided value printed in Version 1.0 and the two-sided value.
    - PCR-003 gives the Version 2.0 Cpk and places it against the minimum and the target.

- id: L4-curated-root-cause-capa
  level: L4
  question: >-
    What root cause did the investigation into the Version 1.0 acceptance criteria find, which
    corrective action removes it for this campaign, and when did the reissued master plan take effect?
  answer: >-
    PCMP-001 Version 1.0 required a criterion for each step but gave no rule for deriving one.
    Corrective action CA1 reissues PCMP-001 with a priori intermediate acceptance criteria (owner
    MSAT, due 2026-09-30). PCMP-001 Version 2.0 is effective 2026-09-30.
  evidence:
    - {doc_id: INV-001, quote: "The root cause is that PCMP-001 Version 1.0, the master plan, required a criterion for each step but gave no rule for deriving one (finding F1)."}
    - {doc_id: INV-001, quote: "CA1 | Reissue PCMP-001 with a priori intermediate acceptance criteria | MSAT | 2026-09-30"}
    - {doc_id: PCMP-001, quote: "2.0 | 2026-09-30 | Reissued under INV-001 and INV-002: a priori intermediate acceptance criteria"}
  reasoning:
    - INV-001 states the root cause.
    - INV-001 Table 14 assigns CA1 to the reissue of PCMP-001.
    - The PCMP-001 revision history gives the effective date of Version 2.0.

- id: L4-curated-xmulv-claims-sum
  level: L4
  question: >-
    Which steps claim XMuLV clearance, what does each claim, and do the claims cover the cumulative
    requirement of the drug substance?
  answer: >-
    Low-pH viral inactivation claims 6.60, anion exchange 5.50 and virus filtration 4.62 log10. They
    sum to 16.72 log10 against a requirement of 16.7, so the claims alone meet it with little room.
  evidence:
    - {doc_id: PCMP-001, quote: "XMuLV clearance (log10) | ≥ 16.7 d) | Low-pH viral inactivation | not applicable | ≥ 6.60 | Platform claim e)"}
    - {doc_id: PCMP-001, quote: "| | Anion exchange | not applicable | ≥ 5.50 | Platform claim e)"}
    - {doc_id: PCR-009, quote: "Every measured XMuLV LRF, from 5.90 to 6.51 log10, met its claim of 4.62 log10, and XMuLV LRF has no PAR."}
    - {doc_id: PCMP-001, quote: "The claims for XMuLV sum to 16.72 log10 against a requirement of 16.7."}
    - {doc_id: PCR-006, quote: "which three steps claim together, and the claim of this step is 6.60"}
  reasoning:
    - PCMP-001 Table 9 gives the claims of low-pH viral inactivation and anion exchange.
    - PCR-009 gives the virus filtration claim.
    - PCMP-001 §7.4 gives the sum against the requirement.

- id: L4-curated-protein-a-hcp-sdm
  level: L4
  question: >-
    Under the rule for qualifying a scale-down model, is the Protein A scale-down model qualified
    for pool host cell protein over the NOR in force, and what does the Protein A report do about it?
  answer: >-
    No. The model is qualified only if the conclusion over the NOR is the same at both ends of the
    offset interval. With the offset ratio at its estimate the upper single-run limit (15,697 ng/mg)
    meets the criterion of 16,719 ng/mg, but at the low end of the interval it is 17,143 ng/mg. PCR-005
    uses the model at the estimate all the same (PD-005-10), does not narrow the NOR, and flags the
    protein load NOR for discussion with manufacturing; the limit would hold with the upper edge of
    the protein load NOR at 38.9 g/L resin.
  evidence:
    - {doc_id: PCMP-001, quote: "The model is qualified for an output when the conclusion against its criterion over the NOR is the same with the offset at either end of its confidence interval."}
    - {doc_id: PCR-005, quote: "With the ratio at its estimate the upper prediction limit of a single run is 15,697 ng/mg, below the criterion of ≤ 16,719 ng/mg."}
    - {doc_id: PCR-005, quote: "With the ratio at the low end of its interval it is 17,143 ng/mg, above the criterion."}
    - {doc_id: PCR-005, quote: "The report flags the protein load NOR for discussion with manufacturing on whether it can be improved."}
    - {doc_id: PCR-005, quote: "With the ratio at the low end of its interval the limit meets the criterion when the upper edge of the protein load NOR is 38.9 g/L resin."}
  reasoning:
    - PCMP-001 §7.1 rule 3 defines qualification by the offset interval.
    - PCR-005 gives the upper limit at the estimate and at the low end of the interval.
    - The conclusion changes across the interval, so the model is not qualified for pool HCP.
    - PCR-005 states what it does instead.

- id: L4-curated-harvest-no-doe
  level: L4
  question: >-
    Why does the harvest step have no multivariate design, what transfer gap follows from it, and
    what did the new harvest univariate study show for the quality attributes?
  answer: >-
    The A-Mab case study assumes, for simplicity, that harvest has no impact on product quality.
    PTP-001 records the open gap that harvest and UF/DF carry no multivariate design, so their ranges
    rest on univariate work and platform experience. The univariate study S-HAR-UNI2 found no slope
    for host cell protein, residual DNA, aggregate, fragments or step yield, so the assumption is kept.
  evidence:
    - {doc_id: PCR-004, quote: "The A-Mab case study assumes, for simplicity, that harvest has no impact on product quality (CMC Biotech Working Group 2009)"}
    - {doc_id: PTP-001, quote: "Harvest and UF/DF carry no multivariate design | The operating ranges of these two steps rest on univariate work and platform experience"}
    - {doc_id: PCR-004, quote: "No slope against the setting was detected for host cell protein, residual DNA, aggregate, fragments or step yield in any of the three series, at α = 0.05."}
    - {doc_id: PCR-004, quote: "The A-Mab assumption is therefore kept."}
  reasoning:
    - PCR-004 gives the case-study assumption behind the absence of a DoE.
    - PTP-001 records the resulting transfer gap.
    - PCR-004 reports the univariate result and keeps the assumption.

- id: L4-curated-acidic-variants-risk
  level: L4
  question: >-
    Where in the train do acidic variants come closest to their lower limit, how is that risk
    handled, and what do the harvest hold and the low-pH hold do to acidic variants?
  answer: >-
    At the production bioreactor: at nine of the 81 NOR combinations, all with pCO2 at NOR high, the
    single-run interval reaches below 18.0 %. The NOR was not narrowed and the risk was accepted as the
    producer's, with a combined alert, an action limit of 18.72 % at harvest and trending. Holding the
    clarified harvest raises acidic variants (1.39 points in 7 days at 21 °C), and the low-pH hold
    also raises them, moving them away from the lower limit.
  evidence:
    - {doc_id: PCR-003, quote: "At nine of the 81 combinations, all with pCO2 at its NOR high, the interval reaches below the lower limit of 18.0 %."}
    - {doc_id: PCR-003, quote: "The NOR was not narrowed. The risk was accepted as the producer’s."}
    - {doc_id: PCR-003, quote: "An action limit for acidic variants at harvest of 18.72 %, the lower limit of the criterion plus 2 intermediate-precision standard deviations of icIEF (AMV-3013, 0.36 points)."}
    - {doc_id: PCR-004, quote: "The hold study shows that acidic variants rise in a clarified harvest held at 21 °C, by 1.39 percentage points in 7 days, so the time and the temperature of a sample before it is tested bear on that monitoring."}
    - {doc_id: PCR-006, quote: "The low-pH hold raises acidic variants, so it moves them away from the limit that binds."}
  reasoning:
    - PCR-003 shows the lower limit is reached at some NOR combinations and accepts the risk with controls.
    - PCR-004 and PCR-006 show that the later holds raise acidic variants, away from the lower limit.

- id: L4-curated-fragments-method
  level: L4
  question: >-
    Why are fragments measured by nrCE-SDS rather than SEC in Version 2.0, and how large was the SEC
    excess in the Protein A pool compared with the Protein A fragment criterion?
  answer: >-
    Part of the host cell protein elutes in the low molecular weight window of SEC and is counted as
    fragments, so SEC reads high where host cell protein is high. In the Protein A pool SEC gave a mean
    of 1.34 % against 0.91 % by nrCE-SDS, an excess of about 17 % of the criterion of 2.45 %. Decision
    AMD-001 (2026-03-20) moved fragments to nrCE-SDS; the Version 2.0 Protein A criterion is set on
    nrCE-SDS.
  evidence:
    - {doc_id: INV-001, quote: "Part of the host cell protein elutes in the low molecular weight window of SEC, where it is counted with the clipped antibody species."}
    - {doc_id: INV-001, quote: "In the Protein A pool, SEC reported a mean of 1.34 % fragments, where nrCE-SDS reported 0.91 %."}
    - {doc_id: INV-001, quote: "The excess there is about 47 % of the fragment level that nrCE-SDS measures, and about 17 % of the Protein A fragment criterion of 2.45 %"}
    - {doc_id: INV-001, quote: "The decision AMD-001 to measure fragments by nrCE-SDS was taken on 2026-03-20 on these data."}
    - {doc_id: PCR-005, quote: "All 28 pools of the response-surface design met the criterion of ≤ 2.45 %, the highest at 1.09 %"}
  reasoning:
    - INV-001 finding F6 gives the mechanism of the SEC bias and its size in the Protein A pool.
    - INV-001 gives the method decision.
    - PCR-005 judges the Version 2.0 fragment results against the criterion.

- id: L4-curated-bioreactor-augmentation
  level: L4
  question: >-
    Why were runs added to the production bioreactor response-surface design, how many, and what
    does the bioreactor report say would hold on the planned runs alone?
  answer: >-
    INV-002 found that the full quadratic models were too large for the planned designs (14 of 22
    above the limit on overfitting) and set a rule that augments a failing model of a drug substance
    attribute. PCR-003 added 16 runs as a second block. That every PAR contains the NOR rests on these
    runs and the model selection; on the 28 planned runs alone the PARs of culture pH, culture
    temperature and pCO2 for acidic variants do not contain the NOR.
  evidence:
    - {doc_id: INV-002, quote: "The re-analysis found 14 of the 22 full quadratic models above the limit on overfitting."}
    - {doc_id: INV-002, quote: "The primary cause is that the plans prescribed the full quadratic model as the predictive model of every response-surface design, with no model selection."}
    - {doc_id: PCR-003, quote: "Under INV-002, 16 runs were added to the response-surface design as a second block, after the results of the planned runs were known."}
    - {doc_id: PCR-003, quote: "That every PAR contains the NOR rests on the 16 augmentation runs and on the model selection."}
    - {doc_id: PCR-003, quote: "On the 28 planned runs alone, the PARs of culture pH, culture temperature and pCO2 for acidic variants do not contain it."}
  reasoning:
    - INV-002 gives the finding and the root cause.
    - PCR-003 gives the augmentation and what depends on it.

- id: L4-curated-hcp-control
  level: L4
  question: >-
    How is host cell protein controlled across the purification train, and what criterion applies at
    each step that clears it?
  answer: >-
    It is not controlled at harvest; it is controlled by its clearance at Protein A, cation exchange
    and anion exchange. The criteria are 16,719 ng/mg in the Protein A pool, 418 ng/mg in the cation
    exchange pool and the drug substance limit of 100 ng/mg at anion exchange.
  evidence:
    - {doc_id: PCR-004, quote: "Host cell protein and DNA are controlled by their clearance at Protein A capture, cation exchange and anion exchange (PCR-005, PCR-007 and PCR-008)"}
    - {doc_id: PCMP-001, quote: "Host cell protein (ng/mg) | ≤ 100 | Protein A | 167 | 0.00 | ≤ 16,719 | Carried back, widened a)"}
    - {doc_id: PCMP-001, quote: "| | Cation exchange | 4.18 | 0.00 | ≤ 418 | Carried back, widened a)"}
    - {doc_id: PCMP-001, quote: "| | Anion exchange | 1.00 | 0.00 | ≤ 100 | DS criterion b)"}
  reasoning:
    - PCR-004 assigns host cell protein control to the three clearing steps.
    - PCMP-001 Table 9 gives the criterion at each of them.

