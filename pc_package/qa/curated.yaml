- id: SUM-control-strategy
  level: SUM
  question: Summarize the control strategy for A-Mab drug substance across the process steps, as the Version 2.0 documents state it.
  answer: See key points.
  key_points:
    - point: The batch record carries every CPP and WC-CPP, 21 in all, with set-point and NOR.
      evidence: [{doc_id: PTP-001, quote: "The batch record must carry every parameter classified as a critical or a well-controlled critical process parameter, 21 in all, with its set-point and its NOR."}]
    - point: In-process limits bound what each intermediate may deliver to the next step.
      evidence: [{doc_id: PTP-001, quote: "In-process limits bound what each intermediate may deliver to the next step."}]
    - point: At the bioreactor the four WC-CPPs and the CPP osmolality are held by the control system, with a combined alert and an acidic variants action limit at harvest.
      evidence:
        - {doc_id: PCR-003, quote: "The four WC-CPPs and the CPP osmolality are held within their NORs by the bioreactor control system."}
        - {doc_id: PCR-003, quote: "An action limit for acidic variants at harvest of 18.72 %, the lower limit of the criterion plus 2 intermediate-precision standard deviations of icIEF (AMV-3013, 0.36 points)."}
    - point: Harvest has no CPP or WC-CPP; its two KPPs are held in their NORs and turbidity is an in-process control.
      evidence:
        - {doc_id: PCR-004, quote: "No parameter of the step is a CPP or a WC-CPP."}
        - {doc_id: PCR-004, quote: "The turbidity of the clarified harvest is measured on every batch by nephelometry (AMV-3015) as an in-process control (PCP-004 §4.1 and §8), against its NOR of 1–10 NTU."}
    - point: Host cell protein and DNA are controlled by their clearance at Protein A, cation exchange and anion exchange.
      evidence: [{doc_id: PCR-004, quote: "Host cell protein and DNA are controlled by their clearance at Protein A capture, cation exchange and anion exchange (PCR-005, PCR-007 and PCR-008)"}]
    - point: At Protein A, protein load and elution buffer pH are WC-CPPs.
      evidence: [{doc_id: PCR-005, quote: "Protein load and elution buffer pH were classified as well-controlled critical process parameters (WC-CPPs)."}]
    - point: At low-pH viral inactivation, inactivation pH is a CPP and hold time and temperature are WC-CPPs.
      evidence: [{doc_id: PCR-006, quote: "Hold time and temperature were classified as well-controlled critical process parameters (WC-CPPs), and A-Mab concentration as a general process parameter (GPP)."}, {doc_id: PCR-006, quote: "Inactivation pH was classified as a critical process parameter (CPP)."}]
    - point: At virus filtration, filtration volume and pressure are both WC-CPPs.
      evidence: [{doc_id: PCR-009, quote: "Both parameters were classified as well-controlled critical process parameters (WC-CPP)."}]
    - point: The load conditions that each viral clearance claim depends on are controlled through the batch record.
      evidence: [{doc_id: PTP-001, quote: "The load conditions on which each claim depends, such as the pH and the conductivity of the anion exchange load, are controlled by the batch record."}]
    - point: Release testing confirms the drug substance attributes.
