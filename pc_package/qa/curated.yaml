    - point: Root cause, the plans prescribed the full quadratic model with no model selection, on designs small for it.
      evidence: [{doc_id: INV-002, quote: "The primary cause is that the plans prescribed the full quadratic model as the predictive model of every response-surface design, with no model selection."}]
    - point: No range was set from a failing model while the investigation was open.
      evidence: [{doc_id: INV-002, quote: "No range was set from a failing model at Version 2.0."}]
    - point: A remedy rule approved before any new run augments a failing model of a drug substance attribute that keeps an effect, and refits the others.
      evidence: [{doc_id: INV-002, quote: "QA approved the remedy rule on 2026-09-02, before any new run was made, and it was applied to every failing model in the same way:"}]
    - point: Viral clearance models are refitted; no augmentation spikes virus.
      evidence: [{doc_id: INV-002, quote: "Its models are refitted, and no augmentation spikes virus."}]
    - point: Both augmentations were run by 2026-09-24, and model selection (CA3) then replaced the refits for every output.
      evidence: [{doc_id: INV-002, quote: "A remedy was assigned to every failing model by a rule approved before any new run, and both augmentations were run by 2026-09-24."}]
    - point: The augmentation runs moved no criterion; the investigation is classed minor and closed on 2026-09-28.
      evidence:
        - {doc_id: INV-002, quote: "The augmentation runs moved no criterion."}
        - {doc_id: INV-002, quote: "INV-002 was closed on 2026-09-28."}

- id: SUM-protein-a
  level: SUM
  question: Summarize the findings of the Protein A chromatography characterization report.
  answer: See key points.
  key_points:
    - point: Six parameters, four in a 19-run screening and a 28-run response-surface design, two one factor at a time.
      evidence: [{doc_id: PCR-005, quote: "Of these, 4 were studied in a 19-run screening design followed by a 28-run response-surface design, and 2 were studied one factor at a time."}]
    - point: Protein load and elution buffer pH are WC-CPPs; no CPP.
      evidence: [{doc_id: PCR-005, quote: "Protein load and elution buffer pH were classified as well-controlled critical process parameters (WC-CPPs)."}]
    - point: The scale-down model is not qualified for pool host cell protein over the NOR in force, and the protein load NOR is flagged for manufacturing.
      evidence: [{doc_id: PCR-005, quote: "The report flags the protein load NOR for discussion with manufacturing on whether it can be improved."}]
    - point: Pool host cell protein rises with load and falls with elution pH, by factors of 2.43 and 3.30.
      evidence: [{doc_id: PCR-005, quote: "F3. Pool host cell protein rises with protein load and as elution buffer pH falls, by factors of 2.43 and 3.30 across the ranges studied."}]
    - point: Leached Protein A met its criterion on every run.
      evidence: [{doc_id: PCR-005, quote: "Every run met the criterion of ≤ 158 ppm at manufacturing scale, the highest at 5.79 ppm"}]
    - point: Fragments met the criterion in all 28 response-surface pools.
      evidence: [{doc_id: PCR-005, quote: "All 28 pools of the response-surface design met the criterion of ≤ 2.45 %, the highest at 1.09 %"}]
    - point: The pool host cell protein criterion is 4 % wider than a priori, because the anion exchange clearance bound beat its platform worst case; the change is the producer's risk.
      evidence: [{doc_id: PCR-005, quote: "The change is the producer’s risk, and an excursion would be detected at release of the drug substance"}]
    - point: Every NOR-propagated PAR spans the range studied except elution buffer pH for pool host cell protein.
      evidence: [{doc_id: PCR-005, quote: "Every NOR-propagated PAR spans the range studied of its parameter, except that of elution buffer pH for pool host cell protein, 3.22–3.9."}]

- id: SUM-viral-clearance
  level: SUM
  question: Summarize the viral clearance strategy and results across the Version 2.0 documents.
  answer: See key points.
  key_points:
    - point: Each clearing step is held to its platform claim, and the claims are checked against the cumulative requirement.
      evidence: [{doc_id: PCMP-001, quote: "Each step that clears virus is held to its platform claim."}]
    - point: XMuLV claims sum to 16.72 against 16.7 log10, MVM to 8.62 against 8.6, leaving little room.
      evidence:
        - {doc_id: PCMP-001, quote: "The claims for XMuLV sum to 16.72 log10 against a requirement of 16.7."}
        - {doc_id: PCMP-001, quote: "For MVM they sum to 8.62 against 8.6."}
    - point: Low-pH viral inactivation makes no MVM claim, because a parvovirus has no lipid envelope.
      evidence: [{doc_id: PCMP-001, quote: "Low-pH viral inactivation makes no claim for MVM, because a parvovirus has no lipid envelope for low pH to disrupt."}]
    - point: At low-pH viral inactivation the claim was not met at the planned NORs, so pH, hold time and temperature NORs were moved; across the NOR in force the lowest mean LRF is 6.77 log10.
      evidence: [{doc_id: PCR-006, quote: "Across the NOR in force the lowest mean predicted log reduction is 6.77"}]
    - point: At virus filtration the mean predicted MVM LRF at the least favourable NOR combination is 5.25 against the claim of 4.62 log10.
      evidence: [{doc_id: PCR-009, quote: "There the mean predicted MVM LRF is 5.25 log10, against the LRF claimed for this step, 4.62 log10."}]
    - point: Filtration volume lowers the MVM LRF by 1.73 log10 across its range; no pressure effect was detected.
      evidence: [{doc_id: PCR-009, quote: "Filtration volume lowers the MVM LRF by 1.73 log10 across its range, and its PAR extends 31 L/m2 beyond its NOR."}]
    - point: Cumulative clearance Cpk is 1.51 for MVM and 1.70 for XMuLV.
      evidence: [{doc_id: PCR-009, quote: "The integrated model of the train gives a process capability index (Cpk) of 1.51 for the cumulative MVM clearance of the drug substance and of 1.70 for XMuLV, both above the target of 1.33 and the minimum of 1.0 of PCMP-001."}]
    - point: Claims rest on small-scale spiking studies and cannot be verified at commercial scale.
      evidence: [{doc_id: PTP-001, quote: "Viral clearance claims are established at small scale only | The claims cannot be verified at commercial scale"}]

- id: SUM-criteria-derivation
  level: SUM
  question: Summarize how the intermediate acceptance criteria of Version 2.0 are derived and verified.
  answer: See key points.
  key_points:
    - point: A drug substance criterion cannot judge an upstream pool, so each step output has an intermediate acceptance criterion.
      evidence: [{doc_id: PCMP-001, quote: "Each step output is therefore judged against an intermediate acceptance criterion."}]
    - point: Each drug substance criterion is carried back through the platform worst case of each downstream step, with no margin.
      evidence:
        - {doc_id: PCMP-001, quote: "Each drug substance criterion is carried backward through the train, step by step, using the worst case that each downstream step showed on the platform."}
        - {doc_id: PCMP-001, quote: "No margin is applied."}
    - point: Attributes that no downstream step changes keep the drug substance criterion (the glycans).
      evidence: [{doc_id: PCMP-001, quote: "An attribute that no downstream step changes keeps its drug substance criterion."}]
    - point: Verification uses the one-sided 95 % prediction bound of a single batch, never a confidence bound of the mean.
      evidence: [{doc_id: PCMP-001, quote: "The bound is a prediction bound of a single batch, never a confidence bound of the mean."}]
    - point: A worse A-Mab worst case tightens upstream criteria; a better bound widens them only if the model passes the first three adequacy criteria.
      evidence: [{doc_id: PCMP-001, quote: "Every criterion upstream of that step is recalculated with it and becomes stricter."}]
    - point: Of 22 criteria, 17 stand at their a priori value and verification changed 5.
      evidence: [{doc_id: PCMP-001, quote: "17 are in force at their a priori value and verification changed 5"}]
    - point: UF/DF raises aggregate within its NOR, so every aggregate criterion carries that increase.
      evidence: [{doc_id: PCMP-001, quote: "UF/DF raises aggregate within its NOR, by up to 0.104 percentage points at the prediction bound of a single batch, and each aggregate criterion now carries that increase."}]
    - point: Each change of a criterion is argued by its risk, in four parts.
      evidence: [{doc_id: PCMP-001, quote: "Every change of a criterion is argued by its risk."}]
    - point: Residual DNA has no intermediate criterion and is judged on the drug substance only.
      evidence: [{doc_id: PCMP-001, quote: "Residual DNA has a drug substance criterion but no intermediate acceptance criterion."}]

