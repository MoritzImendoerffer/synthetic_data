  answer: See key points.
  key_points:
    - point: A model is qualified per output, by its offset from manufacturing scale, not by an equivalence test.
      evidence: [{doc_id: PCMP-001, quote: "It is qualified by the offset between the scales, not by a test of equivalence."}]
    - point: It is qualified when the conclusion over the NOR is the same at both ends of the offset confidence interval; results are stated at manufacturing scale.
      evidence: [{doc_id: PCMP-001, quote: "The model is qualified for an output when the conclusion against its criterion over the NOR is the same with the offset at either end of its confidence interval."}]
    - point: Fragments and viral clearance are not compared at both scales; their offset is unknown, not zero.
      evidence: [{doc_id: PCMP-001, quote: "The qualification studies do not compare fragments or viral clearance at both scales."}]
    - point: Production bioreactor, qualified for every output with a criterion.
      evidence: [{doc_id: PCR-003, quote: "The scale-down model is qualified for every output with a criterion."}]
    - point: Harvest, not qualified, because no laboratory-scale disk-stack centrifuge exists; results are at study scale.
