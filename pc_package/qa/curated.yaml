- id: SUM-version-changes
  level: SUM
  question: Summarize what changed from Version 1.0 to Version 2.0 of the characterization documents, and why.
  answer: See key points.
  key_points:
    - point: QA's review of PCMR-001 found that no step criterion could be traced to a plan approved before execution, and opened INV-001.
      evidence: [{doc_id: INV-001, quote: "It found that none of the criteria could be traced to a plan as it was approved before execution."}]
    - point: Root cause, PCMP-001 Version 1.0 required step criteria but gave no rule to derive them.
      evidence: [{doc_id: INV-001, quote: "The root cause is that PCMP-001 Version 1.0, the master plan, required a criterion for each step but gave no rule for deriving one (finding F1)."}]
    - point: Version 1.0 criteria used safety factors chosen so each step passed at its set-point.
      evidence: [{doc_id: INV-001, quote: "The factors ranged from 3.2 to 6.8, and no document records why they differ."}]
    - point: Version 2.0 carries each drug substance criterion back through the platform worst case of each downstream step, with no margin.
      evidence: [{doc_id: PCMP-001, quote: "Each drug substance criterion is carried backward through the train, step by step, using the worst case that each downstream step showed on the platform."}]
    - point: Verification against A-Mab data may replace a platform worst case with the single-batch prediction bound, tightening or widening criteria.
      evidence: [{doc_id: PCMP-001, quote: "Verification may change a criterion in either direction, by the following rule."}]
    - point: Acidic variant capability is now assessed against both ends of its range.
      evidence: [{doc_id: INV-001, quote: "Computed against both ends, the index is 1.03, because the mean lies 3.1 SD above the lower limit and 12.8 SD below the upper limit."}]
    - point: Fragments are reported, measured by nrCE-SDS under decision AMD-001.
      evidence: [{doc_id: INV-001, quote: "The decision AMD-001 to measure fragments by nrCE-SDS was taken on 2026-03-20 on these data."}]
    - point: Execution dates and approval dates are now recorded.
      evidence: [{doc_id: INV-001, quote: "Every plan was approved before its first study began."}]
    - point: INV-002 replaced the full quadratic model by model selection for every response-surface output, after 14 of 22 full models failed the limit on overfitting.
      evidence:
        - {doc_id: INV-002, quote: "The re-analysis found 14 of the 22 full quadratic models above the limit on overfitting."}
        - {doc_id: INV-002, quote: "Model selection then replaced the refits for every output."}
    - point: The reports are reissued at Version 2.0 under corrective action CA3 of INV-001.
      evidence: [{doc_id: INV-001, quote: "CA3 | Reissue PCR-003 to PCR-010, PTP-001, RA-001 and PCMR-001 at Version 2.0 | MSAT | 2026-09-30"}]

