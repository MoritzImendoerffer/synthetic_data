# Metadata for a variant rendering pass (render_variant.py, make corpus-variant RULES=rows|grid):
#   PC_TABLE_RULES=rows quarto render X.qmd --to pdf --metadata-file table_rules.yml
# It adds table_rules.lua after Quarto's own filters, so the plain pipe tables get the rules that
# PC_TABLE_RULES names, and table_rules.tex before the document's own header. Both are added to
# what the document sets, never in place of it. The default pass never reads this file.
filters:
  - path: table_rules.lua
    at: post-render
include-in-header: table_rules.tex
