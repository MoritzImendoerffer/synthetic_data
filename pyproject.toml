[project]
name = "synthetic-data"
version = "0.1.0"
description = "Seeded A-Mab process model and the cross-referenced document corpus it generates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "jupyter-client>=8.9.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.5",
    "pymupdf>=1.28.0",
    "pytest>=8.0",
    "quarto>=0.1.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
# Parser for authoring/check_discourse.py (advisory register diagnostics). Nothing in
# make test / style / corpus needs it. Install with: uv sync --extra discourse
discourse = [
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
